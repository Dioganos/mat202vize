/p>\n<div class=\"tw\"><table>\n<tr><th>Mertebe<\/th><th>E ile<\/th><th>Sonuç<\/th><th>Düğümler<\/th><\/tr>\n<tr><td>∇<\/td><td>1 − E⁻¹<\/td><td>f(xᵢ) − f(xᵢ₋₁)<\/td><td>xᵢ₋₁, xᵢ (2 nokta)<\/td><\/tr>\n<tr><td>∇²<\/td><td>(1 − E⁻¹)² = 1 − 2E⁻¹ + E⁻²<\/td><td>f(xᵢ) − 2f(xᵢ₋₁) + f(xᵢ₋₂)<\/td><td>xᵢ₋₂, xᵢ₋₁, xᵢ<\/td><\/tr>\n<tr><td>∇³<\/td><td>(1 − E⁻¹)³ = 1 − 3E⁻¹ + 3E⁻² − E⁻³<\/td><td>f(xᵢ) − 3f(xᵢ₋₁) + 3f(xᵢ₋₂) − f(xᵢ₋₃)<\/td><td>xᵢ₋₃, …, xᵢ (4 nokta)<\/td><\/tr>\n<tr><td>∇⁴<\/td><td>(1 − E⁻¹)⁴ = 1 − 4E⁻¹ + 6E⁻² − 4E⁻³ + E⁻⁴<\/td><td>f(xᵢ) − 4f(xᵢ₋₁) + 6f(xᵢ₋₂) − 4f(xᵢ₋₃) + f(xᵢ₋₄)<\/td><td>xᵢ₋₄, …, xᵢ (5 nokta)<\/td><\/tr>\n<\/table><\/div>\n<p>Katsayılar Δ ile aynıdır. Yalnız hangi noktalara bakıldığı değişir. Δ³ için i, i+1, i+2, i+3 kullanılır. ∇³ için i−3, i−2, i−1, i kullanılır (s22).<\/p>\n\n<h4>Merkezi fark δ (s23-24)<\/h4>\n<p>İleri ve geri fark tek yönlüdür, biri yalnız sağa, diğeri yalnız sola bakar. Bu asimetri Taylor açılımında iptal olmayan birinci dereceden hata terimi bırakır. Sonuç O(h) olur. Merkezi fark xᵢ'nin iki yanına simetrik bakar. Tek sayılı hata terimleri birbirini götürür. En küçük formülde bile O(h²) elde edilir. Slayt şöyle der: merkezi fark bu üçünün en dengeli olanıdır. Sayısal türev ve interpolasyonda mümkün olduğunda merkezi fark tercih edilir.<\/p>\n<p>Slaytın alt başlığı: \"Simetrik formüller daha küçük hata verir: O(h²) yerine aynı sayıda noktayla.\"<\/p>\n<p>Temel tanım yarım adımlıdır: δf(xᵢ) = f(xᵢ₊½) − f(xᵢ₋½). Burada xᵢ±½ = xᵢ ± h/2 demektir. Tam düğümlerde hesaplamak için δ²'ye geçilir.<\/p>\n\\[\\begin{aligned}\\delta^2 f(x_i)&=\\delta[f(x_{i+1/2})-f(x_{i-1/2})]\\\\&=\\delta f(x_{i+1/2})-\\delta f(x_{i-1/2})\\\\&=[f_{i+1}-f_i]-[f_i-f_{i-1}]\\\\&=f_{i+1}-2f_i+f_{i-1}\\end{aligned}\\]\n<p>E ile: δ² = (E^½ − E^−½)² = E − 2 + E⁻¹, yani f(x+h) − 2f(x) + f(x−h). Katsayılar +1 −2 +1, düğümler xᵢ₋₁, xᵢ, xᵢ₊₁ (simetrik).<\/p>\n<p>Çift mertebede (δ², δ⁴) xᵢ formüle girer. Tek mertebede (δ¹, δ³) xᵢ girmez, yalnız komşular kullanılır. Bu, simetrinin doğal sonucudur.<\/p>\n<p>δ³ = δ(δ²) uygulanır (s24). Slaytın yazdığı ara satır ve sonuç şöyledir.<\/p>\n\\[\\begin{aligned}\\delta^3 f(x_i)&=\\delta^2 f(x_{i+1/2})-\\delta^2 f(x_{i-1/2})\\\\&=[f_{i+2}-2f_{i+1}+f_i]\\\\&\\quad-[f_{i+1}-2f_i+f_{i-1}]\\end{aligned}\\]\n\\[\\delta^3 f(x_i)=f_{i+2}-2f_{i+1}+2f_{i-1}-f_{i-2}\\]\n<p>Katsayılar +1 −2 0 +2 −1. Dört nokta kullanılır, xᵢ dahil değildir. Slayt \"xᵢ terimi türetim sırasında iptal oldu\" der ve ekler: bu beklenen bir sonuç, simetrik açılımda tek mertebe merkez noktasının katsayısını sıfıra düşürür. Bu ara satır ile sonucun uyuşmadığına aşağıdaki slayt hatası bölümünde bak.<\/p>\n<p>δ⁴ = δ²(δ²) uygulanır ve 5 noktalı simetrik formül çıkar.<\/p>\n\\[\\delta^4 f(x_i)=f_{i+2}-4f_{i+1}+6f_i-4f_{i-1}+f_{i-2}\\]\n<p>Katsayılar +1 −4 +6 −4 +1, xᵢ dahil.<\/p>\n<div class=\"vurgu\"><p>\"Dikkat: δ²f(xᵢ) ile Δ²f(xᵢ) ve ∇²f(xᵢ)'nin katsayıları (1 −2 +1) aynıdır. Fark, kullanılan noktalardadır: Δ² için i, i+1, i+2; ∇² için i−2, i−1, i; δ² için i−1, i, i+1.\" <span class=\"kaynak\">W234 s23<\/span><\/p><\/div>\n\n<h3>Özet tablo ve kullanım rehberi<\/h3>\n<p>s25, tek sayfada bütün operatörler ve düğümler. Sütunlar \"İleri Δ (xᵢ → xᵢ₊ₙ)\", \"Geri ∇ (xᵢ₋ₙ → xᵢ)\" ve \"Merkezi δ (simetrik)\".<\/p>\n<div class=\"tw\"><table>\n<tr><th>n<\/th><th>İleri Δ<\/th><th>Geri ∇<\/th><th>Merkezi δ<\/th><\/tr>\n<tr><td>1<\/td><td>f(xᵢ₊₁) − f(xᵢ)<br>[xᵢ, xᵢ₊₁]<\/td><td>f(xᵢ) − f(xᵢ₋₁)<br>[xᵢ₋₁, xᵢ]<\/td><td>[f(xᵢ₊₁) − f(xᵢ₋₁)] / 2 (slayt: \"sayısal türev CD2\")<br>[xᵢ₋₁, xᵢ, xᵢ₊₁]<\/td><\/tr>\n<tr><td>2<\/td><td>f₂ − 2f₁ + f₀<br>[xᵢ, xᵢ₊₁, xᵢ₊₂]<\/td><td>fₙ − 2fₙ₋₁ + fₙ₋₂<br>[xᵢ₋₂, xᵢ₋₁, xᵢ]<\/td><td>f₁ − 2f₀ + f₋₁<br>[xᵢ₋₁, xᵢ, xᵢ₊₁]<\/td><\/tr>\n<tr><td>3<\/td><td>f₃ − 3f₂ + 3f₁ − f₀<br>[xᵢ, …, xᵢ₊₃]<\/td><td>fₙ − 3fₙ₋₁ + 3fₙ₋₂ − fₙ₋₃<br>[xᵢ₋₃, …, xᵢ]<\/td><td>f₂ − 2f₁ + 2f₋₁ − f₋₂<br>[xᵢ₋₂, xᵢ₋₁, xᵢ₊₁, xᵢ₊₂] (xᵢ = 0)<\/td><\/tr>\n<tr><td>4<\/td><td>f₄ − 4f₃ + 6f₂ − 4f₁ + f₀<br>[xᵢ, …, xᵢ₊₄]<\/td><td>fₙ − 4fₙ₋₁ + 6fₙ₋₂ − 4fₙ₋₃ + fₙ₋₄<br>[xᵢ₋₄, …, xᵢ]<\/td><td>f₂ − 4f₁ + 6f₀ − 4f₋₁ + f₋₂<br>[xᵢ₋₂, …, xᵢ₊₂]<\/td><\/tr>\n<\/table><\/div>\n<p>Katsayı kuralı (s25): n. mertebe için Pascal üçgeninin n. satırı. İşaretler +, −, +, −, … soldan sağa. Merkezi farkta 3. mertebede xᵢ'nin katsayısı sıfırdır, formüle girmez.<\/p>\n<p>s28 kullanım rehberi:<\/p>\n<ul>\n<li><b>Δ<\/b>: tablo başına yakın veya ilk noktalar. Sağda komşu var, solda yok. NIFF kullanır.<\/li>\n<li><b>∇<\/b>: tablo sonuna yakın veya son noktalar. Solda komşu var, sağda yok. NGFF kullanır.<\/li>\n<li><b>δ<\/b>: iç noktalar, tablonun başı ve sonu değil. İki yanda simetrik komşu var. Slayt: \"Mümkün olduğunca bunu kullan.\"<\/li>\n<\/ul>\n<p>s28 hızlı başvuru (Δ ve δ için f₀ ilk, f₁ ikinci nokta gibi okunur; ∇ için fₙ son nokta):<\/p>\n<div class=\"tw\"><table>\n<tr><th>Δ<\/th><th>∇<\/th><th>δ<\/th><\/tr>\n<tr><td>Δ¹: f₁ − f₀<\/td><td>∇¹: fₙ − fₙ₋₁<\/td><td>δ²: f₁ − 2f₀ + f₋₁<\/td><\/tr>\n<tr><td>Δ²: f₂ − 2f₁ + f₀<\/td><td>∇²: fₙ − 2fₙ₋₁ + fₙ₋₂<\/td><td>δ⁴: f₂ − 4f₁ + 6f₀ − 4f₋₁ + f₋₂<\/td><\/tr>\n<tr><td>Δ³: f₃ − 3f₂ + 3f₁ − f₀<\/td><td>∇³: fₙ − 3fₙ₋₁ + 3fₙ₋₂ − fₙ₋₃<\/td><td><\/td><\/tr>\n<tr><td>Δ⁴: f₄ − 4f₃ + 6f₂ − 4f₁ + f₀<\/td><td>∇⁴: fₙ − 4fₙ₋₁ + 6fₙ₋₂ − 4fₙ₋₃ + fₙ₋₄<\/td><td><\/td><\/tr>\n<\/table><\/div>\n<p>s28 hata ifadeleri (slayttaki hâliyle): Δ ve ∇ için O(h) (1. mertebe), O(h²) (2. mertebe), …; δ için O(h²) (1. ve 2. mertebe), O(h⁴) (3. ve 4. mertebe). \"Hata her mertebede iki kat daha iyidir.\" Bu ifade s17 ile çelişir. Aşağıdaki slayt hatası bölümüne bak.<\/p>\n\n<h3>Şema ve grafikler<\/h3>\n<ul>\n<li>s17: üç sütun yan yana. Her sütunda tanım, 2. mertebe, n. mertebe, E ile ilişki, hata mertebesi ve kullanım yazılı. Alta tek satırlık karşılaştırma konmuş.<\/li>\n<li>s20-24: her mertebe için düğüm yerleşimi çizilmiş. Δ¹ iki komşu nokta. Δ² xᵢ, xᵢ₊₁, xᵢ₊₂ (3 nokta, hepsi ileriye). Δ³ xᵢ…xᵢ₊₃ (4 nokta). Δ⁴ 5 nokta. ∇ için aynı çizim geriye doğru, δ² için xᵢ₋₁, xᵢ, xᵢ₊₁ simetrik.<\/li>\n<li>s19: Pascal üçgeni ve yanında mertebe → katsayı tablosu.<\/li>\n<\/ul>\n\n<h3>Küçük kontrol örneği (slayt dışı)<\/h3>\n<div class=\"ornek\"><p>f(x) = x³, x = 1, 2, 3, 4, 5, h = 1. Değerler 1, 8, 27, 64, 125.<\/p>\n<ul>\n<li>Δ²f₀ (x = 1): 27 − 2·8 + 1 = 12.<\/li>\n<li>Δ³f₀ (x = 1): 64 − 3·27 + 3·8 − 1 = 6.<\/li>\n<li>δ²f (x = 3): 64 − 2·27 + 8 = 18.<\/li>\n<li>∇²f (x = 5): 125 − 2·64 + 27 = 24.<\/li>\n<li>δ³ slayt formülü (x = 3): 125 − 2·64 + 2·8 − 1 = 12. h = 1 olduğundan f‴ ≈ 12/2 = 6 çıkar. Gerçek (x³)‴ = 6.<\/li>\n<\/ul>\n<p>12, 18, 24 sayıları <a href=\"#\" data-go=\"k:k18\">K18<\/a>'deki x³ fark tablosunun Δ² sütunudur.<\/p><\/div>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>\"Formülleri ezberlemek gerekmez, Pascal üçgeni yazılır ve okunur.\"<br>\"Dikkat: tablodaki katsayılar Pascal üçgeninden gelir (+1 +1, +1 +2 +1, …). İşaretler ise binom açılımındaki (−1)ᵏ nedeniyle soldan sağa +, −, +, −, … sırasını izler.\" <span class=\"kaynak\">W234 s19<\/span><\/p><\/div>\n<div class=\"vurgu\"><p>\"Merkezi fark bu üçünün en dengeli olanıdır.\" Sayısal türev ve interpolasyonda mümkün olduğunda merkezi fark tercih edilir. <span class=\"kaynak\">W234 s23<\/span><\/p><\/div>\n<div class=\"vurgu\"><p>\"Mümkün olduğunca bunu kullan.\" (δ için) <span class=\"kaynak\">W234 s28<\/span><\/p><\/div>\n\n<h3>Slayt hataları<\/h3>\n<div class=\"slhata\"><p><b>δ³ türetmesi (s24).<\/b> Slayt ara satırı [f(xᵢ₊₂) − 2f(xᵢ₊₁) + f(xᵢ)] − [f(xᵢ₊₁) − 2f(xᵢ) + f(xᵢ₋₁)] diye yazıp sonucu f(xᵢ₊₂) − 2f(xᵢ₊₁) + 2f(xᵢ₋₁) − f(xᵢ₋₂) bulur. İkisi eşit değildir. Ara satır açılınca f(xᵢ₊₂) − 3f(xᵢ₊₁) + 3f(xᵢ) − f(xᵢ₋₁) çıkar. Slaytın verdiği son formül aslında Δ³f(xᵢ₋₁) + Δ³f(xᵢ₋₂) = 2μδ³f(xᵢ) değeridir.<\/p>\n<p>Kısa hesap: f = x³, h = 1, xᵢ = 0. Slayt formülü 8 − 2 + 2(−1) − (−8) = 12. Δ³f₋₁ + Δ³f₋₂ = 6 + 6 = 12 (tutuyor). Ara satır ise 8 − 3 + 0 − (−1) = 6 verir. Sınavda slaytın son formülünü kullan (föy sorusu <a href=\"#\" data-go=\"q:c2\">C2<\/a> bunu kullanıyor).<\/p><\/div>\n<div class=\"slhata\"><p><b>δ¹ satırı (s25).<\/b> Özet tabloda δ¹ için [f(xᵢ₊₁) − f(xᵢ₋₁)] / 2 yazılı ve \"sayısal türev CD2\" notu var. Bu, s17'deki tanım δf(xᵢ) = f(xᵢ₊½) − f(xᵢ₋½) ile uyuşmaz. Tam düğümde yazılan ifade μδf(xᵢ) yani ortalama ile merkezi farkın çarpımıdır.<\/p>\n<p>Kısa hesap: μδf(xᵢ) = ½[f(xᵢ₊½) + f(xᵢ₋½)] ifadesine δ uygulanınca tam düğümlerde [f(xᵢ₊₁) − f(xᵢ₋₁)]/2 çıkar.<\/p><\/div>\n<div class=\"slhata\"><p><b>Hata mertebesi (s17 ile s28 çelişiyor).<\/b> s17 ve s23, s34: Δ ve ∇ için O(h), δ için O(h²). s28: Δ ve ∇ için 2. mertebede O(h²), δ için 3. ve 4. mertebede O(h⁴). Slayt kendi içinde net değil.<\/p>\n<p>Kısa hesap (türev yaklaşımı olarak Δⁿf/hⁿ, ∇ⁿf/hⁿ, δⁿf/hⁿ; keyfi bir f, x = 0.4, h = 0.1 ve 0.05): h yarılanınca hata oranı n = 1, 2, 3, 4 için Δ'da 2.03, 2.14, 2.11, 2.08, ∇'da 1.98, 1.87, 1.89, 1.93 (hepsi yaklaşık 2, yani O(h)). δ'da dördü için de 4.00 (yani O(h²)). Sınavda s17'yi yaz: Δ ve ∇ O(h), δ O(h²). Çıktı: _h34_hesap\\cikti_h34_ek.txt.<\/p><\/div>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>Δ², ∇², δ² aynı katsayıları (1 −2 1) kullanır. Fark noktalardadır, karıştırma.<\/li>\n<li>Kaç nokta gerekir: n. mertebe Δ ve ∇ için n + 1 nokta. δ² için 3 nokta, δ³ için 4 nokta (xᵢ yok), δ⁴ için 5 nokta.<\/li>\n<li>İşaretleri Pascal satırından ver: + − + − …<\/li>\n<li>Seçim: tablo başına yakın nokta Δ, sonuna yakın nokta ∇, iç nokta δ.<\/li>\n<li>δ³ formülünü sorarsa sonucu şöyle yaz: f(xᵢ₊₂) − 2f(xᵢ₊₁) + 2f(xᵢ₋₁) − f(xᵢ₋₂). Türev için payda 2h³ olur (f‴ ≈ δ³f / 2h³, föy sorusu C2).<\/li>\n<li>Sayısal örnek: cos x, x = π/4, h = 0.1 için bu formül f‴ ≈ 0.70534 verir. Gerçek sin(π/4) = 0.70711.<\/li>\n<\/ul><\/div>\n<p class=\"sn\">Föy sorusu: <a href=\"#\" data-go=\"q:c2\">C2<\/a>, δ³ ile üçüncü türev.<\/p>\n<p class=\"bu-eksik\">BUders videolarının başlığında geçmeyen kısım: yüksek mertebeden farklar (Δⁿ), Pascal üçgeni katsayıları ve E ile ilişkiler (∇ = 1 − E⁻¹, δ = E^½ − E^−½). Bu kısmı bu nottan çalış.<\/p>","v":["jI_w88nIkqU","MFuKaLiuHso","nGJ6snBFmQg"],"qs":["c2","x11"]},"k18":{"y":"k","id":"k18","t":"Fark tablosu ve polinom derecesi kuralı","g":2,"h":"<p class=\"sn\">Kaynak: W234 s26, s29. Operatör tanımları için <a href=\"#\" data-go=\"k:k17\">K17<\/a>.<\/p>\n<h3>Ne işe yarar<\/h3>\n<p>Fark tablosu, veriden polinom derecesini okumayı sağlar. n. mertebe farklar sabitse veri en fazla n. dereceden bir polinomdan gelmiştir. Interpolasyon yaparken gereken polinom derecesini böyle belirleriz (s26).<\/p>\n\n<h3>Tanım ve kural<\/h3>\n<p>Fark tablosu soldan sağa doldurulur. Her sütun, bir öncekinin komşu elemanları arasındaki farktır. Yani alttaki değerden üstteki çıkarılır. s26'daki gösterim:<\/p>\n\\[\\begin{aligned}\\Delta^1 f_0&=f_1-f_0\\\\\\Delta^2 f_0&=\\Delta^1 f_1-\\Delta^1 f_0\\\\\\Delta^3 f_0&=\\Delta^2 f_1-\\Delta^2 f_0\\end{aligned}\\]\n<p>Kural (s26 ve s29): f(x) gerçekten n. dereceden bir polinom ise Δⁿf sabit olur ve Δⁿ⁺¹f = 0 olur. Örnek: Δ³f sabitse polinom kübiktir (3. derece). Slaytın yorumu: Δ⁴f = 0 demek dördüncü mertebe yoktur.<\/p>\n<div class=\"vurgu\"><p>\"Bu önemli bir kuraldır: fark tablosunda n. mertebe sabitlenirse, elimizdeki veri en fazla n. dereceden bir polinom tarafından üretilmiştir. Interpolasyon yaparken gereken polinom derecesini böyle belirleriz.\" <span class=\"kaynak\">W234 s26<\/span><\/p><\/div>\n<p>Ek bilgi (slayt dışı, kontrol edildi): polinomun baş katsayısı aₙ ise sabit fark Δⁿf = n!·aₙ·hⁿ. x³ için n = 3, aₙ = 1, h = 1 ve 3!·1·1 = 6. Tablodaki 6 ile uyuşur.<\/p>\n\n<h3>Örnek E16: f(x) = x³ (s26)<\/h3>\n<div class=\"ornek\"><p>Slaytın sorusu: \"Fark tablosu nasıl kurulur? Δⁿf sabitlenince ne anlama gelir?\" x = 1, 2, 3, 4, 5 noktalarında f(x) = x³ değerleri biliniyor. Fark tablosunu soldan sağa doldur.<\/p>\n<div class=\"tw\"><table>\n<tr><th>i<\/th><th>xᵢ<\/th><th>f(xᵢ)<\/th><th>Δ¹f<\/th><th>Δ²f<\/th><th>Δ³f<\/th><th>Δ⁴f<\/th><\/tr>\n<tr><td>0<\/td><td>1<\/td><td>1<\/td><td>7<\/td><td>12<\/td><td>6<\/td><td>0<\/td><\/tr>\n<tr><td>1<\/td><td>2<\/td><td>8<\/td><td>19<\/td><td>18<\/td><td>6<\/td><td><\/td><\/tr>\n<tr><td>2<\/td><td>3<\/td><td>27<\/td><td>37<\/td><td>24<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>3<\/td><td>4<\/td><td>64<\/td><td>61<\/td><td><\/td><td><\/td><td><\/td><\/tr>\n<tr><td>4<\/td><td>5<\/td><td>125<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n<\/table><\/div>\n<p>Hesaplama adımları (slayttaki gibi):<\/p>\n<ul>\n<li>Δ¹f₀ = f(x₁) − f(x₀) = 8 − 1 = 7<\/li>\n<li>Δ¹f₁ = f(x₂) − f(x₁) = 27 − 8 = 19<\/li>\n<li>Δ²f₀ = Δ¹f₁ − Δ¹f₀ = 19 − 7 = 12<\/li>\n<li>Δ²f₁ = Δ¹f₂ − Δ¹f₁ = 37 − 19 = 18<\/li>\n<li>Δ³f₀ = Δ²f₁ − Δ²f₀ = 18 − 12 = 6<\/li>\n<li>Δ⁴f₀ = Δ³f₁ − Δ³f₀ = 6 − 6 = 0<\/li>\n<\/ul>\n<p>Ne anlıyoruz: Δ³f = 6 her satırda sabit, yani f(x) kübik polinomdur. Δ⁴f = 0, dördüncü mertebe yoktur. Bütün sayılar script ile yeniden hesaplandı, tutuyor.<\/p><\/div>\n\n<h3>Örnek E18: f(x) = sin x, h = 0.2 (s29)<\/h3>\n<div class=\"ornek\"><p>xᵢ = 0.0, 0.2, 0.4, 0.6, 0.8 (rad). Slayt tablosu:<\/p>\n<div class=\"tw\"><table>\n<tr><th>xᵢ<\/th><th>f(xᵢ)<\/th><th>Δf<\/th><th>Δ²f<\/th><th>Δ³f<\/th><th>Δ⁴f<\/th><\/tr>\n<tr><td>0.0<\/td><td>0.0000<\/td><td>0.1987<\/td><td>−0.0079<\/td><td>−0.0076<\/td><td>0.0006<\/td><\/tr>\n<tr><td>0.2<\/td><td>0.1987<\/td><td>0.1907<\/td><td>−0.0155<\/td><td>0.0070 (slayt)<\/td><td><\/td><\/tr>\n<tr><td>0.4<\/td><td>0.3894<\/td><td>0.1752<\/td><td>−0.0225<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>0.6<\/td><td>0.5646<\/td><td>0.1527<\/td><td><\/td><td><\/td><td><\/td><\/tr>\n<tr><td>0.8<\/td><td>0.7174<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n<\/table><\/div>\n<p>Doğru tablo, tek hücre farklı: ikinci Δ³f değeri −0.0070 olmalı (slayt +0.0070). Diğer bütün hücreler tutuyor. Tam sin değerleriyle Δ³f = −0.00760 ve −0.00699, Δ⁴f = 0.00062.<\/p>\n<p>Slaytın kırmızı hücreleri açılımları gösterir:<\/p>\n<ul>\n<li>Δ²f₀ = f(0.4) − 2f(0.2) + f(0)<\/li>\n<li>Δ²f₁ = f(0.6) − 2f(0.4) + f(0.2)<\/li>\n<li>Δ²f₂ = f(0.8) − 2f(0.6) + f(0.4)<\/li>\n<li>Δ³f₀ = f(0.6) − 3f(0.4) + 3f(0.2) − f(0)<\/li>\n<li>Δ³f₁ = f(0.8) − 3f(0.6) + 3f(0.4) − f(0.2)<\/li>\n<li>Δ⁴f₀ = f(0.8) − 4f(0.6) + 6f(0.4) − 4f(0.2) + f(0)<\/li>\n<\/ul>\n<p>Δf sütununun hücre etiketleri: f(0.2) − f(0) = 0.1987 − 0.0, sonra 0.3894 − 0.1987, 0.5646 − 0.3894, 0.7174 − 0.5646. Etiketlerin yazımı slaytta yanlıştır, aşağıya bak.<\/p>\n<p>Bu tablo tam sin değerlerinden hesaplanıp 4 ondalığa yuvarlanmıştır. Tablodaki yuvarlak f değerleriyle hesaplarsan küçük farklar çıkar (Δ² için −0.0080, −0.0155, −0.0224 gibi). Sınavda slayttaki değerleri yaz.<\/p>\n<p>Slaytın sonuç kutusu (s29):<\/p>\n<ul>\n<li>f(x) gerçekten n. dereceden polinomsa Δⁿf sabittir ve Δⁿ⁺¹f = 0 olur.<\/li>\n<li>sin x sonlu dereceli bir polinom değildir. Farklar hiçbir mertebede tam sabitlenmez.<\/li>\n<li>5 veri noktasıyla en fazla 4. derece bir interpolasyon polinomu P₄(x) kurulabilir. Bu, sin x'in 4. dereceden olduğu anlamına gelmez.<\/li>\n<li>Δ⁴f₀ ≠ 0 olduğundan veriler 3. derece bir polinomla tam temsil edilemez.<\/li>\n<li>Buradaki P₄(x) yalnızca seçilen beş sin x noktasından geçen yaklaşık polinomdur.<\/li>\n<\/ul><\/div>\n\n<h3>Şema ve grafikler<\/h3>\n<ul>\n<li>s26: tablo satırları i = 0…4. Sağda \"Ne anlıyoruz?\" kutusu ve altta hesaplama adımları. Sabit sütun (Δ³f = 6) vurgulu.<\/li>\n<li>s29: sin tablosunun kırmızı hücreleri her farkın hangi f değerlerinden oluştuğunu açılım olarak gösterir. Sol altta \"Polinom Derecesi Kuralı\" kutusu, sağ altta \"Tablonun Pratik Kullanımları\" kutusu vardır.<\/li>\n<\/ul>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>Δ⁴f = 0 demek dördüncü mertebe yoktur. Interpolasyon yaparken gereken polinom derecesi böyle belirlenir. <span class=\"kaynak\">W234 s26<\/span><\/p><\/div>\n<div class=\"vurgu\"><p>\"Bu, sin(x)'in 4. dereceden olduğu anlamına gelmez.\" <span class=\"kaynak\">W234 s29<\/span><\/p><\/div>\n\n<h3>Slayt hataları<\/h3>\n<div class=\"slhata\"><p><b>İkinci Δ³f değeri (s29).<\/b> Slaytta +0.0070. Doğrusu −0.0070.<\/p>\n<p>Kısa hesap: Δ³f₁ = Δ²f₂ − Δ²f₁ = −0.0225 − (−0.0155) = −0.0070.<\/p><\/div>\n<div class=\"slhata\"><p><b>Δf hücre etiketleri (s29).<\/b> İlk etiket doğru (f(0.2) − f(0) = 0.1987 − 0.0). Sonraki üçü \"f(0.4) − f(0.0) = 0.3894 − 0.1987\", \"= 0.5646 − 0.3894\", \"= 0.7174 − 0.5646\" diye yazılmış. Doğrusu f(0.4) − f(0.2), f(0.6) − f(0.4), f(0.8) − f(0.6). Sayıların kendisi doğru.<\/p><\/div>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>Her sütunda üsttekini alttakinden çıkar: Δ¹fᵢ = fᵢ₊₁ − fᵢ.<\/li>\n<li>Sabit çıkan ilk mertebe, polinom derecesidir. Δ³ sabitse derece 3, Δ⁴ sıfırdır.<\/li>\n<li>Veri ölçümse küçük sapmalar olur. \"Yaklaşık sabit\" okunur ve ona göre derece seçilir.<\/li>\n<li>Her mertebede bir satır eksilir. 5 noktadan 4 Δ¹, 3 Δ², 2 Δ³, 1 Δ⁴ çıkar.<\/li>\n<li>Föyde fark tablosu istenir: <a href=\"#\" data-go=\"q:b8\">B8<\/a> a şıkkı (eˣ tablosu) ve <a href=\"#\" data-go=\"q:b9\">B9<\/a> a şıkkı.<\/li>\n<\/ul><\/div>\n<p class=\"bu-eksik\">BUders videolarının başlığında geçmeyen kısım: fark tablosunun kendisi başlıkta ve açıklamada yok. \"n. dereceden polinomda Δⁿf sabit, Δⁿ⁺¹f = 0\" kuralı da yok. Bu kısmı bu nottan çalış.<\/p>","v":["5Tc-YWj_8KU","HV5xo8klTPo","WIAMXcCThsk"],"qs":["b8","b9","x12","x14"]},"k19":{"y":"k","id":"k19","t":"Merkezi farkın üstünlüğü: sin(x) türevi","g":2,"h":"<p class=\"sn\">Kaynak: W234 s27. Formüller için <a href=\"#\" data-go=\"k:k24\">K24<\/a> ve <a href=\"#\" data-go=\"k:k25\">K25<\/a>.<\/p>\n<h3>Ne işe yarar<\/h3>\n<p>Aynı türevi ileri, geri ve merkezi farkla hesaplayıp hatalarını kıyaslar. Merkezi farkın neden O(h²) olduğunu sayıyla gösterir.<\/p>\n\n<h3>Tanımlar ve formüller<\/h3>\n<ul>\n<li>Hedef: f(x) = sin x için x₀ = π/6 ≈ 0.5236 rad noktasında f′(x₀), h = 0.1 ile. Üç yöntemi uygulayıp hatalarını karşılaştıralım.<\/li>\n<li>Gerçek değer: f′(π/6) = cos(π/6) = √3/2 ≈ 0.8660.<\/li>\n<li>İleri fark (Δ¹): f′ ≈ [f(x₁) − f(x₀)] / h<\/li>\n<li>Geri fark (∇¹): f′ ≈ [f(x₀) − f(x₋₁)] / h<\/li>\n<li>Merkezi fark (CD2): f′ ≈ [f(x₁) − f(x₋₁)] / 2h<\/li>\n<li>Hata mertebesi: ileri ve geri O(h), merkezi O(h²). İleri farkın beklenen hatası h·f″/2 ≈ 0.1 × 0.5 / 2 = 0.025.<\/li>\n<\/ul>\n\n<h3>Örnek E17: sin x türevi, x₀ = π/6 (s27)<\/h3>\n<div class=\"ornek\"><p>Slaytın kullandığı fonksiyon değerleri (h = 0.1 rad): x₋₁ = π/6 − 0.1, x₀ = π/6, x₁ = π/6 + 0.1.<\/p>\n<div class=\"tw\"><table>\n<tr><th>Nokta<\/th><th>sin değeri<\/th><th>Slayt<\/th><th>Doğrusu<\/th><\/tr>\n<tr><td>x₋₁ (0.4236)<\/td><td>sin(0.4236)<\/td><td>0.41165<\/td><td>0.41104<\/td><\/tr>\n<tr><td>x₀ (0.5236)<\/td><td>sin(0.5236)<\/td><td>0.50000<\/td><td>0.50000<\/td><\/tr>\n<tr><td>x₁ (0.6236)<\/td><td>sin(0.6236)<\/td><td>0.58070<\/td><td>0.58396<\/td><\/tr>\n<\/table><\/div>\n<p>Slaytın çözümü (yanlış sin değerleriyle, aritmetik kendi içinde tutarlı):<\/p>\n<ul>\n<li>İleri: (0.58070 − 0.50000) / 0.1 = 0.8070. Hata |0.8660 − 0.8070| = 0.0590. Slayt, beklenen hatanın ~0.025 olduğunu not eder.<\/li>\n<li>Geri: (0.50000 − 0.41165) / 0.1 = 0.8835. Hata |0.8660 − 0.8835| = 0.0175. Slayt yorumu: yine O(h), bu noktada ileri farktan şansa bağlı iyi çıktı.<\/li>\n<li>Merkezi (CD2): (0.58070 − 0.41165) / 0.2 = 0.8453. Hata |0.8660 − 0.8453| = 0.0207 ... bekle! Slayt: bu h = 0.1 için hatalı görünüyor? Hayır, aşağıya bak.<\/li>\n<\/ul>\n<p>Slaytın alt kutusu: merkezi fark bu örnekte yanıltıcı görünüyor çünkü h = 0.1 oldukça büyük. h yarılandığında (h = 0.05) ileri fark hatası yaklaşık yarıya inerken merkezi fark hatası yaklaşık dörtte bire iner. O(h) ile O(h²) arasındaki fark h küçüldükçe dramatik hâle gelir.<\/p>\n<p><b>Doğru değerlerle sonuç.<\/b> sin(0.4236) = 0.41104 ve sin(0.6236) = 0.58396 ile:<\/p>\n<div class=\"tw\"><table>\n<tr><th>Yöntem<\/th><th>Hesap<\/th><th>Sonuç<\/th><th>Hata<\/th><\/tr>\n<tr><td>İleri<\/td><td>(0.58396 − 0.50000) / 0.1<\/td><td>0.8396<\/td><td>0.0264<\/td><\/tr>\n<tr><td>Geri<\/td><td>(0.50000 − 0.41104) / 0.1<\/td><td>0.8896<\/td><td>0.0235<\/td><\/tr>\n<tr><td>Merkezi<\/td><td>(0.58396 − 0.41104) / 0.2<\/td><td>0.8646<\/td><td>0.0014<\/td><\/tr>\n<\/table><\/div>\n<p>Merkezi fark açık farkla en iyisi çıkar. İleri farkın hatası beklenen 0.025'e yakındır.<\/p>\n<p><b>h = 0.05 ile.<\/b> sin(π/6 − 0.05) = 0.45609, sin(π/6 + 0.05) = 0.54266.<\/p>\n<div class=\"tw\"><table>\n<tr><th>Yöntem<\/th><th>h = 0.1 sonuç<\/th><th>h = 0.1 hata<\/th><th>h = 0.05 sonuç<\/th><th>h = 0.05 hata<\/th><th>Oran<\/th><\/tr>\n<tr><td>İleri<\/td><td>0.8396<\/td><td>0.02642<\/td><td>0.8532<\/td><td>0.01286<\/td><td>2.05<\/td><\/tr>\n<tr><td>Geri<\/td><td>0.8896<\/td><td>0.02354<\/td><td>0.8782<\/td><td>0.01214<\/td><td>1.94<\/td><\/tr>\n<tr><td>Merkezi<\/td><td>0.8646<\/td><td>0.00144<\/td><td>0.8657<\/td><td>0.00036<\/td><td>4.00<\/td><\/tr>\n<\/table><\/div>\n<p>Slaytın h = 0.05 için verdiği iddia (ileri hata yarıya, merkezi dörtte bire iner) tutuyor. Slayt bu değerleri hesaplamamış, yalnız oranı söylemiş.<\/p><\/div>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>\"O(h) ile O(h²) arasındaki fark h küçüldükçe dramatik hâle gelir.\" <span class=\"kaynak\">W234 s27<\/span><\/p><\/div>\n\n<h3>Slayt hataları<\/h3>\n<div class=\"slhata\"><p><b>sin değerleri ve \"merkezi fark yanıltıcı\" yorumu (s27).<\/b> Slayt sin(0.4236) = 0.41165 ve sin(0.6236) = 0.58070 yazıyor. Doğrusu 0.41104 ve 0.58396. Bu yüzden slaytın ileri 0.8070, geri 0.8835, merkezi 0.8453 ve hata 0.0207 sonuçları yanlıştır. Doğrusu ileri 0.8396 (hata 0.0264), geri 0.8896 (hata 0.0235), merkezi 0.8646 (hata 0.0014). \"Merkezi fark yanıltıcı görünüyor\" yorumu bu yanlış değerlerden doğuyor.<\/p>\n<p>Kısa hesap: (0.58396 − 0.41104) / 0.2 = 0.17292 / 0.2 = 0.8646. |0.8660 − 0.8646| = 0.0014. Sınavda hocanın cevabı slayttaki değerler olabilir. İkisini de bil.<\/p><\/div>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>Hesap makinesi RAD modunda olmalı. h = 0.1 radyandır.<\/li>\n<li>Merkezi fark paydası 2h. İleri ve geri farkta h.<\/li>\n<li>Merkezi farkta f(x₀) kullanılmaz. Yalnız f(x₋₁) ve f(x₁).<\/li>\n<li>h yarılanınca: ileri ve geri hata yaklaşık ½, merkezi hata yaklaşık ¼.<\/li>\n<li>Sonucu hata ile birlikte yaz: \"değer + hata + yorum\".<\/li>\n<\/ul><\/div>\n<p class=\"sn\">Föy soruları: <a href=\"#\" data-go=\"q:a1\">A1<\/a> (eˣ, ileri), <a href=\"#\" data-go=\"q:a2\">A2<\/a> (sin tablosu, geri), <a href=\"#\" data-go=\"q:a3\">A3<\/a> (sin tablosu, merkezi).<\/p>\n<p class=\"bu-eksik\">BUders videolarının başlığında geçmeyen kısım: sin(x) karşılaştırma örneği (ileri, geri ve merkezi farkın hata kıyası) hocaya özgüdür. Bu kısmı bu nottan çalış.<\/p>","v":["EUodLr7SXMk","xaQZQFTsGc4","cLHKU_yFOIw","LzgzhxQcVZ4"],"qs":["x13"]},"k20":{"y":"k","id":"k20","t":"Newton ileri fark interpolasyonu (NIFF)","g":2,"h":"<p class=\"sn\">Kaynak: W234 s30-31. E operatörü ve türetmenin kökü için <a href=\"#\" data-go=\"k:k16\">K16<\/a>.<\/p>\n<h3>Ne işe yarar<\/h3>\n<p>Eşit aralıklı tabloda, tablo başına (x₀) yakın bir x için f(x) değerini bulur. Katsayılar tablonun üst satırından okunur. İleri fark tablosu hazırsa kullanılır.<\/p>\n\n<h3>Tanımlar ve formüller<\/h3>\n\\[\\begin{aligned}P_n(x)=f_0&+s\\,\\Delta f_0+\\frac{s(s-1)}{2!}\\Delta^2f_0\\\\&+\\frac{s(s-1)(s-2)}{3!}\\Delta^3f_0+\\cdots\\end{aligned}\\qquad s=\\frac{x-x_0}{h}\\]\n<p>s boyutsuz koordinattır:<\/p>\n<ul>\n<li>s = 0 ise x = x₀ (ilk nokta), s = 1 ise x = x₁, s = n ise x = xₙ (son nokta).<\/li>\n<li>0 &lt; s &lt; n: interpolasyon.<\/li>\n<li>s &lt; 0 veya s &gt; n: ekstrapolasyon!<\/li>\n<li>Formül, s küçükken (≈ 0) daha hassastır. s ≈ 0 ile 1 arası en hassas bölgedir.<\/li>\n<\/ul>\n<p>Binom benzeri katsayılar C(s, k):<\/p>\n<div class=\"tw\"><table>\n<tr><th>k<\/th><th>Katsayı<\/th><th>İfade<\/th><\/tr>\n<tr><td>0<\/td><td>1<\/td><td>(sabit)<\/td><\/tr>\n<tr><td>1<\/td><td>s<\/td><td>s<\/td><\/tr>\n<tr><td>2<\/td><td>s(s − 1)/2<\/td><td>s(s − 1)/2!<\/td><\/tr>\n<tr><td>3<\/td><td>s(s − 1)(s − 2)/6<\/td><td>s(s − 1)(s − 2)/3!<\/td><\/tr>\n<\/table><\/div>\n<p>NIFF ne zaman kullanılır (s30):<\/p>\n<ul>\n<li>Tablo başına (x₀) yakın sorgu.<\/li>\n<li>s ≈ 0 ile 1 arasında en hassas.<\/li>\n<li>İleri fark tablosu hazırsa.<\/li>\n<li>Bilgisayar uygulamalarında.<\/li>\n<\/ul>\n<p>Kaç terim alınır: Δⁿf ≈ 0 olmaya başladığında dur. Genelde 3-4 terim yeterlidir.<\/p>\n<div class=\"vurgu\"><p>\"Δⁿf ≈ 0 olmaya başladığında dur! Genelde 3-4 terim yeterli.\" <span class=\"kaynak\">W234 s30<\/span><\/p><\/div>\n\n<h3>Türetim (s30)<\/h3>\n<p>E ile:<\/p>\n\\[f(x)=f(x_0+sh)=E^s f(x_0)=(1+\\Delta)^s f(x_0)\\]\n<p>Binom açılımı:<\/p>\n\\[(1+\\Delta)^s=1+s\\Delta+\\frac{s(s-1)}{2!}\\Delta^2+\\cdots\\]\n<p>Her terim f₀'a uygulanır: Δf₀ = f₁ − f₀, Δ²f₀ = f₂ − 2f₁ + f₀, … Böylece yukarıdaki NIFF çıkar.<\/p>\n\n<h3>Örnek E19: cos(0.25) (s31)<\/h3>\n<div class=\"ornek\"><p>Verilen: x = [0.0, 0.5, 1.0, 1.5], f = [1.000, 0.878, 0.540, 0.071]. Newton ileri fark ile f(0.25) bulunacak. h = 0.5.<\/p>\n<p>Fark tablosu (doğru değerlerle):<\/p>\n<div class=\"tw\"><table>\n<tr><th>xᵢ<\/th><th>f(xᵢ)<\/th><th>Δf<\/th><th>Δ²f<\/th><th>Δ³f<\/th><\/tr>\n<tr><td>0.0<\/td><td>1.000<\/td><td>−0.122<\/td><td>−0.216<\/td><td>0.085<\/td><\/tr>\n<tr><td>0.5<\/td><td>0.878<\/td><td>−0.338<\/td><td>−0.131<\/td><td><\/td><\/tr>\n<tr><td>1.0<\/td><td>0.540<\/td><td>−0.469<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>1.5<\/td><td>0.071<\/td><td><\/td><td><\/td><td><\/td><\/tr>\n<\/table><\/div>\n<p>Slayt tablosunda Δ²f ikinci değer 0.050, Δ³f ise 0.266 yazıyor. İkisi de yanlıştır, aşağıya bak.<\/p>\n<p>Adımlar:<\/p>\n<ul>\n<li>s = (0.25 − 0.0)/0.5 = 0.50<\/li>\n<li>C(s,0) = 1, C(s,1) = s = 0.5<\/li>\n<li>C(s,2) = s(s − 1)/2 = 0.5 × (−0.5)/2 = −0.125<\/li>\n<li>C(s,3) = s(s − 1)(s − 2)/6 = 0.5 × (−0.5) × (−1.5)/6 = 0.0625<\/li>\n<\/ul>\n<p>Doğru hesap:<\/p>\n\\[\\begin{aligned}P_3(0.25)&=1\\cdot1.000+0.5(-0.122)\\\\&\\quad+(-0.125)(-0.216)+0.0625(0.085)\\\\&=1.000-0.061+0.027+0.0053\\\\&=0.9713\\end{aligned}\\]\n<p>Gerçek cos(0.25) = 0.9689. Hata |0.9713 − 0.9689| = 0.0024, bağıl hata %0.25. Dört veri noktasından geçen Lagrange polinomu da aynı 0.9713'ü verir.<\/p>\n<p>Slaytın çözümü (yanlış farklarla): P₃(0.25) = 1.000 − 0.061 + 0.027 − 0.0166 = 0.9494. Gerçek 0.9689. Hata |0.9494 − 0.9689| = 0.0195. Bağıl hata %2.01. Slaytın yorumu: \"Neden hata büyük? cos(x) bu aralıkta hafif eğrisel. Daha sık tablo veya daha fazla terim gerekir.\" Alt not: \"Daha hassas için: h = 0.25 veya 5 nokta kullanılırsa hata O(h⁵) mertebesine düşer!\" (Slayt bunu hesaplamıyor.)<\/p><\/div>\n\n<h3>NIFF'ten türev (slayt dışı, föyde var)<\/h3>\n<p>Slayt NIFF'ten türev formülünü yazmıyor. Föy sorusu B8c istiyor. NIFF'i s üzerinden türetip x = x₀ (s = 0) noktasında alınca şu çıkar:<\/p>\n\\[\\begin{aligned}f'(x_0)\\approx\\frac1h\\Big[&\\Delta f_0-\\frac{\\Delta^2f_0}2\\\\&+\\frac{\\Delta^3f_0}3-\\frac{\\Delta^4f_0}4+\\cdots\\Big]\\end{aligned}\\]\n<p>Kontrol: föy B8'in eˣ tablosunda (h = 0.5, Δf₀ = 0.649, Δ²f₀ = 0.420, Δ³f₀ = 0.275, Δ⁴f₀ = 0.173) ilk iki terimle f′(0) ≈ 2[0.649 − 0.420/2] = 0.878. Dört terimle 0.9748. Gerçek 1. Terim sayısı arttıkça gerçeğe yaklaşır. Δf₀ ile f₀ karıştırılmaz, formül farklarla başlar. 1/h = 2 çarpanı unutulmaz.<\/p>\n\n<h3>Şema<\/h3>\n<ul>\n<li>s30: sol tarafta türetim kutusu ve katsayı tablosu. Sağ tarafta s değişkeninin özellikleri (s = 0, 1, n, aralık) ve \"NIFF ne zaman kullanılır?\" kutusu.<\/li>\n<li>s31: solda ileri fark tablosu, sağda çözüm adımları ve sonuç satırı.<\/li>\n<\/ul>\n\n<h3>Slayt hataları<\/h3>\n<div class=\"slhata\"><p><b>NIFF örneği (s31).<\/b> Slaytta Δ²f ikinci değer = 0.050, Δ³f = 0.266, sonuç P₃(0.25) = 0.9494, hata %2. Doğrusu Δ²f = −0.131, Δ³f = 0.085, P₃(0.25) = 0.9713, hata %0.25. Slayt ayrıca 0.0625 × 0.266 = +0.0166 olan terimi \"−0.0166\" diye yazıyor. \"Hata büyük\" yorumu bu yüzden geçersizdir.<\/p>\n<p>Kısa hesap: Δ²f ikinci = 0.071 − 2(0.540) + 0.878 = −0.131. Δ³f = −0.131 − (−0.216) = 0.085. 0.0625 × 0.085 = 0.0053. Toplam 1 − 0.061 + 0.027 + 0.0053 = 0.9713.<\/p><\/div>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>Formül seçimi: x₀'a yakın → NIFF, xₙ'e yakın → NGFF, orta → Stirling. Genel kural: |s| en küçük olan formülü seç (<a href=\"#\" data-go=\"k:k21\">K21<\/a>, <a href=\"#\" data-go=\"k:k23\">K23<\/a>).<\/li>\n<li>s = (x − x₀)/h. h sabit olmalı. Değilse Newton bölünmüş fark.<\/li>\n<li>s(s − 1)(s − 2) gibi terimler negatif çıkabilir. İşarete dikkat.<\/li>\n<li>Katsayılar tablonun üst satırından: f₀, Δf₀, Δ²f₀, Δ³f₀.<\/li>\n<li>s32'deki seçim kuralına göre s = 0.5 Stirling bölgesidir (0.25 &lt; |s| &lt; 0.75). Slayt örnekte yine de NIFF kullanır. Sınavda sorunun istediği formülü kullan.<\/li>\n<li>Ara adımlarda 4 ondalık tut. Son basamak ±1-2 oynayabilir.<\/li>\n<li>Hata = |yaklaşık − gerçek|. Bağıl hata = hata / |gerçek|, yüzde yazılır (slaytta %2.01 gibi).<\/li>\n<\/ul><\/div>\n<p class=\"sn\">Föy soruları: <a href=\"#\" data-go=\"q:b8\">B8<\/a> (eˣ tablosu, NIFF ve türev), <a href=\"#\" data-go=\"q:b9\">B9<\/a> (kiriş yükü).<\/p>\n<p class=\"bu-eksik\">BUders videolarının başlığında geçmeyen kısım: s = (x − x₀)/h tanımı ve NIFF'ten türev formülü (föy B8c). Bu kısmı bu nottan çalış.<\/p>","v":["jI_w88nIkqU","5Tc-YWj_8KU","HV5xo8klTPo","WIAMXcCThsk"],"qs":["b8","b9","x12","x14","x15"]},"k21":{"y":"k","id":"k21","t":"Newton geri fark interpolasyonu (NGFF)","g":2,"h":"<p class=\"sn\">Kaynak: W234 s32-33. Geri fark operatörü için <a href=\"#\" data-go=\"k:k17\">K17<\/a>.<\/p>\n<h3>Ne işe yarar<\/h3>\n<p>Eşit aralıklı tabloda, tablo sonuna (xₙ) yakın bir x için f(x) değerini bulur. Katsayılar tablonun alt satırından okunur. s negatif çıkar.<\/p>\n\n<h3>Tanımlar ve formüller<\/h3>\n\\[\\begin{aligned}P_n(x)=f_n&+s\\,\\nabla f_n+\\frac{s(s+1)}{2!}\\nabla^2f_n\\\\&+\\frac{s(s+1)(s+2)}{3!}\\nabla^3f_n+\\cdots\\end{aligned}\\]\n\\[s=\\frac{x-x_n}{h}\\qquad[s\\le 0]\\]\n<p>NIFF ile farkı (s32):<\/p>\n<div class=\"tw\"><table>\n<tr><th><\/th><th>NIFF<\/th><th>NGFF<\/th><\/tr>\n<tr><td>Merkez<\/td><td>x₀ (ilk)<\/td><td>xₙ (son)<\/td><\/tr>\n<tr><td>s tanımı<\/td><td>(x − x₀)/h<\/td><td>(x − xₙ)/h<\/td><\/tr>\n<tr><td>s değeri<\/td><td>0 … n<\/td><td>≤ 0<\/td><\/tr>\n<tr><td>Fark tipi<\/td><td>Δ (ileri)<\/td><td>∇ (geri)<\/td><\/tr>\n<tr><td>En hassas<\/td><td>x₀ yakını<\/td><td>xₙ yakını<\/td><\/tr>\n<\/table><\/div>\n<p>Geri fark tablosu (s32):<\/p>\n<ul>\n<li>Geri fark tablosu ileri fark tablosunun tersi değildir.<\/li>\n<li>fₙ son f değeridir. ∇fₙ = fₙ − fₙ₋₁. ∇²fₙ = ∇fₙ − ∇fₙ₋₁. Devam eder.<\/li>\n<li>Her satırın sonundan okunur. Köşegen sağ-aşağı doğru okunur. NIFF'te sol-üst köşegen okunur.<\/li>\n<li>Bu sayede aynı tablo iki formül için kullanılabilir.<\/li>\n<\/ul>\n<div class=\"vurgu\"><p>\"Geri fark tablosu = İleri fark tablosunun TERSİ değil!\"<br>\"Bu sayede aynı tablo iki formül için kullanılabilir!\" <span class=\"kaynak\">W234 s32<\/span><\/p><\/div>\n\n<h3>Hangi formülü seç (s32)<\/h3>\n<div class=\"vurgu\"><p>\"Genel kural: |s| en küçük yapan formülü seç! |s| &lt; 0.25 → en yakın uç formülü; 0.25 &lt; |s| &lt; 0.75 → Stirling.\" <span class=\"kaynak\">W234 s32<\/span><\/p><\/div>\n<ul>\n<li>x, x₀'a yakın → NIFF (s küçük pozitif).<\/li>\n<li>Orta noktalar → Stirling (en hassas).<\/li>\n<li>x, xₙ'e yakın → NGFF (s küçük negatif).<\/li>\n<\/ul>\n\n<h3>Örnek E20: eˣ, f(2.3) (s33)<\/h3>\n<div class=\"ornek\"><p>Verilen: x = [1.0, 1.5, 2.0, 2.5], f = [2.718, 4.482, 7.389, 12.182] (eˣ tablosu). NGFF ile f(2.3) bulunacak. h = 0.5.<\/p>\n<div class=\"tw\"><table>\n<tr><th>xᵢ<\/th><th>f(xᵢ)<\/th><th>∇f<\/th><th>∇²f<\/th><th>∇³f<\/th><\/tr>\n<tr><td>1.0<\/td><td>2.718<\/td><td><\/td><td><\/td><td><\/td><\/tr>\n<tr><td>1.5<\/td><td>4.482<\/td><td>1.764<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>2.0<\/td><td>7.389<\/td><td>2.907<\/td><td>1.143<\/td><td><\/td><\/tr>\n<tr><td>2.5<\/td><td>12.182<\/td><td>4.793<\/td><td>1.886<\/td><td>0.743<\/td><\/tr>\n<\/table><\/div>\n<p>NGFF son satırı kullanır: fₙ = 12.182, ∇fₙ = 4.793, ∇²fₙ = 1.886, ∇³fₙ = 0.743.<\/p>\n<ul>\n<li>s = (2.3 − 2.5)/0.5 = −0.4 (negatif, son noktaya yakın)<\/li>\n<li>s(s + 1)/2 = (−0.4)(0.6)/2 = −0.12<\/li>\n<li>s(s + 1)(s + 2)/6 = (−0.4)(0.6)(1.6)/6 = −0.064<\/li>\n<\/ul>\n\\[\\begin{aligned}P_3(2.3)&=12.182+(-0.4)(4.793)\\\\&\\quad+(-0.12)(1.886)+(-0.064)(0.743)\\\\&=12.182-1.917-0.226-0.048\\\\&=9.991\\end{aligned}\\]\n<p>Gerçek e^2.3 = 9.974. Hata |9.991 − 9.974| = 0.017. Bağıl hata %0.17. Slayt: \"ÇOK İYİ!\" Geri fark formülü, son noktaya (2.5) yakın olan x = 2.3 için mükemmel çalışıyor (s negatif, son noktaya yakın). Bütün sayılar script ile tutuyor.<\/p><\/div>\n\n<h3>Şema<\/h3>\n<ul>\n<li>s32: üstte NGFF formülü ve s tanımı. Solda NIFF-NGFF karşılaştırma tablosu, sağda geri fark tablosunun nasıl okunduğunu anlatan kutu. Altta \"Hangi formülü seç?\" bölümü.<\/li>\n<li>s33: solda geri fark tablosu, sağda adım adım çözüm.<\/li>\n<\/ul>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>s negatiftir. En sık hata bu işaret. s = (x − xₙ)/h, x &lt; xₙ olduğu için s &lt; 0.<\/li>\n<li>Katsayılar alt satırdan: fₙ, ∇fₙ, ∇²fₙ, ∇³fₙ. Tablonun üst satırından okuma.<\/li>\n<li>Katsayılarda (s + 1), (s + 2) vardır. NIFF'teki (s − 1), (s − 2) değil.<\/li>\n<li>NIFF'te Δ'lar üst satırdan, NGFF'te ∇'lar alt satırdan okunur. Aynı sayılar farklı yerden alınır.<\/li>\n<li>Hangi formül: |s| en küçük olan. Sınır |s| &lt; 0.25 uç formülü, 0.25 &lt; |s| &lt; 0.75 Stirling.<\/li>\n<li>Yeni terim eklemek, bir önceki terimleri değiştirmez. Son terim küçülüyorsa dur.<\/li>\n<\/ul><\/div>\n<p class=\"sn\">Föy soruları: <a href=\"#\" data-go=\"q:a6\">A6<\/a> (ln x, x = 4.5), <a href=\"#\" data-go=\"q:b11\">B11<\/a> (ln x, x = 2.3).<\/p>","v":["MFuKaLiuHso","uiHY_stGtdI","_cnZGBgmZ5I","38WRO_uuoGQ"],"qs":["a6","b11","x15"]},"k22":{"y":"k","id":"k22","t":"Stirling merkezi fark interpolasyonu","g":2,"h":"<p class=\"sn\">Kaynak: W234 s34. Merkezi fark operatörü için <a href=\"#\" data-go=\"k:k17\">K17<\/a>.<\/p>\n<h3>Ne işe yarar<\/h3>\n<p>Merkez bir iç noktaysa kullanılır. İleri ve geri farkların ortalamasını alır. İç noktalarda en hassas formüldür. Hem interpolasyon hem türev için kullanılır.<\/p>\n\n<h3>Tanımlar ve formüller<\/h3>\n\\[\\begin{aligned}P(x)=f_0&+s\\,\\mu\\Delta f_0+\\frac{s^2}{2!}\\Delta^2f_{-1}\\\\&+\\frac{s(s^2-1)}{3!}\\mu\\Delta^3f_{-1}\\\\&+\\frac{s^2(s^2-1)}{4!}\\Delta^4f_{-2}+\\cdots\\end{aligned}\\]\n<ul>\n<li>s = (x − xᵢ)/h, merkez xᵢ. Merkez, x'e en yakın düğüm seçilir ve f₀ olur.<\/li>\n<li>μΔf₀ = [f₁ − f₋₁]/2, yani ileri ve geri farkın ortalaması.<\/li>\n<li>Doğru terim: Δ²f₋₁ = f₁ − 2f₀ + f₋₁ (3 nokta, merkez f₀).<\/li>\n<\/ul>\n<p>Slayt μΔ³f₋₁ ve Δ⁴f₋₂ için tanım vermez. Standart tanım (slayt dışı): μΔ³f₋₁ = (Δ³f₋₂ + Δ³f₋₁)/2 ve Δ⁴f₋₂ = f₂ − 4f₁ + 6f₀ − 4f₋₁ + f₋₂. Kontrol: 5 düğümde bu formül, aynı 5 noktadan geçen Lagrange polinomuyla 10 basamak aynı çıkıyor. 3 terimli hâli de 3 noktalı Lagrange ile aynı.<\/p>\n\n<h3>Neden O(h²)? (slayt)<\/h3>\n<p>İleri ve geri farkların ortalamasını alır. Taylor ile:<\/p>\n\\[f(x+h)-f(x-h)=2hf'(x)+\\frac{2h^3}{3!}f'''(x)+\\cdots\\]\n<p>2h'ye bölünce:<\/p>\n\\[f'(x)=\\frac{f(x+h)-f(x-h)}{2h}-\\frac{h^2}{6}f'''(c)\\]\n<p>Hata terimi h² içerir, O(h²). Yani h = 0.1 için O(0.01) mertebesinde hata. İleri ve geri farkın O(0.1) hatasından 10 kat daha iyi.<\/p>\n<p>Avantajlar (s34):<\/p>\n<ul>\n<li>Hata O(h²), merkezi fark sayesinde.<\/li>\n<li>Simetrik yapı, hata terimleri kısmen iptal olur.<\/li>\n<li>İç noktalarda en hassas seçim.<\/li>\n<li>Hem interpolasyon hem türev için.<\/li>\n<\/ul>\n<p>Kısıtlar (s34):<\/p>\n<ul>\n<li>Merkez noktanın iki tarafında veri gerekir.<\/li>\n<li>Sınır noktalarda (x₀, xₙ) kullanılamaz.<\/li>\n<li>μΔf için xᵢ±½ noktaları (bazen zorlanır). Not: tam düğümlerde μΔf₀ = (f₁ − f₋₁)/2 yazılınca yarım adımlı nokta gerekmez.<\/li>\n<\/ul>\n\n<h3>Örnek E21: sin(0.3) (s34, satır içi)<\/h3>\n<div class=\"ornek\"><p>sin tablosu, f(0.3) bulunacak. x = [0.0, 0.2, 0.4], f = [0.0000, 0.1987, 0.3894]. Merkez xᵢ = 0.2, h = 0.2.<\/p>\n<ul>\n<li>s = (0.3 − 0.2)/0.2 = 0.5<\/li>\n<li>Δf₀ = f₁ − f₋₁ = 0.3894 − 0.0000 = 0.3894<\/li>\n<li>μΔf₀ = 0.3894/2 = 0.1947<\/li>\n<\/ul>\n<p>Slayt, Δ²f₋₁ = f₀ − 2f₋₁ + f₋₂ yazar. Bu = 0.1987 − 2 × 0.0000 + ??? ve \"[xᵢ₋₂ yok!] → sadece ilk terim\" der. İlk terimle:<\/p>\n\\[\\begin{aligned}P(0.3)&\\approx0.1987+0.5\\times0.1947\\\\&=0.1987+0.0974=0.2961\\end{aligned}\\]\n<p>Gerçek sin 0.3 = 0.2955. Hata %0.20 (slayt). Sayılar script ile tutuyor (yuvarlamasız 0.29605, hata %0.18).<\/p>\n<p><b>Doğru yöntemle üç terim:<\/b> Δ²f₋₁ = f₁ − 2f₀ + f₋₁ = 0.3894 − 2(0.1987) + 0 = −0.0080.<\/p>\n\\[\\begin{aligned}P(0.3)&=0.1987+0.0974\\\\&\\quad+\\frac{0.25}{2}(-0.0080)\\\\&=0.29505\\end{aligned}\\]\n<p>Hata 0.00047. Üç düğüm yeterli, \"xᵢ₋₂ yok\" gerekçesi geçersizdir. Sınavda slaytın yöntemiyle iki terimli sonuç 0.2961 beklenebilir.<\/p><\/div>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>\"Yani h = 0.1 için O(0.01) mertebesinde hata. İleri/geri O(0.1)'den 10x daha iyi!\" <span class=\"kaynak\">W234 s34<\/span><\/p><\/div>\n\n<h3>Slayt hataları<\/h3>\n<div class=\"slhata\"><p><b>Δ²f₋₁ tanımı (s34).<\/b> Slaytta Δ²f₋₁ = f₀ − 2f₋₁ + f₋₂ ve \"xᵢ₋₂ yok\" gerekçesi var. Doğrusu Δ²f₋₁ = f₁ − 2f₀ + f₋₁. Bu üç noktada hesaplanabilir.<\/p>\n<p>Kısa hesap: 0.3894 − 0.3974 + 0 = −0.0080. Üç terimli P(0.3) = 0.29505. Hata 0.00047.<\/p><\/div>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>μΔf₀ bir ortalamadır. (f₁ − f₋₁)'i 2'ye bölmeyi unutma.<\/li>\n<li>Merkez x'e en yakın düğümdür. s küçük olmalı (|s| ≤ 0.5).<\/li>\n<li>Merkezin iki yanında veri yoksa Stirling kullanılamaz. Tablonun başında NIFF, sonunda NGFF kullan.<\/li>\n<li>Seçim: x₀'a yakın NIFF, xₙ'e yakın NGFF, orta Stirling. |s| &lt; 0.25 uç formülü, 0.25 &lt; |s| &lt; 0.75 Stirling.<\/li>\n<li>h sabit değilse bölünmüş fark.<\/li>\n<li>Föy sorularında Stirling yok. Hafta 3 konu sonu sıcaklık örneği (<a href=\"#\" data-go=\"k:k23\">K23<\/a>) Stirling ile çözülüyor.<\/li>\n<\/ul><\/div>","v":["nGJ6snBFmQg","ruOyM577XvU","ZoXnn8JNRJU"],"qs":["x15"]},"k23":{"y":"k","id":"k23","t":"Hafta 3 özeti, formül seçimi, konu sonu örnekler","g":2,"h":"<p class=\"sn\">Kaynak: W234 s35-38. Slaytın Hafta 3 kapağı \"Örnekler + Pratik Sorular\" der. PDF'te pratik soru slaytı yoktur. Bütün formüller için <a href=\"#\" data-go=\"k:k20\">K20<\/a>, <a href=\"#\" data-go=\"k:k21\">K21<\/a>, <a href=\"#\" data-go=\"k:k22\">K22<\/a>. Formül kâğıdı: <a href=\"#\" data-go=\"n:formul\">formül kâğıdı<\/a>.<\/p>\n<h3>Ne işe yarar<\/h3>\n<p>Hafta 3'ün dört interpolasyon formülünü karşılaştırır ve hangisini seçeceğini söyler. Sonra iki konu sonu örnekle uygular.<\/p>\n\n<h3>Özet tablo (s35)<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Formül<\/th><th>Hata mertebesi<\/th><th>s tanımı<\/th><th>Veri gerekliliği<\/th><th>En iyi kullanım<\/th><th>Katsayılar nereden<\/th><\/tr>\n<tr><td>Newton Böl. Fark<\/td><td>O(hⁿ⁺¹)<\/td><td>yok<\/td><td>Herhangi<\/td><td>Genel, değişken h<\/td><td>Sola köşe<\/td><\/tr>\n<tr><td>NIFF (İleri)<\/td><td>O(hⁿ⁺¹)<\/td><td>(x − x₀)/h<\/td><td>Eşit h<\/td><td>x₀ yakın<\/td><td>Sola köşe<\/td><\/tr>\n<tr><td>NGFF (Geri)<\/td><td>O(hⁿ⁺¹)<\/td><td>(x − xₙ)/h<\/td><td>Eşit h<\/td><td>xₙ yakın<\/td><td>Sağa köşe<\/td><\/tr>\n<tr><td>Stirling<\/td><td>O(hⁿ⁺²)<\/td><td>(x − xᵢ)/h<\/td><td>Eşit h, iç nokta<\/td><td>Orta, hassas<\/td><td>Orta satır<\/td><\/tr>\n<\/table><\/div>\n<p>Not: s34 Stirling'in merkezi fark hatasını O(h²) olarak anlatır, s35 tablosu O(hⁿ⁺²) yazar. İkisi aynı şey değildir. s34 türev yaklaşımının hatasıdır. s35 interpolasyon polinomunun hatasıdır.<\/p>\n<p>Hangi formülü seçmeli (s35):<\/p>\n<ol>\n<li>h sabit mi? Evet → eşit aralıklı formüller (aşağıdaki 2. ve 3. soru). Hayır → Newton bölünmüş fark.<\/li>\n<li>x hangi uca yakın? x₀ → NIFF. xₙ → NGFF. Orta → Stirling.<\/li>\n<li>Maksimum hassasiyet gerekiyor mu? Stirling (O(h²) minimum için). Gerek yoksa NIFF veya NGFF yeterli.<\/li>\n<\/ol>\n<p>s tabanlı kural (s32): |s| en küçük olan formülü seç. |s| &lt; 0.25 ise en yakın uç formülü. 0.25 &lt; |s| &lt; 0.75 ise Stirling.<\/p>\n\n<h3>Örnek E22: gemi direnci, V = 13 kn (s36-37)<\/h3>\n<div class=\"ornek\"><p>Verilen: V = [10, 12, 14, 16] kn, R = [20, 30, 60, 130] kN. R(13) NIFF, NGFF ve doğrusal ile bulunacak ve kıyaslanacak. h = 2.<\/p>\n<div class=\"tw\"><table>\n<tr><th>V<\/th><th>R<\/th><th>Δ<\/th><th>Δ²<\/th><th>Δ³<\/th><\/tr>\n<tr><td>10<\/td><td>20<\/td><td>10<\/td><td>20<\/td><td>20<\/td><\/tr>\n<tr><td>12<\/td><td>30<\/td><td>30<\/td><td>40<\/td><td><\/td><\/tr>\n<tr><td>14<\/td><td>60<\/td><td>70<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>16<\/td><td>130<\/td><td><\/td><td><\/td><td><\/td><\/tr>\n<\/table><\/div>\n<p>Slayt, tabloyu \"ileri/geri fark tablosu\" diye verir. Aynı sayılar iki formülde kullanılır: NIFF üst satırı (10, 20, 20), NGFF alt köşegeni (70, 40, 20).<\/p>\n<p><b>Doğrusal (V ∈ [12, 14]):<\/b> m = (60 − 30)/(14 − 12) = 15 kN/kn. R(13) = 30 + 15 × (13 − 12) = 45 kN.<\/p>\n<p><b>NIFF:<\/b> s = (13 − 10)/2 = 1.5.<\/p>\n\\[\\begin{aligned}P&=20+1.5\\times10\\\\&\\quad+\\tfrac{1.5\\times0.5}{2}\\times20\\\\&\\quad+\\tfrac{1.5\\times0.5\\times(-0.5)}{6}\\times20\\\\&=20+15+7.5-1.25=41.25\\ \\text{kN}\\end{aligned}\\]\n<p><b>NGFF:<\/b> s = (13 − 16)/2 = −1.5.<\/p>\n\\[\\begin{aligned}P&=130+(-1.5)\\times70\\\\&\\quad+\\tfrac{(-1.5)(-0.5)}{2}\\times40\\\\&\\quad+\\tfrac{(-1.5)(-0.5)(0.5)}{6}\\times20\\\\&=130-105+15+1.25=41.25\\ \\text{kN}\\end{aligned}\\]\n<p>Sonuç (slayt): Doğrusal = 45 kN, NIFF = 41.25 kN, NGFF = 41.25 kN. 3. derece polinom (NIFF ve NGFF) verinin eğriselliğini yakalıyor. Doğrusal basit ama sapmıyor! NIFF ve NGFF aynı 4 noktadan geçen polinom olduğu için aynı sonucu verir. Sayılar script ile tutuyor.<\/p><\/div>\n\n<h3>Örnek E23: sıcaklık dağılımı, T(1.75) (s38)<\/h3>\n<div class=\"ornek\"><p>Verilen: çubuk üzerinde x = [1.0, 1.5, 2.0, 2.5] m, T = [100, 90, 75, 55] °C. Stirling ile T(1.75) bulunacak. h = 0.5.<\/p>\n<div class=\"tw\"><table>\n<tr><th>x<\/th><th>T<\/th><th>∇T<\/th><th>∇²T<\/th><th>∇³T<\/th><\/tr>\n<tr><td>1.0<\/td><td>100<\/td><td><\/td><td><\/td><td><\/td><\/tr>\n<tr><td>1.5<\/td><td>90<\/td><td>−10<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>2.0<\/td><td>75<\/td><td>−15<\/td><td>−5<\/td><td><\/td><\/tr>\n<tr><td>2.5<\/td><td>55<\/td><td>−20<\/td><td>−5<\/td><td>0<\/td><\/tr>\n<\/table><\/div>\n<p><b>Stirling (merkez xᵢ = 1.5):<\/b> s = (1.75 − 1.5)/0.5 = 0.5. İlk iki terim: T ≈ f₀ + s·μΔf₀. μΔf₀ = [f(2.0) − f(1.0)]/2 = (75 − 100)/2 = −12.5.<\/p>\n\\[T(1.75)\\approx90+0.5(-12.5)=90-6.25=83.75\\ ^\\circ\\mathrm C\\]\n<p><b>NGFF karşılaştırma (merkez xₙ = 2.5):<\/b> s = (1.75 − 2.5)/0.5 = −1.5. s(s + 1)/2 = (−1.5)(−0.5)/2 = 0.375. s(s + 1)(s + 2)/6 = (−1.5)(−0.5)(0.5)/6 = 0.0625.<\/p>\n\\[\\begin{aligned}P&=55+(-1.5)(-20)+0.375(-5)+0.0625(0)\\\\&=55+30-1.875+0=83.125\\ ^\\circ\\mathrm C\\end{aligned}\\]\n<p>Slayt: \"Stirling: 83.75 °C | NGFF: 83.125 °C | Fark: 0.625 °C. İki yöntem yakın sonuç veriyor! Stirling xi = 1.5'e yakın olduğu için biraz daha doğru.\" Sayılar script ile tutuyor, son cümle yanlış (aşağıya bak).<\/p>\n<p>Üçüncü terimle Stirling: δ²f₀ = 75 − 2(90) + 100 = −5. P = 83.75 + (0.25/2)(−5) = 83.125, NGFF ile aynı.<\/p><\/div>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>\"Genel kural: |s| en küçük yapan formülü seç!\" <span class=\"kaynak\">W234 s32<\/span><\/p><\/div>\n<div class=\"vurgu\"><p>\"Doğrusal basit ama sapmıyor!\" (konu sonu örnek sonucu, NIFF ve NGFF verinin eğriselliğini yakalıyor.) <span class=\"kaynak\">W234 s37<\/span><\/p><\/div>\n\n<h3>Slayt hataları<\/h3>\n<div class=\"slhata\"><p><b>\"Stirling daha doğru\" (s38).<\/b> Slayt Stirling 83.75'i daha doğru der. Yanlış. ∇³ = 0 olduğu için NGFF verinin tam polinomudur. 4 noktalı Lagrange da 83.125 verir. Stirling'in 2 terimli 83.75'i terim kesilmiş hâlidir. s²/2·δ²f₀ terimi eklenince 83.75 − 0.625 = 83.125, NGFF ile aynı.<\/p>\n<p>Kısa hesap: (0.25/2) × (−5) = −0.625. 83.75 − 0.625 = 83.125.<\/p><\/div>\n<div class=\"slhata\"><p><b>\"3 terim\" başlığı (s36).<\/b> Slayt NIFF ve NGFF için \"3 terim\" diyor. Hesap 4 terim kullanıyor (veri 4 nokta, 3. farka kadar).<\/p>\n<p>Kısa hesap: NIFF 20 + 15 + 7.5 − 1.25. Dördüncü terim −1.25. 3 terimle (ilk üçü) 42.5 çıkar, 41.25 değil.<\/p><\/div>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>Seçim kuralı: x₀'a yakın → NIFF, xₙ'e yakın → NGFF, orta → Stirling. |s| &lt; 0.25 uç formülü, 0.25 &lt; |s| &lt; 0.75 Stirling.<\/li>\n<li>h sabit değilse eşit aralıklı formüller kullanılmaz. Bölünmüş fark kullan.<\/li>\n<li>Aynı tablo NIFF ve NGFF için kullanılır. NIFF üst satırı, NGFF alt satırı okur.<\/li>\n<li>Fark tablosunda sabit sütun hangi mertebedeyse o kadar terim yeter. Δ³ = 0 ise 3. terim 0 gelir (E23).<\/li>\n<li>İki yöntem aynı veri polinomunu veriyorsa sonuçlar aynı çıkar (E22, E23 NGFF ve Lagrange). Terim kestiğin yöntem farklı sonuç verir.<\/li>\n<li>Sonucu hata payıyla yaz. Hesaplanan ara değer ölçülmüş değer gibi sunulmaz.<\/li>\n<\/ul><\/div>\n<p class=\"bu-eksik\">BUders videolarının başlığında geçmeyen kısım: Hafta 3 özeti ve formül seçimi (x₀ yakın → NIFF, xₙ yakın → NGFF, orta → Stirling). Gemi ve sıcaklık örnekleri hocaya özgüdür. Bu kısmı bu nottan çalış.<\/p>","v":["5Tc-YWj_8KU","uiHY_stGtdI","ruOyM577XvU"],"qs":["x15"]},"k24":{"y":"k","id":"k24","t":"Sayısal türevin anlamı ve Taylor ile türetim","g":3,"h":"<p class=\"sn\">Kaynak: W234 s39-41. Hafta 4 içindekiler (s39): 1) Sayısal türevin fiziksel ve matematiksel anlamı, 2) Taylor serisi ile hata analizi ve türetim, 3) 2-nokta ileri ve geri fark O(h), 4) 3-nokta ileri, geri ve merkezi fark O(h²), 5) 5-nokta merkezi fark O(h⁴), 6) yüksek mertebe türevler (2. türev), 7) kesme hatası ve yuvarlama hatası dengesi, 8-9) konu sonu çözümlü örnekler.<\/p>\n<h3>Ne işe yarar<\/h3>\n<p>Türevi fonksiyon formülü olmadan, yalnız tablodaki değerlerden hesaplar. Bütün sayısal türev formülleri Taylor serisinden çıkar. Bu not, FD1, BD1 ve CD2'nin nereden geldiğini ve hatasının neden O(h) ya da O(h²) olduğunu gösterir.<\/p>\n\n<h3>Tanımlar ve formüller<\/h3>\n<p>Matematiksel tanım (limit):<\/p>\n\\[f'(x)=\\lim_{h\\to0}\\frac{f(x+h)-f(x)}{h}\\]\n<ul>\n<li>Bilgisayarda h = 0 olamaz. h = 0 koyarsan [f(x+0) − f(x)]/0 = 0/0 çıkar.<\/li>\n<li>Çare: küçük ama sonlu bir h seçilir. Bu durumda kesme hatası (truncation) doğar.<\/li>\n<li>Sonlu fark (finite difference) yaklaşımı: f′(x) ≈ [f(x+h) − f(x)]/h. Bu yaklaşımın hatası O(h) mertebesindedir.<\/li>\n<\/ul>\n<p>Fiziksel anlam: ortalama değişim hızından anlık değişim hızına geçiş. Eğim = yükseklik farkı / yatay uzaklık.<\/p>\n<ul>\n<li>Hız: v(t) = dx/dt ≈ [x(t+h) − x(t)]/h. h küçükse anlık hızdır.<\/li>\n<li>Isı akısı: q = −k dT/dx. Sıcaklık ölçümlerinden sayısal türev alınarak ısı akısı tahmin edilebilir.<\/li>\n<li>Türev olmadan hesaplanamayan uygulamalar: devre analizi (V = L·di/dt), kontrol sistemleri, CFD (akışkanlar dinamiği), görüntü işleme (kenar tespiti).<\/li>\n<\/ul>\n<p>Geometrik anlam (s40): türev, eğrinin bir noktadaki teğet eğimidir.<\/p>\n\n<h3>Türetim (s41)<\/h3>\n<p>Amaç, f(x+h) ve f(x−h) ifadelerini x noktası etrafında açarak f′(x) için yaklaşık formüller elde etmektir. Sayısal türev formüllerinin temelinde Taylor serisi vardır.<\/p>\n<p>İleri ve geri Taylor açılımları:<\/p>\n\\[\\begin{aligned}f(x+h)=f(x)&+hf'(x)+\\frac{h^2}{2!}f''(x)\\\\&+\\frac{h^3}{3!}f'''(x)+\\cdots\\end{aligned}\\]\n\\[\\begin{aligned}f(x-h)=f(x)&-hf'(x)+\\frac{h^2}{2!}f''(x)\\\\&-\\frac{h^3}{3!}f'''(x)+\\cdots\\end{aligned}\\]\n<h4>2 nokta ileri fark FD1<\/h4>\n<p>İleri açılımda f(x)'i sol tarafa al, her iki tarafı h'ye böl (slayt buna \"F1 türetimi\" diyor):<\/p>\n\\[\\begin{aligned}\\frac{f(x+h)-f(x)}{h}=f'(x)&+\\frac h2f''(x)\\\\&+\\frac{h^2}{6}f'''(x)+\\cdots\\end{aligned}\\]\n\\[f'(x)=\\frac{f(x+h)-f(x)}{h}-\\frac h2f''(\\xi)\\]\n<p>Kesme hatası (h/2)·f″(ξ), yani O(h).<\/p>\n<h4>2 nokta geri fark BD1<\/h4>\n\\[\\begin{aligned}\\frac{f(x)-f(x-h)}{h}=f'(x)&-\\frac h2f''(x)\\\\&+\\frac{h^2}{6}f'''(x)-\\cdots\\end{aligned}\\]\n\\[f'(x)\\approx\\frac{f(x)-f(x-h)}{h}\\]\n<p>Kesme hatası (h/2)·f″(ξ), yani O(h). Slayt buna \"B1 türetimi\" der. Kısaltmalar s45'te FD1 ve BD1.<\/p>\n<h4>3 nokta merkezi fark CD2<\/h4>\n<p>İki açılımı çıkar (farkı al). f(x) ve h² terimleri götürülür.<\/p>\n\\[f(x+h)-f(x-h)=2hf'(x)+\\frac{2h^3}{6}f'''(x)+\\cdots\\]\n\\[f'(x)\\approx\\frac{f(x+h)-f(x-h)}{2h}-\\frac{h^2}{6}f'''(\\xi)\\qquad O(h^2)\\]\n<p>Geriye h³/6 kalır. 2h'ye bölünce h²/6 kalır. Yani O(h) yerine O(h²) olur. Kesme hatası: O(h²), slayt: \"ÇOK İYİ!\"<\/p>\n<p>Slayt: \"Merkezi farkın avantajı, f(x+h) ve f(x−h) Taylor açılımlarının birlikte kullanılmasıdır.\"<\/p>\n\n<h3>Hata sabitlerini sayıyla kontrol<\/h3>\n<div class=\"ornek\"><p>Slayt dışı kontrol. sin x, x₀ = π/6, h = 0.1 (<a href=\"#\" data-go=\"k:k19\">K19<\/a> verisi).<\/p>\n<ul>\n<li>FD1 hata beklentisi: (h/2)|f″| = 0.05 × 0.5 = 0.025. Gerçek hata 0.0264.<\/li>\n<li>CD2 hata beklentisi: (h²/6)|f‴| = 0.01/6 × 0.866 = 0.00144. Gerçek hata 0.00144.<\/li>\n<\/ul>\n<p>Script ile (eˣ, x = 0.5, h = 10⁻³): FD1 hatası / (h/2·f″) = 1.0003. BD1 hatası / (−h/2·f″) = 0.9997. CD2 hatası / (h²/6·f‴) = 1.0000. Hata sabitleri tutuyor.<\/p><\/div>\n\n<h3>Şema<\/h3>\n<p>s40 geometrik gösterim grafiği (\"Türevin Geometrik Anlamı\"):<\/p>\n<ul>\n<li>y = f(x) eğrisi üzerinde A = (x, f(x)) ve B = (x+h, f(x+h)) noktaları işaretli.<\/li>\n<li>Kesikli kırmızı çizgi sekant doğrusudur. Eğimi sekant eğimi = [f(x+h) − f(x)]/h.<\/li>\n<li>Teğet doğrusunun eğimi f′(x)'tir.<\/li>\n<li>h küçüldükçe B noktası A'ya yaklaşır ve sekant doğrusu teğet doğrusuna yaklaşır.<\/li>\n<\/ul>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>\"Bilgisayarda h = 0 olamaz!\" → küçük ama sonlu h seçilir → kesme hatası (truncation) doğar. <span class=\"kaynak\">W234 s40<\/span><\/p><\/div>\n\n<h3>Slayt hataları<\/h3>\n<div class=\"slhata\"><p><b>\"h² terimleri aynı işarette (toplanır!) → bunlar iptal olur\" (s41).<\/b> Slayt CD2 kutusunda böyle yazıyor. Karışık bir ifade. İki açılım çıkarıldığı için h² terimleri iptal olur. Toplanıyor demek yanlıştır.<\/p>\n<p>Kısa hesap: (h²/2 f″) − (h²/2 f″) = 0. h³ terimleri ise farkta toplanır: h³/6 f‴ − (−h³/6 f‴) = 2h³/6 f‴.<\/p><\/div>\n<div class=\"slhata\"><p><b>\"h = 0.1 → 100x daha hassas vs ileri/geri\" (s41).<\/b> Doğrusu 10x. Slayt kendisi s34'te \"İleri/geri O(0.1)'den 10x daha iyi!\" diyor.<\/p>\n<p>Kısa hesap: O(h) = 0.1, O(h²) = 0.01, oran 10. Sabitlerle (f″ ≈ f‴ alınırsa) (h/2)/(h²/6) = 3/h = 30. 100 hiçbir şekilde çıkmaz.<\/p><\/div>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>h küçüldükçe kesme hatası azalır. Çok küçük h ise yuvarlama hatasını büyütür (<a href=\"#\" data-go=\"k:k28\">K28<\/a>).<\/li>\n<li>İleri fark (f(x+h) − f(x))/h. Geri fark (f(x) − f(x−h))/h. Merkezi (f(x+h) − f(x−h))/(2h). Paydayı karıştırma.<\/li>\n<li>İleri ve geri O(h). Merkezi O(h²). Bunu bir cümleyle yaz.<\/li>\n<li>Trigonometride hesap makinesi RAD modunda olmalı.<\/li>\n<li>Tablo verildiyse fonksiyonu yeniden hesaplama. Tablodaki değerleri kullan.<\/li>\n<\/ul><\/div>\n<p class=\"sn\">Föy soruları: <a href=\"#\" data-go=\"q:a1\">A1<\/a> (eˣ, ileri), <a href=\"#\" data-go=\"q:a2\">A2<\/a> (sin tablosu, geri), <a href=\"#\" data-go=\"q:a3\">A3<\/a> (sin tablosu, merkezi), <a href=\"#\" data-go=\"q:b10\">B10<\/a>.<\/p>\n<p class=\"bu-eksik\">BUders videolarının başlığında geçmeyen kısım: Taylor ile türetim (f(x+h) ve f(x−h) açılımları, hata terimleri). Bu kısmı bu nottan çalış.<\/p>","v":["q54_HhbMr4I","NqCPeLclcys"],"qs":["a1","a2","a3","x13"]},"k25":{"y":"k","id":"k25","t":"3-nokta formüller FD2, BD2, CD2","g":3,"h":"<p class=\"sn\">Kaynak: W234 s42. FD1, BD1 ve Taylor açılımları için <a href=\"#\" data-go=\"k:k24\">K24<\/a>.<\/p>\n<h3>Ne işe yarar<\/h3>\n<p>İki nokta yerine üç nokta kullanarak ileri ve geri farkın hatasını O(h)'den O(h²)'ye indirir. Sınır noktalarında, merkezi farkın kullanılamadığı yerde kullanılır.<\/p>\n\n<h3>Tanımlar ve formüller<\/h3>\n<p><b>FD2<\/b> (3 nokta ileri), hata O(h²):<\/p>\n\\[f'(x)\\approx\\frac{-3f(x)+4f(x+h)-f(x+2h)}{2h}\\]\n<p><b>BD2<\/b> (3 nokta geri), hata O(h²):<\/p>\n\\[f'(x)\\approx\\frac{3f(x)-4f(x-h)+f(x-2h)}{2h}\\]\n<p><b>CD2<\/b> (3 nokta merkezi), hata O(h²):<\/p>\n\\[f'(x)\\approx\\frac{f(x+h)-f(x-h)}{2h}\\]\n<ul>\n<li>FD2 (3 nokta ileri) için gereken noktalar: x, x+h, x+2h.<\/li>\n<li>BD2 (3 nokta geri) için gereken noktalar: x, x−h, x−2h.<\/li>\n<li>CD2 (merkezi) için gereken noktalar: x−h, x, x+h.<\/li>\n<li>Merkezi fark, simetrik yapısı nedeniyle iç noktalarda genellikle daha dengeli ve güvenilir sonuç verir.<\/li>\n<\/ul>\n\n<h3>Türetim (s42)<\/h3>\n<h4>FD2<\/h4>\n<p>İki Taylor açılımı yazılır:<\/p>\n\\[f(x+h)=f+hf'+\\frac{h^2}{2}f''+\\frac{h^3}{6}f'''+\\cdots\\]\n\\[f(x+2h)=f+2hf'+2h^2f''+\\frac{4}{3}h^3f'''+\\cdots\\]\n<p>İlk denklem dört ile çarpılır, ikinci denklem çıkarılır. f″(x) terimi yok olur.<\/p>\n\\[\\begin{aligned}4f(x+h)-f(x+2h)&=4f+4hf'+2h^2f''\\\\&\\quad-f-2hf'-2h^2f''+\\cdots\\\\&=3f+2hf'+O(h^3)\\end{aligned}\\]\n\\[f'(x)\\approx\\frac{-3f(x)+4f(x+h)-f(x+2h)}{2h}+O(h^2)\\]\n<p>Kesme hatası O(h²). 2h'ye bölünce O(h³) terimi O(h²) olur.<\/p>\n<h4>BD2<\/h4>\n<p>İki Taylor açılımı (geriye):<\/p>\n\\[f(x-h)=f-hf'+\\frac{h^2}{2}f''-\\frac{h^3}{6}f'''+\\cdots\\]\n\\[f(x-2h)=f-2hf'+\\frac{4h^2}{2}f''-\\cdots\\]\n\\[\\begin{aligned}4f(x-h)-f(x-2h)&=4f-4hf'+2h^2f''\\\\&\\quad-f+2hf'-2h^2f''+\\cdots\\\\&=3f-2hf'+O(h^3)\\end{aligned}\\]\n<p>Aynı mantıkla BD2 formülü çıkar. Kesme hatası O(h²).<\/p>\n<h4>CD2<\/h4>\n<p>İleri − geri Taylor farkı:<\/p>\n\\[f(x+h)-f(x-h)=2hf'+\\frac{2h^3f'''}{6}+\\cdots\\]\n\\[f'(x)\\approx\\frac{f(x+h)-f(x-h)}{2h}-\\frac{h^2}{6}f'''(\\xi)\\]\n<p>Kesme hatası O(h²), çünkü h² terimleri iptal oldu.<\/p>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>\"Sınırdaysanız: ileri veya geri fark tercih edilir.\"<br>\"İç noktadaysanız ve iki tarafta veri varsa: 'Merkezi fark tercih edilir'\" <span class=\"kaynak\">W234 s42<\/span> (slaytta sarı vurgulu)<\/p><\/div>\n\n<h3>Slayt hataları<\/h3>\n<div class=\"slhata\"><p><b>f″ terimi (s42, FD2 ve BD2 türetimi).<\/b> Slayt \"4×[f(x+h)] − [f(x+2h)] = 4f + 4hf′ + 2h²f″… − f − 2hf′ − 4h²f″… = 3f + 2hf′ + O(h³)\" yazıyor. BD2 satırında da \"− 4h²f″…\". Doğrusu \"− 2h²f″…\". f(x+2h) açılımında f″ terimi (2h)²/2 = 2h², slayt kendi açılımında da 2h² yazıyor, birleşim satırında 4h²'ye çevirmiş.<\/p>\n<p>Kısa hesap: 4 × (h²/2) = 2h². 2h² − 2h² = 0, f″ iptal olur. Slaytın yazdığı −4h² ile 2h² − 4h² = −2h² kalırdı, iptal olmazdı. h = 0.1 için doğru 0, yanlış −0.02.<\/p><\/div>\n\n<h3>Kendin dene (slayt dışı)<\/h3>\n<div class=\"ornek\"><p>Isı akısı örneğinin sıcaklık verisi: x = [0, 0.1, 0.2, 0.3, 0.4] m, T = [200, 186, 162, 128, 84] °C, h = 0.1 (örnek için <a href=\"#\" data-go=\"k:k29\">K29<\/a>). Sınır noktalarında:<\/p>\n<ul>\n<li>x = 0 (sol sınır), FD1: (186 − 200)/0.1 = −140 °C/m.<\/li>\n<li>x = 0, FD2: (−3·200 + 4·186 − 162)/(2·0.1) = (−600 + 744 − 162)/0.2 = −18/0.2 = −90 °C/m.<\/li>\n<li>x = 0.4 (sağ sınır), BD1: (84 − 128)/0.1 = −440 °C/m.<\/li>\n<li>x = 0.4, BD2: (3·84 − 4·128 + 162)/(2·0.1) = (252 − 512 + 162)/0.2 = −98/0.2 = −490 °C/m.<\/li>\n<\/ul>\n<p>Sınırda iki formül farklı sonuç verir. O(h²) olan FD2 ve BD2 daha güvenilirdir.<\/p>\n<p>Mertebe kontrolü (eˣ, x = 1, h = 0.1 ve 0.05): hata oranları FD2 4.16, BD2 3.85, CD2 4.00. h yarılanınca hata yaklaşık dörtte bire iner, yani O(h²).<\/p><\/div>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>FD2 işaretleri: −3, +4, −1. BD2 işaretleri: +3, −4, +1. İkisi de 2h'ye bölünür.<\/li>\n<li>FD2'de katsayıların toplamı 0 olmalı (−3 + 4 − 1 = 0). BD2'de de (3 − 4 + 1 = 0). Sabit fonksiyonun türevi 0 çıkar.<\/li>\n<li>BD2, FD2'nin h yerine −h yazılmış, işareti çevrilmiş hâlidir.<\/li>\n<li>Sınırdaysan FD2 (sol) ya da BD2 (sağ). İç noktadaysan CD2.<\/li>\n<li>Gerekli nokta sayısını say: üç nokta için üç tablo değeri.<\/li>\n<\/ul><\/div>\n<p class=\"bu-eksik\">BUders videolarının başlığında geçmeyen kısım: 2 noktalı ileri ve geri fark (FD1, BD1) ayrı bir videoda anlatılıyor mu belli değil. Bu kısmı <a href=\"#\" data-go=\"k:k24\">K24<\/a> notundan çalış.<\/p>","v":["EUodLr7SXMk","xaQZQFTsGc4","cLHKU_yFOIw","LzgzhxQcVZ4"],"qs":["a3","b10","x13","x16"]},"k26":{"y":"k","id":"k26","t":"5-nokta CD4 ve ikinci türev formülleri","g":3,"h":"<p class=\"sn\">Kaynak: W234 s43-44, s46. 3 nokta formüller için <a href=\"#\" data-go=\"k:k25\">K25<\/a>. Karşılaştırma tablosu için <a href=\"#\" data-go=\"k:k27\">K27<\/a>.<\/p>\n<h3>Ne işe yarar<\/h3>\n<p>Çok hassas türev gerektiğinde 5 nokta merkezi formül (hata O(h⁴)) kullanılır. İkinci türev için ayrı formüller vardır. İç noktada merkezi, sınırda 4 noktalı ileri veya geri formül seçilir.<\/p>\n\n<h3>Tanımlar ve formüller<\/h3>\n<p>Amaç, f′(x) değerini x noktasının iki tarafındaki dört komşu noktayı kullanarak yüksek doğrulukla hesaplamaktır. Bu, 3 noktalı merkezi farkın O(h²) doğruluğuna göre önemli bir iyileşmedir.<\/p>\n<p><b>CD4<\/b> (5 nokta merkezi, 1. türev, 4 Taylor serisi birleşimi), hata O(h⁴):<\/p>\n\\[f'(x)\\approx\\frac{-f(x+2h)+8f(x+h)-8f(x-h)+f(x-2h)}{12h}\\]\n<p>Aynı formül s45'te f(x−2h) önde yazılır: [f(x−2h) − 8f(x−h) + 8f(x+h) − f(x+2h)]/(12h). Terimlerin sırası farklıdır, değer aynıdır.<\/p>\n<p><b>İkinci türev formülleri:<\/b><\/p>\n<p><b>D2<\/b> (3 nokta merkezi), hata O(h²):<\/p>\n\\[f''(x)\\approx\\frac{f(x+h)-2f(x)+f(x-h)}{h^2}\\]\n<p><b>FD2-2<\/b> (4 nokta ileri), hata O(h²):<\/p>\n\\[f''(x)\\approx\\frac{2f(x)-5f(x+h)+4f(x+2h)-f(x+3h)}{h^2}\\]\n<p><b>BD2-2<\/b> (4 nokta geri), hata O(h²):<\/p>\n\\[f''(x)\\approx\\frac{2f(x)-5f(x-h)+4f(x-2h)-f(x-3h)}{h^2}\\]\n<p><b>D2-CD4<\/b> (5 nokta merkezi), hata O(h⁴):<\/p>\n\\[\\begin{aligned}f''(x)\\approx\\frac{1}{12h^2}\\bigl[&-f(x+2h)+16f(x+h)\\\\&-30f(x)+16f(x-h)-f(x-2h)\\bigr]\\end{aligned}\\]\n<ul>\n<li>FD2-2 sadece ileri yöne bakar (\"Bu form sadece ileri yöne bakar!\"). Sol sınırda (x₀, başlangıç) kullanılır. Merkezi formül iç noktalarda tercih edilir.<\/li>\n<li>BD2-2 aynı mantıkla sağ sınırda kullanılır.<\/li>\n<li>D2 adı için aşağıdaki slayt hatası notuna bak.<\/li>\n<\/ul>\n<p>Mertebeler: FD2-2, BD2-2, D2 → O(h²). D2-CD4 → O(h⁴). Script ile (eˣ, x = 1, h = 0.2 → 0.1) hata oranı: FD2-2 4.48, BD2-2 3.60, D2 4.00, D2-CD4 16.04. Yani O(h²) için yaklaşık 4, O(h⁴) için yaklaşık 16.<\/p>\n\n<h3>CD4 ne zaman kullanılır (s43-44)<\/h3>\n<ul>\n<li>Çok hassas türev gerekiyorsa (CFD, diferansiyel denklemler).<\/li>\n<li>h = 0.1 ile hata ≈ 10⁻⁴ (3 nokta formülde 10⁻²). Bu sadece h² ve h⁴ mertebesidir, katsayı hesaba girmez.<\/li>\n<li>Gürültüsüz, düzgün verilerle mükemmel.<\/li>\n<li>Gürültülü verilerle KÖTÜ. h küçülünce yuvarlama hatası büyük katsayıları çarpar (8, −8 gibi).<\/li>\n<li>Veri setinin en az 2 iç kenar noktasına ihtiyaç var. x±2h kullanıldığı için x'in iki yanında da en az 2'şer nokta gerekir.<\/li>\n<\/ul>\n<div class=\"vurgu\"><p>\"Gürültülü verilerle KÖTÜ! h küçülünce yuvarlama hatası büyük katsayıları çarpar (8, −8 gibi büyük katsayılar var)\" <span class=\"kaynak\">W234 s43<\/span><\/p><\/div>\n\n<h3>Örnek E24: f(x) = x³, x = 1, h = 0.1 (s44)<\/h3>\n<div class=\"ornek\"><p>f(1.2) = 1.728, f(1.1) = 1.331, f(0.9) = 0.729, f(0.8) = 0.512.<\/p>\n\\[\\begin{aligned}f'(1)&\\approx\\frac{-f(1.2)+8f(1.1)-8f(0.9)+f(0.8)}{1.2}\\\\&=\\frac{-1.728+10.648-5.832+0.512}{1.2}\\\\&=\\frac{3.600}{1.2}=3\\end{aligned}\\]\n<p>Gerçek türev: f′ = 3x², f′(1) = 3. Tam sonucu verir. Slayt: bunun nedeni x³'ün 3. dereceden bir polinom olması ve 5 nokta merkezi formülün düşük dereceli polinomlarda çok yüksek doğruluk sağlamasıdır. Payda 12h = 12 × 0.1 = 1.2. Script ile pay 3.600000, sonuç 3.000000.<\/p>\n<p>Kontrol (slayt dışı): aynı veriyle 3 nokta CD2 (1.331 − 0.729)/0.2 = 3.01 verir (hata h²·f‴/6 = 0.01). CD4 ise 4. dereceye kadar polinomlarda tam: x⁴ için 4.000000. x⁵ için 4.9996 (hata h⁴/30·f⁽⁵⁾ = 0.0004).<\/p><\/div>\n<p>CD4 hata terimi (slayt dışı kontrol): 8[f(x+h) − f(x−h)] − [f(x+2h) − f(x−2h)] = 12hf′ − (2/5)h⁵f⁽⁵⁾ + ⋯ olur. Bölününce f′ = CD4 + (h⁴/30)f⁽⁵⁾(ξ). h³ terimleri 8 ve 1 ağırlığı sayesinde iptal olur.<\/p>\n<p>D2 hata terimi (slayt dışı kontrol): f(x+h) + f(x−h) = 2f + h²f″ + (h⁴/12)f⁗ + ⋯ olduğundan f″ = D2 − (h²/12)f⁗(ξ). O(h²).<\/p>\n\n<h3>Üçüncü türev (slayt dışı, föyde var)<\/h3>\n<p>δ³ formülü (<a href=\"#\" data-go=\"k:k17\">K17<\/a>) türev olarak kullanılır:<\/p>\n\\[f'''(x)\\approx\\frac{f(x+2h)-2f(x+h)+2f(x-h)-f(x-2h)}{2h^3}\\]\n<p>Hata O(h²). Payda 2h³. Kontrol: x³ için 6.000000 (tam). Föy C2: cos x, x = π/4, h = 0.1, sonuç 0.70534, gerçek sin(π/4) = 0.70711. Pay çok küçük (0.0014), yuvarlama hatasına duyarlı. Hesabı değerleri yuvarlamadan, tek satırda yap (<a href=\"#\" data-go=\"q:c2\">C2<\/a>).<\/p>\n\n<h3>Şema<\/h3>\n<ul>\n<li>s43: üstte CD4 formülü ve hata O(h⁴). Solda \"5-nokta ne zaman kullanılır?\" kutusu (✓ çok hassas türev, ✓ h = 0.1 → 10⁻⁴, ✓ gürültüsüz veri, ✗ gürültülü veri, ✗ en az 2 iç kenar noktası). Sağda ikinci türev formülleri ve \"sol sınır için 4 noktalı ileri ikinci türev\".<\/li>\n<li>s44: x³ örneği, soldaki hesap ve sağdaki \"Tam sonucu verir\" açıklaması.<\/li>\n<\/ul>\n\n<h3>Slayt hataları<\/h3>\n<div class=\"slhata\"><p><b>Aynı kısaltma iki formüle verilmiş (s43 ve s45).<\/b> Slayt s42'de CD2'yi 1. türev formülü olarak (f′ = [f(x+h) − f(x−h)]/(2h)) kullanıyor. s43 ikinci türev formülüne de \"CD2: f″(x) = [f(x+h) − 2f(x) + f(x−h)]/h²\" diyor. s45-46 tablosunda aynı formül \"D2\" adıyla geçiyor.<\/p>\n<p>Sınavda ayırt etmek için: 1. türev CD2, 2. türev D2. Tablo (s45) \"D2\" kullanıyor.<\/p><\/div>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>Paydaları karıştırma: CD4 için 12h. D2 için h². D2-CD4 için 12h². Üçüncü türev için 2h³.<\/li>\n<li>CD4 katsayıları: −1, +8, −8, +1 (x+2h, x+h, x−h, x−2h). x ortada, f(x) kullanılmaz. Toplam 0.<\/li>\n<li>D2-CD4 katsayıları: −1, 16, −30, 16, −1. Toplam 0.<\/li>\n<li>FD2-2 katsayıları: 2, −5, 4, −1. Toplam 0.<\/li>\n<li>Büyük katsayılar yuvarlama hatasını büyütür. Ara değerleri yuvarlama, makinede tut.<\/li>\n<li>Gürültülü veride CD4 yerine CD2 ya da büyük h.<\/li>\n<li>Sınırda ikinci türev için 4 noktalı ileri ya da geri formül (FD2-2, BD2-2).<\/li>\n<\/ul><\/div>\n<p class=\"sn\">Föy soruları: <a href=\"#\" data-go=\"q:b10\">B10<\/a> (1. ve 2. türev), <a href=\"#\" data-go=\"q:c4\">C4<\/a> (cos x, 5 nokta), <a href=\"#\" data-go=\"q:c2\">C2<\/a> (cos x, 3. türev).<\/p>\n<p class=\"bu-eksik\">BUders videolarının başlığında geçmeyen kısım: 4 noktalı ileri ve geri ikinci türev formülleri (FD2-2, BD2-2) ve 5 noktalı ikinci türev formülü (D2-CD4). Bu kısmı bu nottan çalış.<\/p>","v":["J3BvMpuKzYw","vBthLUp-5F0","xaQZQFTsGc4","cLHKU_yFOIw","LzgzhxQcVZ4"],"qs":["b10","c2","c4","x17"]},"k27":{"y":"k","id":"k27","t":"Karşılaştırma tablosu ve seçim kuralları","g":3,"h":"<p class=\"sn\">Kaynak: W234 s45-46, s51. Optimal h ayrıntısı için <a href=\"#\" data-go=\"k:k28\">K28<\/a>. Formül kâğıdı: <a href=\"#\" data-go=\"n:formul\">formül kâğıdı<\/a>.<\/p>\n<h3>Ne işe yarar<\/h3>\n<p>Bütün türev formüllerini tek tabloda toplar ve hangi noktada hangisini kullanacağını söyler.<\/p>\n\n<h3>Karşılaştırma tablosu (s45-46)<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Ad<\/th><th>Kısaltma<\/th><th>Formül<\/th><th>Nokta<\/th><th>Hata<\/th><th>Yorum<\/th><\/tr>\n<tr><td>İleri fark 1. türev<\/td><td>FD1<\/td><td>\\(\\frac{f(x+h)-f(x)}{h}\\)<\/td><td>2<\/td><td>O(h)<\/td><td>Başlangıç ve sol sınır noktaları<\/td><\/tr>\n<tr><td>Geri fark 1. türev<\/td><td>BD1<\/td><td>\\(\\frac{f(x)-f(x-h)}{h}\\)<\/td><td>2<\/td><td>O(h)<\/td><td>Son ve sağ sınır noktalar<\/td><\/tr>\n<tr><td>Merkezi fark 1. türev<\/td><td>CD2<\/td><td>\\(\\frac{f(x+h)-f(x-h)}{2h}\\)<\/td><td>3<\/td><td>O(h²)<\/td><td>İç noktalar, simetrik ve daha hassas<\/td><\/tr>\n<tr><td>3-nokta ileri, 1. türev<\/td><td>FD2<\/td><td>\\(\\frac{-3f(x)+4f(x+h)-f(x+2h)}{2h}\\)<\/td><td>3<\/td><td>O(h²)<\/td><td>Sol sınırda yüksek doğruluk<\/td><\/tr>\n<tr><td>3-nokta geri, 1. türev<\/td><td>BD2<\/td><td>\\(\\frac{3f(x)-4f(x-h)+f(x-2h)}{2h}\\)<\/td><td>3<\/td><td>O(h²)<\/td><td>Sağ sınırda yüksek doğruluk<\/td><\/tr>\n<tr><td>5-nokta merkezi, 1. türev<\/td><td>CD4<\/td><td>\\(\\frac{f(x-2h)-8f(x-h)+8f(x+h)-f(x+2h)}{12h}\\)<\/td><td>5<\/td><td>O(h⁴)<\/td><td>İç noktalar, çok yüksek doğruluk, gürültüye daha duyarlı<\/td><\/tr>\n<tr><td>Merkezi fark, 2. türev<\/td><td>D2<\/td><td>\\(\\frac{f(x+h)-2f(x)+f(x-h)}{h^2}\\)<\/td><td>3<\/td><td>O(h²)<\/td><td>İç noktalarda klasik ikinci türev<\/td><\/tr>\n<tr><td>4-nokta ileri, 2. türev<\/td><td>FD2-2<\/td><td>\\(\\frac{2f(x)-5f(x+h)+4f(x+2h)-f(x+3h)}{h^2}\\)<\/td><td>4<\/td><td>O(h²)<\/td><td>Sol sınırda ikinci türev<\/td><\/tr>\n<tr><td>4-nokta geri, 2. türev<\/td><td>BD2-2<\/td><td>\\(\\frac{2f(x)-5f(x-h)+4f(x-2h)-f(x-3h)}{h^2}\\)<\/td><td>4<\/td><td>O(h²)<\/td><td>Sağ sınırda ikinci türev<\/td><\/tr>\n<tr><td>5-nokta merkezi, 2. türev<\/td><td>D2-CD4<\/td><td>\\(\\frac{-f(x+2h)+16f(x+h)-30f(x)+16f(x-h)-f(x-2h)}{12h^2}\\)<\/td><td>5<\/td><td>O(h⁴)<\/td><td>İç noktalar, yüksek hassasiyet<\/td><\/tr>\n<\/table><\/div>\n\n<h3>Noktanın konumuna göre tercih (s46)<\/h3>\n<div class=\"tw\"><table>\n<tr><th>Noktanın konumu<\/th><th>1. türev için tercih<\/th><th>2. türev için tercih<\/th><\/tr>\n<tr><td>Sol sınır<\/td><td>FD1 veya FD2<\/td><td>4-nokta ileri<\/td><\/tr>\n<tr><td>İç nokta<\/td><td>CD2 (daha yüksek hassasiyet için CD4)<\/td><td>3-nokta merkezi (daha yüksek hassasiyet için 5-nokta merkezi)<\/td><\/tr>\n<tr><td>Sağ sınır<\/td><td>BD1 veya BD2<\/td><td>4-nokta geri<\/td><\/tr>\n<\/table><\/div>\n\n<h3>Seçim kuralları ve karar ağacı<\/h3>\n<p>Seçim kuralı (s45): h küçük → hata azalır AMA yuvarlama hatası ARTAR! Optimal h: bilgisayar epsilon'unun kökü. Slayt bunu \"≈ 10⁻⁸ için sqrt(eps) ≈ 10⁻⁴\" diye yazar. Doğrusu aşağıdaki slayt hatası bölümünde.<\/p>\n<p>Adım adım karar ağacı (s51):<\/p>\n<ol>\n<li>Sınır noktası mı (x₀ veya xₙ)? Evet: FD2 (başlangıç) veya BD2 (son) → O(h²). Hayır: 2. soruya.<\/li>\n<li>İç nokta mı? Evet: CD2 kullan → O(h²), en basit. Son hassasiyet gerekiyorsa 3. soruya.<\/li>\n<li>Maksimum hassasiyet mi isteniyor? Evet ve gürültüsüz veri: 5-nokta CD4 → O(h⁴). Hayır: CD2 yeterli.<\/li>\n<li>Gürültülü veri mi? Evet: h büyük tut, 3-nokta yeterli! Hayır: h küçült ama h_opt'u geçme (slaytta \"geç!\" yazıyor, aşağıya bak).<\/li>\n<li>2. türev gerekiyor mu? Evet: CD2 (D2) formülü [f(x+h) − 2f(x) + f(x−h)]/h². Hayır: 1. türev formüllerini kullan.<\/li>\n<\/ol>\n<div class=\"vurgu\"><p>\"Altın kural: |Kesme hatası| + |Yuvarlama hatası| minimumda → h_opt = sqrt(ε_machine). FD1/BD1 asla yeterli değil → Her zaman en az O(h²) kullan!\" <span class=\"kaynak\">W234 s51<\/span><\/p><\/div>\n<div class=\"vurgu\"><p>\"İyi uygulama: Her zaman CD2 (merkezi) kullan (O(h²)). Sınır noktaları için FD2 veya BD2 kullan (O(h²)). Asla FD1/BD1 kullanma, mühendislikte yetersiz!\" <span class=\"kaynak\">W234 s49<\/span><\/p><\/div>\n<div class=\"vurgu\"><p>\"Gürültülü verilerle KÖTÜ!\" (CD4 için) <span class=\"kaynak\">W234 s43<\/span><\/p><\/div>\n\n<h3>Slayt hataları<\/h3>\n<div class=\"slhata\"><p><b>ε ve √ε değerleri (s45 ile s47 çelişiyor).<\/b> s45: \"bilgisayar epsilon'unun kökü ≈ 10⁻⁸ için sqrt(eps) ≈ 10⁻⁴\". s47: ε ≈ 2.2 × 10⁻¹⁶. Sınav için s47 ve s51'i kullan: h_opt = √ε_machine ≈ 10⁻⁸.<\/p>\n<p>Kısa hesap: √(2.2 × 10⁻¹⁶) = 1.5 × 10⁻⁸. s45'in 10⁻⁴ değeri ε = 10⁻⁸ alınınca doğrudur (√(10⁻⁸) = 10⁻⁴). Çift duyarlıkta ε ≈ 10⁻¹⁶ olduğu için √ε ≈ 10⁻⁸ olur. Ayrıntı <a href=\"#\" data-go=\"k:k28\">K28<\/a>.<\/p><\/div>\n<div class=\"slhata\"><p><b>Tutarsızlık: FD1 ve BD1 (s46 ile s49 ve s51).<\/b> s46 tercih tablosu sol sınırda \"FD1 veya FD2\", sağ sınırda \"BD1 veya BD2\" diyor. s49 ve s51 \"Asla FD1/BD1 kullanma\" diyor. İkisi birlikte doğru olamaz. Sınavda soru FD1 ya da BD1 istiyorsa onu kullan (föy A1, A2 böyle). Seçmek sana kalmışsa FD2 ve BD2'yi seç.<\/p><\/div>\n<div class=\"slhata\"><p><b>\"h_opt'u geç\" (s51, adım 4).<\/b> Slayt \"h küçült ama h_opt'u geç!\" yazıyor. Anlam \"geçme\" olmalı. h_opt'tan küçük h'de yuvarlama hatası kesme hatasını geçer ve toplam hata artar. \"Geç\" yazımı doğru bir talimat olarak okunmamalı.<\/p><\/div>\n<div class=\"slhata\"><p><b>CD2 adı (s43, s45).<\/b> 1. türev için CD2, 2. türev için D2. s43 ikinci türev formülüne de CD2 diyor. Karıştırma, tablo (s45) D2 diyor.<\/p><\/div>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>Formül seçimi: sınır noktası → ileri (sol) veya geri (sağ). İç nokta → merkezi.<\/li>\n<li>Sınırda en az O(h²): FD2 veya BD2. İç noktada CD2. Çok hassas gerekiyorsa ve veri gürültüsüzse CD4.<\/li>\n<li>Kaç nokta gerekir: FD1, BD1 2 nokta. CD2, FD2, BD2, D2 3 nokta. FD2-2, BD2-2 4 nokta. CD4, D2-CD4 5 nokta.<\/li>\n<li>2. türev formülünde payda h². 1. türev formülünde h, 2h ya da 12h.<\/li>\n<li>Gürültülü veri: büyük katsayılı formül (CD4) yerine CD2 ve büyük h.<\/li>\n<li>h'yı çok küçültme. h_opt = √ε_machine ≈ 10⁻⁸ (çift duyarlık).<\/li>\n<\/ul><\/div>\n<p class=\"bu-eksik\">BUders videolarının başlığında geçmeyen kısım: karşılaştırma tablosu, karar ağacı (sınır noktası → FD2 veya BD2, iç nokta → CD2 veya CD4) ve \"FD1/BD1 kullanma\" kuralı. Bu kısmı bu nottan çalış.<\/p>","v":["EUodLr7SXMk","J3BvMpuKzYw","xaQZQFTsGc4","cLHKU_yFOIw","LzgzhxQcVZ4"],"qs":["x16","x17","x18","x19"]},"k29":{"y":"k","id":"k29","t":"Hafta 4 çözümlü örnekler","g":3,"h":"<p class=\"sn\">Kaynak: W234 s48-50. Formüller için <a href=\"#\" data-go=\"k:k24\">K24<\/a>, <a href=\"#\" data-go=\"k:k25\">K25<\/a>, <a href=\"#\" data-go=\"k:k26\">K26<\/a>.<\/p>\n<h3>Ne işe yarar<\/h3>\n<p>Hafta 4'ün üç konu sonu örneği: dört formülün kıyası, ısı akısı ve ikinci türev. Sonda ikinci türevin diferansiyel denklemlere bağlantısı var.<\/p>\n\n<h3>Örnek E25: eˣ türevi, 4 formül karşılaştırması (s48)<\/h3>\n<div class=\"ornek\"><p>f(x) = eˣ için x = 1.0, h = 0.5 kullanarak FD1, BD1, CD2 ve CD4 ile f′(1.0) hesaplanacak. Gerçek e¹ = 2.71828…<\/p>\n<div class=\"tw\"><table>\n<tr><th>x<\/th><th>0.0<\/th><th>0.5<\/th><th>1.0<\/th><th>1.5<\/th><th>2.0<\/th><\/tr>\n<tr><td>f(x) = eˣ<\/td><td>1.0000<\/td><td>1.6487<\/td><td>2.7183<\/td><td>4.4817<\/td><td>7.3891<\/td><\/tr>\n<\/table><\/div>\n<p><b>FD1, O(h):<\/b> [f(1.5) − f(1.0)]/h = [4.4817 − 2.7183]/0.5 = 1.7634/0.5 = 3.527. Hata %29.7. h = 0.5 büyük olduğu için hata çok büyük.<\/p>\n<p><b>BD1, O(h):<\/b> [f(1.0) − f(0.5)]/h = [2.7183 − 1.6487]/0.5 = 1.0696/0.5 = 2.139. Hata %21.3. FD1 ve BD1 benzer hata büyüklüğünde.<\/p>\n<p><b>CD2, O(h²):<\/b> [f(1.5) − f(0.5)]/(2h) = [4.4817 − 1.6487]/1.0 = 2.8330/1.0 = 2.833. Hata %4.2. Slayt: 7x daha iyi, O(h²) farkı açık.<\/p>\n<p><b>CD4, O(h⁴):<\/b> [−f(2.0) + 8f(1.5) − 8f(0.5) + f(0.0)]/(12h)<\/p>\n\\[\\begin{aligned}&=\\frac{-7.389+35.854-13.190+1.000}{6.0}\\\\&=\\frac{16.275}{6.0}=2.713\\end{aligned}\\]\n<p>Slayt: hata %0.18, h = 0.5 gibi büyük h ile çok iyi.<\/p>\n<p>Bağıl hata = |hesap − gerçek| / gerçek. Script ile tutuyor: 3.527, 2.139, 2.833, pay 16.275. FD1 / CD2 hata oranı 7.05.<\/p>\n<p>Slayt farkı: CD4 bağıl hatası yuvarlamayla %0.18 çıkmış. Tam eˣ değerleriyle CD4 = 2.71245, hata %0.215 (yaklaşık %0.21). Slaytın %0.18'i ancak yuvarlanmış 2.713 ve 2.718 değerleriyle çıkar (0.005 / 2.718). Slaytın kendi grafiğinde CD4 eğimi m = 2.712 yazıyor.<\/p><\/div>\n\n<h3>Örnek E26: sıcaklık gradyanı ve ısı akısı (s49)<\/h3>\n<div class=\"ornek\"><p>Bir levhada x = [0, 0.1, 0.2, 0.3, 0.4] m, T = [200, 186, 162, 128, 84] °C. q = −k·dT/dx, k = 40 W/(m·K). x = 0.1 ve x = 0.2'de dT/dx ve q hesaplanacak. Her ikisi de orta nokta, CD2, h = 0.1 m.<\/p>\n<p><b>x = 0.1 m:<\/b><\/p>\n\\[\\begin{aligned}\\frac{dT}{dx}&=\\frac{T(0.2)-T(0.0)}{2h}\\\\&=\\frac{162-200}{0.2}=\\frac{-38}{0.2}\\\\&=-190\\ ^\\circ\\mathrm{C/m}\\end{aligned}\\]\n\\[\\begin{aligned}q&=-k\\frac{dT}{dx}=-40\\times(-190)\\\\&=7600\\ \\mathrm{W/m^2}=7.6\\ \\mathrm{kW/m^2}\\end{aligned}\\]\n<p>Fiziksel anlam: ısı soldan sağa akıyor.<\/p>\n<p><b>x = 0.2 m:<\/b><\/p>\n\\[\\begin{aligned}\\frac{dT}{dx}&=\\frac{T(0.3)-T(0.1)}{2h}\\\\&=\\frac{128-186}{0.2}=\\frac{-58}{0.2}\\\\&=-290\\ ^\\circ\\mathrm{C/m}\\end{aligned}\\]\n\\[\\begin{aligned}q&=-40\\times(-290)\\\\&=11600\\ \\mathrm{W/m^2}=11.6\\ \\mathrm{kW/m^2}\\end{aligned}\\]\n<p>Fiziksel anlam: x = 0.2'de gradyan daha dik.<\/p>\n<p>Yorum ve doğrulama (slayt): gradyan büyüklüğü 190 → 290 °C/m arttı. Demek ki levha homojen ısıtılmıyor. Sağ tarafta ısı daha hızlı transfer oluyor. Bütün sayılar script ile tutuyor.<\/p><\/div>\n\n<h3>Örnek E27: ikinci türev, f(x) = sin x, x = 1.0, h = 0.2 (s50)<\/h3>\n<div class=\"ornek\"><p>f″(x) ≈ [f(x+h) − 2f(x) + f(x−h)]/h². f(0.8) = sin 0.8 = 0.7174, f(1.0) = sin 1.0 = 0.8415, f(1.2) = sin 1.2 = 0.9320.<\/p>\n\\[\\begin{aligned}f''(1.0)&\\approx\\frac{0.9320-2\\times0.8415+0.7174}{(0.2)^2}\\\\&=\\frac{0.9320-1.6830+0.7174}{0.04}\\\\&=\\frac{-0.0336}{0.04}=-0.84\\end{aligned}\\]\n<p>Slayt notu: dikkat, 0.9320 − 1.6830 + 0.7174 = −0.0336. (Slaytta bir satırda \"= 0.0336 − 0.0336 + … = −0.0336/0.04\" diye bozuk metin var. Bir önceki satırdaki doğru işlem yukarıdaki.)<\/p>\n<p>Gerçek: −sin 1.0 = −0.8415. Hata |−0.84 + 0.8415| = 0.0015. Bağıl hata %0.18. O(h²) = O(0.04) ✓. Tam sin değerleriyle f″ = −0.83867 çıkar, hata %0.33. Slaytın %0.18'i 4 ondalık yuvarlamasına dayanır.<\/p>\n<h4>Kiriş titreşimi bağlantısı (s50, sayısal çözülmemiş)<\/h4>\n<p>y″ = −ω²y denklemine D2 uygulanır:<\/p>\n\\[\\frac{y(x+h)-2y(x)+y(x-h)}{h^2}=-\\omega^2y(x)\\]\n\\[y(x+h)-2y(x)+y(x-h)=-\\omega^2h^2y(x)\\]\n\\[y(x+h)+(-2+\\omega^2h^2)y(x)+y(x-h)=0\\]\n<p>Bu denklem her iç noktada yazılır. Sonuç matris sistemi [K]{y} = {0} ya da özdeğer problemidir. Mühendislikte buna sonlu farklar yöntemi (FDM) denir. PDE çözümlerinin temeli budur. Makine öğrenmesinde de gradyanlar böyle hesaplanır.<\/p><\/div>\n\n<h3>Grafikler (s48, s49)<\/h3>\n<ul>\n<li>\"f(x) = eˣ ve türev yaklaşımları (x = 1, h = 0.5)\": eˣ eğrisi ve her formülün eğim doğrusu. Eğimler FD1 m = 3.527, BD1 m = 2.139, CD2 m = 2.833, CD4 m = 2.712.<\/li>\n<li>\"4 yöntem sonuçları ve hata (x = 1.0, h = 0.5)\": çubuk grafik. FD1 3.527 (hata %29.7), BD1 2.139 (%21.3), CD2 2.833 (%4.2), CD4 2.713 (%0.18). Kırmızı kesikli çizgi gerçek değeri gösterir: e¹ = 2.71828.<\/li>\n<li>\"Mutlak hata vs x (h = 0.5 sabit)\": FD1 O(h), BD1 O(h), CD2 O(h²), CD4 O(h⁴) eğrileri. Mertebe yükseldikçe eğri aşağıda.<\/li>\n<li>Kutu yorumları: FD1 için \"h = 0.5 büyük → hata çok büyük!\", BD1 için \"FD1 ve BD1 benzer hata büyüklüğü\".<\/li>\n<li>s49: levhada x = 0.1 ve 0.2 için iki CD2 kutusu yan yana. Alt kutularda \"Isı soldan sağa akıyor!\" ve \"x = 0.2'de gradyan daha dik!\" yazar.<\/li>\n<\/ul>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>\"İyi uygulama: Her zaman CD2 (merkezi) kullan (O(h²)). Sınır noktaları için FD2 veya BD2 kullan (O(h²)). Asla FD1/BD1 kullanma, mühendislikte yetersiz!\" <span class=\"kaynak\">W234 s49<\/span><\/p><\/div>\n<div class=\"vurgu\"><p>\"Önemli bağlantı: Sayısal türev → Sayısal PDE çözümü. FDM, FEM, CFD hep bu temelde!\" <span class=\"kaynak\">W234 s50<\/span><\/p><\/div>\n\n<h3>Slayt hataları<\/h3>\n<div class=\"slhata\"><p><b>CD4 bağıl hata (s48).<\/b> Slayt %0.18 yazıyor. Doğrusu yaklaşık %0.21. %0.18, ancak yuvarlanmış 2.713 ve 2.718 değerleriyle çıkar (0.005 / 2.718). Tam değerlerle CD4 = 2.71245 ve hata %0.215.<\/p>\n<p>Kısa hesap: |2.71245 − 2.71828| / 2.71828 = 0.00583 / 2.71828 = 0.00215 = %0.215. Slaytın grafiğindeki CD4 eğimi de 2.712.<\/p><\/div>\n<div class=\"slhata\"><p><b>Bozuk satır (s50).<\/b> İkinci türev örneğinde bir satırda \"= 0.0336 − 0.0336 + … = −0.0336/0.04\" yazıyor. Doğru işlem [0.9320 − 1.6830 + 0.7174]/0.04 = −0.0336/0.04 = −0.84.<\/p><\/div>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>CD2 paydası 2h, CD4 paydası 12h, D2 paydası h². h = 0.5 için 12h = 6.0.<\/li>\n<li>Tabloda x = 0.1 ve x = 0.2 gibi iç noktalarda CD2 kullan. İlk ve son noktada FD2, BD2.<\/li>\n<li>Isı akısı q = −k·dT/dx. Eksi işaretini unutma. Gradyan negatifse q pozitif çıkar (ısı soldan sağa).<\/li>\n<li>İkinci türevde pay küçük sayıların farkı (−0.0336). Yuvarlamaya duyarlıdır. Tam değerlerle çalış.<\/li>\n<li>h = 0.5 gibi büyük h'da CD4 CD2'den çok daha iyidir (7x, E25).<\/li>\n<li>Bağıl hata yüzdesini gerçek değere böl.<\/li>\n<\/ul><\/div>\n<p class=\"sn\">Föy sorusu: <a href=\"#\" data-go=\"q:b10\">B10<\/a> (merkezi fark ile 1. ve 2. türev).<\/p>\n<p class=\"bu-eksik\">BUders videolarının başlığında geçmeyen kısım: ısı akısı (q = −k dT/dx) bağlamı. Bu kısmı bu nottan çalış.<\/p>","v":["xaQZQFTsGc4","cLHKU_yFOIw","LzgzhxQcVZ4"],"qs":["x18"]},"k30":{"y":"k","id":"k30","t":"Belirli integral ve Newton-Cotes fikri","g":4,"h":"<h3>Ne işe yarar<\/h3>\n<p>Antitürevi bulunmayan ya da yalnız tablo olarak bilinen bir fonksiyonun belirli integralini sayıyla bulmayı öğretir. Fikir basit: eğriyi integrali kolay bir polinomla değiştir, polinomun integralini al. Hafta 5'in tüm kuralları bu fikirden çıkar.<\/p>\n\n<h3>Tanımlar ve formüller<\/h3>\n<p><b>Belirli integral.<\/b> \\(I=\\int_a^b f(x)\\,dx\\). Eğer f(x) ≥ 0 ise bu, eğri ile x ekseni arasındaki alandır. Genel durumda \"işaretli alan\" olur. Eksenin altında kalan bölgeler toplamdan çıkarılır.<\/p>\n<ul>\n<li>Fiziksel yorum: hız × zaman = uzaklık, güç × zaman = enerji.<\/li>\n<li>\\(v(t)=\\dfrac{dx}{dt}\\) ise \\(x(t_2)-x(t_1)=\\int_{t_1}^{t_2}v(t)\\,dt\\). Hız-zaman eğrisinin altındaki alan yer değiştirmeyi verir.<\/li>\n<li>Sayısal integrasyonun özü: integrali küçük ve hesaplanabilir katkıların toplamı olarak yaklaşık hesaplamak.<\/li>\n<\/ul>\n<p><b>Neden sayısal integrasyon?<\/b> Slayt dört neden sayıyor.<\/p>\n<ol>\n<li>Bazı fonksiyonların integrali vardır ama elementer fonksiyonlarla yazılamaz. Örnek: \\(\\int e^{-x^2}dx\\) ve \\(\\int \\frac{\\sin x}{x}dx\\). Kapalı çözüm yoktur.<\/li>\n<li>Fonksiyon yalnız tablo olarak biliniyor. Deney verisi ya da sensör ölçümü vardır, f(x) formülü yoktur.<\/li>\n<li>Sınırlar dinamik değişiyor. CFD, FEM, optimizasyon ve kontrol problemlerinde integral çok sayıda kez hesaplanmak zorunda kalabilir. FEM ve optimal kontrolde her adımda yeniden hesaplama gerekir.<\/li>\n<li>Hesaplama hızı kritik. Yüksek boyutlu integraller için Monte Carlo ve Gauss kuadratürü kullanılır. Bu kutu slaytta Newton-Cotes kutusunun arkasında kalır, görselde okunmaz. PDF'in metin katmanında yazar.<\/li>\n<\/ol>\n<p><b>Newton-Cotes yaklaşımı.<\/b> f(x) eğrisini, integrali analitik alınabilen bir Pₙ(x) polinomuyla yaklaşıkla. Sonra o polinomun integralini hesapla.<\/p>\n\\[\\int_a^b f(x)\\,dx\\;\\approx\\;\\int_a^b P_n(x)\\,dx\\]\n<p>Zincir şöyledir: eşit aralıklı düğümler, interpolasyon polinomu (Lagrange), polinomun integrali, Trapez ve Simpson formülleri. Hafta 2 ve 3'te öğrendiğin interpolasyon burada işe yarar.<\/p>\n<p>Polinomun integralini alınca her fᵢ değeri bir sayıyla çarpılır. Bu sayılara ağırlık denir.<\/p>\n\\[\\begin{aligned}\\int_a^b f(x)\\,dx&\\approx\\sum_{i=0}^{n}w_i f_i,\\\\ w_i&=\\int_a^b L_i(x)\\,dx\\end{aligned}\\]\n<p>Her Lagrange baz polinomu Lᵢ(x) integre edilince bir ağırlık (katsayı) çıkar. Genel yazım: \\(I\\approx(b-a)\\sum_i c_i f(x_i)\\). Burada cᵢ katsayıları tablolardan alınır.<\/p>\n\n<p><b>Bu dersin kapsamı.<\/b> Slayt s2 ve s3 tabloları birleşince şu görünüm çıkar. Ağırlıklar h birimindedir, tek panel için.<\/p>\n<div class=\"tw\">\n<table>\n<tr><th>Yöntem<\/th><th>Polinom<\/th><th>Noktalar<\/th><th>Katsayılar<\/th><th>Formül<\/th><th>Hata mertebesi<\/th><th>Koşul<\/th><\/tr>\n<tr><td>Trapez<\/td><td>P₁ doğrusal<\/td><td>x₀, x₁<\/td><td>1, 1<\/td><td>\\(\\frac h2(f_0+f_1)\\)<\/td><td>O(h³) tek panel<\/td><td>yok<\/td><\/tr>\n<tr><td>Bileşik trapez<\/td><td>1. derece<\/td><td>x₀ ... xₙ<\/td><td>1, 2, ..., 2, 1 (uçlar ×½)<\/td><td>\\(\\frac h2[f_0+2f_1+\\dots+f_n]\\)<\/td><td>O(h²) bileşik<\/td><td>n ≥ 1<\/td><\/tr>\n<tr><td>Simpson 1/3<\/td><td>P₂ parabol<\/td><td>x₀, x₁, x₂<\/td><td>1, 4, 1<\/td><td>\\(\\frac h3(f_0+4f_1+f_2)\\)<\/td><td>O(h⁵) tek, O(h⁴) bileşik<\/td><td>n çift<\/td><\/tr>\n<tr><td>Simpson 3/8<\/td><td>P₃ kübik<\/td><td>x₀ ... x₃<\/td><td>1, 3, 3, 1<\/td><td>\\(\\frac{3h}{8}(f_0+3f_1+3f_2+f_3)\\)<\/td><td>O(h⁵) tek, O(h⁴) bileşik<\/td><td>n = 3k<\/td><\/tr>\n<\/table>\n<\/div
