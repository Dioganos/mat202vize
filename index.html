>\n<p>Ağırlıkların nereden geldiğini bir kez gör. Düğümler xᵢ = x₀ + ih ise Lagrange integralleri şunları verir. Bunları script ile ayrıca doğruladım.<\/p>\n<table>\n<tr><th>Kural<\/th><th>w₀<\/th><th>w₁<\/th><th>w₂<\/th><th>w₃<\/th><\/tr>\n<tr><td>Trapez (n = 1)<\/td><td>h/2<\/td><td>h/2<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>Simpson 1/3 (n = 2)<\/td><td>h/3<\/td><td>4h/3<\/td><td>h/3<\/td><td><\/td><\/tr>\n<tr><td>Simpson 3/8 (n = 3)<\/td><td>3h/8<\/td><td>9h/8<\/td><td>9h/8<\/td><td>3h/8<\/td><\/tr>\n<\/table>\n<p>Her satırda ağırlıkların toplamı panel genişliğine eşittir: h, 2h ve 3h. Bunu kontrol aracı olarak kullan. Ayrıntılar sırayla <a href=\"#\" data-go=\"k:k31\">K31<\/a>, <a href=\"#\" data-go=\"k:k33\">K33<\/a> ve <a href=\"#\" data-go=\"k:k35\">K35<\/a> notlarında.<\/p>\n<p><b>Kapalı ve açık Newton-Cotes.<\/b> W1 s4 programı \"kapalı/açık integrasyon\" kelimesini anar. W5 slaytları bunu açmaz. Genel tanım şudur. Kapalı formüllerde a ve b uç noktaları da düğümdür. Açık formüllerde uçlar kullanılmaz, yalnız içteki düğümler girer. Bu haftanın bütün formülleri kapalıdır.<\/p>\n\n<h3>Grafik ve şemalar<\/h3>\n<ul>\n<li>W5 s1 kapağı beş renkli kutu gösterir: Belirli İntegral ve Sayısal Anlam, Trapez ve Bileşik Trapez, Simpson 1/3 Türetim ve Hata, Bileşik Simpson 1/3 ve 3/8, Yöntem Seçimi ve Karşılaştırma. Bu hafta konularının sırası budur.<\/li>\n<li>W5 s3 dört kutuluk bir akış şeması çizer. Soldan sağa: Veri Noktaları (x₀,f₀), ..., (xₙ,fₙ) → Lagrange interpolasyonu f(x) ≈ Pₙ(x) → Polinomu entegre et, ∫f dx ≈ Σ wᵢfᵢ → İntegral formülü Σ wᵢfᵢ.<\/li>\n<li>W5 s3 tablosu \"Her polinom derecesi farklı bir formül verir\" der. P₁ (x₀, x₁) Trapez'i, P₂ (x₀, x₁, x₂) Simpson 1/3'ü, P₃ (x₀ ... x₃) Simpson 3/8'i verir.<\/li>\n<\/ul>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>Önemli not: Katsayılar wᵢ = ∫Lᵢ(x)dx formülünden gelir. Her Lagrange baz polinomu entegre edilince bir ağırlık (katsayı) elde edilir.<\/p><p>Dikkat: Newton-Cotes her zaman eşit aralıklıdır. x₁−x₀ = x₂−x₁ = ... = h koşulu gereklidir. Eşit aralıklı değilse Lagrange doğrudan kullanılır.<\/p><span class=\"kaynak\">W5 s3<\/span><\/div>\n<div class=\"vurgu\"><p>Sayısal integrasyon, bilinmeyen veya zor integrali, bilinen fonksiyon değerlerinden oluşturulan basit bir polinomun integraliyle yaklaşık hesaplar.<\/p><span class=\"kaynak\">W5 s2<\/span><\/div>\n\n<h3>Slayt hatası<\/h3>\n<p class=\"sn\">Bu konuda slayt hatası bulunmadı. Slayt künyesi: Dr. Öğr. Üyesi Cihad Delen, İstanbul Teknik Üniversitesi (W5 s1).<\/p>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>Düğümler eşit aralıklı değilse Newton-Cotes formülünü doğrudan kullanma. Lagrange ile polinomu kur ve integre et.<\/li>\n<li>Kuralın adı polinomun derecesini söyler: Trapez 1., Simpson 1/3 2., Simpson 3/8 3. derece.<\/li>\n<li>Soruda \"veri yalnız tablo\" yazıyorsa antitürev aranmaz. Newton-Cotes tek pratik yoldur.<\/li>\n<li>Ağırlık toplamı kontrolü: 1/2+1/2, 1/3+4/3+1/3, 3/8+9/8+9/8+3/8 toplamları 1, 2, 3 eder (h katsayısı olarak).<\/li>\n<\/ul><\/div>\n<p class=\"bu-eksik\">BUders videolarının başlığında geçmeyen kısım: kapalı ve açık Newton-Cotes ayrımı. Bu kısmı bu nottan çalış.<\/p>\n<p class=\"buq\">BUders testi: <a href=\"https://www.buders.com/altsayfa/quiz_2/sayisal_integrasyon_quiz_1/sayisal_integrasyon_quiz_1.html\" target=\"_blank\" rel=\"noopener\">Sayısal İntegrasyon Quiz-1<\/a>. Kavram soruları, integrasyon neden gerekli.<\/p>","v":["FhKnxSdSUko","ujbFHNoRy5Y","dwEZmv9YVU4"],"qs":[]},"k31":{"y":"k","id":"k31","t":"Trapez kuralı","g":4,"h":"<h3>Ne işe yarar<\/h3>\n<p>İki nokta arasındaki eğriyi düz bir çizgiyle değiştirip altında kalan yamuğun alanını almak. En basit Newton-Cotes kuralıdır. Bileşik trapezin yapı taşıdır.<\/p>\n\n<h3>Tanımlar ve formüller<\/h3>\n<p>İki nokta var: (a, f(a)) ve (b, f(b)). Tek panelde h = b − a olur.<\/p>\n\\[I_T=\\frac h2\\,(f_0+f_1),\\qquad h=b-a\\]\n<p>Aynı formül yazılışı: \\(I_T=(b-a)\\dfrac{f(a)+f(b)}{2}\\).<\/p>\n<p><b>Hata (tek panel).<\/b> Gerçek integral eksi trapez sonucu şudur.<\/p>\n\\[E_T=-\\frac{(b-a)^3\\,f''(\\xi)}{12},\\qquad \\xi\\in(a,b)\\]\n<p>Mertebe O(h³). Bu formül W5 s11 tablosundadır, ayrıntısı <a href=\"#\" data-go=\"k:k37\">K37<\/a> notunda.<\/p>\n\n<h3>Türetim<\/h3>\n<p>Slayt s4 dört adımda ilerler.<\/p>\n<ol>\n<li>Doğrusal Lagrange baz polinomları (n = 1):\n\\[\\begin{aligned}L_0(x)&=\\frac{x-b}{a-b}=\\frac{b-x}{b-a},\\\\ L_1(x)&=\\frac{x-a}{b-a}\\end{aligned}\\]<\/li>\n<li>İnterpolasyon polinomu:\n\\[P_1(x)=f_0L_0+f_1L_1=f(a)+\\frac{f(b)-f(a)}{b-a}\\,(x-a)\\]<\/li>\n<li>a'dan b'ye integre et:\n\\[I\\approx\\int_a^bP_1\\,dx=f(a)(b-a)+\\frac{f(b)-f(a)}{b-a}\\cdot\\frac{(b-a)^2}{2}\\]<\/li>\n<li>Sadeleştir (h = b − a):\n\\[I_T=(b-a)\\,\\frac{f(a)+f(b)}{2}=\\frac h2(f_0+f_1)\\]<\/li>\n<\/ol>\n<p><b>Geometrik anlam.<\/b> Yamuğun alanı, paralel kenarların toplamının yarısı çarpı aralarındaki uzaklıktır. Paralel kenarlar f(a) ve f(b) yükseklikleridir. Aralarındaki yatay mesafe h = b − a olur. Alan \\(A=\\dfrac{f(a)+f(b)}{2}(b-a)\\).<\/p>\n\n<h3>Slayttaki örnek<\/h3>\n<div class=\"ornek\">\n<p><b>Örnek (W5 s6 ve s11'deki n = 1 satırı).<\/b> \\(\\int_0^1 e^x\\,dx\\), tek panel.<\/p>\n<ul>\n<li>h = 1, f₀ = e⁰ = 1, f₁ = e¹ = 2.71828.<\/li>\n<li>\\(I_T=\\frac12(1+2.71828)=1.85914\\).<\/li>\n<li>Gerçek değer e − 1 = 1.71828. Hata = 0.14086. Trapez gerçek değerden büyük çıktı.<\/li>\n<li>Hata formülüyle kontrol: gerçek − yaklaşık = −0.14086 = −e^ξ/12. Buradan e^ξ = 1.690 ve ξ = 0.525 çıkar. ξ, (0,1) aralığında. Formül tutuyor.<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Sınav tipi örnek.<\/b> \\(\\int_1^3 \\dfrac{dx}{x}\\) integralini tek panel trapez ile hesapla ve yorumla.<\/p>\n<ul>\n<li>h = 3 − 1 = 2. f₀ = 1, f₁ = 1/3.<\/li>\n<li>\\(I_T=\\frac22\\,(1+0.33333)=1.33333\\).<\/li>\n<li>Gerçek değer ln 3 = 1.09861. Hata 0.23472.<\/li>\n<li>Yorum: f(x) = 1/x için f″ = 2/x³ pozitif, eğri yukarı bükülüyor. Yamuk eğrinin üstünde kalır. Trapez fazla tahmin eder. Aralık geniş olduğu için hata büyük.<\/li>\n<\/ul>\n<\/div>\n\n<h3>Grafik ve şemalar<\/h3>\n<p>W5 s4'teki şekil \"Geometrik Yorum, Trapez Kuralı\" başlığını taşır. Kırmızı eğri bir yay gibi a'dan b'ye gider. Uçlarında f(a) ve f(b) işaretli. Bu iki uç mavi bir doğruyla birleştirilmiş. Doğrunun altındaki mavi bölge trapez alanıdır (yaklaşık). Doğru ile eğri arasında kalan açık kırmızı bölge \"Hata bölgesi\" diye etiketli. Altta h = b − a oku var. Şeklin altındaki iki cümle aşağıdaki kutudadır.<\/p>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>Trapez Kuralı = 2 noktalı doğrusal interpolasyon + bu doğrunun integrali.<\/p><p>Eğrilik arttıkça trapez hatası artar.<\/p><span class=\"kaynak\">W5 s4<\/span><\/div>\n\n<h3>Slayt hatası<\/h3>\n<p class=\"sn\">Slayt s4'te çerçeveli ana formülün sonunda fazladan bir kapama parantezi var: \"I_T = h/2 (f₀ + f₁))\". Anlamı değişmez, tek yazım hatası.<\/p>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>Tek panelde h = b − a. Bileşik trapezde h = (b − a)/n. İkisini karıştırma.<\/li>\n<li>Dış çarpan h/2. Toplamı alıp çarpanı unutma.<\/li>\n<li>f″ pozitifse (yukarı bükey) trapez fazla, f″ negatifse eksik tahmin eder. Hata formülünün işareti bunu söyler.<\/li>\n<li>Hata formülü en kötü durum için kullanılır: |E| ≤ (b−a)³ · max|f″| / 12.<\/li>\n<\/ul><\/div>\n<p class=\"bu-eksik\">BUders videolarının başlığında geçmeyen kısım: tek panel hata formülü. Bu kısmı bu nottan çalış.<\/p>","v":["YUgAWPFMYrM","TRo91HxWbqU","kfpdR3CLHTI","P0QyZiPKfoU"],"qs":["c1"]},"k32":{"y":"k","id":"k32","t":"Bileşik trapez kuralı","g":4,"h":"<h3>Ne işe yarar<\/h3>\n<p>Geniş aralığı n parçaya böler, her parçaya trapez uygular ve toplar. Tek panel trapezin hatası büyük olur. Parça sayısını artırınca hata düzenli biçimde küçülür.<\/p>\n\n<h3>Tanımlar ve formüller<\/h3>\n<p>h = (b − a)/n. Düğümler xᵢ = a + ih, i = 0, 1, ..., n. Her [xᵢ, xᵢ₊₁] aralığında tek trapez: Iᵢ = (h/2)(fᵢ + fᵢ₊₁). Bunları topla.<\/p>\n\\[\\begin{aligned}I_T\\approx\\frac h2\\Big[&f_0+2f_1+2f_2+\\cdots\\\\&+2f_{n-1}+f_n\\Big]\\end{aligned}\\]\n<p>Katsayı dizisi: 1, 2, 2, ..., 2, 1 (hepsi ×h/2). Uç noktalar bir kez sayılır, ×1. İç düğümler iki komşu trapeze birden ait olduğu için iki kez sayılır, ×2.<\/p>\n<p><b>Hata (W5 s6).<\/b><\/p>\n\\[E_T=-\\frac{(b-a)}{12}\\,h^2f''(\\xi),\\qquad h=\\frac{b-a}{n}\\]\n<p>ξ ortalama hata noktasıdır. Global hata O(h²). n iki katına çıkarsa hata yaklaşık 4 kat azalır.<\/p>\n\n<h3>Türetim<\/h3>\n<p>Tek panel formülünü her alt aralığa uygula, sonra toplamda f₁ ... fₙ₋₁ değerlerinin iki kez çıktığını gör.<\/p>\n\\[\\begin{aligned}I_T&=\\tfrac h2(f_0+f_1)+\\tfrac h2(f_1+f_2)+\\cdots\\\\ &\\quad+\\tfrac h2(f_{n-1}+f_n)\\end{aligned}\\]\n<p>Bu toplamda f₀ ve fₙ birer kez, diğerleri ikişer kez geçer. Dış çarpan h/2 ortak çıkar.<\/p>\n\n<h3>Slayttaki örnekler<\/h3>\n<div class=\"ornek\">\n<p><b>Örnek E28 (W5 s5).<\/b> \\(\\int_0^1 e^x\\,dx\\), n = 4, h = 0.25.<\/p>\n<div class=\"tw\">\n<table>\n<tr><th>i<\/th><th>xᵢ<\/th><th>f(xᵢ) = eˣ<\/th><th>Katsayı<\/th><th>Katsayı × f<\/th><\/tr>\n<tr><td>0<\/td><td>0.00<\/td><td>1.0000<\/td><td>1<\/td><td>1.0000<\/td><\/tr>\n<tr><td>1<\/td><td>0.25<\/td><td>1.2840<\/td><td>2<\/td><td>2.5680<\/td><\/tr>\n<tr><td>2<\/td><td>0.50<\/td><td>1.6487<\/td><td>2<\/td><td>3.2974<\/td><\/tr>\n<tr><td>3<\/td><td>0.75<\/td><td>2.1170<\/td><td>2<\/td><td>4.2340<\/td><\/tr>\n<tr><td>4<\/td><td>1.00<\/td><td>2.7183<\/td><td>1<\/td><td>2.7183<\/td><\/tr>\n<\/table>\n<\/div>\n\\[\\begin{aligned}I_T&=\\frac{0.25}{2}\\big[1.0000+2(1.2840)+2(1.6487)\\\\&\\qquad+2(2.1170)+2.7183\\big]\\\\&\\approx 1.7272\\end{aligned}\\]\n<ul>\n<li>Sütun toplamı 13.8177, çarpan 0.125. Sonuç 1.72721 (tam değerlerle 1.72722). Slayt 1.7272 yazıyor.<\/li>\n<li>Gerçek değer e − 1 = 1.71828. Hata = 0.0089 (script: 0.00894).<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Örnek E29 (W5 s6 ve s11).<\/b> n arttıkça hata. \\(\\int_0^1 e^x\\,dx\\), gerçek e − 1 ≈ 1.71828. Slayt tablosu soldaki sütunlar, script sonucu sağdaki sütunlar.<\/p>\n<div class=\"tw\">\n<table>\n<tr><th>n<\/th><th>h = 1/n<\/th><th>I_T (slayt)<\/th><th>Hata (slayt)<\/th><th>Önceki/şimdiki (slayt)<\/th><th>I_T (script)<\/th><th>Hata (script)<\/th><th>Oran (script)<\/th><\/tr>\n<tr><td>1<\/td><td>1.000<\/td><td>1.85914<\/td><td>0.14086<\/td><td>-<\/td><td>1.85914<\/td><td>0.14086<\/td><td>-<\/td><\/tr>\n<tr><td>2<\/td><td>0.500<\/td><td>1.75393<\/td><td>0.03565<\/td><td>3.95×<\/td><td>1.75393<\/td><td>0.03565<\/td><td>3.95×<\/td><\/tr>\n<tr><td>4<\/td><td>0.250<\/td><td>1.72724<\/td><td>0.00896<\/td><td>3.98×<\/td><td>1.72722<\/td><td>0.00894<\/td><td>3.99×<\/td><\/tr>\n<tr><td>8<\/td><td>0.125<\/td><td>1.72051<\/td><td>0.00223<\/td><td>4.02×<\/td><td>1.72052<\/td><td>0.00224<\/td><td>4.00×<\/td><\/tr>\n<tr><td>16<\/td><td>0.0625<\/td><td>1.71884<\/td><td>0.00056<\/td><td>3.98×<\/td><td>1.71884<\/td><td>0.00056<\/td><td>4.00×<\/td><\/tr>\n<\/table>\n<\/div>\n<ul>\n<li>Slayt yorumu: h yarıya inince hata yaklaşık 4 kat azalıyor. O(h²) doğrulandı.<\/li>\n<li>n = 16 ile başlangıçtaki hatanın yalnız 1/250'si kalıyor (script: 0.14086/0.00056 ≈ 252).<\/li>\n<li>Farklar yalnız son basamakta ve yuvarlamadan geliyor. Sonuç değişmiyor.<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Sınav tipi örnek 1.<\/b> \\(\\int_0^2 (x^2+1)\\,dx\\), n = 4, bileşik trapez. Bu, BUders Quiz-4'ün ilk sorusuyla aynı integraldir.<\/p>\n<ul>\n<li>h = (2 − 0)/4 = 0.5. Düğümler 0, 0.5, 1, 1.5, 2.<\/li>\n<li>f değerleri: 1, 1.25, 2, 3.25, 5.<\/li>\n<li>\\(I_T=\\frac{0.5}{2}\\,[1+2(1.25+2+3.25)+5]=0.25\\times19=4.75\\).<\/li>\n<li>Gerçek değer 14/3 = 4.66667. Hata = 0.08333.<\/li>\n<li>Hata formülü: (b−a)h²f″/12 = 2 · 0.25 · 2/12 = 0.08333. f″ = 2 sabit olduğu için formül tam tutar.<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Sınav tipi örnek 2.<\/b> Bir cismin hızı ölçülmüş: t = 0, 1, 2, 3, 4, 5 s için v = 0, 4, 9, 11, 12, 12 m/s. Yolu bul.<\/p>\n<ul>\n<li>h = 1 s, n = 5. Katsayılar 1, 2, 2, 2, 2, 1.<\/li>\n<li>İç toplam: 4 + 9 + 11 + 12 = 36. Uçlar: 0 + 12 = 12.<\/li>\n<li>\\(I_T=\\frac12\\,[12+2(36)]=\\frac12\\cdot84=42\\) m.<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Sınav tipi örnek 3.<\/b> \\(\\int_0^1 e^x\\,dx\\) için hata 10⁻⁴'ten küçük olsun. En az kaç panel gerekir?<\/p>\n<ul>\n<li>f″ = eˣ, [0,1] üzerinde en büyüğü e = 2.71828.<\/li>\n<li>\\(\\dfrac{(b-a)h^2\\max|f''|}{12}\\le10^{-4}\\) ve h = 1/n. Buradan \\(n^2\\ge\\dfrac{e}{12\\cdot10^{-4}}=2265\\), yani n ≥ 47.6.<\/li>\n<li>Garanti için n = 48 al. Script: n = 48 için gerçek hata 6.2·10⁻⁵. Formül üst sınır verdiği için gerçek hata biraz daha küçük çıkar.<\/li>\n<\/ul>\n<\/div>\n\n<h3>Grafik ve şemalar<\/h3>\n<ul>\n<li>W5 s5 \"Katsayı diyagramı: neden 2 ile çarpılır?\" başlığı altında yedi kutu sıralar: f₀ (mor, 1), f₁, f₂, f₃ (mavi, 2), noktalı kutu, fₙ₋₁ (mavi, 2), fₙ (mor, 1). Sağda \"× h/2\". Altında iki açıklama var. Mor: sadece iki uç nokta, başlangıç ve bitiş. Mavi: iç düğümler iki komşu trapeze ait, bu yüzden iki kez sayılır.<\/li>\n<li>W5 s6'da grafik yoktur. Bir hata tablosu ve sarı bir kutu var. Kutuda ξ ve \"h = (b−a)/n\" anlatılır.<\/li>\n<\/ul>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>ξ: ortalama hata noktası. h = (b−a)/n → h azalınca hata h² ile düşer. Global hata O(h²). n iki katına çıkarsa hata yaklaşık 4 kat azalır.<\/p><span class=\"kaynak\">W5 s6<\/span><\/div>\n<div class=\"vurgu\"><p>h yarıya indiğinde hata yaklaşık 4 kat azalıyor → O(h²) doğrulandı. n=16 ile başlangıçtaki hatanın sadece 1/250'si kalıyor.<\/p><span class=\"kaynak\">W5 s6<\/span><\/div>\n\n<h3>Slayt hatası<\/h3>\n<p class=\"sn\">Bu konuda slayt hatası yok. E29 tablosunda n = 4 ve n = 8 satırlarında son basamak yuvarlama farkı var (1.72724 yerine 1.72722). Sonuç ve yorum değişmez.<\/p>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>h = (b − a)/n. [0,2] aralığında n = 4 ise h = 0.5. Toplam uzunluk 2'yi h diye kullanma.<\/li>\n<li>Katsayı dizisi 1, 2, ..., 2, 1. Uçları 2 ile çarpma.<\/li>\n<li>Dış çarpan h/2'yi unutma.<\/li>\n<li>n = 1 tek panel trapezdir. Slayt tablosu bileşik kural için n ≥ 1 koşulunu yazar.<\/li>\n<li>Hatayı tahmin etmek için eski sonucu kullan: n'yi ikiye katlarsan hata yaklaşık ÷4. Bu bir küçülme hızıdır, gerçek hatanın kendisi değil.<\/li>\n<\/ul><\/div>\n<p class=\"bu-eksik\">BUders videolarının başlığında geçmeyen kısım: \"bileşik\" kelimesi başlıkta yok, videolarda yalnız formül satırı görünüyor. n alt aralık seçimi ve hata sınırı da doğrulanmadı. Bu kısımları bu nottan çalış.<\/p>\n<p class=\"buq\">BUders testi: <a href=\"https://www.buders.com/altsayfa/quiz_2/sayisal_integrasyon_quiz_4/sayisal_integrasyon_quiz_4.html\" target=\"_blank\" rel=\"noopener\">Sayısal İntegrasyon Quiz-4<\/a>. İlk soru ∫₀² (x²+1)dx, yamuk kuralı, n = 4.<\/p>","v":["YUgAWPFMYrM","TRo91HxWbqU","kfpdR3CLHTI","P0QyZiPKfoU"],"qs":["b7","b9","c1","x20","x23"]},"k33":{"y":"k","id":"k33","t":"Simpson 1/3 kuralı","g":4,"h":"<h3>Ne işe yarar<\/h3>\n<p>Üç noktadan geçen parabolün altındaki alanı almak. Trapezden çok daha az hata verir. Üçüncü dereceye kadar polinomları tam integre eder.<\/p>\n\n<h3>Tanımlar ve formüller<\/h3>\n<p>Düğümler: x₀ = a, x₁ = a + h, x₂ = a + 2h = b. Panel genişliği 2h, yani iki alt aralık vardır.<\/p>\n\\[h=\\frac{b-a}{2}\\]\n<p>2. derece Lagrange baz polinomları:<\/p>\n\\[\\begin{aligned}L_0&=\\frac{(x-x_1)(x-x_2)}{(x_0-x_1)(x_0-x_2)},\\\\ L_1&=\\frac{(x-x_0)(x-x_2)}{(x_1-x_0)(x_1-x_2)},\\\\ L_2&=\\frac{(x-x_0)(x-x_1)}{(x_2-x_0)(x_2-x_1)}\\end{aligned}\\]\n<p>Parabol P₂(x) = f₀L₀ + f₁L₁ + f₂L₂. İntegraller:<\/p>\n\\[\\begin{aligned}\\int_a^b L_0dx&=\\frac h3,\\\\ \\int_a^b L_1dx&=\\frac{4h}{3},\\\\ \\int_a^b L_2dx&=\\frac h3\\end{aligned}\\]\n\\[I_S=\\frac h3\\,(f_0+4f_1+f_2),\\qquad h=\\frac{b-a}{2}\\]\n<p>Orta noktanın katsayısı 4, uçların 1. Fiziksel yorum: parabol tepeye yakın bölgeye daha fazla ağırlık veriyor.<\/p>\n<p><b>Hata.<\/b> Tek panel:<\/p>\n\\[E_S=-\\frac{(b-a)^5\\,f^{(4)}(\\xi)}{2880}\\]\n<p>Mertebe O(h⁵) tek panelde, bileşikte O(h⁴). Trapezde E ∝ h²f″ (O(h²)). Simpson'da E ∝ h⁴f⁽⁴⁾ (O(h⁴)). Ayrıntı <a href=\"#\" data-go=\"k:k37\">K37<\/a> notunda.<\/p>\n\n<h3>Türetim<\/h3>\n<p>Slayt s7 integralleri sonuç olarak verir. Ara adımı sen göreceksin. Düğümleri t = (x − x₀)/h ile ölç. Böylece x₀ → t = 0, x₁ → t = 1, x₂ → t = 2 olur ve dx = h dt.<\/p>\n\\[\\begin{aligned}L_0&=\\frac{(t-1)(t-2)}{2},\\\\ L_1&=-t(t-2),\\\\ L_2&=\\frac{t(t-1)}{2}\\end{aligned}\\]\n\\[\\begin{aligned}\\int_0^2\\frac{t^2-3t+2}{2}\\,dt&=\\frac12\\Big(\\frac83-6+4\\Big)=\\frac13\\\\ \\int_0^2(2t-t^2)\\,dt&=4-\\frac83=\\frac43\\\\ \\int_0^2\\frac{t^2-t}{2}\\,dt&=\\frac12\\Big(\\frac83-2\\Big)=\\frac13\\end{aligned}\\]\n<p>Her sonuç h ile çarpılır (dx = h dt). Bu, h/3, 4h/3 ve h/3 verir. Script ile sayısal integralle de kontrol ettim.<\/p>\n<p><b>Üçüncü dereceyi neden tam integre eder?<\/b> Orta nokta x₁'i merkez al: u = x − x₁, u ∈ [−h, h]. u³ tek fonksiyondur. İntegrali sıfırdır. Simpson de aynı sonucu verir: (h/3)((−h)³ + 4·0 + h³) = 0. Yani x³ terimi iptal olur. Parabol kullanılsa da kübik terim hata üretmez.<\/p>\n\n<h3>Slayttaki örnek ve kontroller<\/h3>\n<div class=\"ornek\">\n<p><b>Özellik kontrolü (slayt s7'nin iddiası).<\/b> \\(\\int_0^2x^3dx\\), h = 1.<\/p>\n<ul>\n<li>f(0) = 0, f(1) = 1, f(2) = 8.<\/li>\n<li>\\(I_S=\\frac13(0+4\\cdot1+8)=4\\). Gerçek \\([x^4/4]_0^2=4\\). Tam.<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Slayt s11'in Simpson satırı (n = 2).<\/b> \\(\\int_0^1e^xdx\\), h = 0.5.<\/p>\n<ul>\n<li>f(0) = 1, f(0.5) = 1.64872, f(1) = 2.71828.<\/li>\n<li>\\(I_S=\\frac{0.5}{3}(1+4\\cdot1.64872+2.71828)=1.71886\\). Gerçek 1.71828. Hata 0.00058.<\/li>\n<li>Slayt 1.71882 ve 0.00054 yazıyor. Doğru değer 1.71886 ve 0.00058. Ayrıntı <a href=\"#\" data-go=\"k:k37\">K37<\/a> notundaki slayt hatasında.<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Sınav tipi örnek 1.<\/b> \\(\\int_1^2\\dfrac{dx}{x}\\), Simpson 1/3, n = 2. Bu, BUders Quiz-2'nin ilk sorusuyla aynıdır.<\/p>\n<ul>\n<li>h = (2 − 1)/2 = 0.5. Düğümler 1, 1.5, 2.<\/li>\n<li>f₀ = 1, f₁ = 1/1.5 = 0.66667, f₂ = 0.5.<\/li>\n<li>Köşeli toplam: 1 + 4(0.66667) + 0.5 = 4.16667.<\/li>\n<li>\\(I_S=\\frac{0.5}{3}\\times4.16667=0.69444\\). Gerçek ln 2 = 0.69315. Hata 0.00130.<\/li>\n<li>Karşılaştırma: tek panel trapez 0.75 verir. Simpson çok daha yakın.<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Sınav tipi örnek 2.<\/b> \\(\\int_0^4(x^3-2x+1)\\,dx\\) integralini n = 2 ile hesapla. Sonuç kesin olmalı. Neden?<\/p>\n<ul>\n<li>h = 2. f(0) = 1, f(2) = 8 − 4 + 1 = 5, f(4) = 64 − 8 + 1 = 57.<\/li>\n<li>\\(I_S=\\frac23(1+4\\cdot5+57)=\\frac23\\cdot78=52\\).<\/li>\n<li>Gerçek: \\([x^4/4-x^2+x]_0^4=64-16+4=52\\). Tam.<\/li>\n<li>Neden: integrand 3. derece polinom. Simpson 1/3 üçüncü dereceye kadar tam. Hata terimi f⁽⁴⁾ = 0 olduğu için sıfır.<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Hata formülü kontrolü.<\/b> \\(\\int_0^2x^4dx\\), h = 1. Simpson: \\(\\frac13(0+4\\cdot1+16)=6.66667\\). Gerçek 32/5 = 6.4. Gerçek − yaklaşık = −0.26667. Formül: −(2)⁵ · 24/2880 = −0.26667. Tuttu. (f⁽⁴⁾ = 24.)<\/p>\n<\/div>\n\n<h3>Grafik ve şemalar<\/h3>\n<p>W5 s7 sağ tarafta \"Katsayı Diyagramı: 1-4-1\" çizer. x₀, x₁, x₂ noktaları yatay bir doğru üzerinde. Uçlarda yeşil, 1 yazan iki daire. Ortada büyük turuncu, 4 yazan daire. x₀ ile x₁ arası h, x₁ ile x₂ arası h, toplam panel 2h. Altta kutuda: \"Simpson 1/3 kuralında orta nokta 4, uç noktalar 1 katsayısı alır.\"<\/p>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>Şaşırtıcı özellik: P₂ kullanılsa da Simpson 1/3, 3. dereceden polinomları da tam entegre eder! (Simetri nedeniyle x³ terimi integralde iptal olur.)<\/p><span class=\"kaynak\">W5 s7<\/span><\/div>\n<div class=\"vurgu\"><p>Trapez vs Simpson hata mertebeleri: Trapez E ∝ h² × f″ → O(h²). Simpson E ∝ h⁴ × f⁽⁴⁾ → O(h⁴). h yarıya inince: Trapez 4×, Simpson 16× iyileşir.<\/p><span class=\"kaynak\">W5 s7<\/span><\/div>\n<div class=\"vurgu\"><p>Orta noktanın katsayısı 4, uç noktaların 1. Fiziksel yorum: Parabol tepeye yakın bölgeye daha fazla ağırlık veriyor.<\/p><span class=\"kaynak\">W5 s7<\/span><\/div>\n\n<h3>Slayt hatası<\/h3>\n<p class=\"sn\">Bu konuya ait slayt hatası bulunmadı. Slayt s7'de tek panel hata formülü yoktur. Kesin formül W5 s11 tablosundadır (−(b−a)⁵f⁽⁴⁾(ξ)/2880). Bu notta oradan alındı.<\/p>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>Tek panelde h = (b − a)/2. Panel genişliğinin yarısıdır.<\/li>\n<li>Orta nokta 4 ile çarpılır. Uçlar 1.<\/li>\n<li>h/3 çarpanını unutma.<\/li>\n<li>İntegrand 3. dereceden veya daha düşük bir polinomsa n = 2 yeter. Sonuç kesindir.<\/li>\n<li>Hata mertebesi O(h⁴) bileşikte. \"Tek panelde O(h⁵)\" ayrı bir bilgidir. Sınavda hangisinin sorulduğuna bak.<\/li>\n<\/ul><\/div>\n<p class=\"buq\">BUders testi: <a href=\"https://www.buders.com/altsayfa/quiz_2/sayisal_integrasyon_quiz_3/sayisal_integrasyon_quiz_3.html\" target=\"_blank\" rel=\"noopener\">Sayısal İntegrasyon Quiz-3<\/a>. Yöntemlerin kesinlik derecesini karşılaştıran sorular.<\/p>","v":["1al7Ov3BfJ4","_x2quxqxuDo","8Wge9uNIexs"],"qs":[]},"k34":{"y":"k","id":"k34","t":"Bileşik Simpson 1/3 kuralı","g":4,"h":"<h3>Ne işe yarar<\/h3>\n<p>Geniş aralığı çift sayıda alt aralığa böler. Her iki alt aralığa bir Simpson paneli uygular. Genel amaçlı en doğal yüksek doğruluk seçimidir.<\/p>\n\n<h3>Tanımlar ve formüller<\/h3>\n<p>h = (b − a)/n. n ÇİFT olmalı. Katsayı dizisi 1, 4, 2, 4, 2, ..., 4, 1.<\/p>\n<ul>\n<li>Uç noktalar: 1.<\/li>\n<li>Tek indisli iç noktalar: 4.<\/li>\n<li>Çift indisli iç noktalar: 2.<\/li>\n<\/ul>\n\\[\\begin{aligned}I_S=\\frac h3\\Big[&f_0+4f_1+2f_2+4f_3\\\\&+2f_4+4f_5+f_6\\Big]\\quad(n=6)\\end{aligned}\\]\n\\[I_S=\\frac h3\\Big[f_0+4\\sum f_{tek}+2\\sum f_{çift}+f_n\\Big]\\]\n<p><b>Panel birleşimi.<\/b> n = 6 için üç panel vardır.<\/p>\n<ul>\n<li>Panel 1: f₀, f₁, f₂ → katsayı 1, 4, 1.<\/li>\n<li>Panel 2: f₂, f₃, f₄ → katsayı 1, 4, 1.<\/li>\n<li>Panel 3: f₄, f₅, f₆ → katsayı 1, 4, 1.<\/li>\n<\/ul>\n<p>Ortadaki nokta iki panele aittir. f₂: 1 + 1 = 2. f₄: 1 + 1 = 2. Sonuç dizisi 1, 4, 2, 4, 2, 4, 1.<\/p>\n<p><b>Hata.<\/b> Bileşik: \\(E_S=-\\dfrac{(b-a)\\,h^4\\,f^{(4)}(\\bar\\xi)}{180}\\), O(h⁴). Ayrıntı <a href=\"#\" data-go=\"k:k37\">K37<\/a>.<\/p>\n<p><b>n tek ise.<\/b> Slayt der ki: son aralık için Simpson 3/8 veya Trapez ile tamamla. Karma kullanım <a href=\"#\" data-go=\"k:k36\">K36<\/a> notunda.<\/p>\n\n<h3>Slayttaki örnek<\/h3>\n<div class=\"ornek\">\n<p><b>Örnek E30 (W5 s8).<\/b> \\(\\int_0^1e^xdx\\), n = 4, h = 0.25.<\/p>\n<div class=\"tw\">\n<table>\n<tr><th>i<\/th><th>xᵢ<\/th><th>f = eˣ<\/th><th>Katsayı<\/th><th>Katsayı × f<\/th><\/tr>\n<tr><td>0<\/td><td>0.00<\/td><td>1.0000<\/td><td>1<\/td><td>1.0000<\/td><\/tr>\n<tr><td>1<\/td><td>0.25<\/td><td>1.2840<\/td><td>4<\/td><td>5.1361<\/td><\/tr>\n<tr><td>2<\/td><td>0.50<\/td><td>1.6487<\/td><td>2<\/td><td>3.2974<\/td><\/tr>\n<tr><td>3<\/td><td>0.75<\/td><td>2.1170<\/td><td>4<\/td><td>8.4681<\/td><\/tr>\n<tr><td>4<\/td><td>1.00<\/td><td>2.7183<\/td><td>1<\/td><td>2.7183<\/td><\/tr>\n<\/table>\n<\/div>\n\\[\\begin{aligned}I_S&=\\frac{0.25}{3}\\big[1+4(1.2840)+2(1.6487)\\\\&\\qquad+4(2.1170)+2.7183\\big]\\\\&\\approx1.71831\\end{aligned}\\]\n<ul>\n<li>Gerçek 1.71828. Slayt \"Hata ≈ 0\" yazıyor.<\/li>\n<li>Script: tam değerlerle 1.71832. Gerçek hata 0.000037. Bu \"sıfır\" değil ama çok küçük.<\/li>\n<li>Karşılaştırma: aynı n = 4 ile bileşik trapez 1.72722 vermişti (hata 0.0089). Simpson yaklaşık 240 kat daha iyi.<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Sınav tipi örnek.<\/b> \\(\\int_0^1\\dfrac{4}{1+x^2}dx\\) integralini n = 4 ile Simpson 1/3 kullanarak hesapla. Gerçek değer π.<\/p>\n<ul>\n<li>h = 0.25. Düğümler 0, 0.25, 0.5, 0.75, 1.<\/li>\n<li>f değerleri: 4.0000, 3.7647, 3.2000, 2.5600, 2.0000.<\/li>\n<li>Katsayılı değerler: 4.0000, 4 × 3.7647 = 15.0588, 2 × 3.2000 = 6.4000, 4 × 2.5600 = 10.2400, 2.0000. Toplam 37.6988.<\/li>\n<li>\\(I_S=\\frac{0.25}{3}\\times37.6988=3.14157\\). π = 3.14159. Hata −0.000024.<\/li>\n<li>Aynı n = 4 ile bileşik trapez 3.13118 verir. Simpson açık fark yapar.<\/li>\n<\/ul>\n<\/div>\n\n<h3>Grafik ve şemalar<\/h3>\n<p>W5 s8 üstte katsayı dizisini renkli kutularla gösterir (n = 6). Yedi kutu: f₀ mor 1, f₁ turuncu 4, f₂ yeşil 2, f₃ turuncu 4, f₄ yeşil 2, f₅ turuncu 4, f₆ mor 1. Yanında \"× h/3\". Altta \"Neden 1-4-2-4-1? Panel birleşimi\" kutusu iki alt panelle (Panel 1, 2, 3) bunu açıklar. Altta kırmızı uyarı kutusu var.<\/p>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>UYARI: n mutlaka çift sayı olmalıdır! Her iki alt aralık bir \"Simpson paneli\" oluşturur. n tek ise: Son aralık için Simpson 3/8 veya Trapez ile tamamla.<\/p><span class=\"kaynak\">W5 s8<\/span><\/div>\n<div class=\"vurgu\"><p>uç noktalar 1, tek indisli iç noktalar 4, çift indisli iç noktalar 2.<\/p><span class=\"kaynak\">W5 s8<\/span><\/div>\n\n<h3>Slayt hatası<\/h3>\n<p class=\"sn\">Bu konuda slayt hatası bulunmadı. Slayt n = 4 sonucunu 1.71831 yazıyor, tam değerle 1.71832 çıkar. Son basamak yuvarlama farkıdır.<\/p>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>n tek seçersen Simpson 1/3 uygulanamaz. n = 3 için doğrudan Simpson 3/8 kullan.<\/li>\n<li>Katsayı dizisi: 1, 4, 2, 4, ..., 2, 4, 1. İç noktalarda 4 ve 2 sırayla gider, 4 ile başlar ve 4 ile biter.<\/li>\n<li>h = (b − a)/n. n = 4 ve [0,2] için h = 0.5.<\/li>\n<li>h/3 çarpanını unutma.<\/li>\n<li>Panel sayısı n/2'dir. n = 4 için iki panel.<\/li>\n<\/ul><\/div>\n<p class=\"bu-eksik\">BUders videolarının başlığında geçmeyen kısım: \"bileşik\" kelimesi başlıkta yok, videolarda yalnız formül satırı görünüyor. n'nin çift olma şartı doğrulanmadı. Bu kısımları bu nottan çalış.<\/p>\n<p class=\"buq\">BUders testi: <a href=\"https://www.buders.com/altsayfa/quiz_2/sayisal_integrasyon_quiz_2/sayisal_integrasyon_quiz_2.html\" target=\"_blank\" rel=\"noopener\">Sayısal İntegrasyon Quiz-2<\/a>. İlk soru ∫₁² (1/x)dx, Simpson 1/3, n = 2.<\/p>","v":["1al7Ov3BfJ4","_x2quxqxuDo","8Wge9uNIexs"],"qs":["b9","c3","x20","x22","x23"]},"k35":{"y":"k","id":"k35","t":"Simpson 3/8 kuralı","g":4,"h":"<h3>Ne işe yarar<\/h3>\n<p>Dört noktadan geçen kübik polinomun altındaki alanı almak. Alt aralık sayısı 3 veya 3'ün katı olduğunda doğal seçimdir. Simpson 1/3 ile aynı mertebede hata verir.<\/p>\n\n<h3>Tanımlar ve formüller<\/h3>\n<p>Düğümler: x₀ = a, x₁ = a + h, x₂ = a + 2h, x₃ = a + 3h = b. Panel genişliği 3h.<\/p>\n\\[h=\\frac{b-a}{3}\\]\n<p>Kübik Lagrange polinomu P₃ integre edilir. Ağırlıklar:<\/p>\n\\[\\begin{aligned}\\int L_0&=\\frac{3h}{8},&\\int L_1&=\\frac{9h}{8},\\\\ \\int L_2&=\\frac{9h}{8},&\\int L_3&=\\frac{3h}{8}\\end{aligned}\\]\n\\[I_{3/8}=\\frac{3h}{8}\\,(f_0+3f_1+3f_2+f_3)\\]\n<p><b>Hata.<\/b> Tek panel:<\/p>\n\\[E_{3/8}=-\\frac{3h^5f^{(4)}(\\xi)}{80}\\]\n<p>Bileşik O(h⁴). Simpson 1/3 ile aynı mertebe.<\/p>\n<p><b>Ne zaman kullanılır?<\/b> n = 3, 6, 9, 12, ... yani alt aralık sayısı 3'ün katıysa. Bileşik Simpson 1/3 ile karma kullanım için <a href=\"#\" data-go=\"k:k36\">K36<\/a> notuna bak.<\/p>\n<p>Ağırlıkların kontrolü: 3/8 + 9/8 + 9/8 + 3/8 = 3. Bu panel genişliğinin h cinsinden değeridir.<\/p>\n\n<h3>Slayttaki örnek<\/h3>\n<div class=\"ornek\">\n<p><b>Örnek E32 (W5 s9).<\/b> \\(\\int_0^3x^2dx\\), n = 3, h = 1.<\/p>\n<div class=\"tw\">\n<table>\n<tr><th>i<\/th><th>xᵢ<\/th><th>f = xᵢ²<\/th><th>Katsayı<\/th><th>f × kat<\/th><\/tr>\n<tr><td>0<\/td><td>0<\/td><td>0<\/td><td>1<\/td><td>0<\/td><\/tr>\n<tr><td>1<\/td><td>1<\/td><td>1<\/td><td>3<\/td><td>3<\/td><\/tr>\n<tr><td>2<\/td><td>2<\/td><td>4<\/td><td>3<\/td><td>12<\/td><\/tr>\n<tr><td>3<\/td><td>3<\/td><td>9<\/td><td>1<\/td><td>9<\/td><\/tr>\n<\/table>\n<\/div>\n\\[I_{3/8}=\\frac{3(1)}{8}\\,[0+3(1)+3(4)+9]=\\frac38\\times24=9\\]\n<ul>\n<li>Gerçek: \\([x^3/3]_0^3=9\\). Tam.<\/li>\n<li>Slayt nedeni: x² derecesi 3'ten küçük veya eşit, bu yüzden sonuç tam.<\/li>\n<li>Script ile ek kontrol: \\(\\int_0^3x^3dx=20.25\\), Simpson 3/8 de 20.25 verir. Dördüncü derece x⁴ için tam değil: 49.5, gerçek 48.6.<\/li>\n<li>Karşılaştırma: aynı integralde trapez (n = 3) 9.5 verir.<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Sınav tipi örnek 1.<\/b> \\(\\int_0^1e^xdx\\), n = 3, Simpson 3/8.<\/p>\n<ul>\n<li>h = 1/3. Düğümler 0, 1/3, 2/3, 1.<\/li>\n<li>f değerleri: 1.0000, 1.3956, 1.9477, 2.7183.<\/li>\n<li>Köşeli toplam: 1 + 3(1.3956) + 3(1.9477) + 2.7183 = 13.7483.<\/li>\n<li>3h/8 = 0.125. \\(I_{3/8}=0.125\\times13.7483=1.71854\\).<\/li>\n<li>Gerçek 1.71828. Hata 0.00026. Hata formülünün sınırı yaklaşık 2.5·10⁻⁴, uyumlu.<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Sınav tipi örnek 2.<\/b> \\(\\int_0^{\\pi/2}\\sin x\\,dx\\), n = 3, h = π/6.<\/p>\n<ul>\n<li>f değerleri: sin 0 = 0, sin 30° = 0.5, sin 60° = 0.86603, sin 90° = 1.<\/li>\n<li>Köşeli toplam: 0 + 3(0.5) + 3(0.86603) + 1 = 5.09808.<\/li>\n<li>3h/8 = 3π/48 = 0.19635. \\(I_{3/8}=1.00101\\).<\/li>\n<li>Gerçek 1. Hata 0.0010.<\/li>\n<\/ul>\n<\/div>\n\n<h3>Grafik ve şemalar<\/h3>\n<p>W5 s9 sağda \"Katsayı Diyagramı: 1-3-3-1 (Simpson 3/8)\" çizer. Dört daire yatay doğruda: f₀ ve f₃ mor, 1; f₁ ve f₂ mavi, 3. Her arada h var. x₀ = a, x₁ = a + h, x₂ = a + 2h, x₃ = a + 3h. Altta 3h = b − a ölçüsü. Sarı kutuda üç madde: katsayı dizisi 1, 3, 3, 1; panel genişliği 3h (b − a = 3h); eşit aralık h = (b − a)/3.<\/p>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>Ne zaman kullanılır? n = 3, 6, 9, 12, ... Alt aralık sayısı 3'ün katıysa doğal seçimdir. Bileşik Simpson 1/3 ile karma kullanım.<\/p><span class=\"kaynak\">W5 s9<\/span><\/div>\n<div class=\"vurgu\"><p>Hata: E₃/₈ = −3h⁵f⁽⁴⁾(ξ)/80 [tek panel]. Bileşik: O(h⁴), Simpson 1/3 ile aynı mertebe.<\/p><span class=\"kaynak\">W5 s9<\/span><\/div>\n\n<h3>Slayt hatası<\/h3>\n<p class=\"sn\">W5 s9 sarı kutuda \"n = 10 ise → 1 adet 3/8 paneli + 3 adet 1/3 paneli\" yazıyor. Bu yanlış. Ayrıntı <a href=\"#\" data-go=\"k:k36\">K36<\/a> notunun slayt hatası bölümünde.<\/p>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>Dış çarpan 3h/8. h/3 ile karıştırma.<\/li>\n<li>Katsayılar 1, 3, 3, 1. İki orta değer 3 ile çarpılır.<\/li>\n<li>Tek panelde n = 3 ve h = (b − a)/3.<\/li>\n<li>Simpson 3/8 de kübik polinomu tam integre eder. Hata terimi f⁽⁴⁾ içerir.<\/li>\n<li>Bileşik hata sabiti 3/8 için 1/80, Simpson 1/3 için 1/180. n hem çift hem 3'ün katıysa Simpson 1/3 genellikle daha az hata verir (e<sup>x<\/sup>, n = 6: 7.3·10⁻⁶ ve 1.6·10⁻⁵).<\/li>\n<\/ul><\/div>","v":["r9NUTclKTao","VFh4Fij6LRg","qXBekymaxYY"],"qs":["c5","x21","x22"]},"k36":{"y":"k","id":"k36","t":"Bileşik Simpson 3/8 ve karma kullanım","g":4,"h":"<h3>Ne işe yarar<\/h3>\n<p>Alt aralık sayısı 3'ün katı olan geniş aralıkta Simpson 3/8 panellerini art arda dizer. n tek olduğunda ya da 3'ün katı olmadığında 1/3 ve 3/8 panellerini karıştırarak yine de Simpson doğruluğuna ulaşmayı öğretir.<\/p>\n\n<h3>Tanımlar ve formüller<\/h3>\n<p>n = 3k olmalı (n = 3, 6, 9, ...). h = (b − a)/n. Katsayı dizisi: 1, 3, 3, 2, 3, 3, 2, ..., 3, 3, 1.<\/p>\n<ul>\n<li>İlk ve son nokta: 1.<\/li>\n<li>İndisi 3'ün katı olmayan iç noktalar: 3.<\/li>\n<li>İndisi 3'ün katı olan iç noktalar: 2.<\/li>\n<\/ul>\n\\[\\begin{aligned}I_{3/8}\\approx\\frac{3h}{8}\\Big[&f_0+3f_1+3f_2+2f_3+3f_4+3f_5\\\\&+2f_6+\\cdots+3f_{n-2}+3f_{n-1}+f_n\\Big]\\end{aligned}\\]\n<p>Panel birleşimi: f₃ iki panele aittir (1 + 1 = 2). Bileşik 1/3'teki f₂ gibi çalışır.<\/p>\n<p><b>Karma kullanım tablosu (W5 s10).<\/b><\/p>\n<div class=\"tw\">\n<table>\n<tr><th>n değeri<\/th><th>Önerilen strateji<\/th><th>Açıklama<\/th><\/tr>\n<tr><td>n çift<\/td><td>Bileşik Simpson 1/3<\/td><td>En doğal ve yaygın seçim<\/td><\/tr>\n<tr><td>n = 3'ün katı<\/td><td>Bileşik Simpson 3/8<\/td><td>Doğrudan uygulanır<\/td><\/tr>\n<tr><td>n tek (n ≥ 3)<\/td><td>Son panel 3/8, kalanlar 1/3<\/td><td>Örn. n = 5: 3 + 2 = 5, ilk panel 3/8, kalan 1 panel 1/3<\/td><\/tr>\n<tr><td>n = 1<\/td><td>Tek trapez veya değiştir<\/td><td>n = 1 ise n = 2 yapılıp Simpson 1/3 uygulanabilir<\/td><\/tr>\n<\/table>\n<\/div>\n<p><b>Panel dağılımı kuralı.<\/b> Bir 3/8 paneli 3 alt aralık, bir 1/3 paneli 2 alt aralık kapsar. n tek ise bir tane 3/8 paneli al, kalan n − 3 çift sayıdır. Kalanı (n − 3)/2 tane 1/3 paneliyle kapla.<\/p>\n<div class=\"tw\">\n<table>\n<tr><th>n<\/th><th>3/8 paneli<\/th><th>1/3 paneli<\/th><th>Toplam alt aralık<\/th><\/tr>\n<tr><td>5<\/td><td>1<\/td><td>1<\/td><td>3 + 2 = 5<\/td><\/tr>\n<tr><td>7<\/td><td>1<\/td><td>2<\/td><td>3 + 4 = 7<\/td><\/tr>\n<tr><td>9<\/td><td>1<\/td><td>3<\/td><td>3 + 6 = 9<\/td><\/tr>\n<tr><td>11<\/td><td>1<\/td><td>4<\/td><td>3 + 8 = 11<\/td><\/tr>\n<\/table>\n<\/div>\n<p>Karma sonuç iki parçanın toplamıdır. Panelin çarpanı farklıdır: 3/8 için 3h/8, 1/3 için h/3. Tek bir dış çarpan yoktur.<\/p>\n<p><b>Hata.<\/b> Bileşik 3/8: \\(E=-\\dfrac{(b-a)\\,h^4\\,f^{(4)}(\\bar\\xi)}{80}\\). Ayrıntı <a href=\"#\" data-go=\"k:k37\">K37<\/a>.<\/p>\n\n<h3>Slayttaki örnek ve kontroller<\/h3>\n<div class=\"ornek\">\n<p><b>Bileşik 3/8 kontrolü.<\/b> \\(\\int_0^1e^xdx\\), n = 6, h = 1/6.<\/p>\n<ul>\n<li>Katsayılar: f₀:1, f₁:3, f₂:3, f₃:2, f₄:3, f₅:3, f₆:1.<\/li>\n<li>Script: I = 1.71830. Gerçek hata 1.646·10⁻⁵.<\/li>\n<li>Hata formülü (ξ = 0.5 için \\(e^{0.5}=1.65\\)): \\((1/6)^4\\cdot1.65/80=1.59\\cdot10^{-5}\\). Gerçek hatayla uyumlu.<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Slayt n = 5 örneği.<\/b> \\(\\int_0^1e^xdx\\), n = 5, h = 0.2. Slayt \"3 + 2 = 5, ilk panel 3/8, kalan 1 panel 1/3\" der.<\/p>\n<ul>\n<li>İlk panel 3/8, ardından 1/3: sonuç 1.71831, hata 2.4·10⁻⁵.<\/li>\n<li>Sıra ters olsa (önce 1/3, sonra 3/8): sonuç 1.71831, hata 2.9·10⁻⁵. İkisi de kabul edilebilir.<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Sınav tipi örnek.<\/b> \\(\\int_0^{1.4}e^{-x}dx\\), n = 7, h = 0.2. Karma kuralla hesapla.<\/p>\n<div class=\"tw\">\n<table>\n<tr><th>i<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><\/tr>\n<tr><td>xᵢ<\/td><td>0.0<\/td><td>0.2<\/td><td>0.4<\/td><td>0.6<\/td><td>0.8<\/td><td>1.0<\/td><td>1.2<\/td><td>1.4<\/td><\/tr>\n<tr><td>e<sup>−x<\/sup><\/td><td>1.00000<\/td><td>0.81873<\/td><td>0.67032<\/td><td>0.54881<\/td><td>0.44933<\/td><td>0.36788<\/td><td>0.30119<\/td><td>0.24660<\/td><\/tr>\n<\/table>\n<\/div>\n<ul>\n<li>n = 7 tek. Bir 3/8 paneli ([x₀, x₃]) ve (7 − 3)/2 = 2 tane 1/3 paneli ([x₃, x₇]) al.<\/li>\n<li>3/8 paneli: toplam f₀ + 3f₁ + 3f₂ + f₃ = 6.01596. Çarpan 3h/8 = 0.075. Sonuç 0.451197.<\/li>\n<li>1/3 panelleri: toplam f₃ + 4f₄ + 2f₅ + 4f₆ + f₇ = 4.53326. Çarpan h/3 = 0.066667. Sonuç 0.302217.<\/li>\n<li>Toplam 0.753415. Gerçek 1 − e<sup>−1.4<\/sup> = 0.753403. Hata 1.2·10⁻⁵.<\/li>\n<\/ul>\n<\/div>\n\n<h3>Grafik ve şemalar<\/h3>\n<p>W5 s10 yedi kutuyla n = 6 diyagramını çizer: f₀ mor 1, f₁ ve f₂ mavi 3, f₃ yeşil 2, f₄ ve f₅ mavi 3, f₆ mor 1. Yanında \"× 3h/8\". Altında üç renk açıklaması var: mor (×1) sadece uçlar, mavi (×3) 3'ün katı olmayan iç noktalar, yeşil (×2) panel sınırı iç noktalar. Sayfanın altında karma kullanım tablosu yer alır. Üst köşede üç madde (ilk ve son nokta 1, 3'ün katı olmayan iç noktalar 3, 3'ün katı iç noktalar 2) başlığın yanındadır.<\/p>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>Panel birleşimi: f₃ iki panele ait (1+1=2), tıpkı bileşik 1/3'te f₂ gibi. Kurala göre: 3'ün katı iç noktalar ×2, diğerleri ×3.<\/p><span class=\"kaynak\">W5 s10<\/span><\/div>\n<div class=\"vurgu\"><p>Karma Kullanım: n tek sayı veya n=3'ün katı değilse.<\/p><p>n tek (n≥3): Son panel 3/8, kalanlar 1/3. Örn. n=5: 3+2=5, ilk panel 3/8, kalan 1 panel 1/3.<\/p><span class=\"kaynak\">W5 s10<\/span><\/div>\n\n<h3>Slayt hatası<\/h3>\n<div class=\"slhata\">\n<p><b>Hata 1 (W5 s9, kutu \"Ne zaman kullanılır\").<\/b> Slayt: \"n = 10 ise → 1 adet 3/8 paneli + 3 adet 1/3 paneli\".<\/p>\n<p>Doğrusu: 3/8 paneli 3 alt aralık, 1/3 paneli 2 alt aralık kapsar. Slaytın dağılımı 3 + 3·2 = 9 alt aralık eder, 10 etmez. n = 10 çift olduğu için bileşik 1/3 doğrudan uygulanır (script: hata 9.5·10⁻⁷). Karma gerekirse 2 tane 3/8 (6) + 2 tane 1/3 (4) = 10 olur.<\/p>\n<\/div>\n<div class=\"slhata\">\n<p><b>Hata 2 (W5 s10, karma kullanım tablosu).<\/b> \"Önerilen strateji\" sütunu n tek için \"Son panel 3/8, kalanlar 1/3\" yazıyor. \"Açıklama\" sütunu aynı satırda n = 5 için \"ilk panel 3/8, kalan 1 panel 1/3\" der.<\/p>\n<p>Slayt kendi içinde çelişiyor. İkisi de geçerli bir karma kurar. Sonuçlar küçük farkla ayrılır (e<sup>x<\/sup> için 2.4·10⁻⁵ ve 2.9·10⁻⁵). Sınavda yönü hoca söylemiyorsa hangi panelin 3/8 olduğunu yaz ve tutarlı git.<\/p>\n<\/div>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>Önce n'ye bak. n çift ise doğrudan 1/3. n tek ise bir 3/8 paneli ve geri kalan 1/3 panelleri.<\/li>\n<li>Karmada iki ayrı dış çarpan vardır: 3h/8 ve h/3. Toplamlarını ayrı ayrı çarp, sonra topla.<\/li>\n<li>Panel dağılımının alt aralık toplamı n etmeli: 3 + 2m = n. Dağılımı yazıp kontrol et.<\/li>\n<li>Bileşik 3/8 katsayı dizisinde 2'ler 3'ün katı indislerde: f₃, f₆, f₉.<\/li>\n<\/ul><\/div>\n<p class=\"bu-eksik\">BUders videolarının başlığında geçmeyen kısım: karma kullanım (n tek iken 1/3 ve 3/8 birleştirme) ve panel dağılımı. Bu kısmı bu nottan çalış.<\/p>","v":["1al7Ov3BfJ4","r9NUTclKTao","VFh4Fij6LRg","qXBekymaxYY"],"qs":["c6","x21","x22"]},"k38":{"y":"k","id":"k38","t":"Kapsamlı örnek, yöntem seçimi, sık hatalar","g":4,"h":"<h3>Ne işe yarar<\/h3>\n<p>Üç yöntemi aynı integralde yan yana çalıştırıp karşılaştırır. Hangi durumda hangi yöntemin seçileceğini, hangi hataların sık yapıldığını ve gerçek mühendislik kullanımını gösterir.<\/p>\n\n<h3>Tanımlar ve formüller<\/h3>\n<p>Bu konuda yeni formül yoktur. Kullanılan formüller:<\/p>\n<ul>\n<li>Bileşik trapez: \\(\\frac h2[f_0+2f_1+\\cdots+2f_{n-1}+f_n]\\) (<a href=\"#\" data-go=\"k:k32\">K32<\/a>).<\/li>\n<li>Bileşik Simpson 1/3: \\(\\frac h3[f_0+4f_1+2f_2+\\cdots+4f_{n-1}+f_n]\\), n çift (<a href=\"#\" data-go=\"k:k34\">K34<\/a>).<\/li>\n<li>Simpson 3/8: \\(\\frac{3h}{8}[f_0+3f_1+3f_2+f_3]\\) (<a href=\"#\" data-go=\"k:k35\">K35<\/a>).<\/li>\n<\/ul>\n\n<h3>Slayttaki örnekler<\/h3>\n<div class=\"ornek\">\n<p><b>Örnek E33 (W5 s12).<\/b> \\(I=\\int_0^2\\sqrt{1+x^3}\\,dx\\). f(x) = √(1 + x³), a = 0, b = 2.<\/p>\n<p>Slayt: \"Bu integralin elementer fonksiyonlarla basit bir antitürevi yoktur. Bu nedenle sayısal integrasyon yöntemleri uygundur.\" Üç yöntemle hesapla ve karşılaştır.<\/p>\n<p>Fonksiyon değerleri, n = 4, h = 0.5:<\/p>\n<div class=\"tw\">\n<table>\n<tr><th>i<\/th><th>xᵢ<\/th><th>f(xᵢ) = √(1+xᵢ³)<\/th><th>Hesap<\/th><\/tr>\n<tr><td>0<\/td><td>0.0<\/td><td>√1 = 1.0000<\/td><td>1 + 0 = 1<\/td><\/tr>\n<tr><td>1<\/td><td>0.5<\/td><td>√1.125 = 1.0607<\/td><td>1 + 0.125 = 1.125<\/td><\/tr>\n<tr><td>2<\/td><td>1.0<\/td><td>√2 = 1.4142<\/td><td>1 + 1 = 2<\/td><\/tr>\n<tr><td>3<\/td><td>1.5<\/td><td>√4.375 = 2.0916<\/td><td>1 + 3.375 = 4.375<\/td><\/tr>\n<tr><td>4<\/td><td>2.0<\/td><td>√9 = 3.0000<\/td><td>1 + 8 = 9<\/td><\/tr>\n<\/table>\n<\/div>\n<p><b>Bileşik trapez (n = 4).<\/b><\/p>\n\\[\\begin{aligned}I_T&=\\frac h2[f_0+2f_1+2f_2+2f_3+f_4]\\\\&=0.25\\times[1+2(1.061)+2(1.414)\\\\&\\qquad+2(2.092)+3]\\\\&=0.25\\times[1+2.121+2.828+4.183+3]\\\\&=0.25\\times13.132=3.283\\end{aligned}\\]\n<p><b>Bileşik Simpson 1/3 (n = 4).<\/b><\/p>\n\\[\\begin{aligned}I_{1/3}&=\\frac h3[f_0+4f_1+2f_2+4f_3+f_4]\\\\&=\\frac{0.5}{3}\\,[1+4(1.061)+2(1.414)\\\\&\\qquad+4(2.092)+3]\\\\&=0.1667\\times[1+4.243+2.828+8.366+3]\\\\&=0.1667\\times19.437=3.23961\\end{aligned}\\]\n<p><b>Simpson 3/8 (n = 3, h = 2/3).<\/b> Düğümler x₀ = 0, x₁ = 2/3, x₂ = 4/3, x₃ = 2. Panel tek. Çarpan 3h/8 = 3(2/3)/8 = 0.25.<\/p>\n<p>Slayt f₀ = 1.0000, f₁ = 1.1041, f₂ = 1.6916, f₃ = 3.0000 yazar. Sonuç I₃/₈ ≈ 3.2308 (\"n = 3: az nokta → daha az hassas\"). Doğru f değerleriyle:<\/p>\n\\[f_1=\\sqrt{1+\\tfrac{8}{27}}=1.1386,\\qquad f_2=\\sqrt{1+\\tfrac{64}{27}}=1.8359\\]\n\\[I_{3/8}=0.25\\times12.9232\\approx3.2308\\]\n<p><b>Karşılaştırma tablosu.<\/b> Referans, yüksek n ile elde edilen değerdir: 3.2413 (script: n = 2000 Simpson ile 3.24131).<\/p>\n<div class=\"tw\">\n<table>\n<tr><th>Yöntem<\/th><th>Hesaplanan<\/th><th>Referans (yüksek n)<\/th><th>Fark<\/th><\/tr>\n<tr><td>Bileşik trapez (n = 4)<\/td><td>3.283<\/td><td>3.241<\/td><td>0.04195<\/td><\/tr>\n<tr><td>Simpson 1/3 (n = 4)<\/td><td>3.23961<\/td><td>3.241<\/td><td>0.00170<\/td><\/tr>\n<tr><td>Simpson 3/8 (n = 3)<\/td><td>3.23081<\/td><td>3.241<\/td><td>0.01050<\/td><\/tr>\n<\/table>\n<\/div>\n<ul>\n<li>Script (tam değerler): trapez 3.28326, Simpson 3/8 3.23081, Simpson 1/3 3.23961. Farklar 0.04195, 0.00170 ve 0.01050. Slayt farkları tutuyor.<\/li>\n<li>Slaytın ara toplamları 13.132 ve 19.437 yuvarlanmış değerlerle yazılmış. Tam değerlerle 13.1330 ve 19.4377 çıkar. Sonuç değişmez.<\/li>\n<li>Ek bilgi (script): Simpson 1/3 n = 2 için 3.21895, n = 6 için 3.24109. Simpson 3/8 n = 6 için 3.24059.<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Örnek E34 (W5 s15), mekanik: kuvvetten iş.<\/b> \\(W=\\int F(x)\\,dx\\). Deney verisi:<\/p>\n<table>\n<tr><th>x (m)<\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><\/tr>\n<tr><th>F (N)<\/th><td>100<\/td><td>85<\/td><td>72<\/td><td>50<\/td><td>30<\/td><\/tr>\n<\/table>\n<ul>\n<li>h = 1, bileşik trapez: \\(W\\approx1\\times[50+85+72+50+15]=272\\) J.<\/li>\n<li>Kontrol: \\(\\frac12[100+2(85+72+50)+30]=272\\).<\/li>\n<li>Ek: n = 4 çift olduğu için Simpson 1/3 de uygulanır. \\(\\frac13[100+4(85)+2(72)+4(50)+30]=\\frac{814}{3}=271.33\\) J. Veri tablodan geldiği için gerçek değer bilinmez. İki sonuç 0.67 J farklıdır.<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Sınav tipi örnek.<\/b> Bir aracın hızı 2 s aralıkla ölçülmüş: t = 0, 2, 4, 6, 8, 10 s için v = 0, 3, 7, 12, 14, 15 m/s. Alınan yolu bul.<\/p>\n<ul>\n<li>n = 5 (tek), h = 2. Bileşik Simpson 1/3 olmaz. İki seçenek var: trapez veya karma.<\/li>\n<li>Trapez: \\(\\frac22[0+2(3+7+12+14)+15]=87\\) m.<\/li>\n<li>Karma (ilk panel 3/8, sonra 1/3): 3/8 paneli \\(\\frac{3\\cdot2}{8}(0+3\\cdot3+3\\cdot7+12)=0.75\\times42=31.5\\). 1/3 paneli \\(\\frac23(12+4\\cdot14+15)=\\frac23\\cdot83=55.33\\). Toplam 86.83 m.<\/li>\n<li>İki sonuç yakın. Karma yöntem daha yüksek mertebeli, bu yüzden tercih edilir.<\/li>\n<\/ul>\n<\/div>\n\n<h3>Yöntem seçimi (W5 s13)<\/h3>\n<div class=\"tw\">\n<table>\n<tr><th>Durum<\/th><th>Önerilen yöntem<\/th><th>Neden?<\/th><th>Dikkat<\/th><\/tr>\n<tr><td>Hızlı/kaba tahmin yeterli<\/td><td>Trapez (küçük n)<\/td><td>Basit, hızlı<\/td><td>Hata büyük olabilir<\/td><\/tr>\n<tr><td>Yüksek hassasiyet, genel amaç<\/td><td>Bileşik Simpson 1/3<\/td><td>O(h⁴), geniş kullanım<\/td><td>n çift zorunlu<\/td><\/tr>\n<tr><td>n = 3'ün katı<\/td><td>Simpson 3/8<\/td><td>Doğal panel uyumu<\/td><td>O(h⁴), aynı mertebe<\/td><\/tr>\n<tr><td>Fonksiyon çok dalgalı (yüksek f″)<\/td><td>Küçük h ile Trapez veya Simpson<\/td><td>Hata formülünde f″ var<\/td><td>n büyük seç<\/td><\/tr>\n<tr><td>Veri sadece tablo (eşit aralık)<\/td><td>Trapez veya bileşik Simpson<\/td><td>Sadece fᵢ değerleri biliniyor<\/td><td>Gauss mümkün değil<\/td><\/tr>\n<tr><td>f 3. derece veya altı polinom<\/td><td>Simpson 1/3 (n = 2 yeterli!)<\/td><td>Tam sonuç verir, hata = 0<\/td><td>Polinom olduğunu bil<\/td><\/tr>\n<\/table>\n<\/div>\n\n<h3>Sık yapılan hatalar (W5 s14)<\/h3>\n<ol>\n<li><b>n tek seçmek (Simpson 1/3'te).<\/b> n = 3 ile bileşik Simpson 1/3 uygulanamaz. n = 3 için Simpson 3/8 veya Trapez son panele eklenir.<\/li>\n<li><b>h'yı yanlış hesaplamak.<\/b> h = (b−a)/n, toplam uzunluk değil. n = 4, [0,2] aralığı → h = 2/4 = 0.5 (2.0 değil!).<\/li>\n<li><b>Bileşik Simpson katsayı dizisi hatası.<\/b> 1, 4, 2, 4, ..., 2, 4, 1. Uçlar ×1, tek indis iç noktalar ×4, çift indis iç noktalar ×2.<\/li>\n<li><b>h/3 veya 3h/8 çarpanını unutmak.<\/b> Her iki Simpson kuralında da çarpan var. Sadece toplamı bulmak yetmez.<\/li>\n<li><b>Hata mertebesi = gerçek hata sanmak.<\/b> O(h⁴) mertebesini, gerçek hatanın tam h⁴ olduğu sanılmamalı. Bu sadece küçülme hızı.<\/li>\n<li><b>Tüm Newton-Cotes'ta eşit aralık koşulu göz ardı.<\/b> x₁−x₀ ≠ x₂−x₁ ise formül doğrudan uygulanamaz. Lagrange veya başka yöntem gerekir.<\/li>\n<\/ol>\n\n<h3>Mühendislik uygulamaları (W5 s15)<\/h3>\n<ul>\n<li>Mekanik: kuvvetten iş (yukarıdaki örnek E34).<\/li>\n<li>Akışkanlar: \\(A=\\int f(x)dx\\), profil kesit alanı. Foil profili koordinatlarından (veri tablosu) bileşik Simpson ile kesin alan hesabı.<\/li>\n<li>Isı transferi: \\(Q=\\int q(x)dx\\), cidar boyunca ısı akısı dağılımı. Trapez veya Simpson ile toplam Q hesaplanır. FEM çözümünden gelen sayısal veri için yaygın.<\/li>\n<li>Sinyal işleme: \\(E=\\int|x(t)|^2dt\\), discrete-time sinyalin enerjisi. Her Δt aralığında trapez uygulanır. Örnekleme periyodu h → bileşik trapez.<\/li>\n<\/ul>\n<p>Slayttaki kapanış: \"Deney verisi, ölçüm sonuçları ve simülasyon çıktıları genellikle tablo formatındadır, antitürev hesaplanamaz. Bu durumlarda Newton-Cotes yöntemleri tek pratik seçenektir. h küçüldükçe hata sistematik azalır.\"<\/p>\n\n<h3>Grafik ve şemalar<\/h3>\n<ul>\n<li>W5 s12 üç renkli kutu gösterir: kırmızı (bileşik trapez), yeşil (bileşik Simpson 1/3), mor (Simpson 3/8). Her kutuda hesap adımları sırasıyla yazılı. Altta karşılaştırma tablosu var.<\/li>\n<li>W5 s13 yöntem seçimi tablosundan ibarettir. Grafik yok.<\/li>\n<li>W5 s14 altı kırmızı kutuyu alt alta dizer. Her kutuda bir çarpı simgesi ve kısa açıklama var. En altta yeşil \"Altın kural\" kutusu.<\/li>\n<li>W5 s15 dört siyah kutu (Mekanik, Akışkanlar, Isı Transferi, Sinyal İşleme) ve altta yeşil bir mesaj kutusu gösterir.<\/li>\n<\/ul>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>Altın kural: Formülü uygulamadan önce her zaman (1) h, (2) katsayı dizisi, (3) dış çarpanı kontrol et.<\/p><span class=\"kaynak\">W5 s14<\/span><\/div>\n<div class=\"vurgu\"><p>Deney verisi, ölçüm sonuçları ve simülasyon çıktıları genellikle tablo formatındadır, antitürev hesaplanamaz. Bu durumlarda Newton-Cotes yöntemleri tek pratik seçenektir. h küçüldükçe hata sistematik azalır.<\/p><span class=\"kaynak\">W5 s15<\/span><\/div>\n<div class=\"vurgu\"><p>O(h⁴) mertebesini, gerçek hatanın tam h⁴ olduğu sanılmamalı. Bu sadece küçülme hızı.<\/p><span class=\"kaynak\">W5 s14<\/span><\/div>\n\n<h3>Slayt hatası<\/h3>\n<div class=\"slhata\">\n<p><b>Hata (W5 s12, Simpson 3/8 ara değerleri).<\/b> Slayt f(2/3) = 1.1041 ve f(4/3) = 1.6916 yazıyor.<\/p>\n<p>Doğrusu f(2/3) = √(1 + 8/27) = 1.1386 ve f(4/3) = √(1 + 64/27) = 1.8359. Slaytın ara değerleriyle hesap 3.0968 çıkar. Slaytın sonucu 3.2308 ise doğru değerlerle tutar (3.23081). Sınavda ara değerleri slayttan kopyalama.<\/p>\n<\/div>\n<p class=\"sn\">Slayt s12'de f(1.5) = 2.0916 yazar. Tam değer 2.09165. Bu son basamak yuvarlamasıdır, hata değil.<\/p>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>Sınavda sırayı uygula: (1) h = (b − a)/n, (2) düğümler ve f değerleri tablosu, (3) katsayı dizisi, (4) dış çarpan, (5) toplam × çarpan.<\/li>\n<li>n'ye bak ve yöntemi seç: çift → 1/3, 3'ün katı → 3/8, tek → karma, \"yalnız trapez\" → bileşik trapez.<\/li>\n<li>Veri tablosunda aralık eşit mi diye kontrol et. Eşit değilse Newton-Cotes uygulanmaz.<\/li>\n<li>İki yöntemi karşılaştırırken referans değer olarak yüksek n sonucu veya analitik sonuç kullan.<\/li>\n<\/ul><\/div>\n<p class=\"bu-eksik\">BUders videolarının başlığında geçmeyen kısım: yöntemleri karşılaştırma, yöntem seçimi ve sık hatalar. ∫√(1+x³) örneği ve mühendislik uygulamaları hocaya özgü. Bu kısımları bu nottan çalış.<\/p>\n<p class=\"buq\">BUders testleri: <a href=\"https://www.buders.com/altsayfa/quiz_2/sayisal_integrasyon_quiz_3/sayisal_integrasyon_quiz_3.html\" target=\"_blank\" rel=\"noopener\">Sayısal İntegrasyon Quiz-3<\/a> (yöntemleri karşılaştıran kavram soruları) ve <a href=\"https://www.buders.com/altsayfa/quiz_2/sayisal_integrasyon_quiz_5/sayisal_integrasyon_quiz_5.html\" target=\"_blank\" rel=\"noopener\">Quiz-5<\/a> (Gauss kuadratürü ağırlıklı, vize dışı).<\/p>","v":["dwEZmv9YVU4","TRo91HxWbqU","kfpdR3CLHTI","_x2quxqxuDo","8Wge9uNIexs","VFh4Fij6LRg","qXBekymaxYY"],"qs":[]},"rehber":{"y":"n","id":"rehber","t":"Sınav rehberi","g":5,"sub":"Rehber ve formül","h":"<p>Bu not hocanın 17 soruluk örnek föyünden çıkarıldı. Föy sınav kâğıdı değil. Kalıbı sınavla aynı olması muhtemel. Çözümler <a href=\"#\" data-go=\"q:a1\">A1<\/a> ile <a href=\"#\" data-go=\"q:c6\">C6<\/a> arasında. Formüller <a href=\"#\" data-go=\"n:formul\">formül kâğıdında<\/a>, slayt hataları <a href=\"#\" data-go=\"n:slhata\">slayt hataları<\/a> notunda.<\/p>\n<h3>Föy nedir<\/h3>\n<ul>\n<li>Tür: Dr. Öğr. Üyesi Cihad Delen'in (İTÜ) basılı örnek soru listesi. Telefonla taranmış 7 sayfa.<\/li>\n<li>Sayfa 1-2 \"Örnek Sorular\": A1-A6. Sayfa 3-5 \"Örnek Sorular 2\": B7-B11. Sayfa 6-7 yine \"Örnek Sorular 2\" ama numara 1'den yeniden başlıyor: C1-C6. Burada üç harfli etiket kullanıldı.<\/li>\n<li>Boş doldurma tabloları var: fark tablosu, düğüm tablosu, \"Yöntem, Hesaplanan, Gerçek, Mutlak fark\" tablosu. Sınav da büyük ihtimalle bu kalıpta.<\/li>\n<li>Kısaltmalar: föyde NİFİF ve NGFİF, slaytta NIFF ve NGFF yazıyor. İkisi aynı yöntem. Türev kısaltmaları slayttaki gibi: FD1, BD1, CD2, FD2, BD2, CD4, D2.<\/li>\n<li>Sorularda puan yazmıyor.<\/li>\n<li>Taramada soluk ya da okunmayan yerler var. İlgili soruda \"Okunamayan yer\" notuyla işaretli.<\/li>\n<\/ul>\n<h3>Hocanın kuralları<\/h3>\n<div class=\"tw\">\n<table>\n<tr><th>Konu<\/th><th>Kural<\/th><th>Kaynak<\/th><\/tr>\n<tr><td>Mutlak hata<\/td><td>\\(E=\\lvert\\text{gerçek}-\\text{yaklaşık}\\rvert\\)<\/td><td>Hafta 1 \"Mutlak ve bağıl hata\". Hafta 4 örneklerinde \"Hata: |0.8660 − 0.8070|\"<\/td><\/tr>\n<tr><td>Bağıl hata<\/td><td>\\(\\varepsilon=E/\\lvert\\text{gerçek}\\rvert\\times100\\%\\)<\/td><td>Hafta 2-3 NİFİF örneği \"Bağıl hata: 2.01%\"<\/td><\/tr>\n<tr><td>Yuvarlama<\/td><td>Sonraki rakam 5'ten küçükse koru, 5 ya da büyükse bir artır. Sonucu belirsizliğe uygun basamakla ver.<\/td><td>Hafta 1 \"Anlamlı basamak ve yuvarlama\"<\/td><\/tr>\n<tr><td>Basamak pratiği<\/td><td>Ara değerler 4-6 ondalık, sonuç 3-4 ondalık. Tablo verisi 3 basamaksa sonuç da 3-4 ondalık.<\/td><td>Hafta 4 Örnek 1, Hafta 3 NGFİF örneği<\/td><\/tr>\n<tr><td>Açı<\/td><td>Trigonometrik fonksiyonlar radyan.<\/td><td>Hafta 2 Taylor slaytı. Kâğıttaki öğrenci notu: \"radyan derece çevir\"<\/td><\/tr>\n<tr><td>Tablo verisi<\/td><td>Tablo verilmişse hesap tablodaki değerlerle yapılır. sin ve eˣ yeniden hesaplanmaz.<\/td><td>Hafta 4 Örnek 1 (eˣ tablosu 4 ondalıkla kullanılıyor)<\/td><\/tr>\n<tr><td>Bileşik Simpson n<\/td><td>n çift ise 1/3. n, 3'ün katıysa 3/8. n tek ise 3 aralık 3/8, kalan çift sayıda aralık 1/3. Föyde n = 5: ilk iki aralık 1/3, son üç aralık 3/8.<\/td><td>Hafta 5 \"Karma kullanım\"<\/td><\/tr>\n<\/table>\n<\/div>\n<div class=\"vurgu\">Formülü uygulamadan önce her zaman üç şeyi kontrol et: h, katsayı dizisi, dış çarpan. <span class=\"kaynak\">W5 s14<\/span><\/div>\n<div class=\"vurgu\">Sonuç = Değer + Hata + Yorum. <span class=\"kaynak\">W1 s22<\/span><\/div>\n<h3>Hesap makinesi: RAD modu<\/h3>\n<ul>\n<li>sin, cos, tan varsa önce makineyi RAD moduna al. Ekranda R ya da RAD işareti görünmeli. Kâğıttaki öğrenci notu: \"shift mode 4 rad\". Model farklıysa ayar menüsünde Radian'ı seç.<\/li>\n<li>DEG modunda cos(1.4) = 0.999701 çıkar. RAD modunda 0.169967. <a href=\"#\" data-go=\"q:a2\">A2<\/a> bu tuzağa göre kurulmuş.<\/li>\n<li>RAD modu <a href=\"#\" data-go=\"q:a2\">A2<\/a>, <a href=\"#\" data-go=\"q:a3\">A3<\/a>, <a href=\"#\" data-go=\"q:c2\">C2<\/a> ve <a href=\"#\" data-go=\"q:c4\">C4<\/a> için şart.<\/li>\n<\/ul>\n<h3>Yuvarlama kuralları<\/h3>\n<ul>\n<li>Kesme değil yuvarlama yap. 1.051709 değeri 4 ondalıkta 1.0517, 5 ondalıkta 1.05171 olur. Kâğıtta \"1.05170\" yazılmış, bu kesme.<\/li>\n<li>Hata her zaman mutlak değer. Farkı yuvarlanmış sayıdan değil tam değerden al. Örnek: 14/3 ile hesapla, 4.667 ile değil (<a href=\"#\" data-go=\"q:c1\">C1<\/a>).<\/li>\n<li>Kesirle çalışabiliyorsan kesirle çalış. Erken yuvarlama sonucu kaydırır (<a href=\"#\" data-go=\"q:a4\">A4<\/a>).<\/li>\n<li>Pay küçük, katsayılar büyükse ara değerleri yuvarlama. Tabloya 6 ondalık yaz, sonucu makinede yuvarlamadan hesapla. <a href=\"#\" data-go=\"q:c2\">C2<\/a> ve <a href=\"#\" data-go=\"q:c4\">C4<\/a> bunun örneği.<\/li>\n<li>Bağıl hata yazarsan formülü de yaz. W1 slaytında payda yaklaşık değer (δ = Δa / |a|). W234 örneklerinde payda gerçek değer. Föy gerçek değeri kullanıyor: \\(\\varepsilon=E/\\lvert\\text{gerçek}\\rvert\\times100\\).<\/li>\n<\/ul>\n<h3>Durdurma ölçütü<\/h3>\n<ul>\n<li>Föydeki yöntemlerin hepsi tek geçişli. İnterpolasyon, sayısal türev ve Newton-Cotes integrali iterasyon istemez. Bu yüzden hiçbir soruda \\(\\varepsilon_s\\) ya da durdurma ölçütü yok. İterasyon tablosu yerine fark tablosu ya da düğüm tablosu var.<\/li>\n<li>Slaytlarda olmayanlar: \\(\\varepsilon_s\\), \\(\\varepsilon_a\\), iterasyon durdurma kriteri, \"n anlamlı basamak için hata\" formülü. Bunlar kök bulma konusu ve Hafta 9'da.<\/li>\n<li>Slayttaki en yakın kurallar: NİFİF'te \"Δⁿf ≈ 0 olmaya başladığında dur, genelde 3-4 terim yeterli\" (W234 s30). Taylor'da \\(\\lvert R_n\\rvert\\le M\\lvert x-x_0\\rvert^{n+1}/(n+1)!\\). Bileşik kurallarda h'yı yarılayarak hatayı azaltma (W5 s6). En iyi h için \\(h_{opt}=\\sqrt{\\varepsilon_{machine}}\\) (W234 s47, s51).<\/li>\n<\/ul>\n<h3>Soru tipleri<\/h3>\n<h4>Konu dağılımı (17 soru, alt maddelerle)<\/h4>\n<div class=\"tw\">\n<table>\n<tr><th>Konu (slayttaki adı)<\/th><th>Sorular<\/th><th>Adet<\/th><\/tr>\n<tr><td>Sayısal türev: FD1, BD1, CD2<\/td><td><a href=\"#\" data-go=\"q:a1\">A1<\/a>, <a href=\"#\" data-go=\"q:a2\">A2<\/a>, <a href=\"#\" data-go=\"q:a3\">A3<\/a>, <a href=\"#\" data-go=\"q:b10\">B10a<\/a><\/td><td>4<\/td><\/tr>\n<tr><td>Merkezi 2. türev D2<\/td><td><a href=\"#\" data-go=\"q:b10\">B10b<\/a><\/td><td>1<\/td><\/tr>\n<tr><td>Merkezi fark 3. türev (δ³, 4 nokta)<\/td><td><a href=\"#\" data-go=\"q:c2\">C2<\/a><\/td><td>1<\/td><\/tr>\n<tr><td>5 nokta merkezi fark CD4<\/td><td><a href=\"#\" data-go=\"q:c4\">C4<\/a><\/td><td>1<\/td><\/tr>\n<tr><td>NİFİF'ten türev<\/td><td><a href=\"#\" data-go=\"q:b8\">B8c<\/a><\/td><td>1<\/td><\/tr>\n<tr><td>Newton bölünmüş farklar<\/td><td><a href=\"#\" data-go=\"q:a4\">A4<\/a><\/td><td>1<\/td><\/tr>\n<tr><td>Lagrange P₁ ve P₂ (hata sınırıyla)<\/td><td><a href=\"#\" data-go=\"q:a5\">A5<\/a>, <a href=\"#\" data-go=\"q:b7\">B7a<\/a><\/td><td>2<\/td><\/tr>\n<tr><td>İleri fark tablosu ve NİFİF<\/td><td><a href=\"#\" data-go=\"q:b8\">B8a-b<\/a>, <a href=\"#\" data-go=\"q:b9\">B9a<\/a><\/td><td>2<\/td><\/tr>\n<tr><td>Geri fark tablosu ve NGFİF<\/td><td><a href=\"#\" data-go=\"q:a6\">A6<\/a>, <a href=\"#\" data-go=\"q:b11\">B11<\/a><\/td><td>2<\/td><\/tr>\n<tr><td>Tek panel ve bileşik trapez<\/td><td><a href=\"#\" data-go=\"q:b7\">B7b<\/a>, <a href=\"#\" data-go=\"q:b9\">B9b<\/a>, <a href=\"#\" data-go=\"q:c1\">C1<\/a><\/td><td>3<\/td><\/tr>\n<tr><td>Bileşik Simpson 1/3<\/td><td><a href=\"#\" data-go=\"q:b9\">B9c<\/a>, <a href=\"#\" data-go=\"q:c3\">C3<\/a><\/td><td>2<\/td><\/tr>\n<tr><td>Simpson 3/8<\/td><td><a href=\"#\" data-go=\"q:c5\">C5<\/a><\/td><td>1<\/td><\/tr>\n<tr><td>Karma 1/3 ve 3/8<\/td><td><a href=\"#\" data-go=\"q:c6\">C6<\/a><\/td><td>1<\/td><\/tr>\n<\/table>\n<\/div>\n<h4>Biçim<\/h4>\n<ul>\n<li>Tek geçişli hesap ve gerçek değerle karşılaştırma. Neredeyse her soru böyle. \"Analitik değerle karşılaştırınız\" demek mutlak fark, bazen bağıl yüzde.<\/li>\n<li>Tablo doldurma: fark tablosu (ileri, geri, bölünmüş), düğüm ve değer tablosu, \"Yöntem, Hesaplanan, Gerçek, Mutlak fark\" tablosu. Föydeki boş tablolar sınav şablonu gibi.<\/li>\n<li>Hata hesabı her soruda var: mutlak hata. Lagrange hata üst sınırı bir soruda (<a href=\"#\" data-go=\"q:a5\">A5<\/a>).<\/li>\n<li>Hafif yorum soruları: \"PV=C sağlanıyor mu\" (<a href=\"#\" data-go=\"q:b7\">B7c<\/a>), \"q(x)=x²+2x olduğunu gösteriniz\" (<a href=\"#\" data-go=\"q:b9\">B9d<\/a>), \"hataları karşılaştırınız\" (<a href=\"#\" data-go=\"q:a3\">A3<\/a>).<\/li>\n<li>İspat ve türetme yok.<\/li>\n<li>İterasyon ve durdurma ölçütü yok.<\/li>\n<li>Mühendislik bağlamı: iş = ∫P dV (<a href=\"#\" data-go=\"q:b7\">B7<\/a>), kiriş yayılı yükü (<a href=\"#\" data-go=\"q:b9\">B9<\/a>). Uzun, çok maddeli sorular bu tipte.<\/li>\n<\/ul>\n<h4>Vizenin muhtemel yapısı<\/h4>\n<ul>\n<li>4-6 soru. Her biri bir konu bloğu: interpolasyon (Newton bölünmüş, Lagrange, NİFİF, NGFİF), sayısal türev, sayısal integral.<\/li>\n<li>En az bir uzun mühendislik sorusu bekle: aynı veriyle interpolasyon, trapez, Simpson ve analitik karşılaştırma (<a href=\"#\" data-go=\"q:b7\">B7<\/a> ve <a href=\"#\" data-go=\"q:b9\">B9<\/a> tipi).<\/li>\n<li>Formüller büyük ihtimalle kâğıtta verilecek. Föyde hepsi kutu içinde verilmiş. Puan doğru tabloya, doğru s ve h değerine ve karşılaştırma satırına gidiyor.<\/li>\n<li>Hesap makinesi RAD modu kritik.<\/li>\n<li>Bu bir tahmin. Süre ve puanlar föyde yazmıyor.<\/li>\n<\/ul>\n<h4>Föyde olmayıp slayttan gelebilecek soru tipleri<\/h4>\n<ul>\n<li>Hata analizi (Hafta 1): mutlak ve bağıl hata, anlamlı basamak, yuvarlama ile kesme hatası farkı, doğruluk ile hassasiyet.<\/li>\n<li>Hata yayılımı (Hafta 1): toplama ve çıkarmada mutlak hatalar toplanır. Çarpma ve bölmede bağıl hatalar toplanır. \\(\\Delta f\\approx\\lvert f'(x)\\rvert\\Delta x\\). Çok değişkenli toplam katkı.<\/li>\n<li>Anlamlı basamak kaybı: 1 − cos θ yerine 2 sin²(θ/2) (Hafta 1 örneği).<\/li>\n<li>Taylor serisi ve Lagrange kalanı: \\(R_n=\\frac{f^{(n+1)}(c)}{(n+1)!}(x-a)^{n+1}\\). Örnek: cos x ve sin x için 3. derece açılım ve hata sınırı (Hafta 2).<\/li>\n<li>Horner kuralı: polinom değerini iç içe yazımla hesaplamak.<\/li>\n<li>Doğrusal interpolasyon hata tahmini: \\(E\\approx\\frac{h^2}{8}\\max\\lvert f''\\rvert\\).<\/li>\n<li>Newton bölünmüş fark ile 3. derece polinom. Newton ve Lagrange aynı polinomu verir.<\/li>\n<li>Stirling formülü ve formül seçimi: x₀'a yakınsa NİFİF, xₙ'e yakınsa NGFİF, ortadaysa Stirling.<\/li>\n<li>Fark operatörleri: \\(E=1+\\Delta\\), \\(\\nabla=1-E^{-1}\\), \\(\\delta=E^{1/2}-E^{-1/2}\\). Pascal katsayıları.<\/li>\n<li>3 nokta ileri ve geri 1. türev (FD2, BD2), 4 nokta ileri ve geri 2. türev, 5 nokta 2. türev (Hafta 4 tablosu).<\/li>\n<li>En iyi h: kesme ve yuvarlama dengesi, \\(h_{opt}=\\sqrt{\\varepsilon_m/C}\\).<\/li>\n<li>Newton-Cotes hata formülleriyle n seçimi. Örnek: \"hata 10⁻⁴'ten küçük olsun, kaç alt aralık?\" Trapez \\(-(b-a)h^2f''/12\\), Simpson 1/3 \\(-(b-a)h^4f^{(4)}/180\\).<\/li>\n<li>h yarıya inince hata oranı: trapez 4'e, Simpson 16'ya bölünür.<\/li>\n<li>Karma Simpson, farklı n için. Örnek: n = 7 ya da n = 10 için panel dağılımı.<\/li>\n<\/ul>\n<p>Bu tiplerin formülleri <a href=\"#\" data-go=\"n:formul\">formül kâğıdında<\/a>. Slayttaki yanlış değerler <a href=\"#\" data-go=\"n:slhata\">slayt hataları<\/a> notunda.<\/p>\n<h3>BUders sayfası<\/h3>\n<p class=\"buq\"><a href=\"https://www.buders.com/altsayfa/vize_ve_finalde_cikabilecek_sorular_sayisal_analiz.html\" target=\"_blank\" rel=\"noopener\">BUders: Vize ve Finalde Çıkabilecek Sorular<\/a><\/p>\n<p class=\"sn\">Videoların konusu sayfada yazmıyor. BUders'in vize-final örnekleri kök bulma ağırlıklı. Bu vizenin kapsamına tam uymuyor. Önce buradaki 17 soruyu çöz.<\/p>"},"formul":{"y":"n","id":"formul","t":"Formül kâğıdı","g":5,"sub":"Rehber ve formül","h":"<p>Vizeden önce bir kez bakmadan elle yaz. Yazdırırsan yalnız bu not çıkar. Hafta 1-5'in tüm formülleri burada. \"Standart\" diye işaretli satırlar slaytta yazmıyor, Taylor ya da Lagrange hatasından geliyor.<\/p>\n<h3>Hata<\/h3>\n<ul>\n<li>\\(\\Delta a=|a_0-a|\\), \\(\\delta_a=\\Delta a/|a|\\). Yüzde: \\(\\varepsilon=E/|\\text{gerçek}|\\times100\\). Föyde payda gerçek değer.<\/li>\n<li>Toplama, çıkarma: mutlak hatalar toplanır. Çarpma, bölme: bağıl hatalar toplanır. Kuvvette \\(\\delta_z\\approx|m|\\delta_x+|n|\\delta_y\\).<\/li>\n<li>\\(\\Delta y\\approx|f'(x)|\\,\\Delta x\\). Çok değişkende \\(\\Delta y\\approx\\sum|\\partial f/\\partial x_i|\\,\\Delta x_i\\). Açı hatası radyan olmalı.<\/li>\n<li>Yakın sayılarda \\(1-\\cos\\theta=2\\sin^2(\\theta/2)\\). Çıkarma yerine bu yazım kararlı.<\/li>\n<li>Yuvarlama: sonraki rakam 5'ten küçükse koru, 5 ya da büyükse bir artır.<\/li>\n<\/ul>\n<h3>Taylor ve Horner<\/h3>\n<ul>\n<li>\\(f(x)\\approx\\sum_{k=0}^{n}\\frac{f^{(k)}(x_0)}{k!}(x-x_0)^k\\). Açı radyan.<\/li>\n<li>Kalan: \\(R_n=\\frac{f^{(n+1)}(c)}{(n+1)!}(x-x_0)^{n+1}\\), \\(|R_n|\\le\\frac{M|x-x_0|^{n+1}}{(n+1)!}\\). M, \\(f^{(n+1)}\\)'in aralıktaki en büyük değeri.<\/li>\n<li>\\(\\cos x\\approx1-\\frac{x^2}{2!}+\\frac{x^4}{4!}\\). \\(\\sin x\\approx x-\\frac{x^3}{3!}\\). \\(e^x\\approx1+x+\\frac{x^2}{2}+\\frac{x^3}{6}\\).<\/li>\n<li>Horner: \\(b_n=a_n,\\ b_k=a_k+x\\,b_{k+1},\\ P(x)=b_0\\). n çarpma ve n toplama.<\/li>\n<\/ul>\n<div class=\"slhata\"><b>Slayt hatası:<\/b> G2 s7 \"P₃ = 1 − x²/2\" yazıp 0.877604 gösteriyor. O değer x⁴ terimini de içeriyor. 1 − x²/2 ile P₃(0.5) = 0.875.<\/div>\n<h3>İnterpolasyon<\/h3>\n<ul>\n<li>n + 1 nokta, en fazla n. derece polinom. Aralık dışı (ekstrapolasyon) riskli, hata çarpımı hızla büyür.<\/li>\n<li>Doğrusal: \\(P_1=f_0+\\frac{f_1-f_0}{x_1-x_0}(x-x_0)\\).<\/li>\n<li>Doğrusal hata: \\(f(x)-P_1(x)=\\frac{f''(c)}{2!}(x-x_0)(x-x_1)\\). En fazla \\(\\frac{h^2}{8}\\max|f''|\\), \\(h=x_1-x_0\\).<\/li>\n<li>Bölünmüş fark: \\(f[x_i]=f(x_i)\\), \\(f[x_i,\\dots,x_k]=\\frac{f[x_{i+1},\\dots,x_k]-f[x_i,\\dots,x_{k-1}]}{x_k-x_i}\\). h sabit olmak zorunda değil.<\/li>\n<\/ul>\n\\[\\begin{aligned}P_n(x)=f[x_0]&+f[x_0,x_1](x-x_0)\\\\&+f[x_0,x_1,x_2](x-x_0)(x-x_1)\\\\&+\\cdots\\end{aligned}\\]\n<ul>\n<li>Yeni nokta eklenirse yalnız yeni terim eklenir. Katsayılar tablonun köşegeni.<\/li>\n<li>Lagrange: \\(P_n(x)=\\sum_{i=0}^{n}L_i(x)f(x_i)\\), \\(L_i(x)=\\prod_{j\\ne i}\\frac{x-x_j}{x_i-x_j}\\). \\(L_i(x_i)=1\\), \\(L_i(x_j)=0\\), \\(\\sum L_i=1\\).<\/li>\n<li>P₂: \\(L_0=\\frac{(x-x_1)(x-x_2)}{(x_0-x_1)(x_0-x_2)}\\), \\(L_1=\\frac{(x-x_0)(x-x_2)}{(x_1-x_0)(x_1-x_2)}\\), \\(L_2=\\frac{(x-x_0)(x-x_1)}{(x_2-x_0)(x_2-x_1)}\\).<\/li>\n<li>Newton ve Lagrange aynı polinomu verir. Hata terimi de aynı (aşağıda).<\/li>\n<\/ul>\n<h4>Lagrange ve Newton hata terimi<\/h4>\n\\[E_n(x)=\\frac{f^{(n+1)}(c)}{(n+1)!}\\prod_{i=0}^{n}(x-x_i)\\]\n<ul>\n<li>c, düğümlerin arasında bir nokta. Hata, n + 1. türeve ve \\(\\prod(x-x_i)\\) çarpımına bağlı.<\/li>\n<li>Üst sınır: \\(|E_n(x)|\\le\\frac{M_{n+1}}{(n+1)!}\\Bigl|\\prod(x-x_i)\\Bigr|\\). \\(M_{n+1}=\\max|f^{(n+1)}|\\), [x₀, xₙ] aralığında. eˣ artan, en büyüğü sağ uçta. Alt sınır için en küçük değer (eˣ için sol uç).<\/li>\n<li>Newton biçimi (standart): \\(E_n(x)=f[x_0,\\dots,x_n,x]\\prod(x-x_i)\\). Bir sonraki bölünmüş farkı çarpımla çarpar.<\/li>\n<li>Örnek: n = 2 için \\(3!=6\\) ve \\(f'''\\) kullan. 3! yerine 2! yazma. <a href=\"#\" data-go=\"q:a5\">A5<\/a> bu tuzağa göre kurulmuş.<\/li>\n<\/ul>\n<h3>Fark operatörleri ve E<\/h3>\n<ul>\n<li>\\(Ef(x_i)=f(x_i+h)\\), \\(E^nf(x_i)=f(x_i+nh)\\), \\(E^{-1}f(x_i)=f(x_i-h)\\), \\(E^0=1\\).<\/li>\n<li>\\(\\Delta f_i=f_{i+1}-f_i\\). \\(\\nabla f_i=f_i-f_{i-1}\\). \\(\\delta f_i=f_{i+1/2}-f_{i-1/2}\\). \\(\\mu f_i=\\frac{f_{i+1/2}+f_{i-1/2}}{2}\\).<\/li>\n<li>\\(\\Delta=E-1\\), \\(\\nabla=1-E^{-1}\\), \\(\\delta=E^{1/2}-E^{-1/2}\\). Ters yazım: \\(E=1+\\Delta\\), \\(E^{-1}=1-\\nabla\\), \\(E^s=(1+\\Delta)^s\\).<\/li>\n<li>\\(\\nabla f_i=\\Delta f_{i-1}\\), \\(\\nabla^2f_i=\\Delta^2f_{i-2}\\), \\(\\delta^2f_i=\\Delta^2f_{i-1}\\). Aynı sayılar, farklı satırda okunur.<\/li>\n<li>Genel: \\(\\Delta^nf_i=\\sum_{k=0}^{n}(-1)^{n-k}\\binom nk f_{i+k}\\). \\(\\nabla^nf_i=\\sum_{k=0}^{n}(-1)^{k}\\binom nk f_{i-k}\\).<\/li>\n<li>Pascal: 1 1 / 1 2 1 / 1 3 3 1 / 1 4 6 4 1. İşaretler +, −, +, −.<\/li>\n<\/ul>\n\\[\\begin{aligned}\\Delta^2f_i&=f_{i+2}-2f_{i+1}+f_i\\\\\\Delta^3f_i&=f_{i+3}-3f_{i+2}+3f_{i+1}-f_i\\\\\\Delta^4f_i&=f_{i+4}-4f_{i+3}+6f_{i+2}\\\\&\\quad-4f_{i+1}+f_i\\end{aligned}\\]\n\\[\\begin{aligned}\\nabla^2f_i&=f_i-2f_{i-1}+f_{i-2}\\\\\\nabla^3f_i&=f_i-3f_{i-1}+3f_{i-2}-f_{i-3}\\\\\\nabla^4f_i&=f_i-4f_{i-1}+6f_{i-2}\\\\&\\quad-4f_{i-3}+f_{i-4}\\end{aligned}\\]\n\\[\\begin{aligned}\\delta^2f_i&=f_{i+1}-2f_i+f_{i-1}\\\\2\\mu\\delta^3f_i&=f_{i+2}-2f_{i+1}\\\\&\\quad+2f_{i-1}-f_{i-2}\\\\\\delta^4f_i&=f_{i+2}-4f_{i+1}+6f_i\\\\&\\quad-4f_{i-1}+f_{i-2}\\end{aligned}\\]\n<div class=\"slhata\"><b>Slayt hatası:<\/b> W234 s24 δ³ türetmesi sonuç formülüyle uyuşmuyor. Türetme \\(f_{i+2}-3f_{i+1}+3f_i-f_{i-1}\\) veriyor. Sonuçtaki \\(f_{i+2}-2f_{i+1}+2f_{i-1}-f_{i-2}\\) aslında \\(2\\mu\\delta^3f_i=\\Delta^3f_{i-1}+\\Delta^3f_{i-2}\\). Föy bu sonuç formülünü kullanıyor (<a href=\"#\" data-go=\"q:c2\">C2<\/a>). Katsayılar +1 −2 0 +2 −1, f(xᵢ) girmez.<\/div>\n<ul>\n<li>Çift mertebede f(xᵢ) formüle girer, tek mertebede girmez.<\/li>\n<li>Polinom kuralı: n. fark sabitse veri n. derece polinomdan. \\(\\Delta^nf=n!\\,a_n\\,h^n\\) ve \\(\\Delta^{n+1}f=0\\).<\/li>\n<li>Mertebe (basit hâl): Δ ve ∇ için O(h), δ için O(h²).<\/li>\n<\/ul>\n<div class=\"slhata\"><b>Slayt hatası:<\/b> W234 s17 ve s28 hata mertebesini farklı anlatıyor. s28 \"δ³ ve δ⁴ için O(h⁴)\" diyor. Sayıyla bakınca δ³ ve δ⁴ de O(h²) (<a href=\"#\" data-go=\"q:c2\">C2<\/a>'de hata \\(\\frac{h^2}{4}|f^{(5)}|\\)). Sınavda \"Δ, ∇: O(h). δ: O(h²)\" yaz.<\/div>\n<h3>NIFF, NGFF, Stirling<\/h3>\n<p>Föyde NİFİF ve NGFİF. Slaytta NIFF ve NGFF. Düğümler eşit aralıklı olmalı.<\/p>\n\\[\\begin{aligned}P(x)=f_0&+s\\Delta f_0+\\frac{s(s-1)}{2!}\\Delta^2f_0\\\\&+\\frac{s(s-1)(s-2)}{3!}\\Delta^3f_0+\\cdots\\end{aligned}\\]\n<p>NIFF: \\(s=\\frac{x-x_0}{h}\\). Katsayılar tablonun üst satırından, sol üst köşegenden.<\/p>\n\\[\\begin{aligned}P(x)=f_n&+s\\nabla f_n+\\frac{s(s+1)}{2!}\\nabla^2f_n\\\\&+\\frac{s(s+1)(s+2)}{3!}\\nabla^3f_n+\\cdots\\end{aligned}\\]\n<p>NGFF: \\(s=\\frac{x-x_n}{h}\\), s negatif. Katsayılar tablonun alt satırından, sağ alt köşegenden. Geri fark tablosu, ileri fark tablosunun tersi değil. Aynı tablo iki formül için kullanılır.<\/p>\n\\[\\begin{aligned}P(x)=f_0&+s\\,\\mu\\Delta f_0+\\frac{s^2}{2!}\\Delta^2f_{-1}\\\\&+\\frac{s(s^2-1)}{3!}\\mu\\Delta^3f_{-1}\\\\&+\\frac{s^2(s^2-1)}{4!}\\Delta^4f_{-2}\\end{aligned}\\]\n<ul>\n<li>Stirling: \\(s=\\frac{x-x_i}{h}\\), x₀ = xᵢ merkez. \\(\\mu\\Delta f_0=\\frac{f_1-f_{-1}}{2}\\).<\/li>\n<li>\\(\\Delta^2f_{-1}=f_1-2f_0+f_{-1}\\). \\(\\mu\\Delta^3f_{-1}=\\frac{\\Delta^3f_{-1}+\\Delta^3f_{-2}}{2}\\). \\(\\Delta^4f_{-2}=f_2-4f_1+6f_0-4f_{-1}+f_{-2}\\).<\/li>\n<li>s boyutsuz: s = 0, 1, …, n düğümleri verir. s &lt; 0 ya da s &gt; n ekstrapolasyon.<\/li>\n<li>Terimleri Δⁿf ≈ 0 olana kadar ekle. Genelde 3-4 terim.<\/li>\n<li>Katsayı sözlüğü: \\(C(s,2)=\\frac{s(s-1)}{2}\\), \\(C(s,3)=\\frac{s(s-1)(s-2)}{6}\\), \\(C(s,4)=\\frac{s(s-1)(s-2)(s-3)}{24}\\).<\/li>\n<\/ul>\n<div class=\"vurgu\">Genel kural: |s| en küçük olan formülü seç. |s| &lt; 0.25 ise en yakın uç formülü (NIFF ya da NGFF). 0.25 &lt; |s| &lt; 0.75 ise Stirling. h sabit değilse Newton bölünmüş fark. <span class=\"kaynak\">W234 s32<\/span><\/div>\n<div class=\"slhata\"><b>Slayt hatası:<\/b> W234 s34 Stirling örneğinde \\(\\Delta^2f_{-1}=f_0-2f_{-1}+f_{-2}\\) yazıyor. Doğrusu \\(f_1-2f_0+f_{-1}\\). sin 0.3 için = −0.0080, üç terimle 0.29505. Slayt iki terimle 0.2961 veriyor.<\/div>\n<h4>NIFF ve NGFF hata terimi (standart)<\/h4>\n\\[E=\\frac{s(s-1)\\cdots(s-n)}{(n+1)!}\\,h^{n+1}f^{(n+1)}(c)\\]\n<p>NGFF'de çarpım \\(s(s+1)\\cdots(s+n)\\). Bu, Lagrange hatasında \\(\\prod(x-x_i)=h^{n+1}s(s-1)\\cdots(s-n)\\) yazılmış hâli.<\/p>\n<h4>Fark formüllerinden türev<\/h4>\n\\[\\begin{aligned}f'(x_0)\\approx\\frac1h\\Bigl[&\\Delta f_0-\\frac{\\Delta^2f_0}{2}\\\\&+\\frac{\\Delta^3f_0}{3}-\\frac{\\Delta^4f_0}{4}+\\cdots\\Bigr]\\end{aligned}\\]\n\\[\\begin{aligned}f'(x_n)\\approx\\frac1h\\Bigl[&\\nabla f_n+\\frac{\\nabla^2f_n}{2}\\\\&+\\frac{\\nabla^3f_n}{3}+\\frac{\\nabla^4f_n}{4}+\\cdots\\Bigr]\\end{aligned}\\]\n<p>İlki föyde (<a href=\"#\" data-go=\"q:b8\">B8c<\/a>). İkincisi NGFF'den aynı yoldan çıkar (standart). Formül farklarla başlar, f₀ ile değil.<\/p>\n<h3>Sayısal türev<\/h3>\n<h4>1. türev<\/h4>\n<ul>\n<li>FD1 (2 nokta ileri), O(h): \\(f'\\approx\\frac{f(x+h)-f(x)}{h}\\).<\/li>\n<li>BD1 (2 nokta geri), O(h): \\(f'\\approx\\frac{f(x)-f(x-h)}{h}\\).<\/li>\n<li>CD2 (3 nokta merkezi), O(h²): \\(f'\\approx\\frac{f(x+h)-f(x-h)}{2h}\\). f(x) girmez.<\/li>\n<li>FD2 (3 nokta ileri), O(h²): \\(f'\\approx\\frac{-3f(x)+4f(x+h)-f(x+2h)}{2h}\\).<\/li>\n<li>BD2 (3 nokta geri), O(h²): \\(f'\\approx\\frac{3f(x)-4f(x-h)+f(x-2h)}{2h}\\).<\/li>\n<\/ul>\n<p>CD4 (5 nokta merkezi), O(h⁴):<\/p>\n\\[\\begin{aligned}f'(x)\\approx\\frac{1}{12h}\\bigl[&-f(x+2h)+8f(x+h)\\\\&-8f(x-h)+f(x-2h)\\bigr]\\end{aligned}\\]\n<h4>2. türev<\/h4>\n<ul>\n<li>D2 (3 nokta merkezi), O(h²): \\(f''\\approx\\frac{f(x+h)-2f(x)+f(x-h)}{h^2}\\).<\/li>\n<li>4 nokta ileri, O(h²): \\(f''\\approx\\frac{2f(x)-5f(x+h)+4f(x+2h)-f(x+3h)}{h^2}\\).<\/li>\n<li>4 nokta geri, O(h²): \\(f''\\approx\\frac{2f(x)-5f(x-h)+4f(x-2h)-f(x-3h)}{h^2}\\).<\/li>\n<\/ul>\n<p>5 nokta merkezi (D2-CD4), O(h⁴):<\/p>\n\\[\\begin{aligned}f''(x)\\approx\\frac{1}{12h^2}\\bigl[&-f(x+2h)+16f(x+h)-30f(x)\\\\&+16f(x-h)-f(x-2h)\\bigr]\\end{aligned}\\]\n<h4>3. türev<\/h4>\n<p>4 nokta merkezi (δ³), O(h²):<\/p>\n\\[\\begin{aligned}f'''(x)\\approx\\frac{1}{2h^3}\\bigl[&\\ f(x+2h)-2f(x+h)\\\\&+2f(x-h)-f(x-2h)\\bigr]\\end{aligned}\\]\n<ul>\n<li>Genel: \\(f^{(n)}\\approx\\Delta^nf/h^n\\) ve \\(\\nabla^nf/h^n\\) O(h). \\(\\delta^nf/h^n\\) O(h²). 3. türev formülü \\(2\\mu\\delta^3f/(2h^3)\\).<\/li>\n<li>Paydalar: FD1, BD1: h. CD2, FD2, BD2: 2h. CD4: 12h. D2, 4 nokta f'': h². 5 nokta f'': 12h². f''': 2h³.<\/li>\n<li>Seçim: sınırda FD2 ya da BD2. İç noktada CD2. Çok hassas ve gürültüsüz veride CD4. 2. türevde D2.<\/li>\n<li>CD4 gürültülü veride kötü. 8 ve −8 katsayıları yuvarlama hatasını büyütür.<\/li>\n<li>x³ gibi kübik fonksiyonlarda CD4 tam sonuç verir.<\/li>\n<\/ul>\n<h4>Hata terimi: gerçek − yaklaşık<\/h4>\n<div class=\"tw\">\n<table>\n<tr><th>Formül<\/th><th>Gerçek − yaklaşık<\/th><\/tr>\n<tr><td>FD1<\/td><td>\\(-\\frac h2f''(\\xi)\\)<\/td><\/tr>\n<tr><td>BD1<\/td><td>\\(+\\frac h2f''(\\xi)\\)<\/td><\/tr>\n<tr><td>CD2<\/td><td>\\(-\\frac{h^2}{6}f'''(\\xi)\\)<\/td><\/tr>\n<tr><td>FD2, BD2<\/td><td>\\(+\\frac{h^2}{3}f'''(\\xi)\\) (standart)<\/td><\/tr>\n<tr><td>CD4<\/td><td>\\(+\\frac{h^4}{30}f^{(5)}(\\xi)\\) (standart)<\/td><\/tr>\n<tr><td>D2<\/td><td>\\(-\\frac{h^2}{12}f^{(4)}(\\xi)\\) (standart)<\/td><\/tr>\n<tr><td>4 nokta f'' ileri, geri<\/td><td>\\(+\\frac{11}{12}h^2f^{(4)}(\\xi)\\) (standart)<\/td><\/tr>\n<tr><td>5 nokta f''<\/td><td>\\(+\\frac{h^4}{90}f^{(6)}(\\xi)\\) (standart)<\/td><\/tr>\n<tr><td>f''' (4 nokta merkezi)<\/td><td>\\(-\\frac{h^2}{4}f^{(5)}(\\xi)\\) (standart)<\/td><\/tr>\n<\/table>\n<\/div>\n<p class=\"sn\">Slayt yalnız mertebeyi ve FD1, BD1, CD2 katsayılarını veriyor. Diğer katsayılar Taylor açılımından standart, sayısal olarak doğrulandı.<\/p>\n<div class=\"slhata\"><b>Slayt hatası:<\/b> W234 s41 \"CD2 h = 0.1 için 100 kat daha hassas\" diyor. Doğrusu 10 kat. O(h) = 0.1 ve O(h²) = 0.01, oran 10.<\/div>\n<div class=\"slhata\"><b>Slayt hatası:<\/b> W234 s42 FD2 ve BD2 türetmesinde \"− 4h²f″\" yazıyor. Doğrusu \"− 2h²f″\". f(x+2h) açılımında f″ terimi (2h)²/2 = 2h². 4·(h²/2) = 2h² ile iptal olur.<\/div>\n<div class=\"slhata\"><b>Slayt hatası:<\/b> W234 s41 \"h² terimleri aynı işarette, toplanır, iptal olur\" diyor. İki açılım çıkarıldığı için iptal olur.<\/div>\n<h4>Kesme ve yuvarlama, en iyi h<\/h4>\n<ul>\n<li>Toplam hata \\(\\approx C_1h+\\frac{\\varepsilon_m}{h}\\). Kesme h küçülünce azalır, yuvarlama artar.<\/li>\n<li>FD1 için \\(h_{opt}=\\sqrt{\\varepsilon_m/C_1}\\), \\(C_1\\approx|f''|/2\\). Hızlı kural \\(h_{opt}\\approx\\sqrt{\\varepsilon_m}\\approx10^{-8}\\) (\\(\\varepsilon_m\\approx2.2\\times10^{-16}\\)).<\/li>\n<li>CD2 için \\(h_{opt}\\approx\\varepsilon_m^{1/3}\\approx6\\times10^{-6}\\).<\/li>\n<\/ul>\n<div class=\"slhata\"><b>Slayt hatası:<\/b> W234 s45 \"ε ≈ 10⁻⁸ ve √ε ≈ 10⁻⁴\" yazıyor. s47 ve s51 \\(\\varepsilon_m\\approx2.2\\times10^{-16}\\) alıp \\(h_{opt}=\\sqrt{\\varepsilon_m}\\approx10^{-8}\\) veriyor. İkincisini kullan.<\/div>\n<h3>Newton-Cotes<\/h3>\n<ul>\n<li>\\(h=(b-a)/n\\), \\(x_i=a+ih\\). Eşit aralık şart. Eşit değilse Lagrange.<\/li>\n<li>Genel biçim: \\(I\\approx\\sum w_if_i\\), \\(w_i=\\int L_i\\,dx\\). Tek panelde \\((b-a)\\sum c_if_i\\): trapez \\(c=\\frac12,\\frac12\\). Simpson 1/3 \\(c=\\frac16,\\frac46,\\frac16\\). Simpson 3/8 \\(c=\\frac18,\\frac38,\\frac38,\\frac18\\).<\/li>\n<li>Trapez 1. dereceye kadar tam. Simpson 1/3 ve 3/8, 3. dereceye kadar tam.<\/li>\n<\/ul>\n<h4>Tek panel<\/h4>\n<ul>\n<li>Trapez, \\(h=b-a\\): \\(I=\\frac h2(f_0+f_1)\\). Hata \\(-\\frac{h^3}{12}f''(\\xi)\\), yani \\(-\\frac{(b-a)^3}{12}f''\\). O(h³).<\/li>\n<li>Simpson 1/3, \\(h=\\frac{b-a}{2}\\): \\(I=\\frac h3(f_0+4f_1+f_2)\\). Hata \\(-\\frac{h^5}{90}f^{(4)}(\\xi)=-\\frac{(b-a)^5}{2880}f^{(4)}\\). O(h⁵).<\/li>\n<li>Simpson 3/8, \\(h=\\frac{b-a}{3}\\): \\(I=\\frac{3h}{8}(f_0+3f_1+3f_2+f_3)\\). Hata \\(-\\frac{3h^5}{80}f^{(4)}(\\xi)\\). O(h⁵).<\/li>\n<\/ul>\n<h4>Bileşik<\/h4>\n<p>Bileşik trapez, katsayılar 1, 2, 2, …, 2, 1:<\/p>\n\\[I\\approx\\frac h2\\bigl[f_0+2f_1+\\cdots+2f_{n-1}+f_n\\bigr]\\]\n<p>Bileşik Simpson 1/3, n çift, katsayılar 1, 4, 2, 4, …, 2, 4, 1:<\/p>\n\\[I\\approx\\frac h3\\bigl[f_0+4f_1+2f_2+\\cdots+4f_{n-1}+f_n\\bigr]\\]\n<p>Bileşik Simpson 3/8, n = 3k, katsayılar 1, 3, 3, 2, 3, 3, 2, …, 3, 3, 1:<\/p>\n\\[I\\approx\\frac{3h}{8}\\bigl[f_0+3f_1+3f_2+2f_3+\\cdots+3f_{n-1}+f_n\\bigr]\\]\n<ul>\n<li>Trapez: \\(E=-\\frac{(b-a)h^2}{12}f''(\\bar\\xi)\\). O(h²).<\/li>\n<li>Simpson 1/3: \\(E=-\\frac{(b-a)h^4}{180}f^{(4)}(\\bar\\xi)\\). O(h⁴).<\/li>\n<li>Simpson 3/8: \\(E=-\\frac{(b-a)h^4}{80}f^{(4)}(\\bar\\xi)\\). O(h⁴).<\/li>\n<li>Hata sınırı için f″ ya da f⁽⁴⁾'ün aralıktaki en büyük değerini al (eˣ için sağ uç).<\/li>\n<\/ul>\n<div class=\"slhata\"><b>Slayt hatası:<\/b> W5 s11 Simpson 3/8 bileşik hatasına \"(× n/3)\" ekliyor. Formül zaten bileşik. n/3 panel × \\(\\frac{3h^5}{80}\\) = \\(\\frac{(b-a)h^4}{80}\\). Ek çarpan koyarsan hata 2 kat fazla çıkar (eˣ, n = 6: gerçek 1.65×10⁻⁵, \"×n/3\" ile 3.18×10⁻⁵).<\/div>\n<h4>h yarıya inince, n seçimi<\/h4>\n<ul>\n<li>h yarıya inerse (n iki katına çıkar) trapez hatası 4'e, Simpson hatası 16'ya bölünür. h dörtte birine inerse 16 ve 256.<\/li>\n<li>Hata sınırı verilmişse n'i formülden bul. Trapez: \\(n\\ge\\sqrt{\\frac{(b-a)^3M_2}{12\\,\\text{tol}}}\\). Simpson 1/3: \\(n\\ge\\Bigl(\\frac{(b-a)^5M_4}{180\\,\\text{tol}}\\Bigr)^{1/4}\\), n çift olmalı.<\/li>\n<li>Mertebe gerçek hata değil, küçülme hızı. O(h⁴) hatanın tam h⁴ olduğu anlamına gelmez.<\/li>\n<li>n = 4 Simpson, n = 100 trapezden iyi olabilir.<\/li>\n<\/ul>\n<div class=\"slhata\"><b>Slayt hatası:<\/b> W5 s11 eˣ tablosunda Simpson için 1.71882 ile 0.00054 ve 1.71829 ile 0.000013 yazıyor, oran 41. Doğrusu 1.71886 ile 0.00058 ve 1.71832 ile 0.000037, oran yaklaşık 16 (15.65).<\/div>\n<h4>Karma kullanım: n tek<\/h4>\n<ul>\n<li>n çift: bileşik Simpson 1/3. n = 3k: bileşik Simpson 3/8. n = 1: tek trapez.<\/li>\n<li>n tek (n ≥ 3): 3 aralık Simpson 3/8, kalan (n − 3) aralık Simpson 1/3. Ortak düğüm iki formülde de yazılır.<\/li>\n<li>Föy n = 5 için sırayı veriyor: ilk iki aralık 1/3, son üç aralık 3/8.<\/li>\n<\/ul>\n\\[I\\approx\\frac h3\\bigl[f_0+4f_1+f_2\\bigr]+\\frac{3h}{8}\\bigl[f_2+3f_3+3f_4+f_5\\bigr]\\]\n<div class=\"slhata\"><b>Slayt hatası:<\/b> W5 s9 \"n = 10 ise 1 adet 3/8 + 3 adet 1/3\" diyor. Bu 3 + 6 = 9 aralık. n = 10 çift, Simpson 1/3 doğrudan uygulanır. W5 s10 n = 5 için hem \"son panel 3/8\" hem \"ilk panel 3/8\" diyor. Soruda hangi sıra yazılıysa onu uygula (<a href=\"#\" data-go=\"q:c6\">C6<\/a>).<\/div>\n<div class=\"vurgu\">Formülü uygulamadan önce her zaman üç şeyi kontrol et: h, katsayı dizisi, dış çarpan. <span class=\"kaynak\">W5 s14<\/span><\/div>\n<p>Tüm slayt hataları: <a href=\"#\" data-go=\"n:slhata\">slayt hataları<\/a>. Çözümlü örnekler: <a href=\"#\" data-go=\"q:a1\">A1<\/a> ile <a href=\"#\" data-go=\"q:c6\">C6<\/a>.<\/p>"},"a1":{"y":"q","id":"a1","t":"A1 · İleri fark türevi (FD1) ve mutlak hata","g":5,"sub":"Föy A seti","h":"<\!-- k: k24,k04 -->\n<p>\\(f(x)=e^x\\) fonksiyonunun \\(x_0=0\\) noktasındaki birinci türevini, \\(h=0.1\\) adım büyüklüğü için ileri fark yöntemi kullanarak yaklaşık olarak hesaplayınız. Elde ettiğiniz sayısal sonucu analitik türev değeriyle karşılaştırarak mutlak hatayı belirleyiniz.<\/p>\n\\[f'(x_0)\\approx\\frac{f(x_0+h)-f(x_0)}{h}\\]","s":"<p><b>Verilenler:<\/b> \\(f(x)=e^x\\), \\(x_0=0\\), \\(h=0.1\\).<\/p>\n<p><b>Formül:<\/b> FD1, 2 nokta ileri fark, hata O(h). Mutlak hata \\(E=|\\text{gerçek}-\\text{yaklaşık}|\\).<\/p>\n<p><b>Hesap:<\/b> \\(f(x_0)=e^0=1\\) ve \\(f(x_0+h)=e^{0.1}=1.1051709\\).<\/p>\n\\[f'(0)\\approx\\frac{1.1051709-1}{0.1}=1.051709\\]\n<p>Analitik türev \\(f'(x)=e^x\\), yani \\(f'(0)=1\\).<\/p>\n\\[E=|1-1.051709|=0.051709\\]\n<p>Bağıl hata: \\(\\varepsilon=E/|\\text{gerçek}|\\times100=\\%5.17\\).<\/p>\n<p><b>Sonuç:<\/b> \\(f'(0)\\approx1.0517\\), mutlak hata \\(E\\approx0.0517\\) (%5.17).<\/p>\n<p><b>Karşılaştırma:<\/b> Beklenen kesme hatası \\(\\frac h2f''(\\xi)=0.05\\,e^{\\xi}\\), \\(\\xi\\in[0,0.1]\\). Bu 0.0500 ile 0.0553 arası. Bulunan 0.0517 bu aralıkta. İleri fark gerçek değerin üstünde çıktı, çünkü \\(f''\\gt0\\).<\/p>\n<div class=\"ipucu\"><b>Sık hata:<\/b> h'ye bölmeyi unutmak. Hatayı işaretli yazmak, oysa mutlak değer istenir. Yuvarlamayı kesmeyle karıştırmak: 1.051709 değeri 4 ondalıkta 1.0517, 5 ondalıkta 1.05171 olur. Kâğıtta \"1.05170\" yazılmış, bu kesme.<\/div>","ks":["k24","k04"],"v":["q54_HhbMr4I","xaQZQFTsGc4","cLHKU_yFOIw","LzgzhxQcVZ4"],"vk":["k24","k19","k19","k19"]},"a2":{"y":"q","id":"a2","t":"A2 · Geri fark türevi (BD1), sin x tablosu","g":5,"sub":"Föy A seti","h":"<\!-- k: k24,k04 -->\n<p>Aşağıdaki tabloyu kullanarak \\(x=1.4\\) noktasındaki birinci türevi, \\(h=0.2\\) adım büyüklüğü için geri fark yöntemi ile yaklaşık olarak hesaplayınız. Elde ettiğiniz sonucu analitik türev değeriyle karşılaştırınız.<\/p>\n<table><tr><th>x<\/th><td>1.0<\/td><td>1.2<\/td><td>1.4<\/td><\/tr><tr><th>f(x)<\/th><td>0.84147<\/td><td>0.93204<\/td><td>0.98545<\/td><\/tr><\/table>\n\\[f'(x_n)\\approx\\frac{f(x_n)-f(x_{n-1})}{h}\\]","s":"<p><b>Verilenler:<\/b> \\(h=0.2\\), \\(x_n=1.4\\), \\(f(1.4)=0.98545\\), \\(f(1.2)=0.93204\\). Tablo \\(\\sin x\\) değerleri. \\(x=1.4\\) son nokta, sağında veri yok. Bu yüzden geri fark.<\/p>\n<p><b>Formül:<\/b> BD1, 2 nokta geri fark, hata O(h).<\/p>\n<p><b>Hesap:<\/b><\/p>\n\\[f'(1.4)\\approx\\frac{0.98545-0.93204}{0.2}=\\frac{0.05341}{0.2}=0.26705\\]\n<p>Analitik türev \\((\\sin x)'=\\cos x\\). RAD modunda \\(\\cos1.4=0.169967\\).<\/p>\n\\[E=|0.169967-0.26705|=0.097083\\]\n<p>Bağıl hata: \\(0.097083/0.169967\\times100=\\%57.12\\).<\/p>\n<p><b>Sonuç:<\/b> \\(f'(1.4)\\approx0.26705\\), gerçek 0.16997, mutlak hata 0.09708.<\/p>\n<p><b>Karşılaştırma:<\/b> Hata büyük (%57). Geri farkın hatası O(h) ve h = 0.2 büyük. Kesme tahmini \\(\\frac h2|f''(\\xi)|=0.1\\sin\\xi\\), \\(\\xi\\in[1.2,1.4]\\). Bu 0.093 ile 0.099 arası. Bulunan 0.097 bu aralıkta.<\/p>\n<div class=\"ipucu\"><b>Sık hata:<\/b> Makine DEG modundayken \\(\\cos1.4=0.999701\\) çıkar, yanlış. RAD şart. 1.4 rad = 80.214° ama derece çevirmeye gerek yok. İleri fark kullanmak da yanlış, çünkü \\(x=1.4\\) son nokta.<\/div>","ks":["k24","k04"],"v":["q54_HhbMr4I","xaQZQFTsGc4","cLHKU_yFOIw","LzgzhxQcVZ4"],"vk":["k24","k19","k19","k19"]},"a3":{"y":"q","id":"a3","t":"A3 · Merkezi fark (CD2), ileri ve geri farkla karşılaştırma","g":5,"sub":"Föy A seti","h":"<\!-- k: k25,k24 -->\n<p>Aynı sin(x) tablosunu kullanarak merkezi fark (CD2) formülüyle \\(x=1.2\\) noktasında \\(f'(1.2)\\) değerini hesaplayın ve ileri/geri farkla hatalarını karşılaştırın.<\/p>\n<table><tr><th>x<\/th><td>1.0<\/td><td>1.2<\/td><td>1.4<\/td><\/tr><tr><th>f(x)<\/th><td>0.84147<\/td><td>0.93204<\/td><td>0.98545<\/td><\/tr><\/table>\n\\[f'(x_0)\\approx\\frac{f(x_0+h)-f(x_0-h)}{2h}\\]\n<p class=\"sn\">Okunamayan yer: kâğıttaki geri fark satırının sayısı 0.45285 ya da 0.65285 okunuyor. Tabloyla doğrusu 0.45285.<\/p>","s":"<p><b>Verilenler:<\/b> \\(h=0.2\\), \\(x_0=1.2\\). CD2'de \\(f(1.0)=0.84147\\) ve \\(f(1.4)=0.98545\\) kullanılır. \\(f(1.2)\\) girmez.
