Gerçek türev \\(\\cos1.2=0.362358\\) (RAD).<\/p>\n<p><b>Formül:<\/b> CD2 O(h²). İleri (FD1) ve geri (BD1) fark O(h).<\/p>\n<p><b>Hesap:<\/b> Payda \\(2h=0.4\\).<\/p>\n<div class=\"tw\">\n<table>\n<tr><th>Yöntem<\/th><th>Hesap<\/th><th>f'(1.2)<\/th><th>Mutlak hata<\/th><th>Bağıl %<\/th><\/tr>\n<tr><td>CD2<\/td><td>(0.98545 − 0.84147)/0.4<\/td><td>0.35995<\/td><td>0.00241<\/td><td>0.66<\/td><\/tr>\n<tr><td>İleri<\/td><td>(0.98545 − 0.93204)/0.2<\/td><td>0.26705<\/td><td>0.09531<\/td><td>26.30<\/td><\/tr>\n<tr><td>Geri<\/td><td>(0.93204 − 0.84147)/0.2<\/td><td>0.45285<\/td><td>0.09049<\/td><td>24.97<\/td><\/tr>\n<\/table>\n<\/div>\n<p><b>Sonuç:<\/b> CD2 = 0.35995, hatası 0.00241. İleri farkın hatası 0.09531, geri farkın hatası 0.09049.<\/p>\n<p><b>Karşılaştırma:<\/b> CD2 hatası ileri farktan 40, geri farktan 38 kat küçük. Sebep: CD2 O(h²), ileri ve geri fark O(h). Kontrol: \\(\\frac{h^2}{6}|f'''(1.2)|=\\frac{0.04}{6}\\cos1.2=0.00242\\approx0.00241\\). İleri ve geri hata ters yönde. Ortalamaları \\(\\frac{0.26705+0.45285}{2}=0.35995\\), yani CD2.<\/p>\n<div class=\"ipucu\"><b>Sık hata:<\/b> Payda \\(2h=0.4\\), h değil. CD2'de \\(f(1.2)\\) kullanılmaz. Kâğıtta geri fark için \"|E| = 0.45285\" yazılmış. Bu türev değeri, hata değil. Doğru geri hata 0.09049.<\/div>","ks":["k25","k24"],"v":["EUodLr7SXMk","xaQZQFTsGc4","cLHKU_yFOIw","LzgzhxQcVZ4","S8H7kmFMULo"],"vk":["k25","k25","k25","k25","k04"]},"a4":{"y":"q","id":"a4","t":"A4 · Newton bölünmüş fark, P₂(x)","g":5,"sub":"Föy A seti","h":"<\!-- k: k12 -->\n<p>\\(f(x)=\\sqrt x\\) fonksiyonu için aşağıdaki üç veri noktası verilmiştir. Newton Bölünmüş Fark yöntemiyle ikinci derece interpolasyon polinomu \\(P_2(x)\\)'i oluşturunuz ve bu polinomu kullanarak \\(f(6.25)\\) değerini yaklaşık olarak hesaplayınız. Elde edilen sonucu gerçek değerle karşılaştırınız.<\/p>\n<table><tr><th>x<\/th><td>1<\/td><td>4<\/td><td>9<\/td><\/tr><tr><th>f(x) = √x<\/th><td>1.0000<\/td><td>2.0000<\/td><td>3.0000<\/td><\/tr><\/table>\n\\[\\begin{aligned}P_2(x)=f[x_0]&+f[x_0,x_1](x-x_0)\\\\&+f[x_0,x_1,x_2](x-x_0)(x-x_1)\\end{aligned}\\]","s":"<p><b>Verilenler:<\/b> \\(x_0=1\\), \\(x_1=4\\), \\(x_2=9\\) ve \\(f=1,2,3\\). Hedef \\(x=6.25\\).<\/p>\n<p><b>Formül:<\/b> \\(f[x_i,x_{i+1}]=\\frac{f(x_{i+1})-f(x_i)}{x_{i+1}-x_i}\\), \\(f[x_0,x_1,x_2]=\\frac{f[x_1,x_2]-f[x_0,x_1]}{x_2-x_0}\\).<\/p>\n<p><b>Bölünmüş fark tablosu:<\/b><\/p>\n<div class=\"tw\">\n<table>\n<tr><th>xᵢ<\/th><th>f[xᵢ]<\/th><th>1. bölünmüş fark<\/th><th>2. bölünmüş fark<\/th><\/tr>\n<tr><td>1<\/td><td>1<\/td><td>(2 − 1)/(4 − 1) = 1/3<\/td><td>(1/5 − 1/3)/(9 − 1) = −1/60<\/td><\/tr>\n<tr><td>4<\/td><td>2<\/td><td>(3 − 2)/(9 − 4) = 1/5<\/td><td><\/td><\/tr>\n<tr><td>9<\/td><td>3<\/td><td><\/td><td><\/td><\/tr>\n<\/table>\n<\/div>\n<p><b>Polinom:<\/b><\/p>\n\\[\\begin{aligned}P_2(x)&=1+\\tfrac13(x-1)-\\tfrac1{60}(x-1)(x-4)\\\\&=-\\frac{x^2}{60}+\\frac{5x}{12}+\\frac35\\end{aligned}\\]\n<p><b>Hesap:<\/b> \\(x-1=5.25\\) ve \\(x-4=2.25\\).<\/p>\n\\[\\begin{aligned}P_2(6.25)&=1+\\tfrac13(5.25)-\\tfrac1{60}(5.25)(2.25)\\\\&=1+1.750000-0.196875\\end{aligned}\\]\n<p><b>Sonuç:<\/b> \\(P_2(6.25)=2.553125\\). Gerçek \\(\\sqrt{6.25}=2.5\\). Mutlak hata \\(E=0.053125\\), bağıl hata %2.125 (yaklaşık %2.13).<\/p>\n<p><b>Karşılaştırma:<\/b> √x polinom değil ve düğümler seyrek (aralıklar 3 ve 5). Bu yüzden 2. derece polinom küçük bir sapma bırakıyor. İşaret hata formülüyle uyumlu: \\(f'''\\gt0\\) ve \\((5.25)(2.25)(-2.75)\\lt0\\). Yani gerçek − \\(P_2\\) negatif, \\(2.5-2.553125\\lt0\\).<\/p>\n<div class=\"ipucu\"><b>Sık hata:<\/b> İkinci farkın paydasına \\(x_2-x_1=5\\) yazmak. Doğrusu \\(x_2-x_0=8\\). Kesirlerle çalış (1/3, −1/60). Erken ondalığa yuvarlamak sonucu kaydırır.<\/div>","ks":["k12"],"v":["8sr57I1zJQA","6iXs3byXOzo","52uGSb-vvvQ","leWktEEbrT0","SJUDJ0wXNeY","Pk3NaWEFRsw"],"vk":["k12","k12","k12","k12","k12","k12"]},"a5":{"y":"q","id":"a5","t":"A5 · Lagrange P₂(x) ve hata üst sınırı","g":5,"sub":"Föy A seti","h":"<\!-- k: k13,k14 -->\n<p>\\(f(x)=e^x\\) fonksiyonu için \\(x_0=0\\), \\(x_1=0.5\\) ve \\(x_2=1.0\\) düğümleri verilmiştir. İkinci derece Lagrange interpolasyon polinomu \\(P_2(x)\\)'i kullanarak \\(f(0.3)\\) değerini yaklaşık olarak hesaplayınız. Elde edilen sonucu gerçek değerle karşılaştırınız ve Lagrange hata formülünü kullanarak interpolasyon hatasının üst sınırını belirleyiniz.<\/p>\n<table><tr><th>x<\/th><td>0<\/td><td>0.5<\/td><td>1.0<\/td><\/tr><tr><th>f(x) = eˣ<\/th><td>1.0000<\/td><td>1.6487<\/td><td>2.7183<\/td><\/tr><\/table>\n\\[P_2(x)=f(x_0)L_0(x)+f(x_1)L_1(x)+f(x_2)L_2(x)\\]","s":"<p><b>Verilenler:<\/b> üç düğüm, \\(n=2\\), \\(x=0.3\\).<\/p>\n<p><b>Formül:<\/b> \\(L_0=\\frac{(x-x_1)(x-x_2)}{(x_0-x_1)(x_0-x_2)}\\), \\(L_1=\\frac{(x-x_0)(x-x_2)}{(x_1-x_0)(x_1-x_2)}\\), \\(L_2=\\frac{(x-x_0)(x-x_1)}{(x_2-x_0)(x_2-x_1)}\\).<\/p>\n\\[\\begin{aligned}L_0(0.3)&=\\frac{(0.3-0.5)(0.3-1)}{(0-0.5)(0-1)}=\\frac{0.14}{0.5}=0.28\\\\L_1(0.3)&=\\frac{(0.3)(0.3-1)}{(0.5)(0.5-1)}=\\frac{-0.21}{-0.25}=0.84\\\\L_2(0.3)&=\\frac{(0.3)(0.3-0.5)}{(1)(0.5)}=-0.12\\end{aligned}\\]\n<p>Kontrol: \\(0.28+0.84-0.12=1\\).<\/p>\n\\[P_2(0.3)=1(0.28)+1.6487(0.84)+2.7183(-0.12)\\]\n\\[=0.28+1.384908-0.326196=1.338712\\]\n<p>Gerçek \\(e^{0.3}=1.349859\\). Mutlak hata \\(E=0.011147\\), bağıl hata %0.83.<\/p>\n<p><b>Hata üst sınırı:<\/b> Hata formülü \\(E_2(x)=\\frac{f'''(c)}{3!}(x-x_0)(x-x_1)(x-x_2)\\), \\(c\\in[0,1]\\). n = 2 olduğu için 3. türev ve 3! kullanılır. \\(f'''(x)=e^x\\) ve \\(e^x\\) artan. \\([0,1]\\) aralığında en büyük değer sağ uçta: \\(\\max|f'''|=e^1\\).<\/p>\n\\[|E|\\le\\frac{e}{3!}\\,\\bigl|(0.3)(0.3-0.5)(0.3-1)\\bigr|\\]\n\\[=\\frac{2.718282}{6}\\,(0.042)=0.019028\\]\n<p><b>Sonuç:<\/b> \\(P_2(0.3)=1.3387\\), gerçek hata 0.011147, hata üst sınırı 0.019028.<\/p>\n<p><b>Karşılaştırma:<\/b> Gerçek hata sınırın altında: \\(0.011147\\lt0.019028\\). Sınır tutarlı. Alt sınır \\(\\frac{e^0}{6}(0.042)=0.007\\). Gerçek hata 0.007 ile 0.019028 arasında.<\/p>\n<div class=\"ipucu\"><b>Sık hata:<\/b> Sınırda \\(\\max f'''\\) için \\(e^{0.3}\\) değil \\(e^1\\) almak gerekir. \\(3!\\) yerine \\(2!\\) yazmak yanlış sınır verir (0.0571). Çarpımın mutlak değerini al. Kâğıtta hata üst sınırı hiç yazılmamış, oysa soru bunu istiyor.<\/div>","ks":["k13","k14"],"v":["rR9mzBWXVfI","Opb0jIvb10s","--gE0BwuciQ","p4ZR3oVrcl8","kCrEG6LgFsU","07xMWQj50Os","gVlg06B9Fgo"],"vk":["k13","k13","k13","k13","k13","k13","k13"]},"a6":{"y":"q","id":"a6","t":"A6 · Newton geri fark interpolasyonu (NGFİF)","g":5,"sub":"Föy A seti","h":"<\!-- k: k21 -->\n<p>Aşağıdaki eşit aralıklı veri tablosunu kullanarak Newton Geri Fark İnterpolasyon Formülü (NGFİF) ile \\(x=4.5\\) noktasındaki \\(f(4.5)\\) değerini hesaplayınız.<\/p>\n<table><tr><th>x<\/th><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><\/tr><tr><th>f(x)<\/th><td>0.6931<\/td><td>1.0986<\/td><td>1.3863<\/td><td>1.6094<\/td><\/tr><\/table>\n\\[\\begin{aligned}P(x)=f_n&+s\\nabla f_n+\\frac{s(s+1)}{2!}\\nabla^2f_n\\\\&+\\frac{s(s+1)(s+2)}{3!}\\nabla^3f_n\\end{aligned}\\qquad s=\\frac{x-x_n}{h}\\]","s":"<p><b>Verilenler:<\/b> \\(h=1\\), \\(x_n=5\\), \\(x=4.5\\). Katsayılar tablonun alt satırından okunur.<\/p>\n<p><b>Geri fark tablosu:<\/b><\/p>\n<table>\n<tr><th>x<\/th><th>f<\/th><th>∇f<\/th><th>∇²f<\/th><th>∇³f<\/th><\/tr>\n<tr><td>2<\/td><td>0.6931<\/td><td><\/td><td><\/td><td><\/td><\/tr>\n<tr><td>3<\/td><td>1.0986<\/td><td>0.4055<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>4<\/td><td>1.3863<\/td><td>0.2877<\/td><td>−0.1178<\/td><td><\/td><\/tr>\n<tr><td>5<\/td><td>1.6094<\/td><td>0.2231<\/td><td>−0.0646<\/td><td>0.0532<\/td><\/tr>\n<\/table>\n<p><b>Hesap:<\/b> \\(s=\\frac{4.5-5}{1}=-0.5\\). Katsayılar \\(\\frac{s(s+1)}{2!}=-0.125\\) ve \\(\\frac{s(s+1)(s+2)}{3!}=-0.0625\\).<\/p>\n\\[\\begin{aligned}P(4.5)&=1.6094+(-0.5)(0.2231)\\\\&\\quad+(-0.125)(-0.0646)+(-0.0625)(0.0532)\\\\&=1.6094-0.11155+0.008075-0.003325\\end{aligned}\\]\n<p><b>Sonuç:<\/b> \\(f(4.5)\\approx1.5026\\).<\/p>\n<p><b>Karşılaştırma:<\/b> Veri \\(\\ln x\\)'e ait. \\(\\ln4.5=1.504077\\), mutlak hata 0.001477. Soru karşılaştırma istemiyor, ek bilgi.<\/p>\n<p class=\"sn\">|s| = 0.5, yani Stirling bölgesinde (0.25 &lt; |s| &lt; 0.75). Soru NGFİF istediği için NGFİF doğru. Yöntem serbest olsaydı bu gerekçe sorulabilirdi.<\/p>\n<div class=\"ipucu\"><b>Sık hata:<\/b> s negatif (−0.5), işaret hatası en sık hata. NGFİF katsayıları tablonun en alt satırından okunur. ∇² terimi (−)(−) olduğu için artı. Kâğıtta sonuç \"1.5626\" yazılmış, doğrusu 1.5026. Tablodaki f₂ \"0.69931\" yazılmış, doğrusu 0.6931.<\/div>","ks":["k21"],"v":["MFuKaLiuHso","uiHY_stGtdI","_cnZGBgmZ5I","38WRO_uuoGQ"],"vk":["k21","k21","k21","k21"]},"b7":{"y":"q","id":"b7","t":"B7 · İzotermal iş: Lagrange P₁, bileşik trapez, PV = C","g":5,"sub":"Föy B seti","h":"<\!-- k: k11,k13,k32 -->\n<p>Bir izotermal sıkıştırma/genleşme deneyi sonucunda aşağıdaki basınç-hacim verileri elde edilmiştir:<\/p>\n<table><tr><th>V (m³)<\/th><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><\/tr><tr><th>P (kPa)<\/th><td>100<\/td><td>50<\/td><td>33.3<\/td><td>25<\/td><\/tr><\/table>\n<p>a) Birinci derece Lagrange, doğrusal interpolasyon kullanarak \\(V=1.5\\ \\text{m}^3\\) için basıncı hesaplayınız.<br>\nb) \\(V=1\\ \\text{m}^3\\) ile \\(V=4\\ \\text{m}^3\\) arasında yapılan işi \\(W=\\int_{V_1}^{V_4}P\\,dV\\) ifadesinden, \\(n=3\\) alt aralıklı bileşik trapez yöntemiyle hesaplayınız.<br>\nc) Verilerin yaklaşık olarak \\(PV=C\\) bağıntısını sağlayıp sağlamadığını kontrol ediniz. İzotermal ideal gaz kabulü altında analitik iş değerini hesaplayarak bileşik trapez sonucu ile karşılaştırınız.<\/p>\n\\[h=\\frac{b-a}{n},\\qquad W\\approx\\frac h2\\bigl[P_0+2P_1+2P_2+P_3\\bigr]\\]\n<p class=\"sn\">Okunamayan yer: soru metni soluk taranmış, büyüterek okundu. Boş tablonun ikinci sütun başlığı \"İş (W)\" diye tahmin edildi.<\/p>","s":"<p><b>a)<\/b> \\(V=1.5\\), 1 ile 2 arasında. Formül \\(P_1(V)=P_0\\frac{V-V_1}{V_0-V_1}+P_1\\frac{V-V_0}{V_1-V_0}\\).<\/p>\n\\[\\begin{aligned}P(1.5)&=100\\cdot\\frac{1.5-2}{1-2}+50\\cdot\\frac{1.5-1}{2-1}\\\\&=50+25=75\\ \\text{kPa}\\end{aligned}\\]\n<p>Hata payı: \\(PV=C\\) ile gerçek \\(P(1.5)=100/1.5=66.67\\) kPa. Doğrusal interpolasyon 8.33 kPa fazla verdi.<\/p>\n<p><b>b)<\/b> \\(n=3\\) alt aralık, 4 nokta. \\(h=\\frac{4-1}{3}=1\\).<\/p>\n\\[W\\approx\\frac12\\bigl[100+2(50)+2(33.3)+25\\bigr]=\\frac12(291.6)\\]\n<p>\\(W_T=145.8\\) kJ. Birim: kPa·m³ = kJ.<\/p>\n<p><b>c)<\/b> PV çarpımları:<\/p>\n<table><tr><th>V<\/th><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><\/tr><tr><th>PV<\/th><td>100<\/td><td>100<\/td><td>99.9<\/td><td>100<\/td><\/tr><\/table>\n<p>En büyük sapma 0.1 (%0.1). \\(PV\\approx C=100\\) kPa·m³ sağlanıyor (99.9, 33.3 değerinin yuvarlanmasından). Analitik iş:<\/p>\n\\[W=\\int_1^4\\frac{100}{V}\\,dV=100\\ln4=138.63\\ \\text{kJ}\\]\n<table><tr><th>Yöntem<\/th><th>İş (W)<\/th><\/tr>\n<tr><td>Bileşik trapez<\/td><td>145.8 kJ<\/td><\/tr>\n<tr><td>Analitik değer<\/td><td>138.63 kJ<\/td><\/tr>\n<tr><td>Fark<\/td><td>7.17 kJ (%5.17)<\/td><\/tr><\/table>\n<p><b>Sonuç:<\/b> \\(P(1.5)=75\\) kPa. \\(W_T=145.8\\) kJ. Analitik \\(W=138.63\\) kJ. Fark 7.17 kJ.<\/p>\n<p><b>Karşılaştırma:<\/b> Trapez fazla veriyor. \\(P=100/V\\) dışbükey (\\(P''\\gt0\\)), trapez dışbükey eğride hep fazla tahmin eder. n büyürse fark azalır.<\/p>\n<div class=\"ipucu\"><b>Sık hata:<\/b> n = 3 alt aralık 4 nokta demek. h = (4 − 1)/3 = 1, 3 değil. Birim kPa·m³ = kJ. Analitik integralde \\(\\ln4-\\ln1=\\ln4\\). Kâğıtta fark satırı \"145.8 − 138.63\" diye bırakılmış, doğrusu 7.17 kJ.<\/div>","ks":["k11","k13","k32"],"v":["HYPGWUjzx6E","cQg8_TAfjns","wTA42kdj4mg","rR9mzBWXVfI","YUgAWPFMYrM","TRo91HxWbqU","kfpdR3CLHTI","FhKnxSdSUko"],"vk":["k11","k11","k11","k13","k32","k32","k32","k30"]},"b8":{"y":"q","id":"b8","t":"B8 · İleri fark tablosu, NİFİF ve NİFİF'ten türev","g":5,"sub":"Föy B seti","h":"<\!-- k: k18,k20 -->\n<p>Aşağıdaki eşit aralıklı veri tablosu verilmiştir: \\(h=0.5\\). Verilerin yaklaşık olarak \\(f(x)=e^x\\) fonksiyonuna ait olduğu bilinmektedir.<\/p>\n<table><tr><th>x<\/th><td>0.0<\/td><td>0.5<\/td><td>1.0<\/td><td>1.5<\/td><td>2.0<\/td><\/tr><tr><th>f(x)<\/th><td>1.000<\/td><td>1.649<\/td><td>2.718<\/td><td>4.482<\/td><td>7.389<\/td><\/tr><\/table>\n<p>a) Tüm ileri fark tablosunu oluşturunuz (\\(\\Delta f_i=f_{i+1}-f_i\\), \\(\\Delta^2f_i=\\Delta f_{i+1}-\\Delta f_i\\), \\(\\Delta^3f_i=\\Delta^2f_{i+1}-\\Delta^2f_i\\), \\(\\Delta^4f_i=\\Delta^3f_{i+1}-\\Delta^3f_i\\)).<br>\nb) Newton İleri Fark İnterpolasyon Formülü (NİFİF) kullanarak \\(x=0.75\\) için \\(f(0.75)\\) değerini tahmin ediniz.<br>\nc) NİFİF'ten elde edilen türev bağıntısındaki ilk iki fark terimini kullanarak \\(x=0\\) noktasındaki \\(f'(0)\\) değerini tahmin ediniz.<\/p>\n\\[\\begin{aligned}P(x)=f_0&+s\\Delta f_0+\\frac{s(s-1)}{2!}\\Delta^2f_0\\\\&+\\frac{s(s-1)(s-2)}{3!}\\Delta^3f_0\\\\&+\\frac{s(s-1)(s-2)(s-3)}{4!}\\Delta^4f_0\\end{aligned}\\qquad s=\\frac{x-x_0}{h}\\]\n\\[\\begin{aligned}f'(x_0)\\approx\\frac1h\\Bigl[&\\Delta f_0-\\frac{\\Delta^2f_0}{2}\\\\&+\\frac{\\Delta^3f_0}{3}-\\frac{\\Delta^4f_0}{4}+\\cdots\\Bigr]\\end{aligned}\\]","s":"<p><b>Verilenler:<\/b> \\(x_0=0\\), \\(h=0.5\\). NİFİF katsayıları tablonun üst satırından okunur.<\/p>\n<p><b>a) İleri fark tablosu<\/b><\/p>\n<div class=\"tw\">\n<table>\n<tr><th>x<\/th><th>f<\/th><th>Δf<\/th><th>Δ²f<\/th><th>Δ³f<\/th><th>Δ⁴f<\/th><\/tr>\n<tr><td>0.0<\/td><td>1.000<\/td><td>0.649<\/td><td>0.420<\/td><td>0.275<\/td><td>0.173<\/td><\/tr>\n<tr><td>0.5<\/td><td>1.649<\/td><td>1.069<\/td><td>0.695<\/td><td>0.448<\/td><td><\/td><\/tr>\n<tr><td>1.0<\/td><td>2.718<\/td><td>1.764<\/td><td>1.143<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>1.5<\/td><td>4.482<\/td><td>2.907<\/td><td><\/td><td><\/td><td><\/td><\/tr>\n<tr><td>2.0<\/td><td>7.389<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n<\/table>\n<\/div>\n<p class=\"sn\">Okunamayan yer: kâğıtta 1.5 satırının Δf değeri \"2.90?\" diye okunuyor. Doğrusu 7.389 − 4.482 = 2.907.<\/p>\n<p><b>b)<\/b> \\(s=\\frac{0.75-0}{0.5}=1.5\\).<\/p>\n<div class=\"tw\">\n<table>\n<tr><th>k<\/th><th>Katsayı<\/th><th>Δᵏf₀<\/th><th>Terim<\/th><\/tr>\n<tr><td>0<\/td><td>1<\/td><td>1.000<\/td><td>1.000000<\/td><\/tr>\n<tr><td>1<\/td><td>s = 1.5<\/td><td>0.649<\/td><td>0.973500<\/td><\/tr>\n<tr><td>2<\/td><td>1.5(0.5)/2 = 0.375<\/td><td>0.420<\/td><td>0.157500<\/td><\/tr>\n<tr><td>3<\/td><td>1.5(0.5)(−0.5)/6 = −0.0625<\/td><td>0.275<\/td><td>−0.017188<\/td><\/tr>\n<tr><td>4<\/td><td>1.5(0.5)(−0.5)(−1.5)/24 = 0.023438<\/td><td>0.173<\/td><td>0.004055<\/td><\/tr>\n<\/table>\n<\/div>\n\\[\\begin{aligned}f(0.75)&\\approx1+0.9735+0.1575\\\\&\\quad-0.017188+0.004055=2.117867\\end{aligned}\\]\n<p>Gerçek \\(e^{0.75}=2.117000\\). Mutlak hata 0.000867 (%0.041).<\/p>\n<p><b>c)<\/b> İlk iki terim, \\(h=0.5\\):<\/p>\n\\[f'(0)\\approx\\frac{1}{0.5}\\Bigl[0.649-\\frac{0.420}{2}\\Bigr]=2(0.439)=0.878\\]\n<p>Gerçek \\(f'(0)=e^0=1\\). Mutlak hata 0.122 (%12.2).<\/p>\n<p><b>Sonuç:<\/b> \\(f(0.75)\\approx2.1179\\), hata 0.0009. \\(f'(0)\\approx0.878\\), hata 0.122.<\/p>\n<p><b>Karşılaştırma:<\/b> İnterpolasyon çok iyi (%0.04), çünkü terimler hızla küçülüyor. Türevde iki terim yetmedi. Terim sayısıyla sonuç şöyle değişiyor: 2 terim 0.878, 3 terim 1.0613, 4 terim 0.9748. h = 0.5 büyük olduğu için seri yavaş yakınsıyor.<\/p>\n<div class=\"ipucu\"><b>Sık hata:<\/b> c'de formül farklarla başlar: \\(\\Delta f_0=0.649\\), \\(f_0=1\\) değil. \\(1/h=2\\) çarpanını unutmak. b'de \\(s(s-1)(s-2)\\) terimi negatif. Kâğıtta c şıkkı \\(2[1-0.649/2]=1.351\\) yazılmış, yanlış. Doğrusu \\(2[0.649-0.420/2]=0.878\\).<\/div>","ks":["k18","k20"],"v":["jI_w88nIkqU","5Tc-YWj_8KU","HV5xo8klTPo","WIAMXcCThsk"],"vk":["k20","k18","k18","k18"]},"b9":{"y":"q","id":"b9","t":"B9 · Kiriş yükü: NİFİF, trapez, Simpson 1/3, q(x) = x² + 2x","g":5,"sub":"Föy B seti","h":"<\!-- k: k18,k20,k32,k34 -->\n<p>Bir kiriş boyunca yayılı yük dağılımı aşağıdaki gibi ölçülmüştür:<\/p>\n<table><tr><th>x (m)<\/th><td>0.0<\/td><td>1.0<\/td><td>2.0<\/td><td>3.0<\/td><td>4.0<\/td><\/tr><tr><th>q(x) (kN/m)<\/th><td>0.0<\/td><td>3.0<\/td><td>8.0<\/td><td>15.0<\/td><td>24.0<\/td><\/tr><\/table>\n<p>a) Newton İleri Fark İnterpolasyon Formülü (NİFİF) kullanarak \\(x=1.5\\) m noktasındaki \\(q(1.5)\\) değerini hesaplayınız (\\(h=1\\)).<br>\nb) Toplam yayılı yükü \\(W=\\int_0^4q(x)\\,dx\\) bileşik trapez yöntemi, \\(n=4\\) kullanarak hesaplayınız.<br>\nc) Aynı toplam yükü bileşik Simpson 1/3 yöntemi, \\(n=4\\) kullanarak hesaplayınız.<br>\nd) Verilerin \\(q(x)=x^2+2x\\) fonksiyonuna ait olduğunu gösteriniz. Bu fonksiyonu kullanarak \\(q(1.5)\\) ve toplam yükün gerçek değerlerini hesaplayınız.<br>\ne) \\(q(1.5)\\) için NİFİF ve gerçek değeri tabloda gösteriniz.<br>\nf) İnterpolasyon sonucunu gerçek \\(q(1.5)\\) değeriyle, trapez ve Simpson sonuçlarını ise gerçek toplam yükle karşılaştırınız.<\/p>\n\\[\\begin{aligned}P(x)=q_0&+s\\Delta q_0+\\frac{s(s-1)}{2!}\\Delta^2q_0\\\\&+\\frac{s(s-1)(s-2)}{3!}\\Delta^3q_0+\\cdots\\end{aligned}\\]\n\\[W_T=\\frac h2\\bigl[q_0+2q_1+2q_2+2q_3+q_4\\bigr]\\]\n\\[W_S=\\frac h3\\bigl[q_0+4q_1+2q_2+4q_3+q_4\\bigr]\\]","s":"<p><b>a) Fark tablosu<\/b><\/p>\n<table>\n<tr><th>x<\/th><th>q<\/th><th>Δq<\/th><th>Δ²q<\/th><th>Δ³q<\/th><\/tr>\n<tr><td>0<\/td><td>0<\/td><td>3<\/td><td>2<\/td><td>0<\/td><\/tr>\n<tr><td>1<\/td><td>3<\/td><td>5<\/td><td>2<\/td><td>0<\/td><\/tr>\n<tr><td>2<\/td><td>8<\/td><td>7<\/td><td>2<\/td><td><\/td><\/tr>\n<tr><td>3<\/td><td>15<\/td><td>9<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>4<\/td><td>24<\/td><td><\/td><td><\/td><td><\/td><\/tr>\n<\/table>\n<p>\\(s=\\frac{1.5-0}{1}=1.5\\). Katsayı \\(\\frac{s(s-1)}{2}=\\frac{1.5(0.5)}{2}=0.375\\).<\/p>\n\\[q(1.5)=0+1.5(3)+0.375(2)+0=4.5+0.75=5.25\\ \\text{kN/m}\\]\n<p><b>b)<\/b> \\(h=1\\).<\/p>\n\\[W_T=\\frac12\\bigl[0+2(3)+2(8)+2(15)+24\\bigr]=\\frac12(76)=38\\ \\text{kN}\\]\n<p><b>c)<\/b><\/p>\n\\[W_S=\\frac13\\bigl[0+4(3)+2(8)+4(15)+24\\bigr]=\\frac{112}{3}=37.3333\\ \\text{kN}\\]\n<p><b>d)<\/b> \\(q(x)=x^2+2x\\) değerleri, beş noktanın hepsinde:<\/p>\n<table>\n<tr><th>x<\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><\/tr>\n<tr><th>x² + 2x<\/th><td>0 + 0 = 0<\/td><td>1 + 2 = 3<\/td><td>4 + 4 = 8<\/td><td>9 + 6 = 15<\/td><td>16 + 8 = 24<\/td><\/tr>\n<tr><th>Tablo q<\/th><td>0<\/td><td>3<\/td><td>8<\/td><td>15<\/td><td>24<\/td><\/tr>\n<\/table>\n<p>Beş değer tabloyla birebir aynı. Ayrıca \\(\\Delta^2q=2\\) sabit ve \\(\\Delta^3q=0\\), yani veri 2. derece polinom. \\(\\Delta^2q=2!\\,a\\,h^2=2a\\) olduğundan \\(a=1\\).<\/p>\n\\[q(1.5)=2.25+3=5.25\\ \\text{kN/m}\\]\n\\[W=\\int_0^4(x^2+2x)\\,dx=\\frac{64}{3}+16=37.3333\\ \\text{kN}\\]\n<p><b>e) q(1.5) tablosu<\/b><\/p>\n<table><tr><th>Yöntem<\/th><th>q(1.5) (kN/m)<\/th><th>Fark<\/th><\/tr>\n<tr><td>NİFİF<\/td><td>5.25<\/td><td>0<\/td><\/tr>\n<tr><td>Gerçek değer<\/td><td>5.25<\/td><td><\/td><\/tr><\/table>\n<p><b>f) Toplam yük tablosu<\/b><\/p>\n<table><tr><th>Yöntem<\/th><th>W (kN)<\/th><th>Mutlak fark<\/th><th>Bağıl %<\/th><\/tr>\n<tr><td>Bileşik trapez<\/td><td>38.0000<\/td><td>0.6667<\/td><td>1.79<\/td><\/tr>\n<tr><td>Bileşik Simpson 1/3<\/td><td>37.3333<\/td><td>0<\/td><td>0<\/td><\/tr>\n<tr><td>Gerçek değer<\/td><td>37.3333<\/td><td><\/td><td><\/td><\/tr><\/table>\n<p><b>Sonuç:<\/b> \\(q(1.5)=5.25\\) kN/m. \\(W_T=38\\) kN, \\(W_S=37.3333\\) kN, gerçek \\(W=37.3333\\) kN.<\/p>\n<p><b>Karşılaştırma:<\/b> NİFİF farkı 0, çünkü veri 2. derece ve \\(\\Delta^3=0\\). Simpson farkı 0, çünkü Simpson 1/3, 3. dereceye kadar polinomu tam entegre eder. Trapez farkı 0.667 kN (%1.79). Bu, \\(\\frac{(b-a)h^2f''}{12}=\\frac{4\\cdot1\\cdot2}{12}=0.667\\) ile birebir aynı.<\/p>\n<div class=\"ipucu\"><b>Sık hata:<\/b> Simpson katsayı dizisi 1-4-2-4-1 ve dış çarpan h/3. \"Gösteriniz\" şıkkında tek noktayı denemek yetmez, beşini de yaz. Fark sütunlarında ilk satırdan oku (NİFİF, üst satır).<\/div>","ks":["k18","k20","k32","k34"],"v":["jI_w88nIkqU","5Tc-YWj_8KU","HV5xo8klTPo","WIAMXcCThsk","YUgAWPFMYrM","TRo91HxWbqU","kfpdR3CLHTI","1al7Ov3BfJ4","_x2quxqxuDo","8Wge9uNIexs"],"vk":["k20","k18","k18","k18","k32","k32","k32","k34","k34","k34"]},"b10":{"y":"q","id":"b10","t":"B10 · Merkezi fark: f'(2) ve f''(2)","g":5,"sub":"Föy B seti","h":"<\!-- k: k25,k26 -->\n<p>\\(f(x)=x^3-4x+2\\) fonksiyonunun \\(x=2\\) noktasında ve \\(h=0.1\\) adım büyüklüğü kullanarak:<br>\na) Merkezi fark yöntemiyle \\(f'(2)\\) değerini hesaplayınız.<br>\nb) Merkezi fark yöntemiyle \\(f''(2)\\) değerini hesaplayınız.<br>\nc) Sayısal sonuçları analitik türev değerleriyle karşılaştırınız.<\/p>\n\\[f'(x)\\approx\\frac{f(x+h)-f(x-h)}{2h}\\]\n\\[f''(x)\\approx\\frac{f(x+h)-2f(x)+f(x-h)}{h^2}\\]\n<p class=\"sn\">Okunamayan yer: sayfa ters ve soluk taranmış. Soru metninin bir kısmı ve ikinci türev formülü okunmuyor. İkinci türev formülü standart merkezi fark olarak alındı. Tablonun ikinci sütun başlığı \"Sayısal\" diye tahmin edildi.<\/p>","s":"<p><b>Verilenler:<\/b> \\(x=2\\), \\(h=0.1\\). \\(f(2.1)=9.261-8.4+2=2.861\\), \\(f(2)=8-8+2=2\\), \\(f(1.9)=6.859-7.6+2=1.259\\).<\/p>\n<p><b>a)<\/b> CD2, O(h²), payda \\(2h=0.2\\).<\/p>\n\\[f'(2)\\approx\\frac{2.861-1.259}{0.2}=\\frac{1.602}{0.2}=8.01\\]\n<p>Analitik \\(f'(x)=3x^2-4\\), \\(f'(2)=8\\).<\/p>\n<p><b>b)<\/b> D2, O(h²), payda \\(h^2=0.01\\).<\/p>\n\\[f''(2)\\approx\\frac{2.861-2(2)+1.259}{0.01}=\\frac{0.12}{0.01}=12\\]\n<p>Analitik \\(f''(x)=6x\\), \\(f''(2)=12\\).<\/p>\n<p><b>c)<\/b><\/p>\n<table><tr><th>Büyüklük<\/th><th>Sayısal<\/th><th>Gerçek<\/th><th>Mutlak fark<\/th><\/tr>\n<tr><td>f'(2)<\/td><td>8.01<\/td><td>8<\/td><td>0.01<\/td><\/tr>\n<tr><td>f''(2)<\/td><td>12<\/td><td>12<\/td><td>0<\/td><\/tr><\/table>\n<p><b>Sonuç:<\/b> \\(f'(2)\\approx8.01\\) (fark 0.01). \\(f''(2)\\approx12\\) (fark 0).<\/p>\n<p><b>Karşılaştırma:<\/b> f' farkı 0.01, CD2 kesme hatasına eşit: \\(\\frac{h^2}{6}f'''=\\frac{0.01}{6}\\cdot6=0.01\\). f'' farkı 0: merkezi 2. türevin hatası \\(f^{(4)}\\) ile orantılı ve kübik fonksiyonda \\(f^{(4)}=0\\).<\/p>\n<div class=\"ipucu\"><b>Sık hata:<\/b> f''de payda \\(h^2=0.01\\), \\(h\\) değil. \\(f(2)\\)'yi 2 ile çarpmayı unutmak. \\(f(2.1)=9.261-8.4+2\\) hesabında küp yanlışı.<\/div>","ks":["k25","k26"],"v":["EUodLr7SXMk","vBthLUp-5F0","xaQZQFTsGc4","cLHKU_yFOIw","LzgzhxQcVZ4","S8H7kmFMULo"],"vk":["k25","k26","k25","k25","k25","k04"]},"b11":{"y":"q","id":"b11","t":"B11 · Geri fark interpolasyonu (NGFİF), ln 2.3","g":5,"sub":"Föy B seti","h":"<\!-- k: k21 -->\n<p>Aşağıdaki eşit aralıklı veri tablosu verilmiştir:<\/p>\n<table><tr><th>x<\/th><td>1<\/td><td>1.5<\/td><td>2<\/td><td>2.5<\/td><\/tr><tr><th>f(x) = ln x<\/th><td>0<\/td><td>0.405<\/td><td>0.693<\/td><td>0.916<\/td><\/tr><\/table>\n<p>Adım büyüklüğü: \\(h=0.5\\). Newton Geri Fark İnterpolasyon Formülü (NGFİF) kullanarak \\(x=2.3\\) için \\(f(2.3)\\approx\\ln(2.3)\\) değerini tahmin ediniz.<\/p>\n\\[\\begin{aligned}P(x)=f_n&+s\\nabla f_n+\\frac{s(s+1)}{2!}\\nabla^2f_n\\\\&+\\frac{s(s+1)(s+2)}{3!}\\nabla^3f_n\\end{aligned}\\qquad s=\\frac{x-x_n}{h}\\]\n<p class=\"sn\">Okunamayan yer: f(1.5) hücresi taramada okunmuyor, yalnız son rakam 5 görünüyor. ln 1.5 = 0.405465 olduğundan 0.405 alındı. Diğer değerler de 3 ondalıklı.<\/p>","s":"<p><b>Verilenler:<\/b> \\(h=0.5\\), \\(x_n=2.5\\), \\(x=2.3\\). Katsayılar tablonun alt satırından okunur.<\/p>\n<p><b>Geri fark tablosu:<\/b><\/p>\n<table>\n<tr><th>x<\/th><th>f<\/th><th>∇f<\/th><th>∇²f<\/th><th>∇³f<\/th><\/tr>\n<tr><td>1<\/td><td>0<\/td><td><\/td><td><\/td><td><\/td><\/tr>\n<tr><td>1.5<\/td><td>0.405<\/td><td>0.405<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>2<\/td><td>0.693<\/td><td>0.288<\/td><td>−0.117<\/td><td><\/td><\/tr>\n<tr><td>2.5<\/td><td>0.916<\/td><td>0.223<\/td><td>−0.065<\/td><td>0.052<\/td><\/tr>\n<\/table>\n<p><b>Hesap:<\/b> \\(s=\\frac{2.3-2.5}{0.5}=-0.4\\). Katsayılar \\(\\frac{s(s+1)}{2!}=\\frac{(-0.4)(0.6)}{2}=-0.12\\) ve \\(\\frac{s(s+1)(s+2)}{3!}=\\frac{(-0.4)(0.6)(1.6)}{6}=-0.064\\).<\/p>\n\\[\\begin{aligned}P(2.3)&=0.916+(-0.4)(0.223)\\\\&\\quad+(-0.12)(-0.065)+(-0.064)(0.052)\\\\&=0.916-0.0892+0.0078-0.003328\\end{aligned}\\]\n<p><b>Sonuç:<\/b> \\(f(2.3)\\approx0.831272\\approx0.8313\\).<\/p>\n<p> /td><td>0.0833<\/td><\/tr>\n<\/table>\n<\/div>\n<p><b>Sonuç:<\/b> \\(I_{T,1}=6\\), \\(I_{T,4}=4.75\\), \\(I=14/3\\approx4.6667\\). Farklar 1.3333 ve 0.0833.<\/p>\n<p><b>Karşılaştırma:<\/b> h, 2'den 0.5'e indi (1/4). Hata 1.3333'ten 0.0833'e düştü (1/16). Trapez O(h²). \\(f''=2\\) sabit olduğu için hata formülü tam tutuyor: tek panel \\(\\frac{(b-a)^3f''}{12}=\\frac{8\\cdot2}{12}=1.3333\\), bileşik \\(\\frac{(b-a)h^2f''}{12}=\\frac{2\\cdot0.25\\cdot2}{12}=0.0833\\).<\/p>\n<div class=\"ipucu\"><b>Sık hata:<\/b> \\(h=(b-a)/n=0.5\\), 2 değil. Farkı yuvarlanmış 4.667'den değil, \\(14/3\\)'ten al. Kâğıtta tek panel farkı \"1.334\" yazılmış, doğrusu 1.333 (\\(6-14/3\\)).<\/div>","ks":["k31","k32"],"v":["YUgAWPFMYrM","TRo91HxWbqU","kfpdR3CLHTI","FhKnxSdSUko","S8H7kmFMULo"],"vk":["k31","k31","k31","k30","k04"]},"c2":{"y":"q","id":"c2","t":"C2 · Üçüncü türev, 4 nokta merkezi fark","g":5,"sub":"Föy C seti","h":"<\!-- k: k17,k26 -->\n<p>\\(f(x)=\\cos(x)\\) fonksiyonu için \\(x=\\pi/4\\) noktasındaki üçüncü türevi, \\(h=0.1\\) adım büyüklüğü kullanarak 4 noktalı merkezi fark yöntemi ile yaklaşık olarak hesaplayınız. Elde ettiğiniz sonucu analitik üçüncü türev değeriyle karşılaştırınız.<\/p>\n\\[\\begin{aligned}f'''(x)\\approx\\frac{1}{2h^3}\\bigl[&\\ f(x+2h)-2f(x+h)\\\\&+2f(x-h)-f(x-2h)\\bigr]\\end{aligned}\\]","s":"<p><b>Verilenler:<\/b> \\(x_0=\\pi/4=0.785398\\), \\(h=0.1\\). RAD modu. \\(f(x_0)\\) formülde yok.<\/p>\n<p><b>Düğüm tablosu:<\/b><\/p>\n<div class=\"tw\">\n<table>\n<tr><th><\/th><th>x − 2h<\/th><th>x − h<\/th><th>x + h<\/th><th>x + 2h<\/th><\/tr>\n<tr><th>x<\/th><td>0.585398<\/td><td>0.685398<\/td><td>0.885398<\/td><td>0.985398<\/td><\/tr>\n<tr><th>cos x<\/th><td>0.833492<\/td><td>0.774167<\/td><td>0.632981<\/td><td>0.552531<\/td><\/tr>\n<\/table>\n<\/div>\n<p><b>Hesap:<\/b> Payda \\(2h^3=2(0.001)=0.002\\). Pay, 9 ondalıklı değerlerle:<\/p>\n\\[\\begin{aligned}\\text{Pay}&=0.552531292-2(0.632981307)\\\\&\\quad+2(0.774167078)-0.833492154\\\\&=0.001410680\\end{aligned}\\]\n\\[f'''(\\pi/4)\\approx\\frac{0.001410680}{0.002}=0.705340\\]\n<p>Analitik: \\(f'=-\\sin x\\), \\(f''=-\\cos x\\), \\(f'''=\\sin x\\). \\(\\sin(\\pi/4)=0.707107\\).<\/p>\n\\[E=|0.707107-0.705340|=0.001767\\]\n<p><b>Sonuç:<\/b> \\(f'''_{sayısal}(\\pi/4)=0.70534\\), \\(f'''_{gerçek}=0.70711\\), mutlak hata \\(E\\approx0.0018\\) (%0.25). Tam hassasiyetle sayısal değer 0.705341 ve hata 0.001766.<\/p>\n<p><b>Karşılaştırma:<\/b> Hata 0.0018, O(h²) mertebesiyle uyumlu. Kesme tahmini \\(\\frac{h^2}{4}|f^{(5)}|=0.0025\\sin(\\pi/4)=0.00177\\), bulunan hatayla aynı. Slayt yalnız O(h²) yazıyor, bu ek bilgi.<\/p>\n<p>Pay çok küçük (0.0014) ve payda 0.002. Yuvarlama hatası 500 kat büyür. Pay küçük olduğundan yuvarlama hatasına duyarlı.<\/p>\n<div class=\"tw\">\n<table>\n<tr><th>Tablo ondalığı<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><th>8 ve üstü<\/th><\/tr>\n<tr><td>f'''<\/td><td>0.7000<\/td><td>0.7100<\/td><td>0.7055<\/td><td>0.70535<\/td><td>0.70534<\/td><\/tr>\n<\/table>\n<\/div>\n<div class=\"ipucu\"><b>Sık hata:<\/b> Tabloyu 6 ondalık yaz ama hesabı makinede yuvarlamadan, tek satırda yap. 6 ondalıklı değerlerle sonuç 0.7055 çıkar. Payda \\(2h^3=0.002\\), \\(2h\\) değil. cos'un 3. türevi \\(+\\sin x\\). Kâğıtta \\(f(x-2h)\\) için 0.8334 yazılmış, 4 basamağa doğru yuvarlama 0.8335. Sonuç 0.70534 doğru.<\/div>","ks":["k17","k26"],"v":["nGJ6snBFmQg","J3BvMpuKzYw"],"vk":["k17","k26"]},"c3":{"y":"q","id":"c3","t":"C3 · Bileşik Simpson 1/3, n = 4","g":5,"sub":"Föy C seti","h":"<\!-- k: k34 -->\n<p>\\(I=\\int_0^{1}e^{x}\\,dx\\) integralini \\(n=4\\) ile bileşik Simpson 1/3 kullanarak hesaplayınız.<\/p>\n\\[I_S=\\frac h3\\bigl[f_0+4f_1+2f_2+4f_3+f_4\\bigr]\\]\n<p class=\"sn\">Okunamayan yer: üst sınır ve üs el yazısıyla karalanmış. ∫₀¹ eˣ dx olarak okundu. Kâğıttaki ara değerler (x₄ = 1, f₃ = 2.117, f₄ = 2.71828) bununla tutarlı. Şablondaki fazladan f₅ kutusu n = 4'te kullanılmaz.<\/p>","s":"<p><b>Verilenler:<\/b> \\(f(x)=e^x\\), \\(a=0\\), \\(b=1\\), \\(n=4\\) (çift, Simpson 1/3 uygulanır). \\(h=\\frac{1-0}{4}=0.25\\).<\/p>\n<p><b>Düğüm tablosu:<\/b><\/p>\n<div class=\"tw\">\n<table>\n<tr><th>i<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><\/tr>\n<tr><th>xᵢ<\/th><td>0<\/td><td>0.25<\/td><td>0.50<\/td><td>0.75<\/td><td>1.00<\/td><\/tr>\n<tr><th>fᵢ<\/th><td>1.000000<\/td><td>1.284025<\/td><td>1.648721<\/td><td>2.117000<\/td><td>2.718282<\/td><\/tr>\n<tr><th>katsayı<\/th><td>1<\/td><td>4<\/td><td>2<\/td><td>4<\/td><td>1<\/td><\/tr>\n<\/table>\n<\/div>\n<p><b>Hesap:<\/b><\/p>\n\\[\\begin{aligned}\\text{Parantez}&=1+4(1.284025)+2(1.648721)\\\\&\\quad+4(2.117000)+2.718282\\\\&=20.619824\\end{aligned}\\]\n\\[I_S=\\frac{0.25}{3}(20.619824)=1.718319\\]\n<p><b>Sonuç:<\/b> \\(I_S\\approx1.7183\\). Gerçek \\(e-1=1.718282\\). Mutlak hata 0.000037.<\/p>\n<p><b>Karşılaştırma:<\/b> Hata sınırı \\(\\frac{(b-a)h^4\\max f^{(4)}}{180}=\\frac{0.25^4\\,e}{180}=0.000059\\). Gerçek hata 0.000037 sınırın altında. Parantez tam hassasiyetle 20.619826, sonuç aynı.<\/p>\n<div class=\"ipucu\"><b>Sık hata:<\/b> Katsayı dizisini 1-2-4 diye kaydırmak. Doğrusu 1-4-2-4-1. \\(h/3\\) çarpanını unutmak. \\(f_5\\) kutusunu doldurmaya çalışmak, n = 4'te yok. Kâğıtta sonuç yazılmamış, doğrusu 1.71832.<\/div>","ks":["k34"],"v":["1al7Ov3BfJ4","_x2quxqxuDo","8Wge9uNIexs"],"vk":["k34","k34","k34"]},"c4":{"y":"q","id":"c4","t":"C4 · Beş nokta merkezi fark (CD4)","g":5,"sub":"Föy C seti","h":"<\!-- k: k26 -->\n<p>\\(f(x)=\\cos x\\) için \\(x_0=\\frac\\pi3\\) ve \\(h=0.1\\) alın. 5 nokta merkezi fark ile \\(f'(\\pi/3)\\) değerini hesaplayınız.<\/p>\n\\[\\begin{aligned}f'(x_0)\\approx\\frac{1}{12h}\\bigl[&-f(x_0+2h)+8f(x_0+h)\\\\&-8f(x_0-h)+f(x_0-2h)\\bigr]\\end{aligned}\\]\n<p class=\"sn\">Okunamayan yer: satır soluk taranmış. \\(x_0=\\pi/3\\) okuması sorudaki \\(f'(\\pi/3)\\) ile tutarlı.<\/p>","s":"<p><b>Verilenler:<\/b> \\(x_0=\\pi/3=1.047198\\), \\(h=0.1\\). RAD modu. \\(f(x_0)\\) formülde yok.<\/p>\n<p><b>Düğüm tablosu:<\/b><\/p>\n<div class=\"tw\">\n<table>\n<tr><th><\/th><th>x₀ − 2h<\/th><th>x₀ − h<\/th><th>x₀ + h<\/th><th>x₀ + 2h<\/th><\/tr>\n<tr><th>x<\/th><td>0.847198<\/td><td>0.947198<\/td><td>1.147198<\/td><td>1.247198<\/td><\/tr>\n<tr><th>cos x<\/th><td>0.662086<\/td><td>0.583960<\/td><td>0.411044<\/td><td>0.317981<\/td><\/tr>\n<\/table>\n<\/div>\n<p><b>Hesap:<\/b> Payda \\(12h=1.2\\). Pay, 9 ondalıklı değerlerle:<\/p>\n\\[\\begin{aligned}\\text{Pay}&=-0.317980601+8(0.411043808)\\\\&\\quad-8(0.583960358)+0.662085976\\\\&=-1.039227025\\end{aligned}\\]\n\\[f'(\\pi/3)\\approx\\frac{-1.039227025}{1.2}=-0.866023\\]\n<p>Analitik \\(f'(x)=-\\sin x\\), \\(-\\sin(\\pi/3)=-0.866025\\).<\/p>\n<p><b>Sonuç:<\/b> \\(f'(\\pi/3)\\approx-0.866023\\), gerçek \\(-0.866025\\), mutlak hata \\(E\\approx3\\times10^{-6}\\) (2.9 × 10⁻⁶).<\/p>\n<p><b>Karşılaştırma:<\/b> CD4 O(h⁴). Kesme hatası \\(\\frac{h^4}{30}|f^{(5)}|=\\frac{10^{-4}}{30}\\sin\\frac\\pi3=2.9\\times10^{-6}\\), bulunan hatayla aynı. Slayttaki \"h = 0.1 için hata yaklaşık 10⁻⁴\" üst tahmini ile uyumlu.<\/p>\n<div class=\"tw\">\n<table>\n<tr><th>Tablo ondalığı<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7 ve üstü<\/th><\/tr>\n<tr><td>f'<\/td><td>−0.866583<\/td><td>−0.866042<\/td><td>−0.866019<\/td><td>−0.866023<\/td><\/tr>\n<\/table>\n<\/div>\n<div class=\"ipucu\"><b>Sık hata:<\/b> İşaret düzeni −, +8, −8, +. Payda \\(12h=1.2\\). Katsayı 8 küçük farkları büyütür. Değerleri makinede yuvarlamadan tut, 4 ondalıkla −0.866583 çıkar. Sonucu tek satırda hesapla.<\/div>","ks":["k26"],"v":["J3BvMpuKzYw","xaQZQFTsGc4","cLHKU_yFOIw","LzgzhxQcVZ4"],"vk":["k26","k26","k26","k26"]},"c5":{"y":"q","id":"c5","t":"C5 · Simpson 3/8, n = 3","g":5,"sub":"Föy C seti","h":"<\!-- k: k35 -->\n<p>\\(I=\\int_0^2\\sqrt{1+x^3}\\,dx\\) integralini \\(n=3\\) ile Simpson 3/8 kullanarak hesaplayınız.<\/p>\n\\[I_{3/8}=\\frac{3h}{8}\\bigl[f_0+3f_1+3f_2+f_3\\bigr]\\]","s":"<p><b>Verilenler:<\/b> \\(f(x)=\\sqrt{1+x^3}\\), \\(a=0\\), \\(b=2\\), \\(n=3\\). \\(h=\\frac{2-0}{3}=\\frac23\\). \\(\\frac{3h}{8}=\\frac{3(2/3)}{8}=0.25\\).<\/p>\n<p><b>Düğüm tablosu:<\/b><\/p>\n<div class=\"tw\">\n<table>\n<tr><th>i<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><\/tr>\n<tr><th>xᵢ<\/th><td>0<\/td><td>2/3<\/td><td>4/3<\/td><td>2<\/td><\/tr>\n<tr><th>fᵢ<\/th><td>1.000000<\/td><td>√(1 + 8/27) = 1.138550<\/td><td>√(1 + 64/27) = 1.835857<\/td><td>3.000000<\/td><\/tr>\n<tr><th>katsayı<\/th><td>1<\/td><td>3<\/td><td>3<\/td><td>1<\/td><\/tr>\n<\/table>\n<\/div>\n<p><b>Hesap:<\/b><\/p>\n\\[\\text{Parantez}=1+3(1.138550)+3(1.835857)+3=12.923221\\]\n\\[I_{3/8}=0.25\\,(12.923221)=3.230805\\]\n<p><b>Sonuç:<\/b> \\(I_{3/8}\\approx3.2308\\).<\/p>\n<p><b>Karşılaştırma:<\/b> Bu integralin kapalı formu yok (eliptik). Soru karşılaştırma istemiyor. Referans: ince bölmeli Simpson (n = 2000) 3.241309. Fark 0.0105 (%0.32). n = 3 az nokta olduğu için sonuç kaba.<\/p>\n<div class=\"ipucu\"><b>Sık hata:<\/b> \\(x_1=2/3\\), \\(x_2=4/3\\) (5/3 değil). \\((2/3)^3=8/27\\). \\(\\frac{3h}{8}=0.25\\) çarpanını unutmak. Slayt W5 s12'deki ara değerleri (1.1041 ve 1.6916) kullanma, yanlış. Onlarla 3.0968 çıkar. Doğru değerler 1.1386 ve 1.8359.<\/div>","ks":["k35"],"v":["r9NUTclKTao","VFh4Fij6LRg","qXBekymaxYY"],"vk":["k35","k35","k35"]},"c6":{"y":"q","id":"c6","t":"C6 · Karma Simpson 1/3 + 3/8, n = 5","g":5,"sub":"Föy C seti","h":"<\!-- k: k36 -->\n<p>\\(I=\\int_0^5\\frac{1}{1+x^2}\\,dx\\) integralinde (\\(h=1\\)) ve (\\(n=5\\)) olsun. İlk iki alt aralıkta Simpson 1/3, son üç alt aralıkta Simpson 3/8 kullanarak integrali hesaplayınız.<\/p>\n\\[I_1=\\frac13\\bigl[f_0+4f_1+f_2\\bigr],\\qquad I_2=\\frac38\\bigl[f_2+3f_3+3f_4+f_5\\bigr]\\]","s":"<p><b>Verilenler:<\/b> \\(f(x)=\\frac{1}{1+x^2}\\), \\(h=1\\), \\(n=5\\) (tek). İlk iki aralık \\([x_0,x_2]\\) Simpson 1/3, son üç aralık \\([x_2,x_5]\\) Simpson 3/8. Ortak düğüm \\(x_2\\).<\/p>\n<p><b>Düğüm tablosu:<\/b><\/p>\n<div class=\"tw\">\n<table>\n<tr><th>i<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr>\n<tr><th>xᵢ<\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><\/tr>\n<tr><th>fᵢ<\/th><td>1.000000<\/td><td>0.500000<\/td><td>0.200000<\/td><td>0.100000<\/td><td>0.058824<\/td><td>0.038462<\/td><\/tr>\n<\/table>\n<\/div>\n<p><b>Hesap:<\/b> \\(h=1\\) olduğu için çarpanlar \\(\\frac13\\) ve \\(\\frac38\\).<\/p>\n\\[I_1=\\frac13\\bigl[1+4(0.5)+0.2\\bigr]=\\frac{3.2}{3}=1.066667\\]\n\\[\\begin{aligned}I_2&=\\frac38\\bigl[0.2+3(0.1)+3(0.058824)\\\\&\\quad+0.038462\\bigr]\\\\&=\\frac38(0.714934)=0.268100\\end{aligned}\\]\n\\[I=I_1+I_2=1.066667+0.268100=1.334767\\]\n<p><b>Sonuç:<\/b> \\(I\\approx1.3348\\). Tam hassasiyetle 1.334766.<\/p>\n<p><b>Karşılaştırma:<\/b> Gerçek \\(\\arctan5=1.373401\\), mutlak hata 0.0386 (%2.81). Soru karşılaştırma istemiyor. h = 1 bu fonksiyon için kaba.<\/p>\n<div class=\"ipucu\"><b>Sık hata:<\/b> Ortak düğüm \\(f_2\\) iki formülde de yazılır, birinde atlama. n = 5 tek olduğu için saf Simpson 1/3 uygulanamaz. Sıra soruda verili: önce ilk iki aralıkta 1/3, sonra son üç aralıkta 3/8. Ters sırada (önce 3/8) 1.3246 çıkar. Slayt bu sıra konusunda kendi içinde çelişkili (W5 s10). Soruda ne yazıyorsa onu uygula.<\/div>","ks":["k36"],"v":["1al7Ov3BfJ4","_x2quxqxuDo","8Wge9uNIexs","r9NUTclKTao","VFh4Fij6LRg","qXBekymaxYY"],"vk":["k36","k33","k33","k36","k36","k36"]},"x01":{"y":"q","id":"x01","t":"Ölçüm: doğruluk, hassasiyet, hata","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k02,k04 -->\n<p>Kütlesi 2.000 kg olan bir kalibrasyon ağırlığı iki ayrı teraziyle üçer kez tartılıyor.<\/p>\n<table><tr><th>Terazi<\/th><th>1. ölçüm<\/th><th>2. ölçüm<\/th><th>3. ölçüm<\/th><\/tr>\n<tr><td>A<\/td><td>2.051<\/td><td>2.049<\/td><td>2.050<\/td><\/tr>\n<tr><td>B<\/td><td>1.98<\/td><td>2.03<\/td><td>1.99<\/td><\/tr><\/table>\n<p>a) Her terazi için ortalamayı ve yayılımı (en büyük − en küçük) bulunuz.<br>\nb) Ortalamaların mutlak ve bağıl hatasını bulunuz. A sonucunu a₀ = a ± Δa biçiminde yazınız.<br>\nc) Hangi terazi doğru, hangisi hassas? Hata türünü (sistematik ya da rastgele) belirtiniz.<br>\nd) Mühendislik açısından hangi sonuç kullanılabilir? Nasıl?<br>\ne) A ortalamasını 2.050000 kg yazmak sonucu daha doğru yapar mı?<\/p>\n\\[a_0=a\\pm\\Delta a,\\quad \\Delta a=|a_0-a|,\\quad \\delta_a=\\frac{\\Delta a}{|a|}\\]","s":"<p><b>Verilenler:<\/b> gerçek değer a₀ = 2.000 kg. Her terazide 3 ölçüm.<\/p>\n<p><b>a)<\/b> A: (2.051 + 2.049 + 2.050)/3 = 6.150/3 = 2.050 kg. Yayılım 2.051 − 2.049 = 0.002 kg.<br>\nB: (1.98 + 2.03 + 1.99)/3 = 6.00/3 = 2.00 kg. Yayılım 2.03 − 1.98 = 0.05 kg.<\/p>\n<p><b>b)<\/b><\/p>\n<div class=\"tw\"><table><tr><th>Terazi<\/th><th>Ortalama a<\/th><th>Yayılım<\/th><th>Δa = |a₀ − a|<\/th><th>δₐ = Δa/|a|<\/th><\/tr>\n<tr><td>A<\/td><td>2.050<\/td><td>0.002<\/td><td>0.050<\/td><td>0.0244 (%2.4)<\/td><\/tr>\n<tr><td>B<\/td><td>2.00<\/td><td>0.05<\/td><td>0.00<\/td><td>0 (%0)<\/td><\/tr><\/table><\/div>\n<p>A: Δa = |2.000 − 2.050| = 0.050 kg. δₐ = 0.050/2.050 = 0.0244, yani %2.4. Paydaya gerçek değer konursa 0.050/2.000 = %2.5 çıkar. Fark küçük.<\/p>\n<p>A sonucu: a₀ = 2.050 ± 0.050 kg.<\/p>\n<p>B'nin ortalaması tam doğru. Ama tek bir ölçüm 0.03 kg'a kadar sapıyor (2.03). Tek ölçümün bağıl hatası %1.5'e çıkıyor.<\/p>\n<p><b>c)<\/b> A hassas ama doğru değil. Ölçümler birbirine çok yakın (0.002), ama hepsi aynı yönde 0.050 sapıyor. Bu sistematik hata. Muhtemel neden kalibrasyon.<\/p>\n<p>B doğru ama hassas değil. Ortalaması gerçeğe eşit, ölçümler saçılıyor (0.05). Rastgele hata baskın.<\/p>\n<div class=\"vurgu\"><p>Doğruluk gerçek değere yakınlıktır. Hassasiyet ölçümlerin birbirine yakınlığıdır. Yüksek hassasiyet ve düşük doğruluk varsa sistematik hata olasıdır. <span class=\"kaynak\">W1 s9<\/span><\/p><\/div>\n<p><b>d)<\/b> A kullanılabilir. Sapması her ölçümde aynı, düzeltilebilir. Her okumadan 0.050 kg çıkarılırsa A hem doğru hem hassas olur. B'nin saçılımı düzeltilemez. B ile tek ölçüm ±0.03 kg belirsiz kalır.<\/p>\n<p><b>e)<\/b> Hayır. Belirsizlik binde birler basamağında (yayılım 0.002). 2.050000'deki ek sıfırlar ölçüm bilgisi taşımaz. Sayısal değer aynıdır, ölçüm bilgisi aynı değildir.<\/p>\n<div class=\"vurgu\"><p>\"Çok basamak yazmak sonucu daha doğru yapmaz.\" \"Sonuç, belirsizlik seviyesine uygun basamak sayısıyla verilmelidir.\" <span class=\"kaynak\">W1 s10<\/span><\/p><\/div>\n<div class=\"ipucu\"><p>Sık hata: ortalaması doğru diye B'ye \"hassas\" demek. Hassasiyet saçılıma bakar, ortalamaya bakmaz.<\/p><\/div>","ks":["k02","k04"],"v":[],"vk":[]},"x02":{"y":"q","id":"x02","t":"Yuvarlama, anlamlı basamak, kesme hatası","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k02,k03,k04,k07 -->\n<p>a) π = 3.14159265 yerine 3.14 kullanılıyor. Mutlak hatayı ve yüzde bağıl hatayı bulunuz.<br>\nb) 47.3862 sayısını 1, 2 ve 3 ondalığa yuvarlayınız. 0.0034567 sayısını 2 ve 3 anlamlı basamağa yuvarlayınız.<br>\nc) \\(e^{x}\\approx 1+x+\\frac{x^2}{2}\\) ile \\(e^{0.1}\\) değerini hesaplayınız. Gerçek değer 1.105171. Hata nedir, hangi türdendir?<br>\nd) Hata türünü yazınız: (i) π yerine 3.14 almak, (ii) c şıkkındaki seri, (iii) cetvelde iki çizgi arasını göz kararı okumak.<\/p>","s":"<p><b>a)<\/b> Δa = |3.14159265 − 3.14| = 0.00159265.<\/p>\n<p>δₐ = 0.00159265/3.14 = 0.000507, yani <b>%0.0507<\/b>. Paydaya π konursa yine 0.000507 çıkar.<\/p>\n<p><b>b)<\/b> Kural: sonraki rakam 5'ten küçükse koru, 5 veya büyükse bir artır.<\/p>\n<table><tr><th>İstenen<\/th><th>Sonraki rakam<\/th><th>Sonuç<\/th><\/tr>\n<tr><td>47.3862, 1 ondalık<\/td><td>8<\/td><td>47.4<\/td><\/tr>\n<tr><td>47.3862, 2 ondalık<\/td><td>6<\/td><td>47.39<\/td><\/tr>\n<tr><td>47.3862, 3 ondalık<\/td><td>2<\/td><td>47.386<\/td><\/tr>\n<tr><td>0.0034567, 2 anlamlı<\/td><td>5<\/td><td>0.0035<\/td><\/tr>\n<tr><td>0.0034567, 3 anlamlı<\/td><td>6<\/td><td>0.00346<\/td><\/tr><\/table>\n<p>0.0034567'de baştaki sıfırlar anlamlı basamak değildir. İlk anlamlı basamak 3'tür.<\/p>\n<p><b>c)<\/b> 1 + 0.1 + 0.01/2 = 1.105000. Gerçek 1.105171. Mutlak hata 0.000171.<\/p>\n<p>İlk atılan terim x³/6 = 0.000167. Hatanın neredeyse tamamı bu terim. Sonsuz seri sonlu terimle kesildiği için bu <b>kesme hatası<\/b>dır.<\/p>\n<p><b>d)<\/b> (i) yuvarlatma hatası. (ii) kesme hatası. (iii) ölçüm hatası.<\/p>\n<div class=\"vurgu\"><p>Yuvarlatma hatası uzun basamaklı sayıyı sınırlı basamakla temsil etmekten doğar. Kesme hatası sonsuz bir işlemi sonlu terimle temsil etmekten doğar. <span class=\"kaynak\">W1 s8<\/span><\/p><\/div>\n<div class=\"ipucu\"><p>Sık hata: baştaki sıfırları anlamlı basamak saymak. 0.0034567'nin 2 anlamlı basamağı 0.00 değil, 0.0035'tir.<\/p><\/div>","ks":["k02","k03","k04","k07"],"v":[],"vk":[]},"x03":{"y":"q","id":"x03","t":"Hata yayılımı: toplama, çarpma, bölme, fonksiyon","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k05 -->\n<p>a) Bir dikdörtgende a = 12.5 ± 0.1 cm, b = 3.20 ± 0.05 cm. A = ab alanının mutlak hatasını bulunuz.<br>\nb) x = 8.40 ± 0.05 cm, y = 2.75 ± 0.02 cm, w = 1.10 ± 0.03 cm ve z = x + y − w. z'nin mutlak ve bağıl hatasını bulunuz.<br>\nc) m = 250.0 ± 0.5 g ve V = 100 ± 2 cm³. ρ = m/V yoğunluğunu ve mutlak hatasını bulunuz.<br>\nd) f = y cos α, y = 10 ± 0.1 N, α = 30° ± 1°. Δf'yi bulunuz.<br>\ne) Sonuçları uygun basamakla yazınız. Her şıkta hangi girdi baskın?<\/p>","s":"<p><b>Formüller (W1 s13-15):<\/b><\/p>\n\\[z=x+y-w:\\ \\Delta z=\\Delta x+\\Delta y+\\Delta w\\]\n\\[z=xy\\ \\text{ya da}\\ z=\\frac xy:\\ \\frac{\\Delta z}{|z|}\\approx\\frac{\\Delta x}{|x|}+\\frac{\\Delta y}{|y|}\\]\n\\[\\Delta f\\approx\\sum\\Bigl|\\frac{\\partial f}{\\partial x_i}\\Bigr|\\Delta x_i\\]\n<p><b>a)<\/b> A = 12.5 × 3.20 = 40.00 cm².<\/p>\n<p>δa = 0.1/12.5 = 0.008. δb = 0.05/3.20 = 0.015625. δA = 0.023625 (%2.4).<\/p>\n<p>ΔA = 40.00 × 0.023625 = 0.945 cm². Kontrol: bΔa + aΔb = 0.32 + 0.625 = 0.945.<\/p>\n<p><b>b)<\/b> z = 8.40 + 2.75 − 1.10 = 10.05 cm. Δz = 0.05 + 0.02 + 0.03 = 0.10 cm. Bağıl 0.10/10.05 = 0.00995 (%1.0).<\/p>\n<p><b>c)<\/b> ρ = 250.0/100 = 2.500 g/cm³. δm = 0.5/250 = 0.002. δV = 2/100 = 0.02. δρ = 0.022. Δρ = 2.500 × 0.022 = 0.055 g/cm³.<\/p>\n<p><b>d)<\/b> Açı hatası radyana çevrilir: Δα = 1° = π/180 = 0.017453 rad.<\/p>\n\\[\\frac{\\partial f}{\\partial y}=\\cos\\alpha=0.866025\\]\n\\[\\Bigl|\\frac{\\partial f}{\\partial\\alpha}\\Bigr|=|y\\sin\\alpha|=5\\]\n\\[\\begin{aligned}\\Delta f&\\approx0.866025(0.1)+5(0.017453)\\\\&=0.086603+0.087266=0.173869\\end{aligned}\\]\n<p>f = 10 cos 30° = 8.660254 N. Bağıl hata %2.0.<\/p>\n<p><b>e)<\/b><\/p>\n<div class=\"tw\"><table><tr><th>Büyüklük<\/th><th>Değer<\/th><th>Mutlak hata<\/th><th>Bağıl<\/th><th>Yazım<\/th><th>Baskın girdi<\/th><\/tr>\n<tr><td>A<\/td><td>40.00<\/td><td>0.945<\/td><td>%2.4<\/td><td>40.0 ± 0.9 cm²<\/td><td>b (%1.6 &gt; %0.8)<\/td><\/tr>\n<tr><td>z<\/td><td>10.05<\/td><td>0.10<\/td><td>%1.0<\/td><td>10.05 ± 0.10 cm<\/td><td>x (0.05)<\/td><\/tr>\n<tr><td>ρ<\/td><td>2.500<\/td><td>0.055<\/td><td>%2.2<\/td><td>2.50 ± 0.06 g/cm³<\/td><td>V (%2 &gt; %0.2)<\/td><\/tr>\n<tr><td>f<\/td><td>8.660<\/td><td>0.174<\/td><td>%2.0<\/td><td>8.66 ± 0.17 N<\/td><td>iki katkı eşit<\/td><\/tr><\/table><\/div>\n<p>Hata tek anlamlı basamağa yuvarlanır. Sonuç da o basamakta kesilir. Örneğin ΔA = 0.945 ≈ 0.9 olduğu için A = 40.0 yazılır.<\/p>\n<div class=\"vurgu\"><p>\"Hangi değişkenin bağıl hatası büyükse, toplam sonuca etkisi de çoğu zaman baskındır.\" <span class=\"kaynak\">W1 s14<\/span><\/p><\/div>\n<div class=\"ipucu\"><p>Sık hatalar:<\/p><ul><li>Çıkarmada hatayı çıkarmak. Δz = 0.05 + 0.02 − 0.03 yanlış. Mutlak hatalar hep toplanır.<\/li><li>Çarpmada mutlak hataları toplamak. Çarpma ve bölmede bağıl hatalar toplanır.<\/li><li>Açı hatasını derece bırakmak. O zaman ikinci katkı 5 × 1 = 5 çıkar ve Δf 5.09 olur.<\/li><\/ul><\/div>","ks":["k05"],"v":[],"vk":[]},"x04":{"y":"q","id":"x04","t":"Yakın sayıların çıkarılması: 1 − cos θ","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k06,k03 -->\n<p>a) θ = 2°. Tablo 4 ondalıklı: cos 2° = 0.9994, sin 1° = 0.0175. Tablo değerlerinin hatası 0.00005. b = 1 − cos θ değerini doğrudan ve b = 2 sin²(θ/2) ile hesaplayınız. Her birinin bağıl hata sınırını bulunuz.<br>\nb) θ = 0.001 rad. Tablo 6 ondalıklı: cos 0.001 = 1.000000, sin 0.0005 = 0.000500. Aynı karşılaştırmayı yapınız.<br>\nc) Gerçek değerler 1 − cos 2° = 6.0917 × 10⁻⁴ ve 1 − cos 0.001 = 4.99999958 × 10⁻⁷. Sonuçları uygun anlamlı basamakla yazınız. Hangi ifade daha kararlı?<\/p>","s":"<p><b>Neden sorun var:<\/b> küçük θ için cos θ ≈ 1. Birbirine çok yakın iki sayı çıkarılınca baştaki basamaklar silinir. Geriye az basamak kalır ve tablonun yuvarlama hatası büyür.<\/p>\n\\[\\cos2x=1-2\\sin^2x,\\ x=\\tfrac\\theta2\\ \\Rightarrow\\ 1-\\cos\\theta=2\\sin^2\\tfrac\\theta2\\]\n<p><b>a) Doğrudan:<\/b> b = 1 − 0.9994 = 0.0006. Δb = Δ(cos) = 0.00005.<\/p>\n\\[\\delta_b=\\frac{0.00005}{0.0006}=0.0833\\ (\\%8.3)\\]\n<p><b>a) Yeniden yazılmış:<\/b> a₁ = sin 1° = 0.0175, Δa₁ = 0.00005.<\/p>\n\\[b=2a_1^2=2(0.0175)^2=0.0006125\\]\n\\[\\begin{aligned}\\Delta b&=|4a_1|\\Delta a_1=4(0.0175)(0.00005)\\\\&=3.5\\times10^{-6}\\end{aligned}\\]\n\\[\\delta_b=\\frac{2\\Delta a_1}{|a_1|}=\\frac{0.0001}{0.0175}=0.00571\\ (\\%0.57)\\]\n<p>Sınırların oranı 0.0833/0.00571 = 14.6. Bağıl hata 14 kattan fazla azaldı.<\/p>\n<p><b>b)<\/b> Doğrudan: 1 − 1.000000 = 0. Bütün anlamlı basamaklar kayboldu. Bağıl hata %100.<\/p>\n<p>Yeniden yazılmış: 2(0.000500)² = 5.00 × 10⁻⁷. Tablodan gelen bağıl sınır 2(0.0000005)/0.0005 = %0.2.<\/p>\n<p><b>c) Karşılaştırma<\/b><\/p>\n<div class=\"tw\"><table><tr><th>θ<\/th><th>İfade<\/th><th>Sonuç<\/th><th>Gerçek<\/th><th>Mutlak fark<\/th><th>Bağıl<\/th><\/tr>\n<tr><td>2°<\/td><td>1 − cos θ<\/td><td>0.0006<\/td><td>6.0917 × 10⁻⁴<\/td><td>9.17 × 10⁻⁶<\/td><td>%1.5<\/td><\/tr>\n<tr><td>2°<\/td><td>2 sin²(θ/2)<\/td><td>6.1 × 10⁻⁴<\/td><td>6.0917 × 10⁻⁴<\/td><td>3.33 × 10⁻⁶<\/td><td>%0.55<\/td><\/tr>\n<tr><td>0.001<\/td><td>1 − cos θ<\/td><td>0<\/td><td>4.99999958 × 10⁻⁷<\/td><td>5.0 × 10⁻⁷<\/td><td>%100<\/td><\/tr>\n<tr><td>0.001<\/td><td>2 sin²(θ/2)<\/td><td>5.00 × 10⁻⁷<\/td><td>4.99999958 × 10⁻⁷<\/td><td>4 × 10⁻¹⁴<\/td><td>8 × 10⁻⁸<\/td><\/tr><\/table><\/div>\n<p>Yazım: 0.0006'nın tek anlamlı basamağı var. 2 sin² sonucu 0.0006125 ± 0.0000035. Üçüncü basamak güvenilir değil, 6.1 × 10⁻⁴ yazılır.<\/p>\n<p><b>Yorum:<\/b> 2 sin²(θ/2) daha kararlı. İçinde yakın sayı çıkarması yok. Tablo hatası yalnız çarpımla taşınıyor.<\/p>\n<div class=\"vurgu\"><p>\"Aynı matematiksel değer, farklı hata davranışı.\" \"Algoritma seçimi, formülün kendisi kadar önemlidir.\" <span class=\"kaynak\">W1 s18<\/span><\/p><\/div>\n<div class=\"ipucu\"><p>Sık hatalar: sin(θ/2) yerine sin θ almak. a şıkkı derece, b şıkkı radyan; hesap makinesinin modunu şıkka göre değiştir.<\/p><\/div>","ks":["k06","k03"],"v":[],"vk":[]},"x05":{"y":"q","id":"x05","t":"Taylor: eˣ, kalan terim, terim sayısı","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k07,k09 -->\n<p>eˣ fonksiyonunu x₀ = 0 etrafında 3. dereceye kadar açınız.<br>\na) P₃(0.5) değerini hesaplayınız.<br>\nb) Gerçek \\(e^{0.5}\\) = 1.648721 ile mutlak hatayı bulunuz.<br>\nc) Lagrange kalan terimiyle hatanın üst sınırını bulunuz.<br>\nd) Hata 10⁻⁶'dan küçük olsun isteniyorsa en az hangi derece gerekir?<br>\ne) Bu hata hangi türdendir?<\/p>\n\\[R_n=\\frac{f^{(n+1)}(c)\\,(x-a)^{n+1}}{(n+1)!}\\]","s":"<p><b>Türevler:<\/b> eˣ'in bütün türevleri eˣ. x₀ = 0'da hepsi 1.<\/p>\n\\[P_3(x)=1+x+\\frac{x^2}{2!}+\\frac{x^3}{3!}\\]\n<p><b>a)<\/b><\/p>\n<table><tr><th>Terim<\/th><th>Değer<\/th><th>Kümülatif<\/th><\/tr>\n<tr><td>1<\/td><td>1.000000<\/td><td>1.000000<\/td><\/tr>\n<tr><td>x = 0.5<\/td><td>0.500000<\/td><td>1.500000<\/td><\/tr>\n<tr><td>x²/2 = 0.25/2<\/td><td>0.125000<\/td><td>1.625000<\/td><\/tr>\n<tr><td>x³/6 = 0.125/6<\/td><td>0.020833<\/td><td>1.645833<\/td><\/tr><\/table>\n<p>P₃(0.5) = <b>1.645833<\/b>.<\/p>\n<p><b>b)<\/b> E = |1.648721 − 1.645833| = <b>0.002888<\/b> (%0.18).<\/p>\n<p><b>c)<\/b> n = 3 olduğu için 4. türev ve 4! gelir. c ∈ (0, 0.5) ve \\(e^c\\) en büyük değerini sağ uçta alır: M = \\(e^{0.5}\\).<\/p>\n\\[\\begin{aligned}|R_3|&\\le\\frac{e^{0.5}(0.5)^4}{4!}\\\\&=\\frac{1.648721(0.0625)}{24}=0.004294\\end{aligned}\\]\n<p>Gerçek hata 0.002888 sınırın altında. Tutarlı.<\/p>\n<p><b>d)<\/b> Sınırı n'ye göre tabloya dök:<\/p>\n<table><tr><th>n<\/th><th>Sınır \\(e^{0.5}(0.5)^{n+1}/(n+1)!\\)<\/th><th>Gerçek hata<\/th><\/tr>\n<tr><td>5<\/td><td>3.578 × 10⁻⁵<\/td><td>2.335 × 10⁻⁵<\/td><\/tr>\n<tr><td>6<\/td><td>2.556 × 10⁻⁶<\/td><td>1.653 × 10⁻⁶<\/td><\/tr>\n<tr><td>7<\/td><td>1.597 × 10⁻⁷<\/td><td>1.026 × 10⁻⁷<\/td><\/tr><\/table>\n<p>Sınır 10⁻⁶'nın altına ilk kez <b>n = 7<\/b>'de iner. n = 6'da gerçek hata bile 10⁻⁶'dan büyük.<\/p>\n<p><b>e)<\/b> Seri sonlu terimde kesildi. Bu kesme hatasıdır (W1 s19). Terim sayısı arttıkça azalır.<\/p>\n<div class=\"ipucu\"><p>Sık hata: M için e⁰ = 1 almak. n = 3'te bu 0.002604 verir ve gerçek hata 0.002888'in altında kalır. Yani sınır olmaz. M her zaman aralıktaki en büyük değerdir.<\/p><\/div>","ks":["k07","k09"],"v":[],"vk":[]},"x06":{"y":"q","id":"x06","t":"İnterpolasyon mu, ekstrapolasyon mu?","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k08,k14 -->\n<p>√x'in x = 1, 4, 9 verisinden kurulan polinom P₂(x) = 1 + (x − 1)/3 − (x − 1)(x − 4)/60'tır (bkz. <a href=\"#\" data-go=\"q:a4\">A4<\/a>).<br>\na) Yaklaşım, interpolasyon ve ekstrapolasyon arasındaki farkı yazınız.<br>\nb) P₂(6.25), P₂(16) ve P₂(0) değerlerini hesaplayıp gerçek değerle karşılaştırınız. Her biri interpolasyon mu, ekstrapolasyon mu?<br>\nc) Hata farkını Lagrange hata terimiyle açıklayınız.<\/p>","s":"<p><b>a)<\/b><\/p>\n<ul><li><b>Yaklaşım:<\/b> karmaşık f(x) yerine daha basit bir g(x) kullanılır. Veri aralığına bağlı değildir. Risk: model hatası. Örnek: Taylor polinomu. Veri noktası kullanmaz, bir noktadaki türevleri kullanır.<\/li>\n<li><b>İnterpolasyon:<\/b> veri noktalarından geçen polinomla [x₀, xₙ] aralığı içinde tahmin. P(xᵢ) = yᵢ. Risk: polinom derecesi ve nokta seçimi.<\/li>\n<li><b>Ekstrapolasyon:<\/b> veri aralığı dışında tahmin. Risk: hata hızla büyüyebilir.<\/li><\/ul>\n<p><b>b)<\/b> Veri aralığı [1, 9].<\/p>\n\\[P_2(16)=1+\\frac{15}{3}-\\frac{(15)(12)}{60}=1+5-3=3\\]\n\\[P_2(0)=1-\\frac13-\\frac{(-1)(-4)}{60}=0.6\\]\n<div class=\"tw\"><table><tr><th>x<\/th><th>Tür<\/th><th>P₂(x)<\/th><th>√x<\/th><th>Mutlak fark<\/th><th>Bağıl<\/th><\/tr>\n<tr><td>6.25<\/td><td>interpolasyon<\/td><td>2.553125<\/td><td>2.5<\/td><td>0.053125<\/td><td>%2.1<\/td><\/tr>\n<tr><td>16<\/td><td>ekstrapolasyon<\/td><td>3.000000<\/td><td>4<\/td><td>1.000000<\/td><td>%25<\/td><\/tr>\n<tr><td>0<\/td><td>ekstrapolasyon<\/td><td>0.600000<\/td><td>0<\/td><td>0.600000<\/td><td>tanımsız (gerçek 0)<\/td><\/tr><\/table><\/div>\n<p><b>c)<\/b> Hata terimi:<\/p>\n\\[E_2(x)=\\frac{f'''(c)}{3!}(x-1)(x-4)(x-9)\\]\n\\[f'''(x)=\\tfrac38x^{-5/2}\\]\n<ul><li>x = 16: |çarpım| = 15·12·7 = 1260. x = 6.25'te 32.48. Çarpım 39 kat büyüdü, hata da büyüdü.<\/li>\n<li>x = 0: |çarpım| = 1·4·9 = 36. Bu 6.25'tekine yakın. Ama c artık [0, 9] aralığında ve f''' sıfıra yaklaşınca sınırsız büyür. x = 1'de f''' = 0.375, x = 0.1'de 118.6. Hatayı türev büyüttü.<\/li><\/ul>\n<p><b>Sonuç:<\/b> ekstrapolasyon iki yoldan bozar. Ya çarpım büyür ya da c aralık dışına taşar ve türev büyür.<\/p>\n<div class=\"vurgu\"><p>\"Hesaplanan ara değer ölçülmüş değer gibi sunulmamalıdır. İnterpolasyon sonucu her zaman hata payı ile birlikte verilmelidir!\" <span class=\"kaynak\">G2 s17<\/span><\/p><\/div>\n<div class=\"ipucu\"><p>Sık hata: x = 0'daki büyük hatayı yalnız çarpıma bağlamak. Çarpım orada küçük, sebep f'''.<\/p><\/div>","ks":["k08","k14"],"v":[],"vk":[]},"x07":{"y":"q","id":"x07","t":"Taylor: cos x, kalan terim, açılım noktası","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k09 -->\n<p>a) cos x'i x₀ = 0 etrafında 3. dereceye kadar açınız.<br>\nb) P₃(0.3) ve P₃(1.2) değerlerini hesaplayıp gerçek değerle karşılaştırınız.<br>\nc) Lagrange kalan terimiyle her iki nokta için hata üst sınırını bulunuz.<br>\nd) x = 1.2 için açılım noktası x₀ = 1 seçilseydi ne değişirdi? (cos 1 = 0.540302, sin 1 = 0.841471)<br>\ne) Hesap makinesi DEG modunda kalırsa ne olur?<\/p>","s":"<p><b>a)<\/b> Türev döngüsü ve x₀ = 0'daki değerler:<\/p>\n<div class=\"tw\"><table><tr><th>f<\/th><th>f'<\/th><th>f''<\/th><th>f'''<\/th><th>f⁽⁴⁾<\/th><\/tr>\n<tr><td>cos x → 1<\/td><td>−sin x → 0<\/td><td>−cos x → −1<\/td><td>sin x → 0<\/td><td>cos x<\/td><\/tr><\/table><\/div>\n\\[P_3(x)=1-\\frac{x^2}{2!}\\quad(x\\ \\text{ve}\\ x^3\\ \\text{katsayısı}\\ 0)\\]\n<p><b>b)<\/b> P₃(0.3) = 1 − 0.09/2 = 0.955000. cos 0.3 = 0.955336.<br>\nP₃(1.2) = 1 − 1.44/2 = 0.280000. cos 1.2 = 0.362358.<\/p>\n<p><b>c)<\/b> |f⁽⁴⁾(c)| = |cos c| ≤ 1.<\/p>\n\\[|R_3|\\le\\frac{x^4}{4!}\\]\n<div class=\"tw\"><table><tr><th>x<\/th><th>P₃(x)<\/th><th>cos x<\/th><th>Mutlak fark<\/th><th>Sınır x⁴/24<\/th><\/tr>\n<tr><td>0.3<\/td><td>0.955000<\/td><td>0.955336<\/td><td>0.000336<\/td><td>0.000338<\/td><\/tr>\n<tr><td>1.2<\/td><td>0.280000<\/td><td>0.362358<\/td><td>0.082358<\/td><td>0.086400<\/td><\/tr><\/table><\/div>\n<p>İki hata da sınırın altında. 1.2 merkezden uzak, hata 245 kat büyük.<\/p>\n<p><b>d)<\/b> x₀ = 1, h = x − x₀ = 0.2:<\/p>\n\\[\\begin{aligned}P_3(1.2)&=\\cos1-\\sin1(0.2)\\\\&\\quad-\\cos1\\tfrac{(0.2)^2}{2}+\\sin1\\tfrac{(0.2)^3}{6}\\\\&=0.540302-0.168294\\\\&\\quad-0.010806+0.001122\\\\&=0.362324\\end{aligned}\\]\n<p>Hata |0.362358 − 0.362324| = 3.4 × 10⁻⁵. Sınır 0.2⁴/24 = 6.7 × 10⁻⁵. Hata yaklaşık 2400 kat azaldı.<\/p>\n<p><b>e)<\/b> DEG modunda cos(0.3°) = 0.999986 çıkar. Taylor serisinde x radyandır. Derece doğrudan kullanılamaz.<\/p>\n<div class=\"vurgu\"><p>\"Taylor polinomunun doğruluğu sadece dereceye değil açılım noktası ile hesaplanacak nokta arasındaki UZAKLIĞA da bağlıdır.\" <span class=\"kaynak\">G2 s7<\/span><\/p><\/div>\n<div class=\"ipucu\"><p>Sık hata: \"3. derece\" deyince x³ terimi aramak. cos'ta x³ katsayısı 0. Kalan terim yine 4. türev ve 4! ile yazılır.<\/p><\/div>","ks":["k09"],"v":[],"vk":[]},"x08":{"y":"q","id":"x08","t":"Horner kuralı","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k10 -->\n<p>P(x) = 2x⁴ − 3x³ + x − 5 veriliyor.<br>\na) Horner kuralıyla P(3) değerini bulunuz.<br>\nb) Kaç çarpma ve toplama gerekti? Doğrudan hesapla karşılaştırınız.<br>\nc) Horner şemasını ikinci kez uygulayarak P'(3) değerini bulunuz.<br>\nd) P(−1.5) değerini Horner ile bulunuz.<\/p>\n\\[b_4=a_4,\\quad b_k=a_k+x\\,b_{k+1},\\quad P(x)=b_0\\]","s":"<p><b>Katsayılar:<\/b> a₄ = 2, a₃ = −3, a₂ = 0 (x² yok), a₁ = 1, a₀ = −5.<\/p>\n<p><b>a)<\/b> x = 3:<\/p>\n<table><tr><th>Adım<\/th><th>Hesap<\/th><th>Sonuç<\/th><\/tr>\n<tr><td>b₄ = a₄<\/td><td><\/td><td>2<\/td><\/tr>\n<tr><td>b₃ = a₃ + x b₄<\/td><td>−3 + 3·2<\/td><td>3<\/td><\/tr>\n<tr><td>b₂ = a₂ + x b₃<\/td><td>0 + 3·3<\/td><td>9<\/td><\/tr>\n<tr><td>b₁ = a₁ + x b₂<\/td><td>1 + 3·9<\/td><td>28<\/td><\/tr>\n<tr><td>b₀ = a₀ + x b₁<\/td><td>−5 + 3·28<\/td><td>79<\/td><\/tr><\/table>\n<p>P(3) = <b>79<\/b>. Kontrol: 2·81 − 3·27 + 3 − 5 = 162 − 81 + 3 − 5 = 79.<\/p>\n<p><b>b)<\/b> Horner: 4 çarpma + 4 toplama = 8 işlem. Doğrudan: 4 kuvvet + 4 çarpma + 4 toplama = 12 işlem (G2 s8 sayımı).<\/p>\n<p><b>c)<\/b> İlk geçişin b₄…b₁ değerleri (2, 3, 9, 28) yeni katsayı olur:<\/p>\n<table><tr><th>Adım<\/th><th>Hesap<\/th><th>Sonuç<\/th><\/tr>\n<tr><td>c₄<\/td><td>2<\/td><td>2<\/td><\/tr>\n<tr><td>c₃<\/td><td>3 + 3·2<\/td><td>9<\/td><\/tr>\n<tr><td>c₂<\/td><td>9 + 3·9<\/td><td>36<\/td><\/tr>\n<tr><td>c₁<\/td><td>28 + 3·36<\/td><td>136<\/td><\/tr><\/table>\n<p>P'(3) = <b>136<\/b>. Kontrol: P'(x) = 8x³ − 9x² + 1, P'(3) = 216 − 81 + 1 = 136.<\/p>\n<p class=\"sn\">Slayt \"Türev hesapları için Horner şeması genişletilebilir\" diyor, yöntemi göstermiyor (G2 s8). c şıkkı bu cümlenin uygulaması.<\/p>\n<p><b>d)<\/b> x = −1.5: b₄ = 2; b₃ = −3 + (−1.5)(2) = −6; b₂ = 0 + (−1.5)(−6) = 9; b₁ = 1 + (−1.5)(9) = −12.5; b₀ = −5 + (−1.5)(−12.5) = <b>13.75<\/b>.<\/p>\n<div class=\"ipucu\"><p>Sık hata: eksik kuvvetin katsayısını (burada x²) atlamak. 0 yazılmazsa bütün zincir kayar. Negatif x'te işaretleri tek tek yaz.<\/p><\/div>","ks":["k10"],"v":[],"vk":[]},"x09":{"y":"q","id":"x09","t":"Doğrusal interpolasyon ve hata sınırı","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k11 -->\n<table><tr><th>x<\/th><td>2.0<\/td><td>3.0<\/td><\/tr><tr><th>ln x<\/th><td>0.693147<\/td><td>1.098612<\/td><\/tr><\/table>\n<p>a) Doğrusal interpolasyonla ln 2.4 değerini bulunuz.<br>\nb) Gerçek ln 2.4 = 0.875469 ile karşılaştırınız.<br>\nc) Hata terimiyle x = 2.4 için üst sınırı bulunuz. Genel sınır E ≈ (h²/8) max|f''| ile de karşılaştırınız.<br>\nd) Tahmin gerçek değerden büyük mü küçük mü? Neden?<\/p>\n\\[P_1(x)=f(x_0)+\\frac{f(x_1)-f(x_0)}{x_1-x_0}(x-x_0)\\]","s":"<p><b>a)<\/b> Eğim m = (1.098612 − 0.693147)/(3 − 2) = 0.405465.<\/p>\n<p>P₁(2.4) = 0.693147 + 0.405465(0.4) = 0.693147 + 0.162186 = <b>0.855333<\/b>.<\/p>\n<p><b>b)<\/b> E = |0.875469 − 0.855333| = <b>0.020136<\/b> (%2.3).<\/p>\n<p><b>c)<\/b> f'' = −1/x². [2, 3]'te en büyük |f''| = 1/4 (x = 2'de).<\/p>\n\\[f(x)-P_1(x)=\\frac{f''(c)}{2!}(x-x_0)(x-x_1)\\]\n\\[|E|\\le\\frac{1/4}{2}\\,|(0.4)(-0.6)|=0.030\\]\n\\[\\text{Genel: }\\frac{h^2}{8}\\max|f''|=\\frac18\\cdot\\frac14=0.03125\\]\n<p>Gerçek hata 0.020136 iki sınırın da altında. En küçük |f''| = 1/9 ile alt sınır 0.0133 çıkar. Gerçek hata ikisinin arasında.<\/p>\n<p><b>d)<\/b> Küçük. f'' &lt; 0, eğri içbükey. Kiriş eğrinin altında kalır. Hata teriminde (0.4)(−0.6) &lt; 0 ve f'' &lt; 0, çarpım pozitif. Yani f − P₁ &gt; 0.<\/p>\n<div class=\"ipucu\"><p>Sık hata: max|f''| için x = 3'ü almak. 1/9 ile bulunan 0.0133 gerçek hatanın altında kalır, sınır olmaz.<\/p><\/div>","ks":["k11"],"v":[],"vk":[]},"x10":{"y":"q","id":"x10","t":"Newton bölünmüş fark P₃ ve Lagrange ile doğrulama","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k12,k13,k14 -->\n<div class=\"tw\"><table><tr><th>x<\/th><td>−1<\/td><td>0<\/td><td>2<\/td><td>3<\/td><\/tr><tr><th>f(x)<\/th><td>1<\/td><td>1<\/td><td>7<\/td><td>25<\/td><\/tr><\/table><\/div>\n<p>a) Aralıklar eşit mi? Hangi yöntem kullanılmalı?<br>\nb) Bölünmüş fark tablosunu kurup P₃(x)'i Newton formunda yazınız.<br>\nc) P₃(1.5) değerini bulunuz.<br>\nd) P₃(1.5)'i Lagrange ile hesaplayıp karşılaştırınız.<br>\ne) (4, 61) noktası eklenirse Newton polinomu nasıl değişir?<\/p>","s":"<p><b>a)<\/b> Aralıklar 1, 2, 1. Eşit değil. NİFİF (slaytta NIFF) ve NGFİF (slaytta NGFF) kullanılamaz. Newton bölünmüş fark kullanılır.<\/p>\n<div class=\"vurgu\"><p>\"Dikkat: h SABIT olmalı! Değilse Newton Bölünmüş Fark kullanılır.\" <span class=\"kaynak\">W234 s16<\/span><\/p><\/div>\n<p><b>b)<\/b><\/p>\n<div class=\"tw\"><table><tr><th>xᵢ<\/th><th>f[xᵢ]<\/th><th>1. fark<\/th><th>2. fark<\/th><th>3. fark<\/th><\/tr>\n<tr><td>−1<\/td><td>1<\/td><td>(1 − 1)/(0 + 1) = 0<\/td><td>(3 − 0)/(2 + 1) = 1<\/td><td>(5 − 1)/(3 + 1) = 1<\/td><\/tr>\n<tr><td>0<\/td><td>1<\/td><td>(7 − 1)/(2 − 0) = 3<\/td><td>(18 − 3)/(3 − 0) = 5<\/td><td><\/td><\/tr>\n<tr><td>2<\/td><td>7<\/td><td>(25 − 7)/(3 − 2) = 18<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>3<\/td><td>25<\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div>\n\\[\\begin{aligned}P_3(x)&=1+0(x+1)+1(x+1)x\\\\&\\quad+1(x+1)x(x-2)\\\\&=x^3-x+1\\end{aligned}\\]\n<p><b>c)<\/b> P₃(1.5) = 1 + 0 + (2.5)(1.5) + (2.5)(1.5)(−0.5) = 1 + 3.75 − 1.875 = <b>2.875<\/b>.<\/p>\n<p><b>d)<\/b> Lagrange taban polinomları x = 1.5'te:<\/p>\n\\[L_0=\\frac{(1.5)(-0.5)(-1.5)}{(-1)(-3)(-4)}=\\frac{1.125}{-12}=-0.09375\\]\n\\[L_1=\\frac{(2.5)(-0.5)(-1.5)}{(1)(-2)(-3)}=\\frac{1.875}{6}=0.3125\\]\n\\[L_2=\\frac{(2.5)(1.5)(-1.5)}{(3)(2)(-1)}=\\frac{-5.625}{-6}=0.9375\\]\n\\[L_3=\\frac{(2.5)(1.5)(-0.5)}{(4)(3)(1)}=\\frac{-1.875}{12}=-0.15625\\]\n<p>Kontrol: L₀ + L₁ + L₂ + L₃ = 1.<\/p>\n<p>P₃(1.5) = 1(−0.09375) + 1(0.3125) + 7(0.9375) + 25(−0.15625) = −0.09375 + 0.3125 + 6.5625 − 3.90625 = <b>2.875<\/b>.<\/p>\n<p><b>Karşılaştırma:<\/b> iki yöntem aynı sonucu verir. n + 1 noktadan geçen en fazla n. dereceden polinom tektir. Newton ve Lagrange onu farklı biçimde yazar.<\/p>\n<p><b>e)<\/b> 64 − 4 + 1 = 61, yeni nokta da x³ − x + 1 üzerinde. Tabloya bir satır eklenir: 3. farklar 1, 1 ve 4. fark 0. Newton'a yalnız 0·(x + 1)x(x − 2)(x − 3) terimi eklenir, polinom değişmez. Lagrange'da bütün Lᵢ yeniden hesaplanır.<\/p>\n<div class=\"vurgu\"><p>\"Yeni nokta eklendiğinde sadece yeni terim eklenir, önceki polinomun tamamı yeniden hesaplanmaz! Bu Newton formunun büyük avantajıdır.\" <span class=\"kaynak\">G2 s13<\/span><\/p><\/div>\n<div class=\"ipucu\"><p>Sık hata: 2. farkın paydasına komşu farkı yazmak. f[x₀, x₁, x₂] paydası x₂ − x₀ = 3. 3. farkın paydası x₃ − x₀ = 4.<\/p><\/div>","ks":["k12","k13","k14"],"v":[],"vk":[]},"x11":{"y":"q","id":"x11","t":"Fark operatörleri: E, Δ, ∇, δ ve Pascal","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k16,k17 -->\n<div class=\"tw\"><table><tr><th>x<\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><\/tr><tr><th>f(x)<\/th><td>1<\/td><td>3<\/td><td>11<\/td><td>31<\/td><td>69<\/td><\/tr><\/table><\/div>\n<p>h = 1.<br>\na) Pascal üçgeniyle Δ³f₀'ı yalnız f değerleriyle yazıp hesaplayınız.<br>\nb) ∇²f₄, δ²f₃ ve Δ²f₂ değerlerini hesaplayınız. Neden eşit çıkıyor?<br>\nc) δ⁴f₂'yi hesaplayınız. Sonuç ne anlama gelir?<br>\nd) E = 1 + Δ bağıntısıyla E²f₀ ve E³f₀'ı farklardan hesaplayınız. Tabloyla karşılaştırınız.<br>\ne) ∇ = 1 − E⁻¹ ile ∇f₄'ü bulunuz.<\/p>","s":"<p><b>İleri fark tablosu:<\/b><\/p>\n<div class=\"tw\"><table><tr><th>xᵢ<\/th><th>fᵢ<\/th><th>Δf<\/th><th>Δ²f<\/th><th>Δ³f<\/th><th>Δ⁴f<\/th><\/tr>\n<tr><td>0<\/td><td>1<\/td><td>2<\/td><td>6<\/td><td>6<\/td><td>0<\/td><\/tr>\n<tr><td>1<\/td><td>3<\/td><td>8<\/td><td>12<\/td><td>6<\/td><td><\/td><\/tr>\n<tr><td>2<\/td><td>11<\/td><td>20<\/td><td>18<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>3<\/td><td>31<\/td><td>38<\/td><td><\/td><td><\/td><td><\/td><\/tr>\n<tr><td>4<\/td><td>69<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div>\n<p><b>a)<\/b> Pascal 3. satırı 1 3 3 1. İşaretler en yüksek indisten başlayarak +, −, +, −.<\/p>\n\\[\\Delta^3f_0=f_3-3f_2+3f_1-f_0=31-33+9-1=6\\]\n<p>Tablodaki Δ³f₀ = 6 ile aynı.<\/p>\n<p><b>b)<\/b><\/p>\n\\[\\nabla^2f_4=f_4-2f_3+f_2=69-62+11=18\\]\n\\[\\delta^2f_3=f_4-2f_3+f_2=18,\\qquad \\Delta^2f_2=f_4-2f_3+f_2=18\\]\n<p>Üçü de aynı üç noktayı (x₂, x₃, x₄) aynı katsayılarla (1, −2, 1) kullanıyor. Fark yalnız sonucun hangi noktaya yazıldığında: Δ² baştaki, ∇² sondaki, δ² ortadaki noktaya.<\/p>\n<div class=\"vurgu\"><p>\"δ²f(xᵢ) ile Δ²f(xᵢ) ve ∇²f(xᵢ)'nin katsayıları (1 −2 +1) aynıdır. Fark, kullanılan noktalardadır.\" <span class=\"kaynak\">W234 s23<\/span><\/p><\/div>\n<p><b>c)<\/b><\/p>\n\\[\\begin{aligned}\\delta^4f_2&=f_4-4f_3+6f_2-4f_1+f_0\\\\&=69-124+66-12+1=0\\end{aligned}\\]\n<p>Bu Δ⁴f₀ ile aynı. 4. fark 0 ise veri en fazla 3. dereceden polinomdur. Gerçekten f = x³ + x + 1.<\/p>\n<p><b>d)<\/b> Δf₀ = 2, Δ²f₀ = 6, Δ³f₀ = 6.<\/p>\n\\[E^2f_0=(1+\\Delta)^2f_0=f_0+2\\Delta f_0+\\Delta^2f_0\\]\n\\[=1+2(2)+6=11=f_2\\]\n\\[E^3f_0=f_0+3\\Delta f_0+3\\Delta^2f_0+\\Delta^3f_0\\]\n\\[=1+6+18+6=31=f_3\\]\n<p>İkisi de tabloyla aynı. NİFİF (slaytta NIFF) bu fikirden çıkar: f(x₀ + sh) = (1 + Δ)ˢ f₀.<\/p>\n<p><b>e)<\/b> ∇f₄ = (1 − E⁻¹)f₄ = f₄ − f₃ = 69 − 31 = <b>38<\/b>. Bu Δf₃ ile aynı sayı.<\/p>\n<div class=\"ipucu\"><p>Sık hatalar: Δ³'te son terimin işaretini + yazmak (−f₀ olmalı). ∇'da indisleri ileri saymak; ∇ hep geriye bakar: f₄, f₃, f₂.<\/p><\/div>","ks":["k16","k17"],"v":[],"vk":[]},"x12":{"y":"q","id":"x12","t":"Fark tablosu ve polinom derecesi","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k18,k20 -->\n<p>f(x) = x³ − 2x veriliyor, x = 0, 1, 2, 3, 4 (h = 1).<br>\na) İleri fark tablosunu kurunuz.<br>\nb) Polinomun derecesini tablodan bulunuz. Δ³f'nin neden bu değeri aldığını açıklayınız.<br>\nc) Aynı fonksiyon h = 0.5 ile (x = 0, 0.5, …, 2) tablolanırsa Δ³f kaç olur? Tablo kurmadan bulunuz.<br>\nd) NİFİF (slaytta NIFF) ile f(1.5) değerini bulup gerçek değerle karşılaştırınız.<\/p>","s":"<p><b>a)<\/b> f = 0, −1, 4, 21, 56.<\/p>\n<div class=\"tw\"><table><tr><th>xᵢ<\/th><th>fᵢ<\/th><th>Δf<\/th><th>Δ²f<\/th><th>Δ³f<\/th><th>Δ⁴f<\/th><\/tr>\n<tr><td>0<\/td><td>0<\/td><td>−1<\/td><td>6<\/td><td>6<\/td><td>0<\/td><\/tr>\n<tr><td>1<\/td><td>−1<\/td><td>5<\/td><td>12<\/td><td>6<\/td><td><\/td><\/tr>\n<tr><td>2<\/td><td>4<\/td><td>17<\/td><td>18<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>3<\/td><td>21<\/td><td>35<\/td><td><\/td><td><\/td><td><\/td><\/tr>\n<tr><td>4<\/td><td>56<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div>\n<p><b>b)<\/b> Δ³f sabit (6), Δ⁴f = 0. Veri 3. dereceden polinom.<\/p>\n<div class=\"vurgu\"><p>\"Fark tablosunda n. mertebe sabitlenirse, elimizdeki veri en fazla n. dereceden bir polinom tarafından üretilmiştir.\" <span class=\"kaynak\">W234 s26<\/span><\/p><\/div>\n<p>aₙxⁿ teriminin n. farkı n!·aₙ·hⁿ'dir. Burada 3!·1·1³ = 6.<\/p>\n<p><b>c)<\/b> 3!·1·(0.5)³ = 6·0.125 = <b>0.75<\/b>. Tablo kurulunca da Δ³f = 0.75, 0.75 çıkar.<\/p>\n<p><b>d)<\/b> s = (1.5 − 0)/1 = 1.5. Katsayılar: s = 1.5; s(s − 1)/2 = 0.375; s(s − 1)(s − 2)/6 = −0.0625.<\/p>\n\\[\\begin{aligned}P(1.5)&=0+1.5(-1)+0.375(6)-0.0625(6)\\\\&=-1.5+2.25-0.375=0.375\\end{aligned}\\]\n<p>Gerçek: 1.5³ − 2(1.5) = 3.375 − 3 = 0.375. Fark 0. Veri kübik, 4 terimli NİFİF tam sonuç verir.<\/p>\n<p class=\"sn\">n!·aₙ·hⁿ kuralı slaytta yazılı değil. Kural slayttaki x³ örneğinden (Δ³f = 6) çıkar.<\/p>\n<div class=\"ipucu\"><p>Sık hata: Δ³f = 6 görüp x³'ün katsayısını 6 sanmak. Katsayı a₃ = Δ³f/(3!·h³) = 1.<\/p><\/div>","ks":["k18","k20"],"v":[],"vk":[]},"x13":{"y":"q","id":"x13","t":"Merkezi farkın üstünlüğü: h = 0.1 ve h = 0.05","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k19,k24,k25 -->\n<p>f(x) = sin x, x₀ = π/6 = 0.523599 rad. Tablo (6 ondalık):<\/p>\n<div class=\"tw\"><table><tr><th>x<\/th><td>0.423599<\/td><td>0.473599<\/td><td>0.523599<\/td><td>0.573599<\/td><td>0.623599<\/td><\/tr>\n<tr><th>sin x<\/th><td>0.411044<\/td><td>0.456092<\/td><td>0.500000<\/td><td>0.542658<\/td><td>0.583960<\/td><\/tr><\/table><\/div>\n<p>a) h = 0.1 için ileri, geri ve merkezi farkla f'(x₀) değerini hesaplayınız.<br>\nb) Aynısını h = 0.05 ile yapınız.<br>\nc) Gerçek cos(π/6) = 0.866025 ile hataları karşılaştırınız. h yarıya inince her hata kaç kat küçüldü?<br>\nd) Slayttaki \"merkezi fark bu örnekte yanıltıcı görünüyor\" yorumu doğru mu?<\/p>","s":"<p><b>Formüller:<\/b> FD1 = [f(x₀ + h) − f(x₀)]/h, BD1 = [f(x₀) − f(x₀ − h)]/h, CD2 = [f(x₀ + h) − f(x₀ − h)]/(2h).<\/p>\n<p><b>a) h = 0.1:<\/b> ileri 0.083960/0.1 = 0.839600. Geri 0.088956/0.1 = 0.889560. Merkezi 0.172916/0.2 = 0.864580.<\/p>\n<p><b>b) h = 0.05:<\/b> ileri 0.042658/0.05 = 0.853160. Geri 0.043908/0.05 = 0.878160. Merkezi 0.086566/0.1 = 0.865660.<\/p>\n<p><b>c)<\/b><\/p>\n<div class=\"tw\"><table><tr><th>Yöntem<\/th><th>h = 0.1<\/th><th>Hata<\/th><th>h = 0.05<\/th><th>Hata<\/th><th>Oran<\/th><\/tr>\n<tr><td>İleri (FD1)<\/td><td>0.839600<\/td><td>0.026425<\/td><td>0.853160<\/td><td>0.012865<\/td><td>2.05<\/td><\/tr>\n<tr><td>Geri (BD1)<\/td><td>0.889560<\/td><td>0.023535<\/td><td>0.878160<\/td><td>0.012135<\/td><td>1.94<\/td><\/tr>\n<tr><td>Merkezi (CD2)<\/td><td>0.864580<\/td><td>0.001445<\/td><td>0.865660<\/td><td>0.000365<\/td><td>3.96<\/td><\/tr><\/table><\/div>\n<p>İleri ve geri farkta hata yarıya iniyor: O(h). Merkezi farkta dörtte bire iniyor: O(h²).<\/p>\n<p>Kesme hatası tahmini: FD1 ≈ (h/2)|f''| = (h/2)(0.5), yani 0.025 ve 0.0125. CD2 ≈ (h²/6)|f'''| = (h²/6)(0.866), yani 0.001443 ve 0.000361. Bulunan hatalarla uyumlu.<\/p>\n<p><b>d)<\/b> Doğru değil. Merkezi fark h = 0.1'de de en iyisi. Hatası ileri farkın 18'de biri.<\/p>\n<div class=\"slhata\"><p>Slayt sin(0.4236) = 0.41165 ve sin(0.6236) = 0.58070 yazıyor. Doğrusu 0.41104 ve 0.58396. Yanlış değerlerle merkezi hata 0.0207 çıkıyor ve \"yanıltıcı\" yorumu buradan geliyor. Doğru değerlerle merkezi hata 0.0014. <span class=\"kaynak\">W234 s27<\/span><\/p><\/div>\n<div class=\"ipucu\"><p>Sık hatalar: CD2'de paydaya h yazmak, doğrusu 2h. CD2'de f(x₀) kullanılmaz. Hesap makinesi RAD modunda olmalı.<\/p><\/div>","ks":["k19","k24","k25"],"v":[],"vk":[]},"x14":{"y":"q","id":"x14","t":"NİFİF: 4 nokta yerine 5 nokta","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k20,k18 -->\n<p>cos x tablosu (6 ondalık, h = 0.5):<\/p>\n<div class=\"tw\"><table><tr><th>x<\/th><td>0.0<\/td><td>0.5<\/td><td>1.0<\/td><td>1.5<\/td><td>2.0<\/td><\/tr><tr><th>f(x)<\/th><td>1.000000<\/td><td>0.877583<\/td><td>0.540302<\/td><td>0.070737<\/td><td>−0.416147<\/td><\/tr><\/table><\/div>\n<p>a) İlk dört noktayla NİFİF (slaytta NIFF) (P₃) kullanarak f(0.25) değerini bulunuz.<br>\nb) Beş noktanın hepsiyle (P₄) f(0.25) değerini bulunuz.<br>\nc) cos 0.25 = 0.968912 ile karşılaştırınız. Beşinci nokta hatayı ne kadar azalttı?<br>\nd) Hata terimiyle iki sonucun hata sınırını bulunuz. Gerçek hata sınırla uyumlu mu?<\/p>\n\\[\\begin{aligned}P(x)=f_0&+s\\Delta f_0+\\tfrac{s(s-1)}{2!}\\Delta^2f_0\\\\&+\\tfrac{s(s-1)(s-2)}{3!}\\Delta^3f_0\\\\&+\\tfrac{s(s-1)(s-2)(s-3)}{4!}\\Delta^4f_0\\end{aligned}\\]","s":"<p><b>Fark tablosu<\/b> (ilk dört nokta tablonun üst kısmını verir):<\/p>\n<div class=\"tw\"><table><tr><th>xᵢ<\/th><th>fᵢ<\/th><th>Δf<\/th><th>Δ²f<\/th><th>Δ³f<\/th><th>Δ⁴f<\/th><\/tr>\n<tr><td>0.0<\/td><td>1.000000<\/td><td>−0.122417<\/td><td>−0.214864<\/td><td>0.082580<\/td><td>0.032385<\/td><\/tr>\n<tr><td>0.5<\/td><td>0.877583<\/td><td>−0.337281<\/td><td>−0.132284<\/td><td>0.114965<\/td><td><\/td><\/tr>\n<tr><td>1.0<\/td><td>0.540302<\/td><td>−0.469565<\/td><td>−0.017319<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>1.5<\/td><td>0.070737<\/td><td>−0.486884<\/td><td><\/td><td><\/td><td><\/td><\/tr>\n<tr><td>2.0<\/td><td>−0.416147<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div>\n<p>s = (0.25 − 0)/0.5 = 0.5.<\/p>\n<div class=\"tw\"><table><tr><th>k<\/th><th>Katsayı<\/th><th>Δᵏf₀<\/th><th>Terim<\/th><th>Kümülatif<\/th><\/tr>\n<tr><td>0<\/td><td>1<\/td><td>1.000000<\/td><td>1.000000<\/td><td>1.000000<\/td><\/tr>\n<tr><td>1<\/td><td>s = 0.5<\/td><td>−0.122417<\/td><td>−0.061209<\/td><td>0.938792<\/td><\/tr>\n<tr><td>2<\/td><td>0.5(−0.5)/2 = −0.125<\/td><td>−0.214864<\/td><td>0.026858<\/td><td>0.965650<\/td><\/tr>\n<tr><td>3<\/td><td>0.5(−0.5)(−1.5)/6 = 0.0625<\/td><td>0.082580<\/td><td>0.005161<\/td><td>0.970811<\/td><\/tr>\n<tr><td>4<\/td><td>0.5(−0.5)(−1.5)(−2.5)/24 = −0.039063<\/td><td>0.032385<\/td><td>−0.001265<\/td><td>0.969546<\/td><\/tr><\/table><\/div>\n<p><b>a)<\/b> P₃(0.25) = <b>0.970811<\/b> (≈ 0.9708).<br><b>b)<\/b> P₄(0.25) = <b>0.969546<\/b> (≈ 0.9695).<\/p>\n<p><b>c)<\/b><\/p>\n<div class=\"tw\"><table><tr><th>Yöntem<\/th><th>Hesaplanan<\/th><th>Gerçek<\/th><th>Mutlak fark<\/th><th>Bağıl<\/th><\/tr>\n<tr><td>NİFİF, 4 nokta<\/td><td>0.970811<\/td><td>0.968912<\/td><td>0.001898<\/td><td>%0.20<\/td><\/tr>\n<tr><td>NİFİF, 5 nokta<\/td><td>0.969546<\/td><td>0.968912<\/td><td>0.000633<\/td><td>%0.07<\/td><\/tr><\/table><\/div>\n<p>Beşinci nokta hatayı 3 kat azalttı.<\/p>\n<p><b>d)<\/b> Hata terimi xᵢ = x₀ + ih ile:<\/p>\n\\[E_n=\\frac{h^{n+1}\\,s(s-1)\\cdots(s-n)}{(n+1)!}f^{(n+1)}(c)\\]\n<p>P₃: |s(s − 1)(s − 2)(s − 3)| = 0.9375, h⁴ = 0.0625, |f⁽⁴⁾| = |cos| ≤ 1. Sınır 0.0625·0.9375/24 = 0.002441. Gerçek 0.001898. Sınırın altında.<\/p>\n<p>P₄: |…(s − 4)| = 3.28125, h⁵ = 0.03125, |f⁽⁵⁾| = |sin| ≤ 1 (π/2 aralıkta). Sınır 0.03125·3.28125/120 = 0.000854. Gerçek 0.000633. Sınırın altında.<\/p>\n<p><b>Yorum:<\/b> 5. nokta kesme hatasını azalttı. Δ⁴f = 0.032385 sıfıra yakın değil. Bu yüzden terim eklemek işe yaradı.<\/p>\n<div class=\"vurgu\"><p>\"Δⁿf ≈ 0 olmaya başladığında dur! Genelde 3-4 terim yeterli.\" <span class=\"kaynak\">W234 s30<\/span><\/p><\/div>\n<div class=\"slhata\"><p>Slayt aynı örnekte Δ²f'nin ikinci değerini 0.050, Δ³f₀'ı 0.266 yazıyor ve P₃(0.25) = 0.9494, hata %2 buluyor. Doğrusu −0.131, 0.085 ve 0.9713, hata %0.25. \"Hata büyük\" yorumu da yanlış. <span class=\"kaynak\">W234 s31<\/span><\/p><\/div>\n<div class=\"ipucu\"><p>Sık hata: s(s − 1)(s − 2)(s − 3) işaretini kaçırmak. s = 0.5'te üç çarpan negatif, sonuç negatif.<\/p><p>Veri 3 ondalık verilirse P₄(0.25) = 0.970219 ve hata 0.001306 çıkar. Bu, sınırı aşar. Yuvarlama hatası kesme hatasından büyük olunca terim eklemek fayda etmez.<\/p><\/div>","ks":["k20","k18"],"v":[],"vk":[]},"x15":{"y":"q","id":"x15","t":"Stirling ve formül seçimi","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k22,k23,k20,k21 -->\n<p>eˣ tablosu (4 ondalık, h = 0.1):<\/p>\n<div class=\"tw\"><table><tr><th>x<\/th><td>1.0<\/td><td>1.1<\/td><td>1.2<\/td><td>1.3<\/td><td>1.4<\/td><\/tr><tr><th>f(x)<\/th><td>2.7183<\/td><td>3.0042<\/td><td>3.3201<\/td><td>3.6693<\/td><td>4.0552<\/td><\/tr><\/table><\/div>\n<p>a) Fark tablosunu kurunuz.<br>\nb) x = 1.02, 1.24 ve 1.38 için |s| kuralına göre hangi formül seçilmeli?<br>\nc) Merkez 1.2 alarak Stirling formülüyle f(1.24) değerini terim terim hesaplayınız.<br>\nd) f(1.02)'yi NİFİF (slaytta NIFF), f(1.38)'i NGFİF (slaytta NGFF) ile (ilk üç terim) hesaplayınız.<br>\ne) Gerçek değerlerle karşılaştırınız: \\(e^{1.02}\\) = 2.773195, \\(e^{1.24}\\) = 3.455613, \\(e^{1.38}\\) = 3.974902.<\/p>\n\\[\\begin{aligned}P(x)=f_0&+s\\,\\mu\\Delta f_0+\\tfrac{s^2}{2!}\\Delta^2f_{-1}\\\\&+\\tfrac{s(s^2-1)}{3!}\\mu\\Delta^3f_{-1}\\\\&+\\tfrac{s^2(s^2-1)}{4!}\\Delta^4f_{-2}\\end{aligned}\\]","s":"<p><b>a)<\/b><\/p>\n<div class=\"tw\"><table><tr><th>xᵢ<\/th><th>fᵢ<\/th><th>Δf<\/th><th>Δ²f<\/th><th>Δ³f<\/th><th>Δ⁴f<\/th><\/tr>\n<tr><td>1.0<\/td><td>2.7183<\/td><td>0.2859<\/td><td>0.0300<\/td><td>0.0033<\/td><td>0.0001<\/td><\/tr>\n<tr><td>1.1<\/td><td>3.0042<\/td><td>0.3159<\/td><td>0.0333<\/td><td>0.0034<\/td><td><\/td><\/tr>\n<tr><td>1.2<\/td><td>3.3201<\/td><td>0.3492<\/td><td>0.0367<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>1.3<\/td><td>3.6693<\/td><td>0.3859<\/td><td><\/td><td><\/td><td><\/td><\/tr>\n<tr><td>1.4<\/td><td>4.0552<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div>\n<p><b>b)<\/b> Kural: |s|'yi en küçük yapan formül. |s| &lt; 0.25 ise en yakın uç formülü, 0.25 &lt; |s| &lt; 0.75 ise Stirling (W234 s32).<\/p>\n<table><tr><th>x<\/th><th>Referans<\/th><th>s<\/th><th>Formül<\/th><\/tr>\n<tr><td>1.02<\/td><td>x₀ = 1.0<\/td><td>0.2<\/td><td>NİFİF<\/td><\/tr>\n<tr><td>1.24<\/td><td>xᵢ = 1.2<\/td><td>0.4<\/td><td>Stirling<\/td><\/tr>\n<tr><td>1.38<\/td><td>xₙ = 1.4<\/td><td>−0.2<\/td><td>NGFİF<\/td><\/tr><\/table>\n<p><b>c)<\/b> Merkez f₀ = 3.3201 (x = 1.2). f₋₁ = 3.0042, f₁ = 3.6693.<\/p>\n<ul><li>μΔf₀ = (f₁ − f₋₁)/2 = (3.6693 − 3.0042)/2 = 0.33255<\/li>\n<li>Δ²f₋₁ = f₁ − 2f₀ + f₋₁ = 0.0333 (orta satırın Δ²'si)<\/li>\n<li>μΔ³f₋₁ = (0.0033 + 0.0034)/2 = 0.00335 (merkezin iki yanındaki Δ³'ün ortalaması)<\/li>\n<li>Δ⁴f₋₂ = 0.0001<\/li><\/ul>\n<p>s = 0.4. Katsayılar: s = 0.4; s²/2 = 0.08; s(s² − 1)/6 = −0.056; s²(s² − 1)/24 = −0.0056.<\/p>\n<div class=\"tw\"><table><tr><th>Terim<\/th><th>Değer<\/th><th>Kümülatif<\/th><th>Hata<\/th><\/tr>\n<tr><td>f₀<\/td><td>3.320100<\/td><td>3.320100<\/td><td>0.135513<\/td><\/tr>\n<tr><td>0.4 × 0.33255<\/td><td>0.133020<\/td><td>3.453120<\/td><td>0.002493<\/td><\/tr>\n<tr><td>0.08 × 0.0333<\/td><td>0.002664<\/td><td>3.455784<\/td><td>0.000171<\/td><\/tr>\n<tr><td>−0.056 × 0.00335<\/td><td>−0.000188<\/td><td>3.455596<\/td><td>0.000017<\/td><\/tr>\n<tr><td>−0.0056 × 0.0001<\/td><td>−0.000001<\/td><td>3.455596<\/td><td>0.000018<\/td><\/tr><\/table><\/div>\n<p>f(1.24) ≈ <b>3.455596<\/b>. Dört terim yeterli. Beşinci terim yuvarlama düzeyinde. Δ⁴f = 0.0001, 4 ondalıklı verinin gürültüsü.<\/p>\n<p><b>d)<\/b> NİFİF, x = 1.02, s = 0.2:<\/p>\n\\[\\begin{aligned}P&=2.7183+0.2(0.2859)+\\tfrac{0.2(-0.8)}{2}(0.0300)\\\\&=2.7183+0.05718-0.0024=2.773080\\end{aligned}\\]\n<p>NGFİF, x = 1.38, s = (1.38 − 1.4)/0.1 = −0.2. Katsayılar en alt satırdan: ∇f₄ = 0.3859, ∇²f₄ = 0.0367.<\/p>\n\\[\\begin{aligned}P&=4.0552-0.2(0.3859)+\\tfrac{(-0.2)(0.8)}{2}(0.0367)\\\\&=4.0552-0.07718-0.002936=3.975084\\end{aligned}\\]\n<p><b>e)<\/b><\/p>\n<div class=\"tw\"><table><tr><th>x<\/th><th>Yöntem<\/th><th>Hesaplanan<\/th><th>Gerçek<\/th><th>Mutlak fark<\/th><\/tr>\n<tr><td>1.02<\/td><td>NİFİF (3 terim)<\/td><td>2.773080<\/td><td>2.773195<\/td><td>0.000115<\/td><\/tr>\n<tr><td>1.24<\/td><td>Stirling (4 terim)<\/td><td>3.455596<\/td><td>3.455613<\/td><td>0.000017<\/td><\/tr>\n<tr><td>1.38<\/td><td>NGFİF (3 terim)<\/td><td>3.975084<\/td><td>3.974902<\/td><td>0.000182<\/td><\/tr><\/table><\/div>\n<p>Aynı beş noktayla NİFİF de 1.24'te 3.455596 verir. Beş noktadan geçen polinom tektir. Stirling'in üstünlüğü az terimle erken yakınsamasıdır.<\/p>\n<div class=\"slhata\"><p>Slayt Stirling örneğinde Δ²f₋₁ = f₀ − 2f₋₁ + f₋₂ yazıyor. Doğrusu f₁ − 2f₀ + f₋₁. <span class=\"kaynak\">W234 s34<\/span><\/p><\/div>\n<div class=\"ipucu\"><p>Sık hatalar: Stirling'de s'yi x₀ = 1.0'dan ölçmek. s merkez düğümden ölçülür. μΔ³f₋₁ için tek bir Δ³ almak; iki komşu Δ³'ün ortalaması alınır.<\/p><\/div>","ks":["k22","k23","k20","k21"],"v":[],"vk":[]},"x16":{"y":"q","id":"x16","t":"3-nokta formüller: FD2 ve BD2","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k25,k27 -->\n<p>eˣ tablosu (6 ondalık, h = 0.1):<\/p>\n<div class=\"tw\"><table><tr><th>x<\/th><td>−0.2<\/td><td>−0.1<\/td><td>0<\/td><td>0.1<\/td><td>0.2<\/td><\/tr><tr><th>f(x)<\/th><td>0.818731<\/td><td>0.904837<\/td><td>1.000000<\/td><td>1.105171<\/td><td>1.221403<\/td><\/tr><\/table><\/div>\n<p>a) x = 0'da yalnız sağdaki noktalarla FD1 ve FD2 hesaplayınız.<br>\nb) Yalnız soldaki noktalarla BD1 ve BD2 hesaplayınız.<br>\nc) CD2 hesaplayınız.<br>\nd) Gerçek f'(0) = 1 ile karşılaştırınız. Hangi formül hangi durumda seçilir?<\/p>\n\\[\\text{FD2: }\\frac{-3f(x)+4f(x+h)-f(x+2h)}{2h}\\]\n\\[\\text{BD2: }\\frac{3f(x)-4f(x-h)+f(x-2h)}{2h}\\]","s":"<p><b>a)<\/b> FD1 = (1.105171 − 1)/0.1 = 1.051710.<\/p>\n\\[\\begin{aligned}\\text{FD2}&=\\frac{-3(1)+4(1.105171)-1.221403}{0.2}\\\\&=\\frac{-3+4.420684-1.221403}{0.2}\\\\&=\\frac{0.199281}{0.2}=0.996405\\end{aligned}\\]\n<p><b>b)<\/b> BD1 = (1 − 0.904837)/0.1 = 0.951630.<\/p>\n\\[\\begin{aligned}\\text{BD2}&=\\frac{3(1)-4(0.904837)+0.818731}{0.2}\\\\&=\\frac{3-3.619348+0.818731}{0.2}\\\\&=\\frac{0.199383}{0.2}=0.996915\\end{aligned}\\]\n<p><b>c)<\/b> CD2 = (1.105171 − 0.904837)/0.2 = 0.200334/0.2 = 1.001670.<\/p>\n<p><b>d)<\/b><\/p>\n<table><tr><th>Formül<\/th><th>Mertebe<\/th><th>Sonuç<\/th><th>Mutlak fark<\/th><\/tr>\n<tr><td>FD1<\/td><td>O(h)<\/td><td>1.051710<\/td><td>0.051710<\/td><\/tr>\n<tr><td>BD1<\/td><td>O(h)<\/td><td>0.951630<\/td><td>0.048370<\/td><\/tr>\n<tr><td>FD2<\/td><td>O(h²)<\/td><td>0.996405<\/td><td>0.003595<\/td><\/tr>\n<tr><td>BD2<\/td><td>O(h²)<\/td><td>0.996915<\/td><td>0.003085<\/td><\/tr>\n<tr><td>CD2<\/td><td>O(h²)<\/td><td>1.001670<\/td><td>0.001670<\/td><\/tr><\/table>\n<p>FD2 ve BD2, iki noktalı formüllerden yaklaşık 15 kat iyi. CD2'nin hatası FD2'ninkinin yaklaşık yarısı.<\/p>\n<p class=\"sn\">Kontrol için kesme hatası sabitleri: FD2 ve BD2 ≈ (h²/3)|f'''| = 0.003333, CD2 ≈ (h²/6)|f'''| = 0.001667. Slayt sabitleri vermiyor, yalnız O(h²) yazıyor.<\/p>\n<div class=\"vurgu\"><p>\"Sınırdaysanız: ileri veya geri fark tercih edilir.\" \"İç noktadaysanız ve iki tarafta veri varsa: merkezi fark tercih edilir.\" <span class=\"kaynak\">W234 s42<\/span><\/p><\/div>\n<div class=\"ipucu\"><p>Sık hata: katsayı işaretlerini karıştırmak. FD2: −3, 4, −1. BD2: 3, −4, 1. İkisinde de payda 2h.<\/p><\/div>","ks":["k25","k27"],"v":[],"vk":[]},"x17":{"y":"q","id":"x17","t":"İkinci türev: 3, 4 ve 5 noktalı formüller","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k26,k27 -->\n<p>eˣ tablosu (6 ondalık, h = 0.1):<\/p>\n<div class=\"tw\"><table><tr><th>x<\/th><td>−0.3<\/td><td>−0.2<\/td><td>−0.1<\/td><td>0<\/td><td>0.1<\/td><td>0.2<\/td><td>0.3<\/td><\/tr>\n<tr><th>f(x)<\/th><td>0.740818<\/td><td>0.818731<\/td><td>0.904837<\/td><td>1.000000<\/td><td>1.105171<\/td><td>1.221403<\/td><td>1.349859<\/td><\/tr><\/table><\/div>\n<p>x = 0'da f''(0) değerini şu formüllerle hesaplayınız: a) FD2-2 (4-nokta ileri), b) BD2-2 (4-nokta geri), c) D2 (3-nokta merkezi), d) D2-CD4 (5-nokta merkezi).<br>\ne) Gerçek f''(0) = 1 ile karşılaştırınız. D2-CD4 sonucunu yuvarlama açısından yorumlayınız.<\/p>\n\\[\\text{FD2-2: }\\frac{2f(x)-5f(x+h)+4f(x+2h)-f(x+3h)}{h^2}\\]\n\\[\\text{D2: }\\frac{f(x+h)-2f(x)+f(x-h)}{h^2}\\]\n\\[\\begin{aligned}\\text{D2-CD4: }&[-f(x+2h)+16f(x+h)-30f(x)\\\\&+16f(x-h)-f(x-2h)]/(12h^2)\\end{aligned}\\]","s":
