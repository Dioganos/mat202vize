 inince: Trapez 4×, Simpson 16× iyileşir.<\/p><span class=\"kaynak\">W5 s7<\/span><\/div>\n\n<h3>Slayt hatası<\/h3>\n<div class=\"slhata\">\n<p><b>Hata 1 (W5 s11, Simpson sayısal tablosu).<\/b> Slayt: n = 2 için 1.71882 ve hata 0.00054. n = 4 için 1.71829 ve hata 0.000013. Oran ≈ 41.<\/p>\n<p>Doğrusu: n = 2 için 1.71886, hata 0.00058. n = 4 için 1.71832, hata 0.000037. Oran 15.65 ≈ 16. Slayttaki \"41\" yanlış. O(h⁴) yine doğrulanır.<\/p>\n<\/div>\n<div class=\"slhata\">\n<p><b>Hata 2 (W5 s11, 3/8 bileşik hata sütunu).<\/b> Slayt: \"−(b−a)h⁴f⁽⁴⁾(ξ̄)/80 (×n/3)\".<\/p>\n<p>Doğrusu: formül zaten bileşiktir. \"(×n/3)\" eki ayrıca uygulanırsa fazladan sayar. Tek panel −3h⁵f⁽⁴⁾/80, n/3 panel çarpımı −n h⁵f⁽⁴⁾/80 = −(b−a)h⁴f⁽⁴⁾/80 verir. Kontrol: e<sup>x<\/sup>, [0,1], n = 6. Gerçek hata 1.646·10⁻⁵. Formül (ξ = 0.5) 1.590·10⁻⁵. \"×n/3\" ile 3.18·10⁻⁵ olur, yaklaşık iki kat fazla.<\/p>\n<\/div>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>Hata formülünde türev derecesi farklı: trapez f″, Simpson (hem 1/3 hem 3/8) f⁽⁴⁾.<\/li>\n<li>Bileşik hata sabitleri: trapez 1/12, Simpson 1/3 1/180, Simpson 3/8 1/80.<\/li>\n<li>Tek panelde h = b − a (trapez) veya h = (b − a)/2 (1/3), (b − a)/3 (3/8). Formülde (b−a)ⁿ kullanıyorsan h yazma.<\/li>\n<li>Sınır bulurken türevin aralıktaki en büyük mutlak değerini koy.<\/li>\n<li>O(h⁴) hızdır, hata miktarı değil. \"Hata tam h⁴'tür\" deme.<\/li>\n<li>Polinomun derecesi ≤ 3 ise Simpson hatası sıfırdır (f⁽⁴⁾ = 0).<\/li>\n<\/ul><\/div>","qs":["x20","x21","x23"]},{"id":"k39","t":"Hafta 5 formül özeti ve ana mesajlar","h":"<p class=\"sn\">Bu konunun BUders videosu yok. Not tek başına yeterli olacak şekilde yazıldı. Tüm haftaların formülleri için <a href=\"#\" data-go=\"n:formul\">formül kâğıdı<\/a> sayfasına bak.<\/p>\n<h3>Ne işe yarar<\/h3>\n<p>Hafta 5'in beş formülünü, katsayı dizilerini ve seçim kurallarını tek yerde toplar. Sınavdan önce son tekrar için.<\/p>\n\n<h3>Sıfırdan anlatım<\/h3>\n<ul>\n<li>Newton-Cotes: eğriyi polinomla değiştir, polinomun integralini al. Derece yükseldikçe hata düşer.<\/li>\n<li>Panel, kuralın tek seferde kapsadığı aralıktır. Trapez 1 alt aralık, Simpson 1/3 2 alt aralık, Simpson 3/8 3 alt aralık.<\/li>\n<li>Bileşik kural, aralığı n alt aralığa böler ve panelleri art arda dizer. Ortak noktalar iki panelde de sayılır. Bu yüzden katsayılar 2 olur.<\/li>\n<li>Her kuralda üç şeyi kontrol et: h, katsayı dizisi, dış çarpan.<\/li>\n<\/ul>\n\n<h3>Tanımlar ve formüller<\/h3>\n<p><b>Temel formüller (W5 s16).<\/b><\/p>\n<div class=\"tw\">\n<table>\n<tr><th>Yöntem<\/th><th>Formül<\/th><th>Hata mertebesi<\/th><\/tr>\n<tr><td>Trapez<\/td><td>\\(I_T=\\dfrac h2(f_0+f_1)\\)<\/td><td>O(h³)<\/td><\/tr>\n<tr><td>Bileşik trapez<\/td><td>\\(I_T=\\dfrac h2[f_0+2f_1+\\cdots+2f_{n-1}+f_n]\\)<\/td><td>O(h²)<\/td><\/tr>\n<tr><td>Simpson 1/3<\/td><td>\\(I_S=\\dfrac h3(f_0+4f_1+f_2)\\)<\/td><td>O(h⁵)<\/td><\/tr>\n<tr><td>Bileşik Simpson 1/3<\/td><td>\\(I_S=\\dfrac h3[f_0+4\\sum f_{tek}+2\\sum f_{çift}+f_n]\\)<\/td><td>O(h⁴)<\/td><\/tr>\n<tr><td>Simpson 3/8<\/td><td>\\(I_{3/8}=\\dfrac{3h}{8}(f_0+3f_1+3f_2+f_3)\\)<\/td><td>O(h⁵)<\/td><\/tr>\n<\/table>\n<\/div>\n<p>Özet tablosu bileşik Simpson 3/8 için ayrı satır vermez. Katsayı dizisi sağdaki tabloda var. Hata mertebesi O(h⁴) (W5 s9 ve s11).<\/p>\n<p><b>Katsayı dizileri (W5 s16).<\/b><\/p>\n<table>\n<tr><th>Yöntem<\/th><th>Katsayı dizisi<\/th><th>Dış çarpan<\/th><\/tr>\n<tr><td>Bileşik trapez<\/td><td>1, 2, 2, ..., 2, 1<\/td><td>h/2<\/td><\/tr>\n<tr><td>Bileşik Simpson 1/3<\/td><td>1, 4, 2, 4, 2, ..., 4, 1<\/td><td>h/3<\/td><\/tr>\n<tr><td>Bileşik Simpson 3/8<\/td><td>1, 3, 3, 2, 3, 3, 2, ..., 3, 3, 1<\/td><td>3h/8<\/td><\/tr>\n<\/table>\n<p><b>Temel koşullar (W5 s16).<\/b><\/p>\n<ul>\n<li>h = (b − a)/n.<\/li>\n<li>n çift → Simpson 1/3.<\/li>\n<li>n = 3k → Simpson 3/8.<\/li>\n<\/ul>\n<p><b>Bileşik hata formülleri<\/b> (ayrıntı için <a href=\"#\" data-go=\"k:k37\">K37<\/a>): trapez \\(-\\frac{(b-a)h^2}{12}f''\\), Simpson 1/3 \\(-\\frac{(b-a)h^4}{180}f^{(4)}\\), Simpson 3/8 \\(-\\frac{(b-a)h^4}{80}f^{(4)}\\).<\/p>\n<p>Konu notları: <a href=\"#\" data-go=\"k:k31\">K31<\/a> trapez, <a href=\"#\" data-go=\"k:k32\">K32<\/a> bileşik trapez, <a href=\"#\" data-go=\"k:k33\">K33<\/a> Simpson 1/3, <a href=\"#\" data-go=\"k:k34\">K34<\/a> bileşik Simpson 1/3, <a href=\"#\" data-go=\"k:k35\">K35<\/a> Simpson 3/8, <a href=\"#\" data-go=\"k:k36\">K36<\/a> bileşik 3/8 ve karma, <a href=\"#\" data-go=\"k:k38\">K38<\/a> kapsamlı örnek.<\/p>\n\n<h3>Ana mesajlar (W5 s17)<\/h3>\n<div class=\"vurgu\"><p>① Sayısal integrasyon = eğriyi polinom ile yaklaşıkla, sonra integralini al. Newton-Cotes bu prensibin sistematik uygulamasıdır.<\/p><p>② Trapez doğrusal, Simpson 1/3 parabolik, Simpson 3/8 kübik polinom kullanır. Daha yüksek derece → daha düşük hata.<\/p><p>③ Bileşik kurallar geniş aralıklarda hatayı sistematik azaltır. h küçüldükçe hata O(hⁿ) ile düşer. n artırınca iyileşme kesilmez.<\/p><p>④ Simpson 1/3, 3. derece polinomları da tam entegre eder (simetri nedeniyle). Bu özellik mühendislikte çok değerlidir.<\/p><p>⑤ Yöntem seçimi: n çift → Simpson 1/3 | n=3k → Simpson 3/8 | Sadece trapez veriliyorsa → Bileşik Trapez.<\/p><span class=\"kaynak\">W5 s17<\/span><\/div>\n\n<h3>Kendi çözümlü örneğim<\/h3>\n<div class=\"ornek\">\n<p><b>Sınav tipi örnek, n = 6 ile üç kural.<\/b> \\(\\int_0^1e^xdx\\), n = 6, h = 1/6. n hem çift hem 3'ün katı olduğu için üç kural da uygulanır.<\/p>\n<div class=\"tw\">\n<table>\n<tr><th>i<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><\/tr>\n<tr><td>xᵢ<\/td><td>0<\/td><td>1/6<\/td><td>2/6<\/td><td>3/6<\/td><td>4/6<\/td><td>5/6<\/td><td>1<\/td><\/tr>\n<tr><td>f = eˣ<\/td><td>1.00000<\/td><td>1.18136<\/td><td>1.39561<\/td><td>1.64872<\/td><td>1.94773<\/td><td>2.30098<\/td><td>2.71828<\/td><\/tr>\n<\/table>\n<\/div>\n<p>Uçların toplamı: f₀ + f₆ = 3.71828.<\/p>\n<ul>\n<li><b>Bileşik trapez.<\/b> 3.71828 + 2(1.18136 + 1.39561 + 1.64872 + 1.94773 + 2.30098) = 3.71828 + 2(8.47440) = 20.66709. Çarpan h/2 = 1/12. Sonuç 1.72226. Hata 3.98·10⁻³.<\/li>\n<li><b>Bileşik Simpson 1/3.<\/b> 3.71828 + 4(f₁ + f₃ + f₅) + 2(f₂ + f₄) = 3.71828 + 4(5.13106) + 2(3.34334) = 30.92921. Çarpan h/3 = 1/18. Sonuç 1.71829. Hata 7.3·10⁻⁶.<\/li>\n<li><b>Bileşik Simpson 3/8.<\/b> 3.71828 + 3(f₁ + f₂ + f₄ + f₅) + 2f₃ = 3.71828 + 3(6.82568) + 2(1.64872) = 27.49277. Çarpan 3h/8 = 1/16. Sonuç 1.71830. Hata 1.6·10⁻⁵.<\/li>\n<li>Gerçek değer e − 1 = 1.71828.<\/li>\n<\/ul>\n<p>Yorum. Üç kuralın hatası 4·10⁻³, 7·10⁻⁶ ve 2·10⁻⁵. Simpson'lar trapezden çok daha iyi. n hem çift hem 3'ün katı olduğunda Simpson 1/3 genellikle biraz daha iyidir (sabit 1/180, 3/8 için 1/80). Fark az ama doğru seçim bu.<\/p>\n<\/div>\n<div class=\"ornek\">\n<p><b>Hızlı karar sırası.<\/b><\/p>\n<ol>\n<li>Veri eşit aralıklı mı? Değilse Newton-Cotes uygulanmaz, Lagrange kullan.<\/li>\n<li>n kaç? Çift ise bileşik Simpson 1/3. 3'ün katı ise bileşik Simpson 3/8. İkisi de ise 1/3.<\/li>\n<li>n tek ve 3'ün katı değilse karma: bir 3/8 paneli + kalan 1/3 panelleri (<a href=\"#\" data-go=\"k:k36\">K36<\/a>).<\/li>\n<li>Soru \"yalnız trapez\" diyorsa bileşik trapez.<\/li>\n<li>h, katsayı dizisi, dış çarpanı yaz ve hesapla.<\/li>\n<\/ol>\n<\/div>\n\n<h3>Grafik ve şemalar<\/h3>\n<p>W5 s16 \"Formül özeti\" sayfasıdır. Solda beş renkli satır (Trapez, Bil. Trapez, Simpson 1/3, Bil. Simp 1/3, Simpson 3/8). Her satırda formül kutusu ve sağında bir hata mertebesi rozeti: O(h³), O(h²), O(h⁵), O(h⁴), O(h⁵). Sağ üstte \"Yöntem / Katsayı dizisi\" tablosu. Altta üç renkli \"Temel koşullar\" kutusu: \"h = (b−a)/n\", \"n: çift → Simp. 1/3\", \"n=3k → Simp. 3/8\". W5 s17 \"Hafta 5, ana mesajlar\" başlığı altında beş renkli şerit.<\/p>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>Altın kural: Formülü uygulamadan önce her zaman (1) h, (2) katsayı dizisi, (3) dış çarpanı kontrol et.<\/p><span class=\"kaynak\">W5 s14<\/span><\/div>\n<div class=\"vurgu\"><p>UYARI: n mutlaka çift sayı olmalıdır!<\/p><span class=\"kaynak\">W5 s8<\/span><\/div>\n\n<h3>Slayt hatası<\/h3>\n<p class=\"sn\">W5 s16 ve s17'de slayt hatası bulunmadı. Hata mertebelerini ve katsayı dizilerini bu notta script ile kontrol ettim. W5'in diğer sayfalarındaki hatalar için <a href=\"#\" data-go=\"k:k36\">K36<\/a>, <a href=\"#\" data-go=\"k:k37\">K37<\/a> ve <a href=\"#\" data-go=\"k:k38\">K38<\/a> notlarına bak.<\/p>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>Üç Simpson hatasını karıştırma: tek panelde O(h⁵), bileşikte O(h⁴). Trapez tek panelde O(h³), bileşikte O(h²).<\/li>\n<li>Çarpanlar: h/2, h/3, 3h/8. Katsayı dizileri: 1,2,...,2,1 | 1,4,2,...,4,1 | 1,3,3,2,3,3,...,3,3,1.<\/li>\n<li>n tek olunca Simpson 1/3 olmaz. n 3'ün katı değilse Simpson 3/8 olmaz. İkisi de değilse karma.<\/li>\n<li>h = (b − a)/n. Toplam uzunluğu h diye kullanma.<\/li>\n<li>Sonucu yaz, hata tahmini yap, bir cümle yorum ekle (<a href=\"#\" data-go=\"k:k01\">K1<\/a>: Sonuç = Değer + Hata + Yorum).<\/li>\n<\/ul><\/div>","qs":[]}]}},"V":{"t69PeA210U8":["S.A.: Sayısal Analiz Nedir? (Numerical Methods)",787,"https://www.buders.com/altsayfa/sayisal_analize_giris.html"],"wGvNOMdedrk":["S.A.: Hata Kavramı ve Hata Çeşitleri (Error)",476,"https://www.buders.com/altsayfa/sayisal_analize_giris.html"],"Kj1tIKdHD-w":["S.A.: Yuvarlama Hatası (Rounding Error)",562,"https://www.buders.com/altsayfa/sayisal_analize_giris.html"],"S8H7kmFMULo":["S.A.: Mutlak Hata (Absolute Error)",366,"https://www.buders.com/altsayfa/sayisal_analize_giris.html"],"KtXRpu6G6qc":["S.A.: Bağıl Hata (Relative Error)",770,"https://www.buders.com/altsayfa/sayisal_analize_giris.html"],"RQzKFwOZAEI":["Calculus-I : Lineer Yaklaşım Kavramı (Linear Approximation)",null,"https://www.buders.com/altsayfa/turev_uygulamalari.html"],"iLmWUh1Q9Gk":["Calculus-I : Lineer Yaklaşım Örnek Soru-1 (Linear Approximation)",null,"https://www.buders.com/altsayfa/turev_uygulamalari.html"],"mLNpfTsrhFY":["Calculus-I : Lineer Yaklaşım Örnek Soru-2 (Linear Approximation)",null,"h }
function rk(r){r=r||$('m');if(window.renderMathInElement)renderMathInElement(r,{delimiters:[{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false});fit();if(document.fonts)document.fonts.ready.then(fit)}

const emb=i=>'https://www.youtube-nocookie.com/embed/'+i+'?rel=0&modestbranding=1&playsinline=1';

function qlist(ids){

function vidBlock(p,v){
 if(!p.v.length)return '<p class="sub">Bu konunun BUders videosu yok.</p>';

 return '<div class="vid"><iframe id="yt" src="'+emb(s)+'" title="'+esc(V[s][0])+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe></div>'
 +'<div class="vl" id="vl">'+p.v.map(i=>'<div class="vi'+(i===s?' on':'')+'" data-vi="'+i+'"><label class="vc"><input type="checkbox" data-vc="'+i+'"'+(isD(vk(i))?' checked':'')+' aria-label="İzlendi"></label><button class="vt" data-play="'+i+'">'+esc(V[i][0])+dur(i)+'</button>'+ytl(i)+bul(i)+'</div>').join('')+'</div>';

function draw(o){
 o=o||{};const p=P[cur],g=G[p.g],ix=ORD.indexOf(cur);
 let h='<h2>'+esc(p.t)+'</h2><p class="sub">'+esc(g.t)+(p.sub?' · '+esc(p.sub):'')+' · '+(ix+1)+'/'+ORD.length+'</p>';
 if(p.y==='k')h+=vidBlock(p,o.v)+'<div class="note">'+p.h+'</div>'+qlist(p.qs);
 else if(p.y==='q'){
  if(p.ks.length)h+='<p class="sub">Konular: '+p.ks.map(k=>'<a href="#" data-go="k:'+k+'">'+esc(tt(k))+'</a>').join(' · ')+'</p>';
  h+='<div class="note">'+p.h+'<p><button class="sb">Çözümü göster</button></p><div class="sol" hidden>'+p.s+'</div></div>';
  if(p.v.length)h+='<div class="note pl"><h3>Bu soru tipini çözen BUders videoları</h3><div class="vl">'+p.v.map((i,j)=>'<div class="vi">'+(p.vk[j]?'<a href="#" data-go="k:'+p.vk[j]+'" data-v="'+i+'">'+esc(V[i][0])+'</a>':'<span>'+esc(V[i][0])+'</span>')+dur(i)+ytl(i)+'</div>').join('')+'</div></div>';
 }else if(p.y==='n')h+='<div class="note">'+p.h+'</div>';
 else{
  h+='<p class="intro">'+esc(D.INTRO)+'</p>';
  p.secs.forEach(s=>{h+='<div class="note" id="'+s.id+'"><h3>'+esc(s.t)+'</h3>'+s.h+'<p><button class="sb2" data-sec="'+s.id+'">'+(isD(nk(s.id))?'İşareti kaldır':'Okudum')+'</button></p></div>'+qlist(s.qs)});
 }
 h+='<div class="ctl"><button id="pv">Önceki</button>';
 const own=p.y==='s'?null:(p.y==='q'?qk(p.id):nk(p.id));
 h+='<button class="p" id="nx">'+(own&&!isD(own)?'Bitti, sonrakine geç':'Sonraki')+'</button>';
 if(own)h+='<button id="tg">'+(isD(own)?'İşareti kaldır':'Tamamlandı olarak işaretle')+'</button>';
 if(g.vids&&g.vids.length&&p.y==='k')h+='<a class="lnk" target="yt" rel="noopener" href="https://www.youtube.com/watch_videos?video_ids='+g.vids.slice(0,50).join(',')+'">Bu haftanın tüm videolarını sırayla oynat</a>';
 $('m').innerHTML=h+'</div>';
 rk();side();
 $('pv').onclick=()=>go(ORD[Math.max(0,ix-1)]);
 $('nx').onclick=()=>{if(own&&!isD(own)){d[own]=1;save()}go(ORD[Math.min(ORD.length-1,ix+1)])};
 if(own)$('tg').onclick=()=>{toggle(own);draw({v:cur===p.id?curV():null})};
 if(o.sol){const b=document.querySelector('#m .sb');if(b)b.click()}
}
function curV(){const e=document.querySelector('#vl .vi.on');return e?e.dataset.vi:null}
function side(){
 let s='',ts=0;const cp=P[cur];
 op.add(cp.g);
 G.forEach((g,gi)=>{
  const us=new Set();g.sub.forEach(b=>b.p.forEach(i=>units(P[i]).forEach(u=>us.add(u))));
  const gd=[...us].filter(isD).length;
  s+='<details data-g="'+gi+'"'+(op.has(gi)?' open':'')+'><summary>'+esc(g.t)+' <small>('+gd+'/'+us.size+durOf(us)+')</small></summary>';

    const q=P[i],u=units(q),n=u.filter(isD).length;

    if(q.y==='s')q.secs.forEach(c=>{s+='<button class="it sub" data-p="'+i+'" data-a="'+c.id+'"><span class="c">'+(isD(nk(c.id))?'✓':'')+'</span>'+esc(c.t)+'</button>'});
   });
  });
  if(g.vids&&g.vids.length)s+='<a class="mi" target="yt" rel="noopener" href="https://www.youtube.com/watch_videos?video_ids='+g.vids.slice(0,50).join(',')+'">Haftanın tüm videolarını oynat</a>';
  s+='</details>';
 });
 $('s').innerHTML=s;
 $('s').querySelectorAll('.it').forEach(b=>b.onclick=()=>go(b.dataset.p,{a:b.dataset.a}));
 const nd=ALLU.filter(isD).length;let wd=0,wt=0;ALLU.forEach(k=>{const x=secOf(k);if(x){wt+=x;if(isD(k))wd+=x}});
 $('pg').textContent=nd+' / '+ALLU.length+' tamamlandı'+(wt>0?' · '+(wd>0?fmtW(wd)+' / ':'')+fmtW(wt):'');$('bi').style.width=(100*nd/ALLU.length)+'%';
}
$('s').addEventListener('toggle',e=>{const g=e.target.dataset&&e.target.dataset.g;if(g!==undefined){if(e.target.open)op.add(+g);else op.delete(+g)}},true);
function go(id,o){
 o=o||{};if(!P[id])return;cur=id;save();draw(o);
 const e=o.a?$(o.a):null;
 if(e)e.scrollIntoView({block:'start'});else window.scrollTo(0,0);

function play(i){
 const f=$('yt');if(!f)return;f.src=emb(i);f.title=V[i][0];
 document.querySelectorAll('#vl .vi').forEach(e=>e.classList.toggle('on',e.dataset.vi===i));

$('m').addEventListener('click',e=>{
 const b=e.target.closest('.sb');if(b){e.preventDefault();const sol=b.parentElement.nextElementSibling;sol.hidden=!sol.hidden;b.textContent=sol.hidden?'Çözümü göster':'Çözümü gizle';fit();return}
 const pl=e.target.closest('[data-play]');if(pl){play(pl.dataset.play);return}
 const sc=e.target.closest('[data-sec]');if(sc){toggle(nk(sc.dataset.sec));sc.textContent=isD(nk(sc.dataset.sec))?'İşareti kaldır':'Okudum';side();return}
 const a=e.target.closest('a[data-go]');if(a){e.preventDefault();const r=tgt(a.dataset.go);if(r)go(r.p,{a:r.a,v:a.dataset.v})}
});
$('m').addEventListener('change',e=>{const c=e.target.closest('[data-vc]');if(c){d[vk(c.dataset.vc)]=c.checked?1:0;save();side()}});
const nm=t=>t.toLocaleLowerCase('tr').replace(/ı/g,'i').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const txt=h=>h.replace(/<[^>]*>/g,' ');
const T=[];
ORD.forEach(i=>{const p=P[i],g=G[p.g];
 const body=p.y==='k'?p.h+p.v.map(v=>V[v][0]).join(' '):p.y==='q'?p.h+p.s:p.y==='n'?p.h:'';
 T.push({p:i,t:p.t,g:g.t,x:nm(p.t+' '+g.t+' '+txt(body))});
 if(p.y==='s')p.secs.forEach(c=>T.push({p:i,a:c.id,t:c.t,g:g.t,x:nm(c.t+' '+g.t+' '+txt(c.h))}));
});
let sr=[],hl=0;const q=$('q'),sl=$('sl');

function sf(){const w=nm(q.value).split(/\s+/).filter(Boolean);if(!w.length){sc();return}
 sr=[];for(let k=0;k<T.length&&sr.length<10;k++)if(w.every(x=>T[k].x.includes(x)))sr.push(k);
 hl=0;sl.innerHTML=sr.length?sr.map(k=>'<div data-k="'+k+'">'+esc(T[k].t)+'<small>'+esc(T[k].g)+'</small></div>').join(''):'<div class="e">Sonuç yok</div>';
 sl.classList.add('on');sh()}
function sp(k){q.value='';sc();q.blur();go(T[k].p,{a:T[k].a})}
q.oninput=sf;q.onfocus=()=>{if(q.value)sf()};
q.onkeydown=e=>{if(e.key==='Escape')sc();else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(sr.length&&sl.classList.contains('on')){hl=(hl+(e.key==='ArrowDown'?1:sr.length-1))%sr.length;sh()}}else if(e.key==='Enter'&&sl.classList.contains('on')&&sr.length)sp(sr[hl])};
sl.onclick=e=>{const d=e.target.closest('div[data-k]');if(d)sp(+d.dataset.k)};
document.addEventListener('click',e=>{if(!e.target.closest('.sr'))sc()});
document.addEventListener('keydown',e=>{if(e.target.tagName==='IFRAME'||e.target.tagName==='INPUT')return;if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();q.focus();return}const ix=ORD.indexOf(cur);if(e.key==='ArrowRight')go(ORD[Math.min(ORD.length-1,ix+1)]);if(e.key==='ArrowLeft')go(ORD[Math.max(0,ix-1)])});
{const hm=decodeURIComponent(location.hash.slice(1)),sol=/\+$/.test(hm),pr=hm.replace(/\+$/,'').split('@'),id=pr[0];
 let o={v:pr[1],sol:sol};
 if(P[id])cur=id;else if(SEC[id]){cur=SP;o.a=id}
 draw(o);if(o.a&&$(o.a))$(o.a).scrollIntoView({block:'start'})}
