"<p>h² = 0.01, 12h² = 0.12. BD2-2'de x + kh yerine x − kh gelir.<\/p>\n<p><b>a)<\/b><\/p>\n\\[\\begin{aligned}&\\frac{2-5.525855+4.885612-1.349859}{0.01}\\\\&=\\frac{0.009898}{0.01}=0.989800\\end{aligned}\\]\n<p><b>b)<\/b><\/p>\n\\[\\begin{aligned}&\\frac{2-4.524185+3.274924-0.740818}{0.01}\\\\&=\\frac{0.009921}{0.01}=0.992100\\end{aligned}\\]\n<p><b>c)<\/b> (1.105171 − 2 + 0.904837)/0.01 = 0.010008/0.01 = 1.000800.<\/p>\n<p><b>d)<\/b><\/p>\n\\[\\begin{aligned}&[-1.221403+17.682736-30\\\\&\\ +14.477392-0.818731]/0.12\\\\&=0.119994/0.12=0.999950\\end{aligned}\\]\n<p><b>e)<\/b><\/p>\n<div class=\"tw\"><table><tr><th>Formül<\/th><th>Nokta<\/th><th>Mertebe<\/th><th>Sonuç<\/th><th>Mutlak fark<\/th><th>Tam eˣ ile<\/th><\/tr>\n<tr><td>FD2-2<\/td><td>4<\/td><td>O(h²)<\/td><td>0.989800<\/td><td>0.010200<\/td><td>0.989763<\/td><\/tr>\n<tr><td>BD2-2<\/td><td>4<\/td><td>O(h²)<\/td><td>0.992100<\/td><td>0.007900<\/td><td>0.991770<\/td><\/tr>\n<tr><td>D2<\/td><td>3<\/td><td>O(h²)<\/td><td>1.000800<\/td><td>0.000800<\/td><td>1.000834<\/td><\/tr>\n<tr><td>D2-CD4<\/td><td>5<\/td><td>O(h⁴)<\/td><td>0.999950<\/td><td>0.000050<\/td><td>0.999999<\/td><\/tr><\/table><\/div>\n<ul><li>Tek yönlü 4-nokta formüllerin hatası ~10⁻². Sınırda başka seçenek yoksa kullanılır.<\/li>\n<li>D2 aynı mertebede ama hatası 10 kattan fazla küçük.<\/li>\n<li>D2-CD4'ün kesme hatası ~10⁻⁶ olmalıydı. Tam eˣ ile gerçekten 0.999999 çıkıyor. 6 ondalıklı tabloyla hata 5 × 10⁻⁵. Fark yuvarlamadan geliyor. Katsayıların mutlak toplamı 64, payda 0.12. Her değerdeki 0.0000005 hata 64(0.0000005)/0.12 = 2.7 × 10⁻⁴'e kadar büyüyebilir.<\/li><\/ul>\n<div class=\"vurgu\"><p>CD4: \"Gürültülü verilerle KÖTÜ!\" h küçülünce yuvarlama hatası büyük katsayılarla çarpılır. <span class=\"kaynak\">W234 s43<\/span><\/p><\/div>\n<div class=\"ipucu\"><p>Sık hatalar: ikinci türevde paydaya 2h yazmak, doğrusu h². D2-CD4'te payda 12h². f(x)'in katsayısı D2'de −2, D2-CD4'te −30.<\/p><\/div>","ks":["k26","k27"],"v":[],"vk":[]},"x18":{"y":"q","id":"x18","t":"Türev formülü seçimi: hız ve ivme","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k27,k29 -->\n<p>Bir aracın konumu ölçülmüştür:<\/p>\n<div class=\"tw\"><table><tr><th>t (s)<\/th><td>0<\/td><td>0.5<\/td><td>1.0<\/td><td>1.5<\/td><td>2.0<\/td><\/tr><tr><th>x (m)<\/th><td>0<\/td><td>0.375<\/td><td>2.000<\/td><td>5.625<\/td><td>12.000<\/td><\/tr><\/table><\/div>\n<p>a) t = 0, 1.0 ve 2.0 s'de hızı bulunuz. Her nokta için uygun O(h²) formülünü seçiniz.<br>\nb) Uç noktalarda FD1 ve BD1 sonuçlarını da bulunuz.<br>\nc) t = 1.0 s'de ivmeyi bulunuz.<br>\nd) Veri x(t) = t³ + t² fonksiyonuna aittir. Sonuçları analitik değerlerle karşılaştırınız.<\/p>","s":"<p><b>Seçim (W234 s46, s51):<\/b> t = 0 sol sınır → FD2. t = 1.0 iç nokta → CD2. t = 2.0 sağ sınır → BD2. İvme iç noktada → D2. h = 0.5, 2h = 1, h² = 0.25.<\/p>\n<p><b>a)<\/b><\/p>\n\\[v(0)\\approx\\frac{-3(0)+4(0.375)-2.000}{1}=-0.5\\]\n\\[v(1)\\approx\\frac{5.625-0.375}{1}=5.25\\]\n\\[v(2)\\approx\\frac{3(12)-4(5.625)+2}{1}=15.5\\]\n<p><b>b)<\/b> FD1: v(0) ≈ (0.375 − 0)/0.5 = 0.75. BD1: v(2) ≈ (12 − 5.625)/0.5 = 12.75.<\/p>\n<p><b>c)<\/b> a(1) ≈ (5.625 − 2(2) + 0.375)/0.25 = 2/0.25 = 8 m/s².<\/p>\n<p><b>d)<\/b> v = 3t² + 2t, a = 6t + 2.<\/p>\n<div class=\"tw\"><table><tr><th>Nokta<\/th><th>Formül<\/th><th>Sayısal<\/th><th>Gerçek<\/th><th>Mutlak fark<\/th><\/tr>\n<tr><td>v(0)<\/td><td>FD2<\/td><td>−0.5<\/td><td>0<\/td><td>0.5<\/td><\/tr>\n<tr><td>v(0)<\/td><td>FD1<\/td><td>0.75<\/td><td>0<\/td><td>0.75<\/td><\/tr>\n<tr><td>v(1)<\/td><td>CD2<\/td><td>5.25<\/td><td>5<\/td><td>0.25<\/td><\/tr>\n<tr><td>v(2)<\/td><td>BD2<\/td><td>15.5<\/td><td>16<\/td><td>0.5<\/td><\/tr>\n<tr><td>v(2)<\/td><td>BD1<\/td><td>12.75<\/td><td>16<\/td><td>3.25<\/td><\/tr>\n<tr><td>a(1)<\/td><td>D2<\/td><td>8<\/td><td>8<\/td><td>0<\/td><\/tr><\/table><\/div>\n<ul><li>Kübikte FD2 ve BD2 hatası (h²/3)·x''' = (0.25/3)·6 = 0.5. CD2 hatası (h²/6)·6 = 0.25. Sayılar birebir tutuyor.<\/li>\n<li>D2 kübikte tam sonuç verir, çünkü x⁽⁴⁾ = 0.<\/li>\n<li>BD1'in hatası BD2'nin 6.5 katı. h = 0.5 büyük olduğu için FD2 bile v(0)'ın işaretini yanlış veriyor. Daha sık ölçüm gerekir.<\/li><\/ul>\n<div class=\"vurgu\"><p>\"İyi uygulama: Her zaman CD2 (merkezi) kullan (O(h²)). Sınır noktaları için FD2 veya BD2 kullan (O(h²)). Asla FD1/BD1 kullanma, mühendislikte yetersiz!\" <span class=\"kaynak\">W234 s49<\/span><\/p><\/div>\n<div class=\"ipucu\"><p>Sık hata: uç noktada CD2 kullanmaya çalışmak. t = −0.5 ya da t = 2.5 verisi yok.<\/p><\/div>","ks":["k27","k29"],"v":[],"vk":[]},"x19":{"y":"q","id":"x19","t":"Optimal h: kesme ve yuvarlama dengesi","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k28,k27 -->\n<p>f(x) = eˣ, x = 1, ileri fark (FD1). Makine epsilonu εₘ = 2.2 × 10⁻¹⁶.<br>\na) Toplam hata ≈ C₁h + εₘ/h ve C₁ ≈ |f''(x)|/2 alarak h_opt'u ve o noktadaki toplam hatayı bulunuz.<br>\nb) Sonucu √εₘ ile karşılaştırınız.<br>\nc) CD2 için \\(h_{opt}\\approx\\varepsilon_m^{1/3}\\) kaçtır?<br>\nd) Bilgisayarda ölçülen gerçek FD1 hataları aşağıdadır. Yorumlayınız.<\/p>\n<div class=\"tw\"><table><tr><th>h<\/th><td>10⁻²<\/td><td>10⁻⁴<\/td><td>10⁻⁸<\/td><td>10⁻¹²<\/td><\/tr><tr><th>Gerçek hata<\/th><td>1.364 × 10⁻²<\/td><td>1.359 × 10⁻⁴<\/td><td>6.603 × 10⁻⁹<\/td><td>4.323 × 10⁻⁴<\/td><\/tr><\/table><\/div>","s":"<p><b>a)<\/b> Türev sıfıra eşitlenir:<\/p>\n\\[\\frac{d}{dh}\\Bigl[C_1h+\\frac{\\varepsilon_m}{h}\\Bigr]=C_1-\\frac{\\varepsilon_m}{h^2}=0\\]\n\\[h_{opt}=\\sqrt{\\varepsilon_m/C_1}\\]\n<p>C₁ = e/2 = 1.359141.<\/p>\n\\[h_{opt}=\\sqrt{\\frac{2.2\\times10^{-16}}{1.359141}}=1.27\\times10^{-8}\\]\n<p>Bu h'de kesme C₁h = 1.73 × 10⁻⁸ ve yuvarlama εₘ/h = 1.73 × 10⁻⁸. İkisi eşit. Toplam hata 3.46 × 10⁻⁸.<\/p>\n<p><b>b)<\/b> √εₘ = 1.48 × 10⁻⁸. h_opt ile aynı mertebe. Slayttaki h_opt = √ε_machine kuralı yeterli.<\/p>\n<p><b>c)<\/b> \\(\\varepsilon_m^{1/3}\\) = 6.0 × 10⁻⁶. Bu yaklaşık \\(10^{-5.2}\\).<\/p>\n<p><b>d)<\/b> h = 10⁻²'den 10⁻⁴'e hata 100 kat azalıyor. Bu kesme hatasının O(h) davranışı. En küçük hata h = 10⁻⁸ civarında. h = 10⁻¹²'de hata 4.3 × 10⁻⁴'e çıkıyor. Yuvarlama baskın: tahmin εₘ/h = 2.2 × 10⁻⁴, aynı mertebe.<\/p>\n<p class=\"sn\">d şıkkındaki değerler double hassasiyetle ölçüldü. Son basamak makineye göre değişebilir.<\/p>\n<div class=\"vurgu\"><p>\"|Kesme hatası| + |Yuvarlama hatası| minimumda → h_opt = sqrt(ε_machine).\" <span class=\"kaynak\">W234 s51<\/span><\/p><\/div>\n<div class=\"slhata\"><p>Slayt bir yerde \"epsilon ≈ 10⁻⁸ için sqrt(eps) ≈ 10⁻⁴\" yazıyor (W234 s45). Aynı konuda εₘ ≈ 2.2 × 10⁻¹⁶ alınıyor (s47). Sınavda s47 ve s51'i kullan: h_opt ≈ 10⁻⁸. <span class=\"kaynak\">W234 s45<\/span><\/p><\/div>\n<div class=\"ipucu\"><p>Sık hata: \"h ne kadar küçükse o kadar iyi\" demek. h_opt'un altında hata yeniden büyür.<\/p><\/div>","ks":["k28","k27"],"v":[],"vk":[]},"x20":{"y":"q","id":"x20","t":"h yarıya inince hata: trapez /4, Simpson /16","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k32,k34,k37 -->\n<p>\\(I=\\int_0^{\\pi}\\sin x\\,dx=2\\).<br>\na) n = 2 ve n = 4 için bileşik trapez ve bileşik Simpson 1/3 ile hesaplayınız.<br>\nb) n = 8 ve 16 sonuçları verilmiştir: T₈ = 1.974232, T₁₆ = 1.993570, S₈ = 2.000269, S₁₆ = 2.000017. Hata ve hata oranı tablosunu doldurunuz.<br>\nc) Oranlardan her yöntemin mertebesini okuyunuz.<br>\nd) n = 4 hatalarından n = 8 hatalarını önceden tahmin ediniz.<\/p>","s":"<p><b>a) n = 2:<\/b> h = π/2 = 1.570796. f = 0, 1, 0.<\/p>\n<p>T₂ = (h/2)[0 + 2(1) + 0] = 1.570796. S₂ = (h/3)[0 + 4(1) + 0] = 2.094395.<\/p>\n<p><b>a) n = 4:<\/b> h = π/4 = 0.785398. f = 0, 0.707107, 1, 0.707107, 0.<\/p>\n\\[\\begin{aligned}T_4&=\\tfrac{0.785398}{2}[0+2(0.707107+1+0.707107)+0]\\\\&=0.392699(4.828428)=1.896119\\end{aligned}\\]\n\\[\\begin{aligned}S_4&=\\tfrac{0.785398}{3}[0+4(0.707107)+2(1)\\\\&\\quad+4(0.707107)+0]\\\\&=0.261799(7.656856)=2.004560\\end{aligned}\\]\n<p><b>b)<\/b><\/p>\n<div class=\"tw\"><table><tr><th>n<\/th><th>Trapez<\/th><th>Hata<\/th><th>Oran<\/th><th>Simpson 1/3<\/th><th>Hata<\/th><th>Oran<\/th><\/tr>\n<tr><td>2<\/td><td>1.570796<\/td><td>0.429204<\/td><td><\/td><td>2.094395<\/td><td>0.094395<\/td><td><\/td><\/tr>\n<tr><td>4<\/td><td>1.896119<\/td><td>0.103881<\/td><td>4.13<\/td><td>2.004560<\/td><td>0.004560<\/td><td>20.70<\/td><\/tr>\n<tr><td>8<\/td><td>1.974232<\/td><td>0.025768<\/td><td>4.03<\/td><td>2.000269<\/td><td>0.000269<\/td><td>16.94<\/td><\/tr>\n<tr><td>16<\/td><td>1.993570<\/td><td>0.006430<\/td><td>4.01<\/td><td>2.000017<\/td><td>0.000017<\/td><td>16.22<\/td><\/tr><\/table><\/div>\n<p><b>c)<\/b> Trapez oranı 4'e gidiyor: O(h²). Simpson oranı 16'ya gidiyor: O(h⁴). h büyükken oran henüz oturmuyor (20.7).<\/p>\n<p><b>d)<\/b> E_T(8) ≈ 0.103881/4 = 0.025970. Gerçek 0.025768. E_S(8) ≈ 0.004560/16 = 0.000285. Gerçek 0.000269. Tahminler iyi.<\/p>\n<p>Trapez hep az veriyor. sin x bu aralıkta içbükey, kirişler eğrinin altında kalır.<\/p>\n<div class=\"vurgu\"><p>\"O(h⁴) mertebesini, gerçek hatanın tam h⁴ olduğu sanılmamalı. Bu sadece küçülme hızı.\" <span class=\"kaynak\">W5 s14<\/span><\/p><\/div>\n<div class=\"slhata\"><p>Slayttaki karşılaştırma tablosunda Simpson satırları yanlış: 1.71882 / 0.00054 ve 1.71829 / 0.000013, oran \"≈41\". Doğrusu 1.71886 / 0.00058 ve 1.71832 / 0.000037, oran 15.65 ≈ 16. <span class=\"kaynak\">W5 s11<\/span><\/p><\/div>\n<div class=\"ipucu\"><p>Sık hata: n iki katına çıkınca hatayı yarıya bölmek. Trapezde 4'e, Simpson'da 16'ya bölünür.<\/p><\/div>","ks":["k32","k34","k37"],"v":[],"vk":[]},"x21":{"y":"q","id":"x21","t":"Bileşik Simpson 3/8 (n = 6)","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k35,k36,k37 -->\n<p>\\(I=\\int_0^1\\frac{dx}{1+x}\\), n = 6.<br>\na) Bileşik Simpson 3/8 ile hesaplayınız.<br>\nb) Aynı n ile bileşik trapez ve bileşik Simpson 1/3 ile hesaplayınız.<br>\nc) Gerçek değer ln 2 = 0.6931472 ile karşılaştırınız.<\/p>\n\\[\\begin{aligned}I_{3/8}\\approx\\tfrac{3h}{8}[&f_0+3f_1+3f_2+2f_3\\\\&+3f_4+3f_5+f_6]\\end{aligned}\\]","s":"<p><b>Verilenler:<\/b> h = 1/6 = 0.166667. 3h/8 = 0.0625. n = 6, 3'ün katı ve çift.<\/p>\n<div class=\"tw\"><table><tr><th>i<\/th><th>xᵢ<\/th><th>fᵢ<\/th><th>3/8 katsayı<\/th><th>Katsayı × f<\/th><\/tr>\n<tr><td>0<\/td><td>0<\/td><td>1.000000<\/td><td>1<\/td><td>1.000000<\/td><\/tr>\n<tr><td>1<\/td><td>1/6<\/td><td>0.857143<\/td><td>3<\/td><td>2.571429<\/td><\/tr>\n<tr><td>2<\/td><td>1/3<\/td><td>0.750000<\/td><td>3<\/td><td>2.250000<\/td><\/tr>\n<tr><td>3<\/td><td>1/2<\/td><td>0.666667<\/td><td>2<\/td><td>1.333334<\/td><\/tr>\n<tr><td>4<\/td><td>2/3<\/td><td>0.600000<\/td><td>3<\/td><td>1.800000<\/td><\/tr>\n<tr><td>5<\/td><td>5/6<\/td><td>0.545455<\/td><td>3<\/td><td>1.636365<\/td><\/tr>\n<tr><td>6<\/td><td>1<\/td><td>0.500000<\/td><td>1<\/td><td>0.500000<\/td><\/tr><\/table><\/div>\n<p><b>a)<\/b> Toplam 11.091128. I₃/₈ = 0.0625 × 11.091128 = <b>0.6931955<\/b>.<\/p>\n<p><b>b)<\/b> Trapez katsayıları 1, 2, 2, 2, 2, 2, 1. Toplam 8.338530. I_T = (h/2)(8.338530) = 8.338530/12 = 0.6948775.<\/p>\n<p>Simpson 1/3 katsayıları 1, 4, 2, 4, 2, 4, 1. Toplam 12.477060. I_S = (h/3)(12.477060) = 12.477060/18 = 0.6931700.<\/p>\n<p><b>c)<\/b><\/p>\n<table><tr><th>Kural (n = 6)<\/th><th>Hesaplanan<\/th><th>Gerçek<\/th><th>Mutlak fark<\/th><\/tr>\n<tr><td>Bileşik trapez<\/td><td>0.6948775<\/td><td>0.6931472<\/td><td>0.0017303<\/td><\/tr>\n<tr><td>Bileşik Simpson 1/3<\/td><td>0.6931700<\/td><td>0.6931472<\/td><td>0.0000228<\/td><\/tr>\n<tr><td>Bileşik Simpson 3/8<\/td><td>0.6931955<\/td><td>0.6931472<\/td><td>0.0000483<\/td><\/tr><\/table>\n<p>İki Simpson aynı mertebede (O(h⁴)). 1/3'ün hata sabiti daha küçük (1/180 &lt; 1/80), hatası yaklaşık yarı. Trapez hatası Simpson 1/3'ün 76 katı.<\/p>\n<p>Hata formülleriyle sınırlar (max f'' = 2, max f⁽⁴⁾ = 24, x = 0'da): trapez 4.6 × 10⁻³, Simpson 1/3 1.0 × 10⁻⁴, Simpson 3/8 2.3 × 10⁻⁴. Gerçek hatalar hepsinin altında.<\/p>\n<div class=\"slhata\"><p>Slaytın hata tablosunda Simpson 3/8 bileşik hatası \"−(b − a)h⁴f⁽⁴⁾/80 (×n/3)\" diye yazılmış. Formül zaten bileşik. \"×n/3\" ayrıca uygulanırsa hata iki kez sayılır. <span class=\"kaynak\">W5 s11<\/span><\/p><\/div>\n<div class=\"ipucu\"><p>Sık hatalar: 3/8 dizisinde f₃'e 3 yazmak. f₃ iki panele ortak, katsayısı 2. Dış çarpan 3h/8'i unutmak.<\/p><\/div>","ks":["k35","k36","k37"],"v":[],"vk":[]},"x22":{"y":"q","id":"x22","t":"Karma Simpson: n = 7 ve n = 10","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k36,k34,k35 -->\n<p>\\(I=\\int_0^1e^x\\,dx\\), gerçek değer e − 1 = 1.718282.<br>\na) n = 7. Panel dağılımını yazınız. İlk 4 alt aralıkta bileşik Simpson 1/3, son 3 alt aralıkta Simpson 3/8 kullanarak hesaplayınız.<br>\nb) Sıra ters olsa (önce 3/8, sonra 1/3) sonuç ne olur?<br>\nc) n = 10 için hangi kural doğrudan uygulanır? Sonucu bulunuz.<br>\nd) \"n = 10 ise 1 adet 3/8 paneli + 3 adet 1/3 paneli\" ifadesi doğru mu? Karma istenirse doğru dağılımı yazıp hesaplayınız.<\/p>","s":"<p><b>a)<\/b> n = 7 tek. 7 = 2 + 2 + 3: iki adet 1/3 paneli ve bir adet 3/8 paneli. h = 1/7 = 0.142857.<\/p>\n<div class=\"tw\"><table><tr><th>i<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>7<\/th><\/tr>\n<tr><th>xᵢ<\/th><td>0<\/td><td>0.142857<\/td><td>0.285714<\/td><td>0.428571<\/td><td>0.571429<\/td><td>0.714286<\/td><td>0.857143<\/td><td>1<\/td><\/tr>\n<tr><th>fᵢ<\/th><td>1.000000<\/td><td>1.153565<\/td><td>1.330712<\/td><td>1.535063<\/td><td>1.770795<\/td><td>2.042727<\/td><td>2.356418<\/td><td>2.718282<\/td><\/tr><\/table><\/div>\n\\[\\begin{aligned}I_1&=\\tfrac h3[f_0+4f_1+2f_2+4f_3+f_4]\\\\&=0.047619(16.186731)=0.770797\\end{aligned}\\]\n\\[\\begin{aligned}I_2&=\\tfrac{3h}8[f_4+3f_5+3f_6+f_7]\\\\&=0.053571(17.686512)=0.947492\\end{aligned}\\]\n<p>I = I₁ + I₂ = <b>1.718288<\/b>. Hata 6.6 × 10⁻⁶.<\/p>\n<p><b>b)<\/b> Önce 3/8 (x₀…x₃), sonra bileşik 1/3 (x₃…x₇):<\/p>\n\\[\\tfrac{3h}8(9.987894)+\\tfrac h3(24.847651)\\]\n\\[=0.535066+1.183221=1.718287\\]\n<p>Hata 5.4 × 10⁻⁶. İki sıra da geçerli, sonuçlar çok yakın. Föydeki <a href=\"#\" data-go=\"q:c6\">C6<\/a> önce 1/3, sonra 3/8 kullanıyor.<\/p>\n<p><b>c)<\/b> n = 10 çift. Bileşik Simpson 1/3 doğrudan uygulanır. h = 0.1.<\/p>\n<p>f₀…f₁₀ = 1, 1.105171, 1.221403, 1.349859, 1.491825, 1.648721, 1.822119, 2.013753, 2.225541, 2.459603, 2.718282.<\/p>\n<p>Σf_tek (f₁, f₃, f₅, f₇, f₉) = 8.577107. Σf_çift (f₂, f₄, f₆, f₈) = 6.760888.<\/p>\n\\[\\begin{aligned}I&=\\tfrac{0.1}{3}[1+4(8.577107)\\\\&\\quad+2(6.760888)+2.718282]\\\\&=\\tfrac{0.1}{3}(51.548486)=1.718283\\end{aligned}\\]\n<p>Hata 1.0 × 10⁻⁶.<\/p>\n<p><b>d)<\/b> Yanlış. 3/8 paneli 3, 1/3 paneli 2 alt aralık kaplar: 3 + 3·2 = 9 ≠ 10. Karma istenirse 2 adet 1/3 (4 aralık) + 2 adet 3/8 (6 aralık) = 10.<\/p>\n\\[\\tfrac{0.1}{3}[f_0+4f_1+2f_2+4f_3+f_4]=0.491825\\]\n\\[\\begin{aligned}\\tfrac{0.3}{8}[&f_4+3f_5+3f_6+2f_7\\\\&+3f_8+3f_9+f_{10}]=1.226459\\end{aligned}\\]\n<p>Toplam 1.718284, hata 1.9 × 10⁻⁶. Saf bileşik 1/3 daha iyi. n çiftse karmaya gerek yok.<\/p>\n<table><tr><th>n<\/th><th>Dağılım<\/th><\/tr>\n<tr><td>5<\/td><td>1 adet 1/3 + 1 adet 3/8<\/td><\/tr>\n<tr><td>7<\/td><td>2 adet 1/3 + 1 adet 3/8<\/td><\/tr>\n<tr><td>9<\/td><td>3 adet 3/8 (ya da 3 adet 1/3 + 1 adet 3/8)<\/td><\/tr>\n<tr><td>10<\/td><td>5 adet 1/3 (karma istenirse 2 adet 1/3 + 2 adet 3/8)<\/td><\/tr><\/table>\n<div class=\"slhata\"><p>Slayt \"n = 10 ise → 1 adet 3/8 paneli + 3 adet 1/3 paneli\" yazıyor. Bu 9 alt aralık eder. Ayrıca n = 5 için bir yerde \"son panel 3/8\", başka yerde \"ilk panel 3/8\" diyor. İkisi de uygulanabilir. <span class=\"kaynak\">W5 s9-10<\/span><\/p><\/div>\n<div class=\"ipucu\"><p>Sık hatalar: birleşme düğümünü (a şıkkında f₄) bir parçada atlamak. f₄ iki parçada da katsayı 1 ile girer. Panel sayısı ile alt aralık sayısını karıştırmak.<\/p><\/div>","ks":["k36","k34","k35"],"v":[],"vk":[]},"x23":{"y":"q","id":"x23","t":"Hata 10⁻⁴'ten küçük: kaç alt aralık?","g":5,"sub":"Ek alıştırmalar","h":"<\!-- k: k37,k32,k34 -->\n<p>Mutlak hatanın 10⁻⁴'ten küçük olması isteniyor.<br>\na) \\(\\int_0^1e^x\\,dx\\) için bileşik trapez ve bileşik Simpson 1/3 ile en az kaç alt aralık gerekir?<br>\nb) \\(\\int_1^3\\frac{dx}{x}\\) için aynı soruyu cevaplayınız.<br>\nc) Bulduğunuz n ile gerçek hatayı kontrol ediniz (e − 1 = 1.718282, ln 3 = 1.098612).<\/p>\n\\[|E_T|\\le\\frac{(b-a)h^2}{12}\\max|f''|,\\quad h=\\frac{b-a}{n}\\]\n\\[|E_S|\\le\\frac{(b-a)h^4}{180}\\max|f^{(4)}|\\]","s":"<p><b>a)<\/b> f'' = f⁽⁴⁾ = eˣ. [0, 1]'de en büyüğü e. b − a = 1, h = 1/n.<\/p>\n\\[\\frac{e}{12n^2}\\le10^{-4}\\Rightarrow n^2\\ge2265.23\\Rightarrow n\\ge47.59\\]\n<p>Trapez: <b>n = 48<\/b>.<\/p>\n\\[\\frac{e}{180n^4}\\le10^{-4}\\Rightarrow n^4\\ge151.02\\Rightarrow n\\ge3.51\\]\n<p>Simpson: n = 4 (çift olmalı). <b>n = 4<\/b>.<\/p>\n<p><b>b)<\/b> f = 1/x. f'' = 2/x³, f⁽⁴⁾ = 24/x⁵. İkisi de x = 1'de en büyük: 2 ve 24. b − a = 2, h = 2/n.<\/p>\n\\[\\frac{2(2/n)^2(2)}{12}=\\frac{4}{3n^2}\\le10^{-4}\\]\n\\[\\Rightarrow n^2\\ge13333.3\\Rightarrow n\\ge115.47\\]\n<p>Trapez: <b>n = 116<\/b>.<\/p>\n\\[\\frac{2(2/n)^4(24)}{180}=\\frac{4.2667}{n^4}\\le10^{-4}\\]\n\\[\\Rightarrow n^4\\ge42666.7\\Rightarrow n\\ge14.37\\]\n<p>Simpson: 15 tek, Simpson 1/3 için n çift olmalı. <b>n = 16<\/b>.<\/p>\n<p><b>c)<\/b><\/p>\n<div class=\"tw\"><table><tr><th>İntegral<\/th><th>Kural<\/th><th>n<\/th><th>Formül sınırı<\/th><th>Gerçek hata<\/th><\/tr>\n<tr><td>∫eˣ<\/td><td>Trapez<\/td><td>48<\/td><td>9.83 × 10⁻⁵<\/td><td>6.21 × 10⁻⁵<\/td><\/tr>\n<tr><td>∫eˣ<\/td><td>Simpson 1/3<\/td><td>4<\/td><td>5.90 × 10⁻⁵<\/td><td>3.70 × 10⁻⁵<\/td><\/tr>\n<tr><td>∫1/x<\/td><td>Trapez<\/td><td>116<\/td><td>9.91 × 10⁻⁵<\/td><td>2.20 × 10⁻⁵<\/td><\/tr>\n<tr><td>∫1/x<\/td><td>Simpson 1/3<\/td><td>16<\/td><td>6.51 × 10⁻⁵<\/td><td>7.75 × 10⁻⁶<\/td><\/tr><\/table><\/div>\n<p>Hepsi 10⁻⁴'ün altında. Sınır en büyük türevle kurulduğu için kötümserdir. 1/x'te gerçek hataya bakılsa trapez için n = 55, Simpson için n = 10 yeterdi. Ama sınav garanti ister: formülle bulunan n yazılır.<\/p>\n<div class=\"vurgu\"><p>\"Pratikte: n=4 ile Simpson, n=100 ile Trapez'den daha iyi sonuç verebilir. Yöntem seçimi kritiktir!\" <span class=\"kaynak\">W5 s11<\/span><\/p><\/div>\n<div class=\"ipucu\"><p>Sık hatalar: n'yi aşağı yuvarlamak (47.59 → 47 yanlış). Simpson'da tek n bırakmak. max|f''|'yi yanlış uçta almak; 1/x'te en büyük değer x = 1'de.<\/p><\/div>","ks":["k37","k32","k34"],"v":[],"vk":[]},"slhata":{"y":"n","id":"slhata","t":"Slayt hataları","g":5,"sub":"Son hazırlık","h":"<p>Slaytlarda yanlış ya da çelişkili 31 yer var. Her biri aşağıda: PDF ve sayfa, slaytta yazan, doğrusu, kısa gerekçe. Numaralar (H1-H20 ve N1-N8) kaynak listeyle aynı. N9-N11 konu notlarından sonradan eklendi.<\/p>\n<div class=\"ipucu\"><b>Sınavda:<\/b> Hocanın kâğıdında bunlardan biri çıkarsa slayttaki değeri tekrarlama, doğrusunu yaz ve yanına kısa bir not düş.<\/div>\n<p>PDF kısaltmaları: W1 = 1. hafta, G2 = 2. hafta güncellenmiş, W234 = 2-3-4. hafta, W5 = 5. hafta Newton-Cotes. Sayfa numarası PDF sırası. Formüllerin doğru hâli <a href=\"#\" data-go=\"n:formul\">formül kâğıdında<\/a>.<\/p>\n<h3>1. hafta<\/h3>\n<div class=\"slhata\"><b>H17 · W1 s18 (1 − cos 1° örneği)<\/b><br>\nSlaytta: Δ_b için hem 0.000002 hem \"≈ 0.000005\" yazıyor.<br>\nDoğrusu: yaklaşık 0.000002 (0.0000017).<br>\nGerekçe: a₁ = 0.0087 ve Δa₁ = 0.00005 için Δ_b = |4a₁|Δa₁ = 4(0.0087)(0.00005) = 1.74 × 10⁻⁶. Bağıl hata %1.15 doğru.<\/div>\n<div class=\"slhata\"><b>N8 · W1 s6 (ders çerçevesi)<\/b><br>\nSlaytta: \"herhangi bir bilimsel makinesine ihtiyacınız olacaktır\".<br>\nDoğrusu: bilimsel hesap makinesi.<br>\nGerekçe: yazım eksiği, içeriği değiştirmiyor. Sınavda bilimsel hesap makinesi gerekecek.<\/div>\n<h3>2. hafta<\/h3>\n<div class=\"slhata\"><b>H3 · G2 s7 (cos 0.5 Taylor)<\/b><br>\nSlaytta: P₃(x) = 1 − x²/2 yazıyor ve yanında 0.877604 gösteriyor.<br>\nDoğrusu: P₃(0.5) = 0.875. 0.877604 değeri 4. derece polinomun değeri.<br>\nGerekçe: 1 − 0.5²/2 = 0.875. 0.877604 değeri x⁴/24 terimini de içeriyor: 1 − 0.125 + 0.002604. W234 s5 doğru anlatıyor (4 terimli seri).<\/div>\n<div class=\"slhata\"><b>H1 · G2 s13 (Newton tablosu, (0, −5), (1, 1), (3, 25), (4, 55))<\/b><br>\nSlaytta: ikinci farklar 3 ve 9.<br>\nDoğrusu: 2 ve 6. P₃ = −5 + 6x + 2x(x − 1) + x(x − 1)(x − 3).<br>\nGerekçe: (12 − 6)/(3 − 0) = 2 ve (30 − 12)/(4 − 1) = 6. Üçüncü fark (6 − 2)/(4 − 0) = 1. Slaytın 3'lü katsayısıyla P₃(3) = 31 çıkar, oysa veri 25. Son polinom x³ − 2x² + 7x − 5 doğru.<\/div>\n<div class=\"slhata\"><b>N3 · W234 s13 (eˣ Newton, Adım 3)<\/b><br>\nSlaytta: f[0,1,2,3] = (4.0128 − 1.4763)/3 = 2.5365/3 = 0.8455.<br>\nDoğrusu: (4.0128 − 1.4762)/3 = 2.5366/3 = 0.8455.<br>\nGerekçe: Adım 2'de f[0,1,2] = 1.4762 bulunmuş. 1.4763 yazım hatası. Sonuç 0.8455 değişmiyor.<\/div>\n<div class=\"slhata\"><b>H4 · W234 s12 ile s13 (eˣ Newton tablosu)<\/b><br>\nSlaytta: s12 tablosunda 4.6707, 12.6962, 4.0129. s13 adımlarında 4.6708, 12.6964, 4.0128.<br>\nDoğrusu: 4 ondalıklı veriyle 4.6708, 12.6964, 4.0128.<br>\nGerekçe: 4.6708 = 7.3891 − 2.7183, 12.6964 = 20.0855 − 7.3891. s12'deki son basamaklar tutmuyor. P₃(0.5) = 1.8072 değişmiyor.<\/div>\n<div class=\"slhata\"><b>H2 · G2 s18 (Alıştırma 2, x = 0, 1, 2 ve f = 1, 3, 7)<\/b><br>\nSlaytta: \"Beklenen: 1 + 2x + x² → P₂(1.5) = 6.25\".<br>\nDoğrusu: P₂(x) = x² + x + 1 ve P₂(1.5) = 4.75.<br>\nGerekçe: 1 + 2x + x² verisi vermez, x = 2'de 9 çıkar (veri 7). G2 s20 ve W234 s14 4.75 yazıyor.<\/div>\n<div class=\"slhata\"><b>H18 · W234 s1-2 (bölüm başı)<\/b><br>\nSlaytta: \"5 Çözümlü Örnek\" yazıyor. 5. örnek (interpolasyon ve ekstrapolasyon farkı, risk, seçim kuralları). s2 başlığı \"BÖLÜM II\", kapakta \"BÖLÜM I\".<br>\nDoğrusu: 5. örnek slaydı PDF'te yok. Hafta 2 bölümünde 4 örnek var.<br>\nGerekçe: sayfa listesinde böyle bir slayt yok. Bölüm numarası tutarsız, içeriği etkilemiyor.<\/div>\n<h3>3. hafta<\/h3>\n<div class=\"slhata\"><b>H5 · W234 s24 (δ³ türetmesi)<\/b><br>\nSlaytta: türetme \\([f_{i+2}-2f_{i+1}+f_i]-[f_{i+1}-2f_i+f_{i-1}]\\) ve sonuç \\(f_{i+2}-2f_{i+1}+2f_{i-1}-f_{i-2}\\).<br>\nDoğrusu: türetme \\(f_{i+2}-3f_{i+1}+3f_i-f_{i-1}\\) eder. Sonuç formülü \\(2\\mu\\delta^3f_i=\\Delta^3f_{i-1}+\\Delta^3f_{i-2}\\).<br>\nGerekçe: iki ifade eşit değil. x³, h = 1, xᵢ = 0 için sonuç formülü 12, \\(\\Delta^3f_{-1}+\\Delta^3f_{-2}=6+6=12\\). Föy sonuç formülünü kullanıyor (<a href=\"#\" data-go=\"q:c2\">C2<\/a>).<\/div>\n<div class=\"slhata\"><b>N5 · W234 s25 (özet tablo, δ¹ satırı)<\/b><br>\nSlaytta: δ¹ için \\([f(x_{i+1})-f(x_{i-1})]/2\\) yazıyor (\"sayısal türev CD2\").<br>\nDoğrusu: bu ifade μδ f(xᵢ), yani ortalama operatör çarpı merkezi fark.<br>\nGerekçe: s17'de tanım δf(xᵢ) = f(xᵢ₊½) − f(xᵢ₋½). Tam düğümlerde \\([f(x_{i+1})-f(x_{i-1})]/2\\) ortalama alınmış hâli.<\/div>\n<div class=\"slhata\"><b>H20 · W234 s17 ile s28 (hata mertebesi)<\/b><br>\nSlaytta: s17 \"Δ ve ∇ için O(h), δ için O(h²)\". s28 \"δ için 3. ve 4. mertebede O(h⁴), hata her mertebede iki kat daha iyi\".<br>\nDoğrusu: Δ ve ∇ için O(h), δ için O(h²). δ³ ve δ⁴ de O(h²).<br>\nGerekçe: <a href=\"#\" data-go=\"q:c2\">C2<\/a>'de δ³ ile hata \\(\\frac{h^2}{4}|f^{(5)}|=0.00177\\), yani O(h²). Sınavda basit hâli yaz.<\/div>\n<div class=\"slhata\"><b>H7 · W234 s29 (sin x fark tablosu, h = 0.2)<\/b><br>\nSlaytta: ikinci Δ³f değeri +0.0070.<br>\nDoğrusu: −0.0070.<br>\nGerekçe: tam sin değerleriyle Δ³f = −0.0076 ve −0.0070, Δ⁴f = 0.0006. Aynı sayfada Δf sütunundaki kırmızı etiketlerden ikincisi ve sonrakiler yanlış (\"f(0.4) − f(0.0) = 0.3894 − 0.1987\" gibi). Doğrusu f(0.4) − f(0.2), f(0.6) − f(0.4), f(0.8) − f(0.6). Sayısal değerler doğru.<\/div>\n<div class=\"slhata\"><b>H6 · W234 s27 (sin x türevi, x₀ = π/6, h = 0.1)<\/b><br>\nSlaytta: sin(0.4236) = 0.41165 ve sin(0.6236) = 0.58070. Merkezi fark 0.8453, hata 0.0207 ve \"merkezi fark yanıltıcı\".<br>\nDoğrusu: sin(0.4236) = 0.41104 ve sin(0.6236) = 0.58396. İleri 0.8396 (hata 0.0264), geri 0.8896 (0.0235), merkezi 0.8646 (hata 0.0014).<br>\nGerekçe: gerçek cos(π/6) = 0.8660. Merkezi fark en iyi çıkıyor. \"Yanıltıcı\" yorumu yanlış sin değerlerinden doğmuş.<\/div>\n<div class=\"slhata\"><b>H8 · W234 s31 (NIFF, cos 0.25)<\/b><br>\nSlaytta: Δ²f = 0.050, Δ³f = 0.266, sonuç 0.9494, hata %2.01. Ayrıca 0.0625 × 0.266 = +0.0166 terimini \"−0.0166\" diye toplamış.<br>\nDoğrusu: Δ²f = −0.131, Δ³f = 0.085. P₃(0.25) = 0.9713, hata 0.0024 (%0.25).<br>\nGerekçe: Δf = −0.122, −0.338, −0.469. Δ²f = −0.216 ve −0.131. Δ³f = −0.131 − (−0.216) = 0.085. P₃ = 1 − 0.061 + 0.027 + 0.0053 = 0.9713 (gerçek cos 0.25 = 0.9689). \"Hata büyük\" yorumu yanlış.<\/div>\n<div class=\"slhata\"><b>H9 · W234 s34 (Stirling, sin 0.3)<\/b><br>\nSlaytta: Δ²f₋₁ = f₀ − 2f₋₁ + f₋₂ ve \"x_{i−2} yok, yalnız ilk terim\". Sonuç 0.2961.<br>\nDoğrusu: Δ²f₋₁ = f₁ − 2f₀ + f₋₁ = 0.3894 − 2(0.1987) + 0 = −0.0080. Üç terimle 0.29505.<br>\nGerekçe: üç düğümle hesaplanabilir. Gerçek sin 0.3 = 0.29552, üç terimli hata 0.00047. Sınavda slayttaki iki terimli 0.2961 beklenebilir, ama tanım doğru yazılmalı.<\/div>\n<div class=\"slhata\"><b>H10 · W234 s38 (sıcaklık, T(1.75))<\/b><br>\nSlaytta: \"Stirling biraz daha doğru\".<br>\nDoğrusu: NGFF 83.125 tam sonuç. Stirling'in 2 terimli 83.75'i eksik terimli.<br>\nGerekçe: ∇³ = 0 olduğu için veri 2. derece. Stirling'e s²/2·δ²f₀ = 0.125 × (−5) = −0.625 terimi eklenince 83.75 − 0.625 = 83.125 çıkar.<\/div>\n<div class=\"slhata\"><b>N4 · W234 s36 (gemi direnci V = 13 kn)<\/b><br>\nSlaytta: başlık \"NIFF (3 terim)\" ve \"NGFF (3 terim)\".<br>\nDoğrusu: dört terim kullanılıyor.<br>\nGerekçe: 4 veri noktası, 3. farka kadar gidiliyor. NIFF 20 + 15 + 7.5 − 1.25 = 41.25. NGFF 130 − 105 + 15 + 1.25 = 41.25. Sonuç doğru.<\/div>\n<h3>4. hafta<\/h3>\n<div class=\"slhata\"><b>H19 · W234 s41 (CD2 türetmesi)<\/b><br>\nSlaytta: \"h² terimleri aynı işarette (toplanır) → iptal olur\".<br>\nDoğrusu: iki açılım çıkarıldığı için h² terimleri iptal olur.<br>\nGerekçe: f(x + h) − f(x − h) = 2hf′ + (2h³/6)f‴ + …. f″ terimi çıkarmada gider.<\/div>\n<div class=\"slhata\"><b>N1 · W234 s41 (CD2 kutusu)<\/b><br>\nSlaytta: \"h = 0.1 → 100x daha hassas vs ileri/geri\".<br>\nDoğrusu: 10 kat.<br>\nGerekçe: O(h) = 0.1 ve O(h²) = 0.01, oran 10. Aynı PDF s34 \"O(0.1)'den 10x daha iyi\" diyor. Sabitlerle de oran 30, 100 çıkmaz.<\/div>\n<div class=\"slhata\"><b>N2 · W234 s42 (FD2 ve BD2 türetmesi)<\/b><br>\nSlaytta: \"4·f(x + h) − f(x + 2h) = 4f + 4hf′ + 2h²f″ … − f − 2hf′ − 4h²f″ …\". BD2 satırı da \"− 4h²f″\".<br>\nDoğrusu: \"− 2h²f″\".<br>\nGerekçe: f(x + 2h) açılımında f″ terimi (2h)²/2 = 2h². 4(h²/2) = 2h², fark 0 ve f″ iptal olur. Slaytın yazdığı −4h² ile −2h²f″ kalırdı.<\/div>\n<div class=\"slhata\"><b>N7 · W234 s42, s43, s45 (kısaltma)<\/b><br>\nSlaytta: s42'de CD2 1. türev formülü. s43'te 2. türev formülü de \"CD2\". s45 tablosunda aynı formül \"D2\".<br>\nDoğrusu: 1. türev CD2, 2. türev D2.<br>\nGerekçe: aynı kısaltma iki formüle verilmiş. Sınavda D2 yaz, tabloyla uyumlu.<\/div>\n<div class=\"slhata\"><b>H12 · W234 s45 ile s47 (en iyi h)<\/b><br>\nSlaytta: s45 \"ε ≈ 10⁻⁸ için √ε ≈ 10⁻⁴\". s47 \\(\\varepsilon_m\\approx2.2\\times10^{-16}\\) alıp h ≈ 10⁻⁸ veriyor.<br>\nDoğrusu: \\(h_{opt}=\\sqrt{\\varepsilon_{machine}}\\approx10^{-8}\\) (s47 ve s51).<br>\nGerekçe: \\(\\sqrt{2.2\\times10^{-16}}=1.5\\times10^{-8}\\). s45'teki ε ≈ 10⁻⁸ makine epsilonu değil.<\/div>\n<div class=\"slhata\"><b>N9 · W234 s46 ile s49 ve s51 (FD1 ve BD1)<\/b><br>\nSlaytta: s46 tercih tablosu sol sınırda \"FD1 veya FD2\", sağ sınırda \"BD1 veya BD2\" diyor. s49 ve s51 \"Asla FD1/BD1 kullanma\" diyor.<br>\nDoğrusu: ikisi birlikte doğru olamaz. Soru FD1 ya da BD1 istiyorsa onu uygula. Seçim sana kalmışsa FD2 ve BD2.<br>\nGerekçe: föy A1 ve A2 FD1 ve BD1'i açıkça istiyor. Kendi seçimin için FD2 ve BD2 O(h²) verir (<a href=\"#\" data-go=\"k:k27\">K27<\/a>).<\/div>\n<div class=\"slhata\"><b>N10 · W234 s51, adım 4 (\"h_opt'u geç\")<\/b><br>\nSlaytta: \"h küçült ama h_opt'u geç!\".<br>\nDoğrusu: \"h_opt'u geçme\".<br>\nGerekçe: h_opt'tan küçük h'de yuvarlama hatası kesme hatasını geçer ve toplam hata artar. \"Geç\" yazımı doğru talimat değil (<a href=\"#\" data-go=\"k:k27\">K27<\/a>).<\/div>\n<div class=\"slhata\"><b>N11 · W234 s50 (ikinci türev örneği, bozuk satır)<\/b><br>\nSlaytta: bir satırda \"= 0.0336 − 0.0336 + … = −0.0336/0.04\".<br>\nDoğrusu: [0.9320 − 1.6830 + 0.7174]/0.04 = −0.0336/0.04 = −0.84.<br>\nGerekçe: parantez içi toplam −0.0336. Ara satırdaki \"0.0336 − 0.0336 + …\" ifadesi bu toplamı vermez (<a href=\"#\" data-go=\"k:k29\">K29<\/a>).<\/div>\n<div class=\"slhata\"><b>H11 · W234 s48 (eˣ, x = 1, h = 0.5)<\/b><br>\nSlaytta: CD4 için bağıl hata %0.18 ve değer 2.713.<br>\nDoğrusu: %0.21.<br>\nGerekçe: CD4 = 2.71245 (4 ondalıklı tabloyla 2.71248). Hata |2.71828 − 2.71245| = 0.00583, bağıl %0.21. Slaytın kendi grafiğinde legend CD4 m = 2.712 diyor.<\/div>\n<h3>5. hafta<\/h3>\n<div class=\"slhata\"><b>H13 · W5 s11 (eˣ karşılaştırma tablosu)<\/b><br>\nSlaytta: Simpson n = 2: 1.71882, hata 0.00054. n = 4: 1.71829, hata 0.000013. Oran ≈ 41.<br>\nDoğrusu: n = 2: 1.71886, hata 0.00058. n = 4: 1.71832, hata 0.000037. Oran 15.65 ≈ 16.<br>\nGerekçe: Simpson O(h⁴), h yarıya inince hata 16'ya bölünür. Slaytın \"41\" oranı bunu tutmuyor. Gerçek e − 1 = 1.71828.<\/div>\n<div class=\"slhata\"><b>N6 · W5 s11 (Simpson 3/8 bileşik hata)<\/b><br>\nSlaytta: \"−(b − a)h⁴f⁽⁴⁾(ξ)/80 (× n/3)\".<br>\nDoğrusu: \\(-\\frac{(b-a)h^4}{80}f^{(4)}(\\bar\\xi)\\), ek çarpan yok.<br>\nGerekçe: tek panel hata \\(-\\frac{3h^5}{80}f^{(4)}\\). n/3 panel toplamı \\(\\frac n3\\cdot\\frac{3h^5}{80}=\\frac{nh^5}{80}=\\frac{(b-a)h^4}{80}\\). Formül zaten bileşik. eˣ, [0, 1], n = 6: gerçek hata 1.65 × 10⁻⁵, formül 1.59 × 10⁻⁵, \"× n/3\" ile 3.18 × 10⁻⁵ (2 kat fazla).<\/div>\n<div class=\"slhata\"><b>H14 · W5 s9 (karma kullanım)<\/b><br>\nSlaytta: \"n = 10 ise 1 adet 3/8 + 3 adet 1/3 panel\".<br>\nDoğrusu: n = 10 çift, bileşik Simpson 1/3 doğrudan uygulanır.<br>\nGerekçe: 3/8 paneli 3 aralık, 1/3 paneli 2 aralık. 3 + 3·2 = 9, 10 etmez. Karma istenirse 2 adet 3/8 (6) + 2 adet 1/3 (4) = 10.<\/div>\n<div class=\"slhata\"><b>H15 · W5 s10 (n = 5 için panel sırası)<\/b><br>\nSlaytta: bir yerde \"son panel 3/8\", başka yerde \"ilk panel 3/8\".<br>\nDoğrusu: slayt kendi içinde çelişiyor. Föy (<a href=\"#\" data-go=\"q:c6\">C6<\/a>) ilk iki aralığı 1/3, son üç aralığı 3/8 yapıyor.<br>\nGerekçe: iki sıra da geçerli bir karma kural ama sonuç farklı (1.3348 ve ters sırada 1.3246). Soruda hangi sıra yazılıysa onu uygula.<\/div>\n<div class=\"slhata\"><b>H16 · W5 s12 (√(1 + x³), Simpson 3/8)<\/b><br>\nSlaytta: f(2/3) = 1.1041 ve f(4/3) = 1.6916.<br>\nDoğrusu: 1.1386 ve 1.8359.<br>\nGerekçe: √(1 + 8/27) = 1.13855 ve √(1 + 64/27) = 1.83586. Slaytın ara değerleriyle 3.0968 çıkar. Slaytın sonucu 3.2308 doğru (<a href=\"#\" data-go=\"q:c5\">C5<\/a>).<\/div>\n<p class=\"sn\">Ayrıca W5 s2'de bir kutu üst üste binmiş. \"Hesaplama hızı kritik: yüksek boyutlu integraller, Monte Carlo, Gauss küad.\" kutusu Newton-Cotes kutusunun altında kalıyor. Gauss 6. hafta konusu, vize dışı.<\/p>"},"songun":{"y":"n","id":"songun","t":"Son gün listesi","g":5,"sub":"Son hazırlık","h":"<p>Vizeden önceki gün bu listeyi baştan sona geç.<\/p>\n<h3>Kontrol listesi<\/h3>\n<ul>\n<li>Formül kâğıdını bir kez bakmadan elle yazdım (<a href=\"#\" data-go=\"n:formul\">formül kâğıdı<\/a>). Türev formülleri, fark operatörleri, NIFF, NGFF, Stirling, Newton-Cotes ve hata terimleri dahil.<\/li>\n<li>17 föy sorusunu çözümü kapatıp en az bir kez yeniden çözdüm: <a href=\"#\" data-go=\"q:a1\">A1<\/a> <a href=\"#\" data-go=\"q:a2\">A2<\/a> <a href=\"#\" data-go=\"q:a3\">A3<\/a> <a href=\"#\" data-go=\"q:a4\">A4<\/a> <a href=\"#\" data-go=\"q:a5\">A5<\/a> <a href=\"#\" data-go=\"q:a6\">A6<\/a> <a href=\"#\" data-go=\"q:b7\">B7<\/a> <a href=\"#\" data-go=\"q:b8\">B8<\/a> <a href=\"#\" data-go=\"q:b9\">B9<\/a> <a href=\"#\" data-go=\"q:b10\">B10<\/a> <a href=\"#\" data-go=\"q:b11\">B11<\/a> <a href=\"#\" data-go=\"q:c1\">C1<\/a> <a href=\"#\" data-go=\"q:c2\">C2<\/a> <a href=\"#\" data-go=\"q:c3\">C3<\/a> <a href=\"#\" data-go=\"q:c4\">C4<\/a> <a href=\"#\" data-go=\"q:c5\">C5<\/a> <a href=\"#\" data-go=\"q:c6\">C6<\/a>. Özellikle Lagrange hata sınırı (<a href=\"#\" data-go=\"q:a5\">A5<\/a>), eˣ tablosu (<a href=\"#\" data-go=\"q:b8\">B8<\/a>), kiriş yükü (<a href=\"#\" data-go=\"q:b9\">B9<\/a>), üçüncü türev (<a href=\"#\" data-go=\"q:c2\">C2<\/a>), beş nokta (<a href=\"#\" data-go=\"q:c4\">C4<\/a>) ve karma Simpson (<a href=\"#\" data-go=\"q:c6\">C6<\/a>).<\/li>\n<li>Konu sayfalarındaki alıştırmaları çözdüm. Föyde sorusu olmayan konular da hazır: hata yayılımı, Taylor, Horner, Stirling, en iyi h, hata sınırından n seçimi, n tek karma Simpson.<\/li>\n<li>Slayt hatalarını okudum (<a href=\"#\" data-go=\"n:slhata\">slayt hataları<\/a>). En çok δ³ formülü, Simpson 3/8 bileşik hatası, CD2 \"10 kat\" ve karma Simpson sırasına baktım.<\/li>\n<li>İleri, geri ve bölünmüş fark tablosunu hızlı kurabiliyorum.<\/li>\n<li>s'yi biliyorum: NİFİF \\((x-x_0)/h\\), NGFİF \\((x-x_n)/h\\) ve negatif. NİFİF katsayıları üst satırdan, NGFİF alt satırdan.<\/li>\n<li>Türev paydaları: h, 2h, 12h, h², 12h², 2h³.<\/li>\n<li>Katsayı dizileri: trapez 1, 2, …, 2, 1. Simpson 1/3: 1, 4, 2, …, 4, 1. Simpson 3/8: 1, 3, 3, 2, …, 3, 3, 1.<\/li>\n<li>Hata sınırlarını yazabiliyorum: Lagrange (n + 1 türev, (n + 1)!), Taylor, trapez, Simpson.<\/li>\n<li>Hesap makinesi bilimsel, RAD modunda, pili dolu.<\/li>\n<li>Hocaya soracaklarım: formül kâğıdı verilecek mi, hafta 6 ve 7 kapsamda mı, bağıl hatada payda gerçek mi yaklaşık mı.<\/li>\n<\/ul>\n<h3>Vize büyük ihtimalle böyle<\/h3>\n<p>Föyde alt maddelerle 8 türev, 7 integral, 4 ileri ya da geri fark ve 3 Newton-Lagrange sorusu var (<a href=\"#\" data-go=\"n:rehber\">sınav rehberi<\/a>). Hemen her soru \"hesapla ve gerçek değerle karşılaştır\" diye bitiyor. En az bir uzun mühendislik sorusu bekle: aynı veriyle interpolasyon, trapez, Simpson ve analitik karşılaştırma (<a href=\"#\" data-go=\"q:b7\">B7<\/a>, <a href=\"#\" data-go=\"q:b9\">B9<\/a> tipi). Formüller büyük ihtimalle kâğıtta verilir. Bu bir tahmin. Süre ve puanlar föyde yazmıyor.<\/p>\n<h3>Sınavda<\/h3>\n<ol>\n<li>Trigonometri varsa önce RAD modunu kontrol et.<\/li>\n<li>Her sonucu değer, hata ve bir cümle yorumla bitir.<\/li>\n<li>Tablo verildiyse tablodaki değerlerle çalış.<\/li>\n<li>Formülden önce üç kontrol: h, katsayı dizisi, dış çarpan.<\/li>\n<li>Hata hep mutlak değer. Farkı yuvarlanmış sayıdan değil tam değerden al (14/3 gibi).<\/li>\n<li>Birimi yaz: kPa·m³ = kJ.<\/li>\n<li>Soruyu yarım bırakma. Kâğıttaki çözümde puan hep burada gitmiş: hata sınırı yazılmamış, fark satırı boş, sonuç yazılmamış.<\/li>\n<li>Kolay tablo sorularını önce bitir, uzun soruya zaman ayır.<\/li>\n<li>Hocanın kâğıdında slayttaki yanlış bir değer çıkarsa doğrusunu yaz ve yanına kısa not düş.<\/li>\n<\/ol>\n<h3>Ara değeri yuvarlama<\/h3>\n<p>Pay küçük ve katsayılar büyükse ara değerleri yuvarlamak sonucu kaydırır. Tabloya 6 ondalık yaz, ama sonucu makinede yuvarlamadan hesapla.<\/p>\n<div class=\"tw\">\n<table>\n<tr><th>Soru<\/th><th>Tam<\/th><th>6 ondalıkla<\/th><th>4 ondalıkla<\/th><th>Gerçek<\/th><\/tr>\n<tr><td>cos x, üçüncü türev (<a href=\"#\" data-go=\"q:c2\">C2<\/a>)<\/td><td>0.705341<\/td><td>0.705500<\/td><td>0.700000<\/td><td>0.707107<\/td><\/tr>\n<tr><td>cos x, beş nokta (<a href=\"#\" data-go=\"q:c4\">C4<\/a>)<\/td><td>−0.866023<\/td><td>−0.866019<\/td><td>−0.866583<\/td><td>−0.866025<\/td><\/tr>\n<\/table>\n<\/div>"},"disari":{"y":"n","id":"disari","t":"Vize dışı","g":5,"sub":"Son hazırlık","h":"<p class=\"sn\">Kapsam: Hafta 6 ve 7 programda var ama slaytı yok. Hocaya sor.<\/p>\n<p>Bunlar vizede yok. Vizeden sonra eski çalışma sitesinden devam et: <a href=\"https://dioganos.github.io/mat202/\" target=\"_blank\" rel=\"noopener\">dioganos.github.io/mat202<\/a>. İzleme kaydın orada duruyor.<\/p>\n<h3>2. haftanın ek konuları<\/h3>\n<p>Slaytta yok. Konu adları:<\/p>\n<ul>\n<li>Neville metodu (anlatım ve 3 örnek)<\/li>\n<li>Bolzano teoremi<\/li>\n<li>Ortalama Değer Teoremi<\/li>\n<\/ul>\n<h3>Vizeden sonraki haftalar<\/h3>\n<ul>\n<li>6. hafta: Gauss-Legendre integrasyonu<\/li>\n<li>7. hafta: matrisler ve lineer sistemler (Gauss yok etme, LU, Jacobi, Gauss-Seidel)<\/li>\n<li>8. hafta: özdeğer problemleri<\/li>\n<li>9. hafta: lineer olmayan denklemler (sabit nokta, Newton-Raphson, Regula-Falsi, ikiye bölme, kiriş)<\/li>\n<li>10. hafta: en küçük kareler, regresyon, korelasyon<\/li>\n<li>11. hafta: Hermite ve spline<\/li>\n<li>12. hafta: diferansiyel denklemlerde Taylor ve Picard<\/li>\n<li>13. hafta: Euler yöntemi<\/li>\n<li>14. hafta: Runge-Kutta ve tekrar<\/li>\n<\/ul>\n<p>Eski sitedeki 14. haftada 17 \"Vize/Final Sorusu\" videosu var. Başlıkları öyle ama konuları belli değil, büyük ihtimalle vize sonrası konular.<\/p>"},"videosuz":{"y":"s","id":"videosuz","t":"BUders'te videosu olmayan konular","g":6,"secs":[{"id":"k01","t":"Dersin çerçevesi, program, değerlendirme","h":"<p class=\"sn\">Bu konunun BUders videosu yok. Not tek başına yeterli olacak şekilde yazıldı.<\/p>\n<h3>Ne işe yarar<\/h3>\n<p>Dersin neyi ölçtüğünü, haftaların sırasını ve notun nasıl oluştuğunu bilmek için. Bu çerçeve her sınav cevabına da girer: sonuç yalnız sayı değildir, değer ile hata ve yorum birlikte yazılır.<\/p>\n\n<h3>Sıfırdan anlatım<\/h3>\n<ul>\n<li>Sayısal yöntem, kapalı formülü olmayan ya da pratik olmayan problemlerde yaklaşık çözüm üretir.<\/li>\n<li>Yaklaşık çözümün her zaman bir hatası vardır. Hata ne kadar, hangi yönde ve hangi yüzünden, bu dersin ana sorusudur.<\/li>\n<li>Bu yüzden her yöntem üç şeyle birlikte öğrenilir: değer, hata, yorum.<\/li>\n<\/ul>\n<p>Küçük bir örnek. z = x + y − w olsun. w = 4.50 ± 0.02, x = 2.0 ± 0.2, y = 3.1 ± 0.5 cm. Değer z = 2.0 + 3.1 − 4.50 = 0.6 cm. Hata Δz = 0.2 + 0.5 + 0.02 = 0.72 cm. Hata değerden büyük (yaklaşık %120). Yorum: bu sonuç pratikte güvenilir değil. Yalnız \"0.6\" yazmak eksik bir cevaptır. Hata toplama kuralı için <a href=\"#\" data-go=\"k:k05\">K5<\/a> notuna bak.<\/p>\n\n<h3>Tanımlar ve formüller<\/h3>\n<p><b>Dersin temel amacı (W1 s2).<\/b> Öğrencinin yalnızca formül uygulaması değil, sayısal sonucun güvenilirliğini de değerlendirmesi hedeflenir. Üç yetkinlik:<\/p>\n<ul>\n<li><b>Yöntem seçimi:<\/b> analitik çözümün mümkün olmadığı mühendislik problemleri için uygun sayısal yaklaşımı seçmek.<\/li>\n<li><b>Hata bilinci:<\/b> yuvarlama, kesme ve ölçüm hatalarının sonucu nasıl etkilediğini yorumlamak.<\/li>\n<li><b>Uygulama becerisi:<\/b> interpolasyon, türev, integrasyon, denklem çözümü ve diferansiyel denklem yöntemlerini uygulamak.<\/li>\n<\/ul>\n<p><b>Dönem akışı (W1 s3).<\/b><\/p>\n<table>\n<tr><th>Haftalar<\/th><th>Konu<\/th><\/tr>\n<tr><td>1<\/td><td>Hata analizi<\/td><\/tr>\n<tr><td>2-3<\/td><td>İnterpolasyon, sonlu farklar<\/td><\/tr>\n<tr><td>4-6<\/td><td>Türev, integrasyon<\/td><\/tr>\n<tr><td>7-9<\/td><td>Denklem çözümleri<\/td><\/tr>\n<tr><td>10-11<\/td><td>Eğri uydurma, tiriz<\/td><\/tr>\n<tr><td>12-14<\/td><td>Diferansiyel denklemler<\/td><\/tr>\n<\/table>\n<p><b>Haftalık program (W1 s4 ve s5).<\/b><\/p>\n<div class=\"tw\">\n<table>\n<tr><th>Hafta<\/th><th>Konu<\/th><th>Odak (slayt)<\/th><\/tr>\n<tr><td>1<\/td><td>Giriş ve hata analizi<\/td><td>Doğruluk, hassasiyet, anlamlı basamak, mutlak ve bağıl hata<\/td><\/tr>\n<tr><td>2<\/td><td>Yaklaşım ve interpolasyon<\/td><td>Taylor, interpolasyon ve ekstrapolasyon kavramları<\/td><\/tr>\n<tr><td>3<\/td><td>Sonlu farklar ve interpolasyon<\/td><td>İleri, geri ve merkezi farklar, fark tabloları<\/td><\/tr>\n<tr><td>4<\/td><td>Sayısal türev alma<\/td><td>Ayrık veriden türev, hata ve adım büyüklüğü etkisi<\/td><\/tr>\n<tr><td>5<\/td><td>Sayısal integrasyon I<\/td><td>Newton-Cotes, kapalı/açık integrasyon, trapez ve Simpson<\/td><\/tr>\n<tr><td>6<\/td><td>Sayısal integrasyon II<\/td><td>Legendre polinomları ve Gauss-Legendre kuadratürü<\/td><\/tr>\n<tr><td>7<\/td><td>Matrisler ve lineer sistemler<\/td><td>Gauss eliminasyonu, geri yerine koyma, pivotlama<\/td><\/tr>\n<tr><td>8<\/td><td>Özdeğer problemleri<\/td><td>Özdeğer ve özvektör problemlerinin sayısal yorumu<\/td><\/tr>\n<tr><td>9<\/td><td>Lineer olmayan denklemler<\/td><td>Ardışık yerine koyma, Newton ve Regula-Falsi<\/td><\/tr>\n<tr><td>10<\/td><td>En küçük kareler ve eğri uydurma<\/td><td>Regresyon, korelasyon, deneysel veri ve pürüzsüzleştirme<\/td><\/tr>\n<tr><td>11<\/td><td>Hermite polinomları ve tiriz eğrileri<\/td><td>Fonksiyon ve türev bilgisiyle düzgün yaklaşım<\/td><\/tr>\n<tr><td>12<\/td><td>Diferansiyel denklemlerin yaklaşık çözümü<\/td><td>Taylor ve Picard yöntemleri<\/td><\/tr>\n<tr><td>13<\/td><td>Diferansiyel denklemlerin sayısal çözümü I<\/td><td>Euler yöntemi, adım büyüklüğü ve hata<\/td><\/tr>\n<tr><td>14<\/td><td>Diferansiyel denklemlerin sayısal çözümü II<\/td><td>Runge-Kutta yöntemi ve genel tekrar<\/td><\/tr>\n<\/table>\n<\/div>\n<p>Bu sitenin kapsamı Hafta 1 ile Hafta 5 arasıdır. Hafta 6 ve sonrası için elimizde slayt yok.<\/p>\n<p><b>Ölçme ve değerlendirme (W1 s6).<\/b><\/p>\n<table>\n<tr><th>Bileşen<\/th><th>Ağırlık<\/th><\/tr>\n<tr><td>Kısa sınav<\/td><td>%20<\/td><\/tr>\n<tr><td>Yarıyıl içi sınavları<\/td><td>%40<\/td><\/tr>\n<tr><td>Yarıyıl sonu sınavı<\/td><td>%40<\/td><\/tr>\n<\/table>\n<p>Slayt notları şunlar.<\/p>\n<ul>\n<li>Değerlendirme şekilleri ve ağırlıkları dönem içinde ihtiyaca göre değişebilir.<\/li>\n<li>Derslerde ve sınavlarda herhangi bir bilimsel hesap makinesine ihtiyacınız olacaktır. (Slaytta \"hesap\" kelimesi düşmüş.)<\/li>\n<li>Kapı kapandıktan sonra derse girmeyin lütfen, ders arasını bekleyin.<\/li>\n<li>Finale girebilmek için: en az %70 devam (en fazla 4 hafta) ve final öncesi ağırlıklı ortalama &gt; 35.<\/li>\n<li>Slayt üst notu: \"Mevcut materyaldeki yapı korunabilir, ancak yeni dönem için resmi izlenceye göre netleştirilmelidir.\"<\/li>\n<\/ul>\n<p class=\"sn\">Slayt \"final öncesi ağırlıklı ortalama\" değerinin nasıl hesaplandığını yazmıyor. Kısa sınav ve yarıyıl içi sınavlarını içeren bir ortalama olduğunu düşünmek makul. Kesin tanımı hocadan ya da resmi izlenceden öğren.<\/p>\n<p><b>Kapak formülleri (W1 s1).<\/b> Kapağın sağında üç formül kutusu var.<\/p>\n\\[a_0=a\\pm\\Delta a\\qquad\\delta=\\frac{\\Delta a}{|a|}\\]\n\\[y_{n+1}=y_n+h\\,f(x_n,y_n)\\]\n<p>İlk ikisi hata gösterimidir: gerçek değer a₀, yaklaşık değer a, mutlak hata Δa, bağıl hata δ. Üçüncüsü Euler yöntemidir, programda 13. haftada işlenir. Hata gösterimi için <a href=\"#\" data-go=\"k:k04\">K4<\/a> notuna bak.<\/p>\n\n<h3>Grafik ve şemalar<\/h3>\n<ul>\n<li>W1 s2: üç kart yan yana. Yöntem seçimi, Hata bilinci, Uygulama becerisi. Altında üç madde (sayısal değer tek başına yeterli değildir, hata + yakınsama + hesap maliyeti birlikte, her yöntemin doğruluk ve kararlılığı vurgulanır).<\/li>\n<li>W1 s3: altı kutuluk dönem akışı şeması. Kutuların üstünde hafta aralıkları, içinde konular (tablodaki gibi).<\/li>\n<li>W1 s6: üç renkli kutu, %20, %40, %40. Altında notlar ve finale giriş koşulları.<\/li>\n<li>W1 s1 kapağı: üç formül kutusu (mavi, yeşil, açık yeşil).<\/li>\n<\/ul>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>Sayısal değer tek başına yeterli değildir.<\/p><p>Sonucun hata, yakınsama ve hesap maliyetiyle birlikte değerlendirilmesi gerekir.<\/p><p>Ders boyunca her yöntemin doğruluk ve kararlılık davranışı vurgulanır.<\/p><span class=\"kaynak\">W1 s2<\/span><\/div>\n<div class=\"vurgu\"><p>Her sayısal yöntem, bir yaklaşık çözüm üretir. Bu çözümün ne kadar güvenilir olduğu yöntem kadar önemlidir.<\/p><span class=\"kaynak\">W1 s3<\/span><\/div>\n<div class=\"vurgu\"><p>Sayısal yöntemlerde sonuç, yalnızca hesaplanan sayı değildir.<\/p><p>Sonuç = Değer + Hata + Yorum<\/p><p>Bu bakış açısı, dönem boyunca tüm yöntemlerin ortak değerlendirme ölçütü olacak.<\/p><span class=\"kaynak\">W1 s22<\/span><\/div>\n\n<h3>Slayt hatası<\/h3>\n<div class=\"slhata\">\n<p><b>W1 s6, yazım eksiği.<\/b> Slayt: \"herhangi bir bilimsel makinesine ihtiyacınız olacaktır\". Doğrusu: \"bilimsel hesap makinesi\". Anlam etkisi yok.<\/p>\n<\/div>\n<p class=\"sn\">Hafta 2 ile Hafta 5 slaytlarının kapağında ders hocası Dr. Öğr. Üyesi Cihad Delen, İstanbul Teknik Üniversitesi yazıyor. Hafta 2-4 dosyasının alt bilgisinde \"İTÜ Makine Mühendisliği\" da geçer. Hafta 1 kapağında isim yok.<\/p>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>Cevabı yalnız sayıyla bitirme. Sayıya hata tahmini ve bir cümle yorum ekle.<\/li>\n<li>Hata değerden büyükse bunu açıkça yaz: sonuç güvenilir değil.<\/li>\n<li>Çok basamak yazmak sonucu daha doğru yapmaz. Hata kadar basamak yaz.<\/li>\n<li>Slaytlarda iterasyon durdurma ölçütü, ε<sub>s<\/sub> ve ε<sub>a<\/sub> yoktur. Sınavda bu terimleri slaytta aramayın.<\/li>\n<\/ul><\/div>","qs":[]},{"id":"k06","t":"Sayısal kararlılık: yakın sayıların çıkarılması","h":"<p class=\"sn\">Bu konunun BUders videosu yok. Not tek başına yeterli olacak şekilde yazıldı.<\/p>\n<h3>Ne işe yarar<\/h3>\n<p>Aynı değeri veren iki formülden hangisinin hesapta daha güvenilir olduğunu seçmeyi öğretir. Küçük θ için 1 − cos θ kötü, 2 sin²(θ/2) iyidir.<\/p>\n\n<h3>Sıfırdan anlatım<\/h3>\n<ul>\n<li>Hesap makinesi ve bilgisayar sayıları sınırlı basamakla tutar. Her sayıda küçük bir yuvarlama hatası vardır.<\/li>\n<li>İki birbirine çok yakın sayıyı çıkarınca baştaki basamaklar birbirini götürür. Geriye yalnız hatalı son basamaklar kalır. Buna anlamlı basamak kaybı denir.<\/li>\n<li>Hata aynı kalır ama sonuç küçüldüğü için bağıl hata büyür. Küçük farkların hesabında bağıl hata hızla büyüyebilir.<\/li>\n<li>Çare: ifadeyi cebirle başka bir biçime sok ki çıkarma kalmasın. Değer aynı kalır, hata davranışı değişir.<\/li>\n<\/ul>\n<p>Bu not, Hafta 1'deki hata yayılımı kurallarını kullanır. Bilmiyorsan önce <a href=\"#\" data-go=\"k:k05\">K5<\/a> notuna bak.<\/p>\n\n<h3>Tanımlar ve formüller<\/h3>\n\\[b=1-\\cos\\theta\\;\\longrightarrow\\;b=2\\sin^2\\frac{\\theta}{2}\\]\n<p>Soldaki biçim: yakın sayıların çıkarılması. Sağdaki biçim: daha kararlı ifade. Slayt s17: \"Aynı matematiksel değer, farklı hata davranışı.\"<\/p>\n<p>Neden: küçük θ için cos θ sayısı 1'e çok yakındır. 1 − cos θ içinde birbirine çok yakın iki sayı çıkarılır. Anlamlı basamak kaybı oluşur. 2 sin²(θ/2) biçimi bu problemi büyük ölçüde azaltır.<\/p>\n\n<h3>Türetim<\/h3>\n<p>Slaytın kenar notu çift açı formülünü kullanır.<\/p>\n\\[\\cos2x=1-2\\sin^2x\\]\n<p>x = θ/2 yaz. Bu, cos θ = 1 − 2 sin²(θ/2) verir. Düzenle:<\/p>\n\\[1-\\cos\\theta=2\\sin^2\\frac\\theta2\\]\n\n<h3>Slayttaki örnek<\/h3>\n<div class=\"ornek\">\n<p><b>Örnek (W1 s18).<\/b> 1 − cos(1°) hesabında iki yolu karşılaştır.<\/p>\n<p><b>Doğrudan ifade:<\/b> b = 1 − cos(1°). Slayt bağıl hatayı yaklaşık %25 verir. (Slayt ara adımı göstermez. cos 1° dört ondalıkla 0.9998 ± 0.00005 ise 1 − 0.9998 = 0.0002 ± 0.00005 ve 0.00005/0.0002 = 0.25 çıkar.)<\/p>\n<p><b>Yeniden düzenlenmiş ifade:<\/b> b = 2 sin²(0.5°). Slaytın adımları:<\/p>\n<ol>\n<li>a₁ = sin(0.5°) olsun. a₁ = 0.0087 ve Δ<sub>a₁<\/sub> = 0.00005.<\/li>\n<li>b = 2a₁² = 0.00015. Türev f′(a₁) = 4a₁.<\/li>\n<li>Mutlak hata: Δ<sub>b<\/sub> = |4a₁|·Δ<sub>a₁<\/sub> = 4(0.0087)(0.00005) ≈ 0.000002.<\/li>\n<li>Bağıl hata:\n\\[\\begin{aligned}\\delta_b&=\\frac{|4a_1|\\,\\Delta_{a_1}}{|2a_1^2|}=\\frac{2\\Delta_{a_1}}{|a_1|}\\\\&=\\frac{2(0.00005)}{0.0087}\\\\&=0.0115=\\%1.15\\end{aligned}\\]<\/li>\n<li>Oran: önceki bağıl hata 0.25 idi. 0.25 / 0.0115 = 21.73913. Bağıl hata 20 defadan fazla azalmıştır.<\/li>\n<\/ol>\n<p>Script kontrolü: a₁ = 0.0087 ile b = 0.00015138, Δ<sub>b<\/sub> = 1.74·10⁻⁶, δ<sub>b<\/sub> = 0.011494. Oran 21.75. Gerçek değer 1 − cos 1° = 1.52305·10⁻⁴, 2 sin²(0.5°) ile aynıdır.<\/p>\n<\/div>\n\n<h3>Kendi çözümlü örneğim<\/h3>\n<div class=\"ornek\">\n<p><b>Sınav tipi örnek.<\/b> 1 − cos(2°) değerini iki yolla, dört ondalık basamakla hesapla. Hangi ifade daha güvenilir? Bağıl hata sınırlarını karşılaştır.<\/p>\n<p><b>Yol 1, doğrudan.<\/b><\/p>\n<ul>\n<li>cos 2° = 0.99939. Dört ondalıkla 0.9994, belirsizlik 0.00005.<\/li>\n<li>b = 1 − 0.9994 = 0.0006. Çıkarmada mutlak hata değişmez: Δ<sub>b<\/sub> = 0.00005.<\/li>\n<li>Bağıl hata sınırı: 0.00005 / 0.0006 = 0.0833, yani %8.33.<\/li>\n<\/ul>\n<p><b>Yol 2, yeniden düzenlenmiş.<\/b><\/p>\n<ul>\n<li>b = 2 sin²(1°). a₁ = sin 1° = 0.017452, dört ondalıkla 0.0175, Δ<sub>a₁<\/sub> = 0.00005.<\/li>\n<li>b = 2(0.0175)² = 0.0006125.<\/li>\n<li>Δ<sub>b<\/sub> = |4a₁|Δ<sub>a₁<\/sub> = 4(0.0175)(0.00005) = 3.5·10⁻⁶.<\/li>\n<li>δ<sub>b<\/sub> = 2Δ<sub>a₁<\/sub>/a₁ = 2(0.00005)/0.0175 = 0.00571, yani %0.571.<\/li>\n<\/ul>\n<p><b>Karşılaştırma.<\/b> Bağıl hata sınırı %8.33'ten %0.571'e iner. Oran 14.6. Gerçek değer 1 − cos 2° = 6.0917·10⁻⁴. Doğrudan sonuç 0.0006 gerçekten %1.5 sapar, yeniden düzenlenmiş sonuç 0.0006125 yalnız %0.55 sapar. Yorum: ikinci ifade daha kararlı, onu kullan.<\/p>\n<\/div>\n<div class=\"ornek\">\n<p><b>Bilgisayarda gerçek durum (script, double duyarlık).<\/b> θ küçüldükçe doğrudan ifade çöker.<\/p>\n<div class=\"tw\">\n<table>\n<tr><th>θ (radyan)<\/th><th>1 − cos θ<\/th><th>2 sin²(θ/2)<\/th><th>Bağıl fark<\/th><\/tr>\n<tr><td>10⁻²<\/td><td>4.999958·10⁻⁵<\/td><td>4.999958·10⁻⁵<\/td><td>3·10⁻¹³<\/td><\/tr>\n<tr><td>10⁻⁴<\/td><td>5.000000·10⁻⁹<\/td><td>5.000000·10⁻⁹<\/td><td>5·10⁻⁹<\/td><\/tr>\n<tr><td>10⁻⁶<\/td><td>5.000445·10⁻¹³<\/td><td>5.000000·10⁻¹³<\/td><td>9·10⁻⁵<\/td><\/tr>\n<tr><td>10⁻⁸<\/td><td>0<\/td><td>5.0·10⁻¹⁷<\/td><td>1 (sonuç tamamen yanlış)<\/td><\/tr>\n<tr><td>10⁻⁹<\/td><td>0<\/td><td>5.0·10⁻¹⁹<\/td><td>1 (sonuç tamamen yanlış)<\/td><\/tr>\n<\/table>\n<\/div>\n<p>θ = 10⁻⁸ için cos θ bilgisayarda tam 1.0 çıkar. Çıkarma sıfır verir. 2 sin²(θ/2) hâlâ doğru: θ²/2 = 5·10⁻¹⁷.<\/p>\n<\/div>\n\n<h3>Grafik ve şemalar<\/h3>\n<ul>\n<li>W1 s17: iki ifade yan yana yazılı. Solda \"b = 1 − cos(θ)\" altında \"Yakın sayıların çıkarılması\". Sağda \"b = 2 sin²(θ/2)\" altında \"Daha kararlı ifade\". Altında slogan: \"Aynı matematiksel değer, farklı hata davranışı.\"<\/li>\n<li>W1 s18: iki kart. Solda kırmızı çizgili kart: \"Doğrudan ifade, b = 1 − cos(1°), bağıl hata yaklaşık %25\". Sağda yeşil çizgili kart: \"Yeniden düzenlenmiş ifade, b = 2 sin²(0.5°), bağıl hata yaklaşık %1.15\". Ortada el hesabı kutusu. Altta mavi bant: \"Bağıl hata 20 kattan fazla azalabilir.\"<\/li>\n<\/ul>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>Matematiksel olarak eşdeğer ifadeler, sayısal hesapta aynı güvenilirliği vermeyebilir.<\/p><p>Aynı matematiksel değer, farklı hata davranışı.<\/p><span class=\"kaynak\">W1 s17<\/span><\/div>\n<div class=\"vurgu\"><p>Küçük farkların hesabında bağıl hata hızla büyüyebilir.<\/p><p>Bağıl hata 20 kattan fazla azalabilir.<\/p><p>Algoritma seçimi, formülün kendisi kadar önemlidir.<\/p><span class=\"kaynak\">W1 s18<\/span><\/div>\n<div class=\"vurgu\"><p>Hafta 1 ödevi: 1 − cos(θ) ve 2sin²(θ/2) ifadelerini küçük θ için karşılaştırın. Sonuçları uygun anlamlı basamakla yazın ve hangi ifadenin daha kararlı olduğunu yorumlayın.<\/p><span class=\"kaynak\">W1 s21<\/span><\/div>\n\n<h3>Slayt hatası<\/h3>\n<div class=\"slhata\">\n<p><b>W1 s18, Δ<sub>b<\/sub> iki farklı değerle yazılmış.<\/b> Slayt: \"Δ<sub>b<\/sub> = |4a₁|Δ<sub>a₁<\/sub> = 0.000002, Δ<sub>b<\/sub> ≈ 0.000005\".<\/p>\n<p>Doğrusu: 4 · 0.0087 · 0.00005 = 0.00000174 ≈ 0.000002. İkinci değer (0.000005) yanlış. Bağıl hata %1.15 değeri 0.000002 ile tutarlı.<\/p>\n<\/div>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>Küçük θ görürsen 1 − cos θ'yı 2 sin²(θ/2) ile değiştir. Sınavda bu dönüşüm istenebilir.<\/li>\n<li>Çıkarma işleminde mutlak hata toplanır, sonuç küçülünce bağıl hata büyür. Önce Δ'yı, sonra bağıl hatayı hesapla.<\/li>\n<li>θ derece verilmişse hesap makinesini DEG modunda kullan. Hata analizinde radyan ile derece karışmasın.<\/li>\n<li>\"Hangisi daha kararlı\" sorusunda iki bağıl hata sınırını yaz, oranını ver, tek cümlelik yorum ekle.<\/li>\n<li>Sonucu hata kadar basamakla yaz. Gereksiz basamak yazma.<\/li>\n<\/ul><\/div>","qs":["x04"]},{"id":"k10","t":"Horner kuralı","h":"<p class=\"sn\">Bu konunun BUders videosu yok. Not tek başına yeterli olacak şekilde yazıldı.<\/p>\n<h3>Ne işe yarar<\/h3>\n<p>Bir polinomun belirli bir x noktasındaki değerini en az işlemle bulmak için. Kuvvet almaya gerek kalmaz. Newton ve Lagrange polinomlarının değerini hesaplarken de işe yarar.<\/p>\n\n<h3>Sıfırdan anlatım<\/h3>\n<ul>\n<li>Polinom: \\(P_n(x)=a_0+a_1x+a_2x^2+\\cdots+a_nx^n\\). Katsayıları a₀ ... aₙ.<\/li>\n<li>Naif hesapta her xᵏ ayrı hesaplanır. Çok kuvvet ve çok çarpma olur.<\/li>\n<li>Horner x'i parantezle dışarı çeker. İçten dışa doğru her adımda bir çarpma ve bir toplama yapılır.<\/li>\n<li>Katsayıları en yüksek dereceden başlayarak sırayla işlersin.<\/li>\n<\/ul>\n\n<h3>Tanımlar ve formüller<\/h3>\n<p>İç içe yazım (4. derece):<\/p>\n\\[P_4(x)=a_0+x\\big(a_1+x(a_2+x(a_3+x\\,a_4))\\big)\\]\n<p><b>İşlem sayısı (slayt s8).<\/b><\/p>\n<ul>\n<li>Naif: P₄(x) = a₀ + a₁x + a₂x² + a₃x³ + a₄x⁴ → 4 kuvvet + 4 çarpma + 4 toplama = 12 işlem.<\/li>\n<li>Horner: 0 kuvvet + 4 çarpma + 4 toplama = 8 işlem.<\/li>\n<\/ul>\n<p>Genel dereceyi n alırsak slaytın saymasıyla naif 3n, Horner 2n işlem eder.<\/p>\n<p><b>Algoritma.<\/b><\/p>\n\\[b_n=a_n,\\qquad b_k=a_k+x\\,b_{k+1}\\quad(k=n-1,\\dots,0)\\]\n<p>n = 4 için: b₄ = a₄; b₃ = a₃ + x b₄; b₂ = a₂ + x b₃; b₁ = a₁ + x b₂; b₀ = a₀ + x b₁. Son bulunan b₀ polinomun x noktasındaki değeridir: P(x) = b₀.<\/p>\n<ul>\n<li>En yüksek dereceli katsayıdan başlanır.<\/li>\n<li>Her adımda bir çarpma ve bir toplama yapılır.<\/li>\n<li>Türev hesapları için Horner şeması genişletilebilir (aşağıda bir örnek var).<\/li>\n<\/ul>\n<p>G2 s21 özeti: \"Verimli ve kararlı bir yöntemdir.\"<\/p>\n\n<h3>Slayttaki örnekler<\/h3>\n<div class=\"ornek\">\n<p><b>Örnek E8 (G2 s8).<\/b> \\(P_4(x)=2+3x-x^2+4x^3+x^4\\), x = 2. Katsayılar: a₄ = 1, a₃ = 4, a₂ = −1, a₁ = 3, a₀ = 2.<\/p>\n<table>\n<tr><th>Adım<\/th><th>Hesap<\/th><th>Sonuç<\/th><\/tr>\n<tr><td>b₄ = a₄<\/td><td><\/td><td>1<\/td><\/tr>\n<tr><td>b₃ = a₃ + x·b₄<\/td><td>4 + 2·1<\/td><td>6<\/td><\/tr>\n<tr><td>b₂ = a₂ + x·b₃<\/td><td>−1 + 2·6<\/td><td>11<\/td><\/tr>\n<tr><td>b₁ = a₁ + x·b₂<\/td><td>3 + 2·11<\/td><td>25<\/td><\/tr>\n<tr><td>b₀ = a₀ + x·b₁<\/td><td>2 + 2·25<\/td><td>52<\/td><\/tr>\n<\/table>\n<p>P₄(2) = 52. Doğrudan kontrol: 2 + 6 − 4 + 32 + 16 = 52. Script ile de doğrulandı.<\/p>\n<\/div>\n<div class=\"ornek\">\n<p><b>Örnek E9 (G2 s9).<\/b> \\(P_4(x)=3x^4+2x^3-x^2+2x-5\\), x = 2. Katsayılar: a₄ = 3, a₃ = 2, a₂ = −1, a₁ = 2, a₀ = −5.<\/p>\n<table>\n<tr><th>Adım<\/th><th>Hesap<\/th><th>Sonuç<\/th><\/tr>\n<tr><td>b₄<\/td><td>3<\/td><td>3<\/td><\/tr>\n<tr><td>b₃<\/td><td>2 + 2·3<\/td><td>8<\/td><\/tr>\n<tr><td>b₂<\/td><td>−1 + 2·8<\/td><td>15<\/td><\/tr>\n<tr><td>b₁<\/td><td>2 + 2·15<\/td><td>32<\/td><\/tr>\n<tr><td>b₀<\/td><td>−5 + 2·32<\/td><td>59<\/td><\/tr>\n<\/table>\n<p>P₄(2) = 59. Script ile doğrulandı.<\/p>\n<\/div>\n\n<h3>Kendi çözümlü örneklerim<\/h3>\n<div class=\"ornek\">\n<p><b>Sınav tipi örnek 1.<\/b> \\(P(x)=2x^3-6x^2+2x-1\\) polinomunun x = 3'teki değerini Horner ile bul.<\/p>\n<ul>\n<li>Katsayılar (yüksekten alçağa): 2, −6, 2, −1.<\/li>\n<li>b₃ = 2. b₂ = −6 + 3·2 = 0. b₁ = 2 + 3·0 = 2. b₀ = −1 + 3·2 = 5.<\/li>\n<li>P(3) = 5. Kontrol: 54 − 54 + 6 − 1 = 5.<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Sınav tipi örnek 2, eksik terim.<\/b> \\(P(x)=x^4-3x^2+5\\) polinomunun x = −2'deki değeri. Eksik terimlere 0 yaz.<\/p>\n<ul>\n<li>Katsayılar: 1, 0, −3, 0, 5.<\/li>\n<li>b₄ = 1. b₃ = 0 + (−2)(1) = −2. b₂ = −3 + (−2)(−2) = 1. b₁ = 0 + (−2)(1) = −2. b₀ = 5 + (−2)(−2) = 9.<\/li>\n<li>P(−2) = 9. Kontrol: 16 − 12 + 5 = 9.<\/li>\n<\/ul>\n<p>Eksik terimi atlarsan sonuç yanlış çıkar. Her kuvvete bir katsayı yazmak zorundasın.<\/p>\n<\/div>\n<div class=\"ornek\">\n<p><b>Türev için genişletme.<\/b> Aynı P(x) = x⁴ − 3x² + 5, x = −2. Slayt \"Horner şeması türev için genişletilebilir\" der. Yöntem: ilk geçişte bulduğun b₄, b₃, b₂, b₁ değerlerine Horner'ı bir kez daha uygula.<\/p>\n<ul>\n<li>İlk geçiş: b = 1, −2, 1, −2 (b₀ = 9 kenarda kalır).<\/li>\n<li>İkinci geçiş: 1. Sonra −2 + (−2)(1) = −4. Sonra 1 + (−2)(−4) = 9. Sonra −2 + (−2)(9) = −20.<\/li>\n<li>Son sayı P′(−2) = −20. Kontrol: P′(x) = 4x³ − 6x, P′(−2) = −32 + 12 = −20.<\/li>\n<\/ul>\n<p>Bu bölümün tamamı benim eklememdir, slayt yalnız \"genişletilebilir\" der. Mantığı: b₄ ... b₁ katsayıları P(x) / (x − x₀) bölümünün katsayılarıdır, b₀ ise kalandır.<\/p>\n<\/div>\n\n<h3>Grafik ve şemalar<\/h3>\n<p>G2 s8 sayfası iki sütundur. Solda \"Naif Hesap\" kutusu, sağda \"Horner Kuralı\" kutusu yan yana. Altında algoritma adımları ve yanında dört madde (en yüksek dereceli katsayıdan başlanır; her adımda bir çarpma ve bir toplama; son b₀ değerdir; türev için genişletilebilir). Altta slayt, sonucu P₄(2) = 52 ✓ diye işaretler. G2 s9'da bir katsayı tablosu ve adım tablosu var.<\/p>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>Horner: her zaman n çarpma + n toplama ile sonuç verir. Daha az işlem, daha hızlı hesap.<\/p><span class=\"kaynak\">G2 s8<\/span><\/div>\n<div class=\"vurgu\"><p>Türev hesapları için Horner şeması genişletilebilir.<\/p><span class=\"kaynak\">G2 s8<\/span><\/div>\n\n<h3>Slayt hatası<\/h3>\n<p class=\"sn\">Bu konuda slayt hatası bulunmadı. İki slayt örneği de script ile tuttu.<\/p>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>Eksik kuvvet varsa katsayısı 0'dır. Satırı atlama.<\/li>\n<li>Katsayıları en yüksek dereceden başla. Ters sıra yanlış sonuç verir.<\/li>\n<li>Her adım: yeni b = o adımın katsayısı + x · önceki b. x'i her adımda aynı değerle çarp.<\/li>\n<li>İşlem sayısı sorulursa: n. derece için n çarpma + n toplama. Kuvvet almak yok.<\/li>\n<li>Kontrol için polinomu doğrudan da yaz. İki sonuç tutmalı.<\/li>\n<\/ul><\/div>","qs":["x08"]},{"id":"k16","t":"Eşit aralıklı düğümler ve kaydırma operatörü E","h":"<p class=\"sn\">Bu konunun BUders videosu yok. Not tek başına yeterli olacak şekilde yazıldı.<\/p>\n<h3>Ne işe yarar<\/h3>\n<p>Hafta 3'ün zeminidir. Eşit aralıklı veri ve E operatörü, fark operatörlerini ve Newton ileri-geri fark formüllerini kurmanın dilidir. Bu hafta konuları: <a href=\"#\" data-go=\"k:k17\">K17<\/a> (Δ, ∇, δ), <a href=\"#\" data-go=\"k:k20\">K20<\/a> (NIFF), <a href=\"#\" data-go=\"k:k21\">K21<\/a> (NGFF), <a href=\"#\" data-go=\"k:k22\">K22<\/a> (Stirling).<\/p>\n\n<h3>Sıfırdan anlatım<\/h3>\n<ul>\n<li>Elinde x₀, x₁, ..., xₙ noktaları ve bu noktalardaki f değerleri var. Komşu noktalar arası uzaklık hep aynıysa düğümler eşit aralıklıdır.<\/li>\n<li>Bu sabit uzaklığa h denir. Böylece xᵢ = x₀ + i·h olur.<\/li>\n<li>E operatörü \"bir adım ileri git\" demektir. f(x)'in değerini h kadar ilerideki noktada okur.<\/li>\n<li>E'yi bir sayı gibi kuvvetlere yükseltebilirsin. E² iki adım ileri, E⁻¹ bir adım geri.<\/li>\n<li>Δ, ∇ ve δ operatörleri E'den türetilir. Bu yüzden her şey bu tek tanıma bağlıdır.<\/li>\n<\/ul>\n\n<h3>Tanımlar ve formüller<\/h3>\n<p><b>Eşit aralıklı düğümler.<\/b><\/p>\n\\[x_i=x_0+ih,\\qquad i=0,1,\\dots,n\\]\n<ul>\n<li>x₀: başlangıç noktası. h: adım büyüklüğü (sabit). Düğüm sayısı n + 1. Polinom derecesi en fazla n.<\/li>\n<li>Örnek: x = 1.0, 1.2, 1.4, 1.6, 1.8 için h = 0.2 ve xᵢ = 1.0 + i × 0.2.<\/li>\n<li>Neden önemli: formüller çok sadeleşir, bilgisayar uygulamasında hız kazandırır, standart tablo verisi böyledir.<\/li>\n<\/ul>\n<p><b>Kaydırma operatörü E.<\/b><\/p>\n\\[E\\,f(x_i)=f(x_i+h)\\]\n<p>E, fonksiyonu bir adım ileriye kaydırır. Örnekler:<\/p>\n<ul>\n<li>E f(x₀) = f(x₁).<\/li>\n<li>E² f(x₀) = f(x₂).<\/li>\n<li>E⁻¹ f(x<sub>i<\/sub>) = f(x<sub>i<\/sub> − h).<\/li>\n<li>E⁰ = I (özdeşlik operatörü).<\/li>\n<li>Eⁿ: n adım ileri. E⁻ⁿ: n adım geri.<\/li>\n<\/ul>\n<p><b>Cebirsel kurallar.<\/b><\/p>\n\\[E=1+\\Delta,\\qquad E^{-1}=1-\\nabla,\\qquad E^{s}=(1+\\Delta)^s\\]\n<p>Sonuncusu binom açılımıdır. Bu ilişkiler NIFF ve NGFF'nin temelidir. Newton formunun kökü:<\/p>\n\\[f(x_0+sh)=E^s f(x_0)=(1+\\Delta)^s f(x_0)\\]\n<p>Binom açılımı yapınca NIFF çıkar (<a href=\"#\" data-go=\"k:k20\">K20<\/a>).<\/p>\n<p><b>Üç temel eşitlik (W234 s18).<\/b><\/p>\n\\[\\Delta=E-1,\\qquad\\nabla=1-E^{-1},\\qquad\\delta=E^{1/2}-E^{-1/2}\\]\n<ul>\n<li>Δ = E − 1 (ileri fark): önce E ile bir adım ilerle, sonra orijinal değeri çıkar. Δf(xᵢ) = f(xᵢ + h) − f(xᵢ).<\/li>\n<li>∇ = 1 − E⁻¹ (geri fark): geriye bir adım atar. ∇f(xᵢ) = f(xᵢ) − f(xᵢ − h).<\/li>\n<li>δ = E<sup>1/2<\/sup> − E<sup>−1/2<\/sup> (merkezi fark): yarım adım ileri ve yarım adım geri giderek simetrik fark verir. δf(xᵢ) = f(xᵢ + h/2) − f(xᵢ − h/2).<\/li>\n<\/ul>\n<p><b>Motivasyon (W234 s18).<\/b> Çoğu zaman f(x)'in analitik ifadesi yoktur. Elinde yalnızca birkaç noktada ölçülmüş f(x₀), f(x₁), ..., f(xₙ) değerleri vardır. Fark operatörleri, eşit aralıklı (h) noktalar arasındaki farkları alarak türev ve integral gibi büyüklükleri yaklaşık hesaplar.<\/p>\n<p><b>Binom açılımı açık yazılırsa<\/b> (s tam sayı değilse sonsuz seri olur, kesilir):<\/p>\n\\[\\begin{aligned}(1+\\Delta)^s=1&+s\\Delta+\\frac{s(s-1)}{2!}\\Delta^2\\\\&+\\frac{s(s-1)(s-2)}{3!}\\Delta^3+\\cdots\\end{aligned}\\]\n\n<h3>Kendi çözümlü örneklerim<\/h3>\n<div class=\"ornek\">\n<p><b>Örnek 1, E ve Δ ilişkisi.<\/b> f(x) = x³, düğümler x = 0, 1, 2, 3 (h = 1).<\/p>\n<div class=\"tw\">\n<table>\n<tr><th>x<\/th><th>f<\/th><th>Δf<\/th><th>Δ²f<\/th><th>Δ³f<\/th><\/tr>\n<tr><td>0<\/td><td>0<\/td><td>1<\/td><td>6<\/td><td>6<\/td><\/tr>\n<tr><td>1<\/td><td>1<\/td><td>7<\/td><td>12<\/td><td><\/td><\/tr>\n<tr><td>2<\/td><td>8<\/td><td>19<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>3<\/td><td>27<\/td><td><\/td><td><\/td><td><\/td><\/tr>\n<\/table>\n<\/div>\n<ul>\n<li>E² f₀ = (1 + Δ)² f₀ = f₀ + 2Δf₀ + Δ²f₀ = 0 + 2(1) + 6 = 8 = f(2). ✓<\/li>\n<li>E³ f₀ = f₀ + 3Δf₀ + 3Δ²f₀ + Δ³f₀ = 0 + 3 + 18 + 6 = 27 = f(3). ✓<\/li>\n<li>E f₁ = f₁ + Δf₁ = 1 + 7 = 8 = f(2). ✓<\/li>\n<li>E⁻¹ f₂ = f₂ − ∇f₂ = 8 − 7 = 1 = f(1). ✓<\/li>\n<\/ul>\n<p>Ekstra: ∇ = E⁻¹Δ. Gerçekten ∇f₃ = 27 − 8 = 19 ve E⁻¹Δf₃ = Δf₂ = 19. Bu satır slaytta yok, ∇ = 1 − E⁻¹ ve Δ = E − 1'den çıkar: E⁻¹(E − 1) = 1 − E⁻¹.<\/p>\n<\/div>\n<div class=\"ornek\">\n<p><b>Örnek 2, E<sup>s<\/sup> ile ara değer.<\/b> Aynı tablo. f(0.5) değerini (1 + Δ)<sup>s<\/sup> f₀ ile bul, s = (0.5 − 0)/1 = 0.5.<\/p>\n<ul>\n<li>s = 0.5. s(s − 1)/2 = −0.125. s(s − 1)(s − 2)/6 = 0.0625.<\/li>\n<li>f(0.5) ≈ 0 + 0.5(1) + (−0.125)(6) + (0.0625)(6) = 0.5 − 0.75 + 0.375 = 0.125.<\/li>\n<li>Gerçek 0.5³ = 0.125. Veri 3. derece bir polinomdan geldiği için sonuç kesin.<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Örnek 3, eşit aralık kontrolü.<\/b> Hangi tablolarda E ve fark formülleri kullanılır? Ardışık farkları bak.<\/p>\n<ul>\n<li>x = 0.5, 0.75, 1.0, 1.25 → farklar 0.25, 0.25, 0.25. Eşit aralıklı, h = 0.25.<\/li>\n<li>x = 1, 2, 4, 8 → farklar 1, 2, 4. Eşit değil. Fark operatörleri uygulanmaz, Newton bölünmüş farklar kullanılır.<\/li>\n<li>x = 1.0, 1.5, 2.0, 2.6 → farklar 0.5, 0.5, 0.6. Eşit değil.<\/li>\n<\/ul>\n<p>Bütün sayıları script ile doğruladım.<\/p>\n<\/div>\n\n<h3>Grafik ve şemalar<\/h3>\n<ul>\n<li>W234 s16 sağ altta \"E operatörünün görsel gösterimi\" çizer. Bir doğru üzerinde beş nokta: x₀, x₁, x₂, x₃, x₄. Altında üç ok etiketi: \"E: x₀ → x₁\", \"E²: x₀ → x₂\", \"E⁻¹: x₁ → x₀\".<\/li>\n<li>W234 s16 sol üstte eşit aralıklı düğümlerin tanımı ve örnek, sağ üstte E'nin tanımı ve örnekleri, ortada cebirsel kurallar, altta \"Neden E operatörü kullanıyoruz?\" kutusu yer alır.<\/li>\n<li>W234 s18 sol tarafta E'nin tanımı, sağ tarafta üç eşitlik: \"Δ = E − 1, İleri fark\", \"∇ = 1 − E⁻¹, Geri fark\", \"δ = E^½ − E^(−½), Merkezi fark\".<\/li>\n<\/ul>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>Dikkat: h SABIT olmalı! Değilse Newton Bölünmüş Fark kullanılır.<\/p><span class=\"kaynak\">W234 s16<\/span><\/div>\n<div class=\"vurgu\"><p>Neden E operatörü kullanıyoruz? Cebir gibi kullanabilir, kuvvet alabiliriz!<\/p><span class=\"kaynak\">W234 s16<\/span><\/div>\n<div class=\"vurgu\"><p>Bu ilişkiler NIFF ve NGFF'nin temelidir.<\/p><span class=\"kaynak\">W234 s16<\/span><\/div>\n<div class=\"vurgu\"><p>Bu tek satır, üç operatörün tamamının temelidir: Δ = E − 1. Bu üç eşitliği anlamak önemlidir.<\/p><span class=\"kaynak\">W234 s18<\/span><\/div>\n\n<h3>Slayt hatası<\/h3>\n<p class=\"sn\">Bu konuda slayt hatası bulunmadı. Slayt s18'de Δ = E − 1 açıklaması (\"önce E ile bir adım ilerlemek, sonra orijinal değeri çıkarmak\") doğrudur.<\/p>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>Düğümler eşit aralıklı değilse E ve fark formülleri çalışmaz. Önce h'nin sabit olduğunu kontrol et.<\/li>\n<li>n + 1 düğüm en fazla n. derece polinom verir.<\/li>\n<li>Δ = E − 1 ve E = 1 + Δ aynı eşitliktir. Aynı şekilde ∇ = 1 − E⁻¹ ile E⁻¹ = 1 − ∇.<\/li>\n<li>E<sup>s<\/sup> = (1 + Δ)<sup>s<\/sup> NIFF'in kökü. E⁻¹ = 1 − ∇ olduğu için E<sup>s<\/sup> = (1 − ∇)<sup>−s<\/sup> yazılır. Bundan NGFF çıkar.<\/li>\n<li>Sınavda \"Δ, ∇, δ'yı E cinsinden yaz\" sorusu gelirse üç eşitliği sırayla yaz.<\/li>\n<\/ul><\/div>","qs":["x11"]},{"id":"k28","t":"Optimal h: kesme ve yuvarlama dengesi","h":"<p class=\"sn\">Bu konunun BUders videosu yok. Not tek başına yeterli olacak şekilde yazıldı.<\/p>\n<h3>Ne işe yarar<\/h3>\n<p>Sayısal türevde h'yı ne kadar küçük seçeceğini söyler. h'yı sonsuz küçültmek sonucu bozar. En iyi h bir denge noktasında olur. Bu hafta konuları: <a href=\"#\" data-go=\"k:k24\">K24<\/a>, <a href=\"#\" data-go=\"k:k25\">K25<\/a> ve <a href=\"#\" data-go=\"k:k26\">K26<\/a>.<\/p>\n\n<h3>Sıfırdan anlatım<\/h3>\n<ol>\n<li><b>Kesme hatası.<\/b> Türev formülü Taylor serisini keser. İleri farkta f′(x) ≈ [f(x+h) − f(x)]/h için kesme hatası yaklaşık (h/2)f″(x). h küçülünce bu hata küçülür.<\/li>\n<li><b>Yuvarlama hatası.<\/b> Bilgisayar her sayıyı yaklaşık saklar. Çift duyarlıkta bağıl hata ε<sub>m<\/sub> ≈ 2.2·10⁻¹⁶. h çok küçükse f(x+h) ile f(x) neredeyse aynıdır. Çıkarınca anlamlı basamaklar yok olur (çıkarma iptal hatası, catastrophic cancellation, bkz. <a href=\"#\" data-go=\"k:k06\">K6<\/a>). Sonra h'ya bölünce bu hata büyür: ε<sub>m<\/sub>/h.<\/li>\n<li><b>Denge.<\/b> Kesme hatası h ile azalır, yuvarlama hatası h ile artar. Toplam hata U biçimindedir. En düşük nokta h_opt'tur.<\/li>\n<\/ol>\n\n<h3>Tanımlar ve formüller<\/h3>\n\\[\\begin{aligned}\\text{Toplam hata}&=\\text{Kesme}+\\text{Yuvarlama}\\\\&\\approx C_1h+\\frac{\\varepsilon_m}{h}\\end{aligned}\\]\n\\[h_{opt}=\\sqrt{\\frac{\\varepsilon_m}{C_1}}\\]\n<ul>\n<li>Kesme hatası: FD1 için ~C·h, CD2 için ~C·h². h küçüldükçe azalır.<\/li>\n<li>Yuvarlama hatası: ε<sub>m<\/sub>/h. h küçüldükçe büyür.<\/li>\n<li>ε<sub>m<\/sub> ≈ 2.2·10⁻¹⁶ (double).<\/li>\n<\/ul>\n<p><b>Türetim (FD1 için, slayt).<\/b><\/p>\n\\[\\begin{aligned}\\frac{d}{dh}\\Big[C_1h+\\frac{\\varepsilon_m}{h}\\Big]&=0\\\\ \\Rightarrow\\;C_1-\\frac{\\varepsilon_m}{h^2}&=0\\end{aligned}\\]\n\\[h_{opt}=\\sqrt{\\varepsilon_m/C_1}\\]\n<ul>\n<li>C₁ ≈ |f″(x)|/2. Genelde 1 varsayılır.<\/li>\n<li>ε<sub>m<\/sub> ≈ 10⁻¹⁶ alınırsa h_opt ≈ 10⁻⁸.<\/li>\n<li>CD2 için: h_opt ≈ (ε<sub>m<\/sub>)^(1/3) ≈ 10<sup>−5.3<\/sup>.<\/li>\n<\/ul>\n<p><b>CD2 türetmesi (slayt vermiyor, benim ekim).<\/b> CD2'nin kesme hatası C₂h², C₂ = |f‴|/6. Toplam C₂h² + ε<sub>m<\/sub>/h. Türev sıfır: 2C₂h − ε<sub>m<\/sub>/h² = 0. Buradan \\(h_{opt}=\\big(\\varepsilon_m/(2C_2)\\big)^{1/3}\\). Sabit 1 alınınca ε<sub>m<\/sub>^(1/3) mertebesi çıkar. Bu slaytla uyumlu.<\/p>\n<p>Minimum toplam hata (FD1): \\(2\\sqrt{C_1\\varepsilon_m}\\).<\/p>\n<p><b>Sayı kontrolü (script).<\/b><\/p>\n<ul>\n<li>√(2.2·10⁻¹⁶) = 1.5·10⁻⁸. √(10⁻¹⁶) = 10⁻⁸.<\/li>\n<li>(2.2·10⁻¹⁶)^(1/3) = 6.0·10⁻⁶ (10<sup>−5.2<\/sup>). (10⁻¹⁶)^(1/3) = 4.6·10⁻⁶ (10<sup>−5.3<\/sup>).<\/li>\n<li>Slaytın \"10<sup>−5.3<\/sup>\" değeri ε<sub>m<\/sub> = 10⁻¹⁶ ile tutarlıdır. 2.2·10⁻¹⁶ alırsan 10<sup>−5.2<\/sup> çıkar. İkisi de doğru, ε<sub>m<\/sub> seçimine bağlıdır.<\/li>\n<\/ul>\n\n<h3>Slayttaki örnek ve kontrol<\/h3>\n<div class=\"ornek\">\n<p><b>Deney, f(x) = eˣ, x = 1 (script, double).<\/b> Gerçek türev e = 2.71828. Tablo her satır için |hata| verir.<\/p>\n<div class=\"tw\">\n<table>\n<tr><th>h<\/th><th>FD1 hata<\/th><th>CD2 hata<\/th><\/tr>\n<tr><td>10⁻¹<\/td><td>1.41·10⁻¹<\/td><td>4.53·10⁻³<\/td><\/tr>\n<tr><td>10⁻²<\/td><td>1.36·10⁻²<\/td><td>4.53·10⁻⁵<\/td><\/tr>\n<tr><td>10⁻⁴<\/td><td>1.36·10⁻⁴<\/td><td>4.53·10⁻⁹<\/td><\/tr>\n<tr><td>10⁻⁶<\/td><td>1.36·10⁻⁶<\/td><td>1.63·10⁻¹⁰<\/td><\/tr>\n<tr><td>10⁻⁸<\/td><td>6.60·10⁻⁹ (en iyi)<\/td><td>6.60·10⁻⁹<\/td><\/tr>\n<tr><td>10⁻¹⁰<\/td><td>1.55·10⁻⁶<\/td><td>6.73·10⁻⁷<\/td><\/tr>\n<tr><td>10⁻¹²<\/td><td>4.32·10⁻⁴<\/td><td>2.10·10⁻⁴<\/td><\/tr>\n<tr><td>10⁻¹⁴<\/td><td>9.34·10⁻³<\/td><td>9.34·10⁻³<\/td><\/tr>\n<\/table>\n<\/div>\n<ul>\n<li>FD1 için en iyi h = 10⁻⁸. Slayt da bunu söyler (deneysel en iyi h = 10⁻⁸).<\/li>\n<li>CD2 için en iyi h yaklaşık 10⁻⁵ ile 10⁻⁶ arasında (ince tarama: log₁₀ h ≈ −5.35, hata 1.3·10⁻¹¹).<\/li>\n<li>h'yı daha da küçültünce hata tekrar büyür. 10⁻¹⁴'te sonuç %0.3 sapar.<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Sınav tipi örnek 1.<\/b> f(x) = sin x, x = 1 noktasında FD1 için h_opt kaç? ε<sub>m<\/sub> = 2.2·10⁻¹⁶.<\/p>\n<ul>\n<li>f″(x) = −sin x. C₁ = |f″(1)|/2 = sin 1/2 = 0.4207.<\/li>\n<li>h_opt = √(ε<sub>m<\/sub>/C₁) = √(2.2·10⁻¹⁶/0.4207) = 2.3·10⁻⁸.<\/li>\n<li>Slayt kuralıyla C₁ = 1 alınırsa h_opt = 1.5·10⁻⁸. İki sonuç aynı mertebe, ≈ 10⁻⁸.<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Sınav tipi örnek 2.<\/b> Aynı fonksiyon için h'yı küçültmek her zaman iyi mi? FD1 hatası (script):<\/p>\n<table>\n<tr><th>h<\/th><th>10⁻¹<\/th><th>10⁻⁴<\/th><th>10⁻⁸<\/th><th>10⁻¹²<\/th><th>10⁻¹⁵<\/th><\/tr>\n<tr><td>|hata|<\/td><td>4.29·10⁻²<\/td><td>4.21·10⁻⁵<\/td><td>2.97·10⁻⁹<\/td><td>4.32·10⁻⁵<\/td><td>1.48·10⁻²<\/td><\/tr>\n<\/table>\n<p>Hayır. h = 10⁻⁸'e kadar hata azalır. Sonra yuvarlama baskın olur ve hata tekrar büyür. h = 10⁻¹² hatası, h = 10⁻⁴ hatasıyla aynı büyüklükte.<\/p>\n<\/div>\n<div class=\"ornek\">\n<p><b>Toplam hata modeli tablosu (ε<sub>m<\/sub> = 10⁻¹⁶, C₁ = 1).<\/b><\/p>\n<div class=\"tw\">\n<table>\n<tr><th>h<\/th><th>Kesme C₁h<\/th><th>Yuvarlama ε/h<\/th><th>Toplam<\/th><\/tr>\n<tr><td>10⁻²<\/td><td>10⁻²<\/td><td>10⁻¹⁴<\/td><td>1.0·10⁻²<\/td><\/tr>\n<tr><td>10⁻⁴<\/td><td>10⁻⁴<\/td><td>10⁻¹²<\/td><td>1.0·10⁻⁴<\/td><\/tr>\n<tr><td>10⁻⁶<\/td><td>10⁻⁶<\/td><td>10⁻¹⁰<\/td><td>1.0·10⁻⁶<\/td><\/tr>\n<tr><td>10⁻⁸<\/td><td>10⁻⁸<\/td><td>10⁻⁸<\/td><td>2.0·10⁻⁸ (minimum)<\/td><\/tr>\n<tr><td>10⁻¹⁰<\/td><td>10⁻¹⁰<\/td><td>10⁻⁶<\/td><td>1.0·10⁻⁶<\/td><\/tr>\n<tr><td>10⁻¹²<\/td><td>10⁻¹²<\/td><td>10⁻⁴<\/td><td>1.0·10⁻⁴<\/td><\/tr>\n<tr><td>10⁻¹⁴<\/td><td>10⁻¹⁴<\/td><td>10⁻²<\/td><td>1.0·10⁻²<\/td><\/tr>\n<\/table>\n<\/div>\n<p>Minimumda iki hata eşit: C₁h = ε/h. Basit model gerçeğin mertebesini verir. Gerçek eğrinin minimumu biraz daha düşük çıkabilir (eˣ örneğinde 6.6·10⁻⁹, model 3.5·10⁻⁸).<\/p>\n<\/div>\n\n<h3>Grafik ve şemalar<\/h3>\n<p>W234 s47 sağ tarafta \"Hata vs h Grafiği (log-log ölçek)\" çizer. Dikey eksen log(Hata), yatay eksen log(h). Mavi düz çizgi \"Kesme O(h)\" sol üstten sağ alta iner. Mor kesikli çizgi sol üstten yeşil noktaya iner. Kırmızı yatay çizgi \"Yuvarlama ε/h\" olarak etiketli. Yeşil noktanın yanında \"MİNİMUM\", altında \"h_opt\" yazar ve noktalı dikey çizgi log(h) eksenine iner. Çizim kabadır. Gerçek toplam hata eğrisi V ya da U biçimindedir: sağda kesme baskın, solda yuvarlama baskın, ortada minimum.<\/p>\n<p>Sol tarafta iki kutu: \"Neden denge gerekli?\" ve \"Optimal h hesabı (FD1 için)\". İlki kesme ve yuvarlamayı anlatır. İkincisi türevi ve h_opt = √(ε_m/C₁) formülünü gösterir.<\/p>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>Altın kural: |Kesme hatası| + |Yuvarlama hatası| minimumda → h_opt = sqrt(ε_machine). FD1/BD1 asla yeterli değil → Her zaman en az O(h²) kullan!<\/p><span class=\"kaynak\">W234 s51<\/span><\/div>\n<div class=\"vurgu\"><p>Kesme hatası: h küçüldükçe AZALIR. Yuvarlama hatası: h küçüldükçe BÜYÜR! Neden: f(x+h) ve f(x) birbirine çok yakın fark → çıkarma iptal hatası (catastrophic cancellation).<\/p><span class=\"kaynak\">W234 s47<\/span><\/div>\n\n<h3>Slayt hatası<\/h3>\n<div class=\"slhata\">\n<p><b>W234 s45 ve s47 çelişiyor.<\/b> Slayt s45 karşılaştırma tablosunun altında: \"Optimal h: bilgisayar epsilon'unun kökü ≈ 10⁻⁸ için sqrt(eps) ≈ 10⁻⁴\". s47 ve s51 ise ε<sub>m<\/sub> ≈ 2.2·10⁻¹⁶ alır.<\/p>\n<p>Doğrusu: h_opt = √ε_machine ≈ 10⁻⁸ (ε = 2.2·10⁻¹⁶ için 1.5·10⁻⁸). s45'teki ε = 10⁻⁸ çift duyarlık için doğru değildir. √(10⁻⁸) = 10⁻⁴ hesabı kendi içinde doğru ama ε yanlış seçilmiş. Sınavda s47 ve s51'i kullan.<\/p>\n<\/div>\n\n<h3>Sık hata ve sınav ipucu<\/h3>\n<div class=\"ipucu\"><ul>\n<li>\"h ne kadar küçükse o kadar iyi\" yanlıştır. Bir alt sınır var.<\/li>\n<li>FD1/BD1 için h_opt = √ε_m ≈ 10⁻⁸. CD2 için ε_m^(1/3) ≈ 10<sup>−5.3<\/sup>.<\/li>\n<li>Formül C₁ ≈ |f″|/2, ε_m ≈ 10⁻¹⁶. Sınavda sabit verilmemişse C₁ = 1 al, bunu belirt.<\/li>\n<li>Yuvarlama hatası ε/h. Kesme hatası C·h (FD1) veya C·h² (CD2).<\/li>\n<li>Gürültülü veride h'yı büyük tut, 3-nokta formül yeterlidir. CD4 gürültülü veride kötüdür (<a href=\"#\" data-go=\"k:k27\">K27<\/a>).<\/li>\n<\/ul><\/div>","qs":["x19"]},{"id":"k37","t":"Newton-Cotes hata analizi","h":"<p class=\"sn\">Bu konunun BUders videosu yok. Not tek başına yeterli olacak şekilde yazıldı.<\/p>\n<h3>Ne işe yarar<\/h3>\n<p>Her Newton-Cotes kuralının ne kadar hata yaptığını ve n değiştirince hatanın nasıl küçüldüğünü bilmek için. Sınavda \"hata sınırı bul\", \"n kaç olmalı\" ve \"iki yöntemi karşılaştır\" soruları buradan gelir.<\/p>\n\n<h3>Sıfırdan anlatım<\/h3>\n<ul>\n<li>Hata tanımı bu notta: E = gerçek − yaklaşık. İşareti formülde görünür, boyutunu |E| ile alırsın.<\/li>\n<li>ξ, aralıkta bilinmeyen bir noktadır. Hata formülündeki türev bu noktada hesaplanır. Pratikte türevin aralıktaki en büyük değerini koyup üst sınır bulursun.<\/li>\n<li>Bileşik hata, tek panel hatasının panel sayısıyla çarpılmış hâlidir.<\/li>\n<li>O(hᵖ) demek: h yarıya inince hata yaklaşık 2ᵖ kat küçülür. Trapez p = 2, Simpson p = 4.<\/li>\n<li>Bu hızdır, hatanın kendisi değildir. Aynı n'de bir Simpson hatası bir trapez hatasından çok daha küçük olur, çünkü hem hız hem sabit farklıdır.<\/li>\n<\/ul>\n\n<h3>Tanımlar ve formüller<\/h3>\n<div class=\"tw\">\n<table>\n<tr><th>Yöntem<\/th><th>Tek panel hata<\/th><th>Bileşik hata (n panel)<\/th><th>Türev<\/th><\/tr>\n<tr><td>Trapez<\/td><td>\\(-\\dfrac{(b-a)^3f''(\\xi)}{12}\\)<\/td><td>\\(-\\dfrac{(b-a)h^2f''(\\bar\\xi)}{12}\\)<\/td><td>f″<\/td><\/tr>\n<tr><td>Simpson 1/3<\/td><td>\\(-\\dfrac{(b-a)^5f^{(4)}(\\xi)}{2880}\\)<\/td><td>\\(-\\dfrac{(b-a)h^4f^{(4)}(\\bar\\xi)}{180}\\)<\/td><td>f⁽⁴⁾<\/td><\/tr>\n<tr><td>Simpson 3/8<\/td><td>\\(-\\dfrac{3h^5f^{(4)}(\\xi)}{80}\\)<\/td><td>\\(-\\dfrac{(b-a)h^4f^{(4)}(\\bar\\xi)}{80}\\)<\/td><td>f⁽⁴⁾<\/td><\/tr>\n<\/table>\n<\/div>\n<p>Slayt son hücreye \"(×n/3)\" ekler. Bu fazladan bir çarpandır, doğru değil (aşağıda slayt hatası bölümüne bak).<\/p>\n<p><b>Küçülme hızı.<\/b><\/p>\n<table>\n<tr><th>Yöntem<\/th><th>h → h/2<\/th><th>h → h/4<\/th><\/tr>\n<tr><td>Trapez O(h²)<\/td><td>hata ×1/4<\/td><td>hata ×1/16<\/td><\/tr>\n<tr><td>Simpson O(h⁴)<\/td><td>hata ×1/16<\/td><td>hata ×1/256<\/td><\/tr>\n<\/table>\n\n<h3>Türetim: tek panelden bileşiğe<\/h3>\n<p>Bileşik formüller tek panel formüllerinden çıkar. Her panelde hata terimini al, panel sayısıyla çarp, h = (b − a)/n yaz.<\/p>\n<ul>\n<li><b>Trapez.<\/b> Her alt aralık genişliği h. Tek panel hatası h³f″/12. n panel: n h³ f″/12. n h = b − a olduğu için (b − a) h² f″/12.<\/li>\n<li><b>Simpson 1/3.<\/b> Tek panelin genişliği b − a = 2h. Hata (2h)⁵f⁽⁴⁾/2880 = 32h⁵/2880 = h⁵f⁽⁴⁾/90. Panel sayısı n/2. Toplam (n/2)(h⁵/90) f⁽⁴⁾ = n h⁵f⁽⁴⁾/180 = (b − a)h⁴f⁽⁴⁾/180.<\/li>\n<li><b>Simpson 3/8.<\/b> Tek panel hatası 3h⁵f⁽⁴⁾/80. Panel sayısı n/3. Toplam (n/3)(3h⁵/80) f⁽⁴⁾ = n h⁵ f⁽⁴⁾/80 = (b − a)h⁴f⁽⁴⁾/80.<\/li>\n<\/ul>\n<p>Son satırda panel sayısı n/3 zaten kullanıldı. Bu yüzden slaytın \"(×n/3)\" eki ikinci kez sayar.<\/p>\n\n<h3>Slayttaki sayısal karşılaştırma<\/h3>\n<div class=\"ornek\">\n<p><b>W5 s11 tablosu.<\/b> \\(\\int_0^1e^xdx\\), gerçek 1.71828. Soldaki sütunlar slayt, sağdaki sütunlar script.<\/p>\n<div class=\"tw\">\n<table>\n<tr><th>Yöntem<\/th><th>n<\/th><th>h<\/th><th>Slayt hesap<\/th><th>Slayt hata<\/th><th>Doğru hesap<\/th><th>Doğru hata<\/th><\/tr>\n<tr><td>Trapez<\/td><td>1<\/td><td>1.000<\/td><td>1.85914<\/td><td>0.14086<\/td><td>1.85914<\/td><td>0.14086<\/td><\/tr>\n<tr><td>Trapez<\/td><td>2<\/td><td>0.500<\/td><td>1.75393<\/td><td>0.03565<\/td><td>1.75393<\/td><td>0.03565<\/td><\/tr>\n<tr><td>Trapez<\/td><td>4<\/td><td>0.250<\/td><td>1.72724<\/td><td>0.00896<\/td><td>1.72722<\/td><td>0.00894<\/td><\/tr>\n<tr><td>Simpson 1/3<\/td><td>2<\/td><td>0.500<\/td><td>1.71882<\/td><td>0.00054<\/td><td><b>1.71886<\/b><\/td><td><b>0.00058<\/b><\/td><\/tr>\n<tr><td>Simpson 1/3<\/td><td>4<\/td><td>0.250<\/td><td>1.71829<\/td><td>0.000013<\/td><td><b>1.71832<\/b><\/td><td><b>0.000037<\/b><\/td><\/tr>\n<\/table>\n<\/div>\n<ul>\n<li>Trapez oranları: 0.14086/0.03565 = 3.95. 0.03565/0.00896 = 3.98. İkisi ≈ 4. O(h²) doğrulanır.<\/li>\n<li>Simpson oranı: slayt 0.00054/0.000013 ≈ 41 yazar. Doğru oran 0.000579/0.000037 = 15.65 ≈ 16. O(h⁴) yine doğrulanır.<\/li>\n<li>Slayt \"≈ 16×(h/2)? fark → O(h⁴) ✓\" diye yarım bırakmış. Doğru yorum: h yarıya inince hata ≈ 16 kat küçülür.<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Hata formülü kontrolü (script).<\/b> \\(\\int_0^1e^xdx\\), Simpson n = 4.<\/p>\n<ul>\n<li>Formül sınırı: (b − a)h⁴ max f⁽⁴⁾/180 = 1 · 0.25⁴ · e/180 = 5.9·10⁻⁵.<\/li>\n<li>Gerçek hata 3.7·10⁻⁵. Sınırın altında, uyumlu.<\/li>\n<li>n = 6 üzerinde 3/8: formül (ξ = 0.5) 1.59·10⁻⁵, gerçek 1.65·10⁻⁵. Aynı mertebe.<\/li>\n<\/ul>\n<\/div>\n\n<h3>Kendi çözümlü örneklerim<\/h3>\n<div class=\"ornek\">\n<p><b>Sınav tipi örnek 1, n seçimi.<\/b> \\(\\int_0^1e^xdx\\) integralini hata ≤ 10⁻⁶ olacak şekilde hesaplamak için trapez ve Simpson 1/3'te en az kaç panel gerekir?<\/p>\n<ul>\n<li>[0,1] üzerinde f″ = f⁽⁴⁾ = eˣ ≤ e = 2.71828. b − a = 1.<\/li>\n<li><b>Trapez:<\/b> \\(\\dfrac{e\\,h^2}{12}\\le10^{-6}\\), h = 1/n. \\(n^2\\ge\\dfrac{e}{12\\cdot10^{-6}}=226523\\), n ≥ 475.9. Yani n = 476. Script: n = 476 için gerçek hata 6.3·10⁻⁷.<\/li>\n<li><b>Simpson 1/3:<\/b> \\(\\dfrac{e\\,h^4}{180}\\le10^{-6}\\). \\(n^4\\ge\\dfrac{e}{180\\cdot10^{-6}}=15102\\), n ≥ 11.09. n çift olmalı, en küçük n = 12. Script: n = 12 için gerçek hata 4.6·10⁻⁷. (n = 10 için sınır 1.5·10⁻⁶ sağlamaz. Gerçek hata 9.5·10⁻⁷ olsa da garanti yok.)<\/li>\n<li>Yorum: aynı doğruluk için trapez 476, Simpson 12 panel ister. Yöntem seçimi kritik.<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Sınav tipi örnek 2, hata küçülmesi.<\/b> Bileşik Simpson'da n = 8 ile hata 3.2·10⁻⁵ bulundu. n = 16 yapılırsa hata yaklaşık ne olur? Trapezde aynı değişiklik ne yapar?<\/p>\n<ul>\n<li>n iki katına çıkınca h yarıya iner.<\/li>\n<li>Simpson O(h⁴): hata ÷16 ≈ 2.0·10⁻⁶.<\/li>\n<li>Trapez O(h²): hata ÷4.<\/li>\n<\/ul>\n<\/div>\n<div class=\"ornek\">\n<p><b>Slayt vurgusunun kontrolü.<\/b> Slayt: \"n = 4 ile Simpson, n = 100 ile Trapez'den daha iyi sonuç verebilir.\" \\(\\int_0^1e^xdx\\) için script sonucu:<\/p>\n<ul>\n<li>Simpson n = 4 hata 3.7·10⁻⁵. Trapez n = 100 hata 1.4·10⁻⁵.<\/li>\n<li>Bu integralde trapezin hatası n = 63'ten itibaren Simpson n = 4'ün hatasının altına iner. n = 100'de trapez daha iyidir.<\/li>\n<li>\\(\\int_0^1x^3dx\\) için ise Simpson n = 4 tamdır (hata 0). Trapez n = 100'ün hatası 2.5·10⁻⁵.<\/li>\n<\/ul>\n<p>Sonuç: \"daha iyi olabilir\" ifadesi fonksiyona bağlıdır. Genel kural: Simpson'un mertebesi yüksek, trapezle aynı doğruluğa çok daha az panelle ulaşır. Her integralde n = 100 trapezi yenmesi garanti değil.<\/p>\n<\/div>\n\n<h3>Grafik ve şemalar<\/h3>\n<p>W5 s11 grafik içermez. İki tablo ve bir kutu var. Üst tabloda üç yöntemin tek panel ve bileşik hata formülleri yan yana. Alt tabloda e<sup>x<\/sup> integrali sayısal karşılaştırma. Altında \"h küçüldükçe hata davranışı\" iki satır olarak gösterilir. Sayfa, vurgu cümlesiyle biter.<\/p>\n\n<h3>Hocanın vurguları<\/h3>\n<div class=\"vurgu\"><p>Pratikte: n=4 ile Simpson, n=100 ile Trapez'den daha iyi sonuç verebilir. Yöntem seçimi kritiktir!<\/p><span class=\"kaynak\">W5 s11<\/span><\/div>\n<div class=\"vurgu\"><p>O(h⁴) mertebesini, gerçek hatanın tam h⁴ olduğu sanılmamalı. Bu sadece küçülme hızı.<\/p><span class=\"kaynak\">W5 s14<\/span><\/div>\n<div class=\"vurgu\"><p>Trapez: E ∝ h² × f″ → O(h²). Simpson: E ∝ h⁴ × f⁽⁴⁾ → O(h⁴). h yarıya
